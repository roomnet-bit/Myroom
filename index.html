<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C8102E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyRoom">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180-apple.png">
<title>MyRoom — Tagihan WiFi</title>
<style>
:root{
  --ink:#2A1416; --ink2:#7A5A5C; --paper:#FBF3F3; --card:#fff; --line:#EBD8D8;
  --merah:#C8102E; --merah-t:#A00C24; --merah-l:#FCE9EC;
  --biru:#C8102E; --biru-l:#FCE9EC;
  --lunas:#0B7A55; --lunas-l:#E2F3EC;
  --belum:#9A6100; --belum-l:#FBF0DC;
  --alert:#B3261E; --alert-l:#FBE9E7;
  --r:14px;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
#antreBar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:9px;
  padding:11px 14px;font-size:13px;font-weight:700;cursor:pointer;border:0;width:100%;
  text-align:left;font-family:var(--sans);line-height:1.35}
#antreBar.tunggu{background:var(--belum-l);color:var(--belum);box-shadow:inset 0 -1px 0 rgba(0,0,0,.06)}
#antreBar.lama{background:var(--alert-l);color:var(--alert);box-shadow:inset 0 -1px 0 rgba(0,0,0,.06)}
#antreBar.aman{background:var(--lunas-l);color:var(--lunas)}
#antreBar small{display:block;font-weight:500;font-size:11.5px;opacity:.85;margin-top:1px}
#antreBar.hide{display:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{overflow-x:hidden}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));overflow-x:hidden;max-width:100vw}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:940px;margin:0 auto;padding:0 14px}

/* ---------- header ---------- */
header{background:linear-gradient(180deg,var(--merah) 0%,var(--merah-t) 100%);color:#fff;padding:14px 0 16px;
  padding-top:calc(14px + env(safe-area-inset-top));position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;
  border-radius:50%;border:22px solid rgba(255,255,255,.05)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:22px;display:flex;align-items:flex-end;gap:3px}
.logo i{flex:1;background:rgba(255,255,255,.45);border-radius:2px;display:block}
.logo i:nth-child(1){height:26%}.logo i:nth-child(2){height:48%}
.logo i:nth-child(3){height:72%;background:rgba(255,255,255,.72)}.logo i:nth-child(4){height:100%;background:#fff}
.brand b{font-size:16px;letter-spacing:.14em;text-transform:uppercase}
.brand small{display:block;font-size:11px;letter-spacing:.06em;color:#FBD4D9;text-transform:none;letter-spacing:.02em}
.perbar{display:flex;align-items:center;gap:8px;margin-top:14px;position:relative;z-index:1}
.perbar button{background:rgba(255,255,255,.12);border:0;color:#fff;width:34px;height:34px;
  border-radius:10px;font-size:17px;cursor:pointer}
.perbar button:active{background:rgba(255,255,255,.28)}
.perlbl{flex:1;text-align:center;font-weight:700;letter-spacing:.03em}
.perlbl span{display:block;font-size:11px;font-weight:500;color:#FBD4D9;letter-spacing:.02em}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.card>h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px}
.backbar{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);padding:8px 14px 8px 10px;border-radius:11px;font-weight:700;font-size:13.5px;
  cursor:pointer;margin-top:12px}
.backbar:active{background:#F7F9FB}
.swrow{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.swrow:first-of-type{border-top:none}
.swrow .swtxt{flex:1}
.swrow .swtxt b{display:block;font-size:14px}
.swrow .swtxt span{display:block;font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.4}
.sw{position:relative;display:inline-block;width:44px;height:26px;flex:0 0 auto;margin-top:2px}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.15s;cursor:pointer}
.sw i::before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;
  border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked + i{background:var(--lunas)}
.sw input:checked + i::before{transform:translateX(18px)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:700px){.grid2{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.kpi .val{font-family:var(--num);font-size:19px;font-weight:700;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11px;color:var(--ink2);margin-top:2px}
.kpi.ok .val{color:var(--lunas)} .kpi.warn .val{color:var(--belum)} .kpi.bad .val{color:var(--alert)}

/* ---------- signal meter (signature) ---------- */
.meter{display:flex;gap:14px;align-items:flex-end}
.bars{display:flex;align-items:flex-end;gap:5px;height:74px;flex:0 0 auto}
.bars i{width:16px;background:var(--line);border-radius:3px;display:block;transition:background .45s ease}
.bars i:nth-child(1){height:30%}.bars i:nth-child(2){height:47%}.bars i:nth-child(3){height:64%}
.bars i:nth-child(4){height:82%}.bars i:nth-child(5){height:100%}
.bars i.on{background:var(--lunas)}
.meter .big{font-family:var(--num);font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1}
.meter .cap{font-size:12px;color:var(--ink2);margin-top:6px}

/* ---------- chart ---------- */
.chart{display:flex;gap:9px;align-items:flex-end;height:130px;margin-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.chart .pair{display:flex;gap:3px;align-items:flex-end;width:100%;height:100%;justify-content:center}
.chart .pair b{width:42%;border-radius:3px 3px 0 0;display:block;min-height:2px}
.chart .msk{background:var(--biru)} .chart .kel{background:#C7D3DE}
.chart .cl{font-size:10px;color:var(--ink2);letter-spacing:.04em}
.legend{display:flex;gap:14px;font-size:11px;color:var(--ink2);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* ---------- toolbar ---------- */
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tools input[type=search],.tools input[type=text]{flex:1 1 150px;min-width:0;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.chips{display:flex;gap:7px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink2);
  padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--merah);border-color:var(--merah);color:#fff}

/* ---------- list rows ---------- */
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;
  margin-top:8px;display:flex;gap:11px;align-items:center;cursor:pointer}
.row:active{background:#F7F9FB}
.tick{flex:0 0 auto;width:38px;height:38px;border-radius:11px;border:2px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:17px;color:transparent;cursor:pointer;padding:0}
.tick.on{background:var(--lunas);border-color:var(--lunas);color:#fff}
.tick.part{background:var(--belum-l);border-color:var(--belum);color:var(--belum);font-size:12px;font-weight:800}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm span{font-size:11.5px;color:var(--ink2)}
.row .amt{font-family:var(--num);font-weight:700;text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.row .amt em{display:block;font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.amt em.l{color:var(--lunas)} .amt em.b{color:var(--belum)} .amt em.t{color:var(--alert)}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:6px;background:var(--paper);color:var(--ink2)}
.badge.isolir{background:var(--alert-l);color:var(--alert)}
.badge.t8{background:var(--biru-l);color:var(--biru)}
.badge.t15{background:#EFEAFB;color:#5B3FBF}
.empty{text-align:center;color:var(--ink2);padding:34px 16px;font-size:14px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 14px;
  font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--biru);border-color:var(--biru);color:#fff}
.btn.g{background:var(--lunas);border-color:var(--lunas);color:#fff}
.btn.d{background:var(--alert-l);border-color:#F0C8C5;color:var(--alert)}
.btn.w{width:100%}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}

/* ---------- nav ---------- */
#lock{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#C8102E 0%,#8E0A1F 100%);
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;
  padding-bottom:calc(24px + env(safe-area-inset-bottom))}
#lock.hide{display:none}
#lock .lg{display:flex;align-items:flex-end;gap:5px;height:38px;margin-bottom:14px}
#lock .lg i{width:11px;background:rgba(255,255,255,.4);border-radius:3px}
#lock .lg i:nth-child(1){height:30%}#lock .lg i:nth-child(2){height:52%}
#lock .lg i:nth-child(3){height:76%;background:rgba(255,255,255,.7)}#lock .lg i:nth-child(4){height:100%;background:#fff}
#lock h1{font-size:19px;letter-spacing:.12em;text-transform:uppercase;text-align:center}
#lock p{margin:6px 0 0;font-size:13px;color:#FBD4D9;text-align:center;min-height:19px}
.dots{display:flex;gap:14px;margin:26px 0 22px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.55);transition:.15s}
.dots i.f{background:#fff;border-color:#fff;transform:scale(1.12)}
.dots.err{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.pad button{height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);
  color:#fff;font-size:23px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.pad button:active{background:rgba(255,255,255,.32)}
.pad button.x{border:0;background:0;font-size:15px;font-weight:600}
#lock input,#lock textarea{color:var(--ink);background:#fff;border:1px solid rgba(255,255,255,.5);
  font-size:15px;-webkit-text-fill-color:var(--ink);caret-color:var(--merah)}
#lock textarea{font-family:var(--num);font-size:12.5px;line-height:1.5;word-break:break-all}
#lock input::placeholder,#lock textarea::placeholder{color:#9AA8B4;-webkit-text-fill-color:#9AA8B4}
#lock input:focus,#lock textarea:focus{outline:3px solid rgba(255,255,255,.85);outline-offset:1px}
#lock label{color:#FBD4D9!important;margin-top:14px}
#lock .who{margin-top:26px;font-size:12.5px;color:#FBD4D9;text-align:center;line-height:1.7}
.rolebar{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);border-radius:999px;
  padding:4px 6px 4px 11px;font-size:11.5px;font-weight:700;letter-spacing:.04em;max-width:100%;flex-wrap:wrap}
.rolebar button{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:999px;padding:4px 10px;
  font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
#meLbl{max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--merah);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:40}
nav button{flex:1;background:0;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--ink2);font-size:10.5px;font-weight:600;cursor:pointer}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--biru)}
nav button.on svg{stroke:var(--biru)}

/* ---------- sheet / modal ---------- */
.mask{position:fixed;inset:0;background:rgba(10,20,30,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:8px 16px 24px;
  max-height:92vh;overflow:auto;animation:up .22s ease}
@media(min-width:700px){.mask{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
.hnd{width:40px;height:4px;background:var(--line);border-radius:9px;margin:6px auto 12px}
.sheet h2{font-size:18px;margin-bottom:2px}
.sheet .sub{color:var(--ink2);font-size:12.5px;margin-bottom:12px}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);
  margin:12px 0 5px;font-weight:700}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--biru);outline-offset:1px}
.fr{display:flex;gap:9px}.fr>*{flex:1}
.acts{display:flex;gap:9px;margin-top:18px}.acts>*{flex:1}
.menu-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:13px 14px;margin-top:8px;width:100%;text-align:left;font-weight:600;cursor:pointer}
.menu-item small{display:block;font-weight:400;color:var(--ink2);font-size:11.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:var(--merah-t);color:#fff;
  padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.notifpop{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);
  background:#fff;color:var(--ink);border-radius:14px;padding:12px 14px;z-index:200;
  box-shadow:0 10px 30px rgba(0,0,0,.22);display:flex;gap:10px;align-items:flex-start;
  cursor:pointer;border:1px solid var(--line);animation:notifIn .25s ease-out}
.notifpop .ico{font-size:20px;line-height:1;flex:0 0 auto}
.notifpop .txt{flex:1;min-width:0}
.notifpop b{display:block;font-size:13px;font-weight:800}
.notifpop span{display:block;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.notifpop .x{flex:0 0 auto;color:var(--ink2);font-size:16px;padding:0 2px}
@keyframes notifIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);
  padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid #EEF2F5;font-variant-numeric:tabular-nums}
td.n,th.n{text-align:right;font-family:var(--num)}
.tot{font-weight:800}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,nav,.tools,.chips,.mask{display:none!important}body{background:#fff;padding:0}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <span class="logo"><i></i><i></i><i></i><i></i></span>
      <b id="bnama">MyRoom<small id="bsub">Manajemen pelanggan &amp; tagihan</small></b>
    </div>
    <div class="perbar">
      <button id="pPrev" aria-label="Bulan sebelumnya">‹</button>
      <div class="perlbl" id="pLbl">—<span id="pSub"></span></div>
      <button id="pNext" aria-label="Bulan berikutnya">›</button>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:10px;position:relative;z-index:1">
      <span class="rolebar"><button id="svr" style="background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700;cursor:pointer">○</button><button id="btnChat" data-go="chat" style="background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;position:relative">💬<span id="chatBadge" style="display:none;position:absolute;top:-4px;right:-4px;background:#fff;color:var(--merah);border-radius:999px;font-size:9px;min-width:15px;height:15px;line-height:15px;text-align:center;padding:0 3px;font-weight:800"></span></button><span id="meLbl">—</span><button id="btnLock">Kunci</button></span>
    </div>
  </div>
</header>

<div id="antreBar" class="hide" role="status"></div>
<main class="wrap" id="app"></main>
<div id="lock"></div>

<nav id="nav"></nav>
<div id="modal"></div>
<script>
/* ================= DATA AWAL (dari file Agustus.xlsx) ================= */
/* Data pelanggan diambil dari server, tidak lagi ditanam di aplikasi. */
const KEY = 'wifi_intl:db_v2';
const P0 = '2026-07';           // periode tagihan pertama
const PZ = '2026-12';           // periode terakhir
const ALLPER = ['2026-07','2026-08','2026-09','2026-10','2026-11','2026-12'];
let DB = null, per = P0, view = 'beranda', mem = null, me = null, pinBuf = '';
/* halaman yang dibuka dari Menu (bukan tab utama) — perlu tombol kembali */
const SUBVIEWS = ['biaya','tiket','setelan','users','server','riwayat','presensi','chat','titip'];
let viewSebelum = 'beranda';
let antreLegaSampai = 0;        // sampai kapan kabar "sudah aman" ditampilkan

/* Nama yang dulu diketik manual bisa berbeda ejaannya: "Ibnu Qoyyim",
   "ibnuqoyyim", "Ibnuqoyyim" — orang yang sama tapi terpecah jadi beberapa
   baris, dan poinnya ikut terbagi sehingga tidak pernah mencapai ambang bonus.
   Nama dicocokkan ke daftar pengguna dengan mengabaikan huruf besar-kecil dan
   spasi, lalu dikembalikan ke ejaan resminya. Nama yang tidak dikenal
   dibiarkan apa adanya supaya tidak ada yang hilang diam-diam. */
const kunciNama = s => String(s||'').toLowerCase().replace(/[\s.]/g,'');

function bakukanNama(nama){
  const t = String(nama || '').trim();
  if(!t) return '';
  for(const u of (DB.users||[])) if(kunciNama(u.nama) === kunciNama(t)) return u.nama;
  return t;
}

let fTag = {q:'', st:'semua', gr:'semua'}, fPel = {q:'', gr:'semua'}, fTitip = {q:''};

/* ================= HELPER ================= */
const $ = s => document.querySelector(s);
const el = (h) => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstChild; };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp' + Math.round(n||0).toLocaleString('id-ID');
const rpk = n => { n=Math.round(n||0); if(Math.abs(n)>=1e6) return 'Rp'+(n/1e6).toFixed(n%1e6?1:0).replace('.',',')+'jt';

    o.frequency.setValueAtTime(1180, nadaCtx.currentTime + 0.11);

    g.gain.exponentialRampToValueAtTime(0.0001, nadaCtx.currentTime + 0.32);

/* ================= TURUNAN DATA ================= */
const pel = () => DB.pel;
const byId = id => DB.pel.find(p=>p.id===id);
const ditagih = p => p.status !== 'berhenti';
const kBayar = (id,pr) => id+'|'+pr;
const bayarOf = (id,pr) => DB.bayar[kBayar(id,pr)] || null;
/* Uang yang dibayar dialirkan bulan per bulan.
   Kurang -> jadi tunggakan. Lebih -> jadi saldo yang otomatis dipakai bulan berikutnya. */
let _alokCache = {}, _alokVer = 0;
function alokasiBatal(){ _alokCache = {}; _alokVer++; }
function alokasi(p, sampai){
  const k = p.id + '|' + sampai + '|' + _alokVer;
  if(_alokCache[k]) return _alokCache[k];
  let bal = 0; const per_ = {};        // bal minus = masih berhutang
  for(const pr of periodeList(sampai)){
    const b = bayarOf(p.id, pr);
    bal += b ? b.j : 0;
    if(!ditagih(p) || pr < p.mulai){ per_[pr] = {tagih:0, terbayar:0, kurang:0, masuk:b?b.j:0, bal}; continue; }
    const terbayar = Math.max(0, Math.min(bal, p.harga));
    bal -= p.harga;                     // tagihan bulan ini dibebankan
    per_[pr] = {tagih:p.harga, terbayar, kurang:p.harga - terbayar, masuk:b?b.j:0, bal};
  }
  const hasil = {per:per_, bal, saldo:Math.max(0, bal), utang:Math.max(0, -bal)};
  _alokCache[k] = hasil;
  return hasil;
}
const saldoOf = (p, sampai) => alokasi(p, sampai).saldo;

function statusOf(p, pr){
  if(!ditagih(p) || pr < p.mulai) return 'nihil';
  const a = alokasi(p, pr).per[pr] || {terbayar:0, tagih:p.harga};
  if(a.terbayar >= a.tagih) return 'lunas';
  if(a.terbayar > 0) return 'sebagian';
  return telat(p, pr) ? 'telat' : 'belum';
}
function telat(p, pr){
  const c = curPer();
  if(pr < c) return true;
  if(pr > c) return false;
  return today().getDate() > p.tempo;
}
function periodeList(sampai){ const out=[]; let x=P0; let guard=0;
  while(x <= sampai && guard++ < 400){ out.push(x); x = pAdd(x,1); } return out; }
function tunggakan(p, sampai){ // sisa hutang setelah semua periode SEBELUM `sampai`
  return alokasi(p, pAdd(sampai, -1)).utang;
}
function ringkas(pr){
  let tagih=0, masuk=0, kas=0, saldo=0, lunas=0, sebagian=0, belum=0, aktif=0, isolir=0, tung=0;
  for(const p of pel()){
    if(p.status==='isolir') isolir++;
    if(p.status!=='berhenti') aktif++;
    if(!ditagih(p) || pr < p.mulai) continue;
    tagih += p.harga;
    const a = alokasi(p, pr).per[pr] || {terbayar:0, masuk:0};
    masuk += a.terbayar;
    kas += a.masuk;
    saldo += saldoOf(p, pr);
    const s = statusOf(p, pr);
    if(s==='lunas') lunas++; else if(s==='sebagian') sebagian++; else belum++;
    tung += tunggakan(p, pr);
  }
  const keluar = DB.biaya.filter(b=>b.periode===pr).reduce((a,b)=>a+b.jml,0);
  return {tagih, masuk, kas, saldo, sisa:tagih-masuk, lunas, sebagian, belum, aktif, isolir, tung, keluar,
    laba: kas-keluar, pct: tagih? Math.round(masuk/tagih*100):0};
}

/* ---------- foto selfie: disimpan di memori HP, bukan di DB utama ----------
   DB utama ikut masuk localStorage yang kapasitasnya kecil (±5MB). Foto
   ditaruh di IndexedDB terpisah supaya tidak membuat data tagihan penuh
   lalu gagal tersimpan. */
const FOTO_DB = 'roomnet_foto', FOTO_TOKO = 'foto';
let fotoDbP = null;
function fotoDb(){
  if(fotoDbP) return fotoDbP;
  fotoDbP = new Promise((ya, tidak)=>{
    if(!window.indexedDB) return tidak(new Error('IndexedDB tidak ada'));
    const r = indexedDB.open(FOTO_DB, 1);
    r.onupgradeneeded = ()=>{ const db = r.result;
      if(!db.objectStoreNames.contains(FOTO_TOKO)) db.createObjectStore(FOTO_TOKO); };
    r.onsuccess = ()=>ya(r.result);
    r.onerror = ()=>tidak(r.error);
  });
  return fotoDbP;
}
async function fotoSimpan(kunci, data){
  try{ const db = await fotoDb();
    await new Promise((ya,tidak)=>{ const t = db.transaction(FOTO_TOKO,'readwrite');
      t.objectStore(FOTO_TOKO).put(data, kunci); t.oncomplete = ya; t.onerror = ()=>tidak(t.error); });
    return true;
  }catch(e){ console.error('foto gagal disimpan di HP', e); return false; }
}
async function fotoAmbil(kunci){
  try{ const db = await fotoDb();
    return await new Promise((ya,tidak)=>{ const t = db.transaction(FOTO_TOKO,'readonly');
      const q = t.objectStore(FOTO_TOKO).get(kunci); q.onsuccess = ()=>ya(q.result || null); q.onerror = ()=>tidak(q.error); });
  }catch(e){ return null; }
}

/* Memotret lewat kamera depan, lalu dikecilkan supaya ringan dikirim:
   lebar ${FOTO_LEBAR}px, mutu ${FOTO_MUTU} — sekitar 20–30KB per foto. */
const FOTO_LEBAR = 320, FOTO_MUTU = 0.5;
function kecilkanFoto(sumber, lebarAsli, tinggiAsli){
  const skala = Math.min(1, FOTO_LEBAR / lebarAsli);

  return c.toDataURL('image/jpeg', FOTO_MUTU);
}

function jarakMeter(a1, o1, a2, o2){
  const R = 6371000, r = x => x*Math.PI/180;
  const dA = r(a2-a1), dO = r(o2-o1);
  const h = Math.sin(dA/2)**2 + Math.cos(r(a1))*Math.cos(r(a2))*Math.sin(dO/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(h)));
}

/* ================= PANTAU HARI INI =================
   Melihat ritme kerja karyawan saat mereka menyisir di lapangan. Datanya
   sudah ada sejak dulu — tiap pembayaran mencatat penerima dan jamnya —
   yang belum ada hanya layar untuk melihatnya secara hidup.

   Yang paling berguna di sini bukan jumlah uangnya, tapi kolom "terakhir":
   bila seorang karyawan sudah lama tidak mencatat apa pun padahal masih jam
   kerja, itu terlihat seketika, tanpa menunggu sampai malam.

   Batasnya: aplikasi hanya tahu apa yang DICATAT. Uang yang diterima tanpa

let pantauTgl = null;        // null = hari ini

  if(!iso) return false;

/* Semua kejadian pada tanggal yang dilihat, terbaru di atas. */
function pantauKejadian(){
  const d = pantauHari(), out = [];

  for(const k of Object.keys(DB.bayar||{})){
    const v = DB.bayar[k], [id, pr] = k.split('|'), p = byId(id);
    if(!v || !samaTanggal(v.t, d)) continue;
    out.push({t:v.t, oleh:bakukanNama(v.u), jenis:'bayar', jml:v.j,
      judul:(p? p.nama : 'Pelanggan'), ket:(p? p.area : '') + ' · ' + pLbl(pr)});
  }
  for(const x of (DB.tiket||[])){
    if(x.selesai && samaTanggal(x.selesai, d))
      out.push({t:x.selesai, oleh:bakukanNama((x.penangan||'').split(',')[0]), jenis:'tutup',
        judul:(byId(x.pelId)||{nama:'Gangguan umum'}).nama, ket:x.masalah});
    if(x.tgl && samaTanggal(x.tgl, d))
      out.push({t:x.tgl, oleh:bakukanNama(x.pelapor), jenis:'lapor',
        judul:(byId(x.pelId)||{nama:'Gangguan umum'}).nama, ket:x.masalah});
  }
  return out.sort((a,b)=> String(b.t).localeCompare(String(a.t)));
}

/* Ringkasan per karyawan pada tanggal itu. */
function pantauOrang(){
  const kj = pantauKejadian(), per_ = {};
  const ambil = n => {
    const k = String(n||'').trim() || '(tidak dicatat)';
    if(!per_[k]) per_[k] = {nama:k, rumah:0, uang:0, gangguan:0, terakhir:'', area:''};
    return per_[k];
  };
  for(const x of kj){
    const o = ambil(x.oleh);
    if(x.jenis==='bayar'){ o.rumah++; o.uang += x.jml; if(!o.area) o.area = (x.ket||'').split(' · ')[0]; }
    else o.gangguan++;
    if(!o.terakhir || String(x.t) > o.terakhir) o.terakhir = x.t;
  }
  /* karyawan terdaftar tetap tampil walau belum ada kegiatan */
  for(const u of (DB.users||[])) if(u.aktif !== false && u.peran === 'karyawan') ambil(u.nama);

  return Object.keys(per_).map(k=>per_[k])
    .sort((a,b)=> (b.terakhir||'').localeCompare(a.terakhir||'') || b.uang - a.uang);
}

function selisihMenit(iso){
  if(!iso) return null;
  return Math.floor((Date.now() - new Date(iso)) / 60000);

function sejakTeks(iso){
  const m = selisihMenit(iso);
  if(m === null) return 'belum ada';
  if(m < 1) return 'baru saja';
  if(m < 60) return m + ' menit lalu';
  const j = Math.floor(m/60);
  if(j < 24) return j + ' jam lalu';
  return Math.floor(j/24) + ' hari lalu';
}
/* Untuk durasi yang MASIH BERJALAN (mis. "sudah online sekian lama") —
   beda dari sejakTeks yang untuk kejadian yang SUDAH LEWAT ("lalu"). */
function durasiTeks(iso){
  const m = selisihMenit(iso);
  if(m === null) return '';
  if(m < 1) return 'baru masuk';
  if(m < 60) return m + ' menit';
  const j = Math.floor(m/60), sisa = m % 60;
  if(j < 24) return sisa ? j+' jam '+sisa+' menit' : j+' jam';
  return Math.floor(j/24) + ' hari';
}

/* ================= CATATAN AKTIVITAS (AUDIT) ================= */
const AKSI_LBL = {tambah:'Tambah', edit:'Ubah', hapus:'Hapus', buka:'Buka kunci', masuk:'Masuk', koreksi:'Koreksi'};
let sesiId = '';
function mulaiSesi(){ sesiId = 'S' + Date.now().toString(36).slice(-5).toUpperCase(); return sesiId; }
function catat(aksi, tabel, rekid, judul, sebelum, sesudah){

  };

const VERSI = '3.1';
/* ================= ATURAN PENGUBAHAN DATA =================
   UANG — jumlah diterima hanya boleh NAIK di tangan karyawan.
   Pelanggan bayar 50rb pagi lalu 70rb sore? Karyawan tinggal mengubah
   50.000 jadi 120.000. Bayar kurang, pas, atau lebih semua boleh —
   sisanya otomatis jadi hutang atau saldo ke bulan berikutnya.
   Yang TIDAK bisa karyawan lakukan: menurunkan angka atau membatalkan
   transaksi. Uang yang sudah masuk catatan tidak bisa menyusut atau hilang
   di tangan siapa pun kecuali Pemilik — termasuk uang yang dicatat
   karyawan lain maupun catatannya sendiri.

   DATA PELANGGAN — boleh diubah karyawan (nama, WA, wilayah, tempo, catatan).
   Tarif dan Status tetap khusus Pemilik.

   Semua perubahan tercatat di Riwayat lengkap dengan nama pengubahnya.
   Kalau suatu saat mau diubah, cukup ganti true/false di bawah ini. */
const KARYAWAN_BOLEH_NAIKKAN_BAYAR  = true;  // menambah jumlah / mencatat cicilan susulan
const KARYAWAN_BOLEH_TURUNKAN_BAYAR = true;  // mengubah jumlah naik ATAU turun (koreksi salah ketik)
const KARYAWAN_BOLEH_UBAH_PELANGGAN = true;  // ubah data pelanggan: nama, WA, wilayah, tempo, catatan
const KARYAWAN_BOLEH_TUTUP_TIKET    = true;  // karyawan boleh menandai gangguan "selesai"
const KARYAWAN_BOLEH_UBAH           = false; // cadangan: buka semua pengubahan, dibatasi BATAS_EDIT kali
/* Nilai ini dipakai di dua tempat (kotak Ubah pelanggan dan saat menyimpan)
   tetapi belum pernah dibuat, sehingga tombol Simpan berhenti diam-diam.
   Artinya: karyawan boleh mengisi nomor WhatsApp yang MASIH KOSONG, walau
   kolom lain terkunci baginya. Nomor yang sudah terisi tidak bisa diubah.
   Ganti ke false bila pengisian nomor pun hanya boleh Pemilik. */
const KARYAWAN_BOLEH_ISI_HP         = true;
const PESAN_TURUN = 'Jumlah hanya bisa ditambah, tidak bisa dikurangi. Untuk membetulkan, minta Pemilik.';
const PESAN_KUNCI = 'Terkunci. Data yang sudah tercatat hanya bisa diubah oleh Pemilik.';

/* Riwayat: Pemilik punya akses penuh — boleh mengubah maupun menghapus.
   Karyawan tetap tidak bisa menyentuhnya sama sekali (lihat IZIN: 'ubahlog').
   Setel true hanya bila izin ubah & hapus tabel log di Supabase ditutup. */
const RIWAYAT_PERMANEN = false;

/* berapa kali karyawan sudah mengubah satu data (sejak dibuka pemilik)
   — hanya terpakai bila KARYAWAN_BOLEH_UBAH = true */
const BATAS_EDIT = 3;
function jumlahEdit(tabel, rekid, userId){
  const list = DB.log.filter(x=>x.tabel===tabel && x.rekid===String(rekid))
    .sort((a,b)=>b.waktu.localeCompare(a.waktu));
  let n = 0;
  for(const x of list){
    if(x.aksi === 'buka') break;                 // pemilik sudah membuka kunci
    if((x.aksi === 'edit' || x.aksi === 'hapus') && x.oleh_id === userId) n++;
  }
  return n;
}
/* hitungan dari server: lebih tepat karena mencakup perubahan dari HP lain */
async function cekBatas(tabel, rekid){
  if(!me) return {ok:false, sisa:0, pesan:'Belum masuk'};
  if(me.peran === 'owner') return {ok:true, sisa:99};
  if(tabel === 'tiket' && KARYAWAN_BOLEH_TUTUP_TIKET) return {ok:true, sisa:99};
  if(tabel === 'pelanggan' && KARYAWAN_BOLEH_UBAH_PELANGGAN) return {ok:true, sisa:99};
  if(!KARYAWAN_BOLEH_UBAH) return {ok:false, sisa:0, kunci:true, pesan:PESAN_KUNCI};
  if(sbOn()){
    try{
      const baris = await sbReq('log?select=aksi,oleh_id,waktu&tabel=eq.' + encodeURIComponent(tabel)
        + '&rekid=eq.' + encodeURIComponent(rekid) + '&order=waktu.desc&limit=30');
      let n = 0;
      for(const x of baris){
        if(x.aksi === 'buka') break;
        if((x.aksi === 'edit' || x.aksi === 'hapus') && x.oleh_id === me.id) n++;
      }
      const lokal = jumlahEdit(tabel, rekid, me.id);
      n = Math.max(n, lokal);                       // ikut hitung yang belum terkirim
      if(n >= BATAS_EDIT) return {ok:false, sisa:0,
        pesan:'Batas ' + BATAS_EDIT + ' kali pengubahan sudah tercapai. Minta Pemilik membuka kuncinya.'};
      return {ok:true, sisa: BATAS_EDIT - n};
    }catch(e){ /* tanpa sinyal -> pakai hitungan di HP */ }
  }
  return bolehEdit(tabel, rekid);
}
function bolehEdit(tabel, rekid){
  if(!me) return {ok:false, sisa:0, pesan:'Belum masuk'};
  if(me.peran === 'owner') return {ok:true, sisa:99};
  if(tabel === 'tiket' && KARYAWAN_BOLEH_TUTUP_TIKET) return {ok:true, sisa:99};
  if(tabel === 'pelanggan' && KARYAWAN_BOLEH_UBAH_PELANGGAN) return {ok:true, sisa:99};
  if(!KARYAWAN_BOLEH_UBAH) return {ok:false, sisa:0, kunci:true, pesan:PESAN_KUNCI};
  const n = jumlahEdit(tabel, rekid, me.id);
  if(n >= BATAS_EDIT) return {ok:false, sisa:0,
    pesan:'Batas ' + BATAS_EDIT + ' kali pengubahan sudah tercapai. Minta Pemilik membuka kuncinya.'};
  return {ok:true, sisa: BATAS_EDIT - n};
}

/* Aturan uang: karyawan boleh menaikkan angka, tidak boleh menurunkan.
   jmlBaru dibandingkan dengan yang sudah tercatat. */
/* Bulan depan terkunci untuk karyawan. Tunggakan dan bulan berjalan tetap
   bebas dicatat; kunci terbuka sendiri tanggal 1. Pemilik tidak terkunci.

   Pengaman: bila tanggal di HP berada di luar rentang periode aplikasi
   (mis. jam HP salah, atau rentang belum diperbarui untuk tahun berikutnya),
   kunci dimatikan. Lebih baik kunci tidak aktif daripada karyawan tidak bisa
   bekerja sama sekali. */
function bulanTerkunci(pr){
  if(!me || me.peran === 'owner') return null;
  const c = curPer();
  if(c < P0 || c > PZ) return null;          // di luar rentang: jangan mengunci
  if(pr <= c) return null;
  return {ok:false, pesan: pLbl(pr) + ' belum dibuka. Tim hanya bisa mencatat '
    + 'sampai ' + pLbl(c) + '. Hubungi pemilik bila pelanggan bayar di muka.'};
}

/* Bulan tertua yang belum lunas. Uang hanya bisa mengalir maju: yang dicatat
   di bulan muda tidak akan pernah melunasi bulan yang lebih tua. Maka bulan
   inilah yang harus diisi lebih dulu. */
function bulanTertuaBelumLunas(p, sampai){
  for(const q of periodeList(sampai)){
    if(!ditagih(p) || q < p.mulai) continue;
    if(statusOf(p, q) !== 'lunas') return q;
  }
  return null;
}

/* Tagihan lama harus ditutup lebih dulu.
   Bila bulan sebelumnya masih menunggak, pencatatan di bulan ini ditolak —
   uangnya harus dimasukkan ke bulan tertua yang belum lunas. Dengan begitu
   tidak ada lagi centang yang hilang dan tidak ada setoran yang tercatat di
   bulan keliru. Berlaku untuk karyawan maupun pemilik, supaya urutan
   pembayaran selalu rapi.
   Membatalkan transaksi (jumlah nol) tidak terkena aturan ini. */
function harusBulanTertua(id, pr, jmlBaru){
  const p = byId(id);
  if(!p) return null;
  if(Math.round(jmlBaru || 0) <= 0) return null;
  const tua = bulanTertuaBelumLunas(p, pr);
  if(tua === null || tua >= pr) return null;
  return {ok:false, pesan: pLbl(tua) + ' belum lunas. Catat pembayarannya di '
    + pLbl(tua) + ' dulu, baru ' + pLbl(pr) + '.'};
}

function bolehBayar(id, pr, jmlBaru){
  if(!me) return {ok:false, pesan:'Belum masuk'};
  const kunci = bulanTerkunci(pr);
  if(kunci) return kunci;
  const urut = harusBulanTertua(id, pr, jmlBaru);
  if(urut) return urut;
  if(me.peran === 'owner') return {ok:true};
  if(KARYAWAN_BOLEH_UBAH) return bolehEdit('pembayaran', id + '_' + pr);
  const b = bayarOf(id, pr), lama = b ? b.j : 0;
  const baru = Math.round(jmlBaru || 0);
  if(baru > lama) return KARYAWAN_BOLEH_NAIKKAN_BAYAR
    ? {ok:true, naik: baru - lama}
    : {ok:false, pesan: PESAN_KUNCI};
  if(baru === lama) return {ok:true, tetap:true};
  /* mengoreksi angka boleh; menghapus setoran sama sekali tetap Pemilik */
  if(baru === 0 && lama > 0) return {ok:false, turun:true,
    pesan:'Membatalkan transaksi hanya bisa Pemilik. Untuk memperbaiki angka, ubah jumlahnya.'};
  return KARYAWAN_BOLEH_TURUNKAN_BAYAR ? {ok:true} : {ok:false, turun:true, pesan: PESAN_TURUN};
}

/* ================= AKSI ================= */
function setBayar(id, pr, jml, cara){
  alokasiBatal();
  const k = kBayar(id, pr);
  if(!jml || jml<=0) delete DB.bayar[k];
  else DB.bayar[k] = {j:Math.round(jml), t:new Date().toISOString(), c:cara||'Tunai', u:(me?me.nama:'-')};
  save();
}
/* satu pintu untuk semua perubahan pembayaran: cek batas, simpan, catat, kirim */
async function bayarUbah(id, pr, jml, cara){
  const p = byId(id); if(!p) return false;
  const rek = id + '_' + pr;
  const lama = bayarOf(id, pr);
  if(!lama && !(jml > 0)) return true;                 // tidak ada yang berubah
  const iz = await Promise.resolve(bolehBayar(id, pr, jml));
  if(!iz.ok){ toast(iz.pesan); return false; }
  const aksi = !lama ? 'tambah' : (jml > 0 ? 'edit' : 'hapus');
  setBayar(id, pr, jml, cara);
  catat(aksi, 'pembayaran', rek, p.nama + ' · ' + pLbl(pr)
      + (iz.naik && lama ? ' · tambah bayar ' + rp(iz.naik) : ''),
    lama ? rp(lama.j) + ' (' + lama.c + ')' : '',
    jml > 0 ? rp(jml) + ' (' + (cara||'Tunai') + ')' : '');
  dorongBayar(id, pr);
  return true;
}

async function toggleLunas(id){
  const p = byId(id); const s = statusOf(p, per);
  if(s==='lunas') await bayarUbah(id, per, 0);
  else await bayarUbah(id, per, p.harga, 'Tunai');
  render();
}
function waLink(hp, teks){
  let n = String(hp||'').replace(/[^0-9]/g,'');
  if(n.startsWith('0')) n = '62'+n.slice(1);

/* ================= KWITANSI =================
   Sebelumnya kwitansi hanya bisa dikirim lewat WhatsApp. Untuk pelanggan
   yang belum punya nomor — dan itu sebagian besar — tombolnya membuka
   WhatsApp tanpa tujuan, jadi praktis tidak terpakai.

   Sekarang kwitansi ditampilkan di layar lebih dulu. Karyawan bisa langsung
   menunjukkannya ke pelanggan, atau pelanggan memotretnya sendiri. Kirim
   lewat WhatsApp jadi pilihan tambahan, bukan satu-satunya jalan.

   Nomor kwitansi dibuat tetap: pelanggan dan bulan yang sama selalu
   menghasilkan nomor yang sama, jadi bisa dicocokkan bila ada selisih. */

function noKwitansi(p, pr){
  const kode = String(p.id||'').replace(/[^a-zA-Z0-9]/g,'').slice(-4).toUpperCase() || '0000';
  return 'KW-' + String(pr).replace('-','') + '-' + kode;
}

function teksKwitansi(p, pr){
  const b = bayarOf(p.id, pr); if(!b) return '';
  const st = statusOf(p, pr) === 'lunas' ? 'LUNAS' : 'BAYAR SEBAGIAN';
  const saldo = saldoOf(p, pr);
  return `*KWITANSI ${DB.usaha.nama}*
No.      : ${noKwitansi(p, pr)}
Nama     : ${p.nama}
Bulan    : ${pLbl(pr)}
Jumlah   : ${rp(b.j)}
Cara     : ${b.c}
Tanggal  : ${tglId(b.t)}
Diterima : ${b.u || '-'}
Status   : ${st}${saldo > 0 ? '\nSaldo    : ' + rp(saldo) + ' (untuk bulan depan)' : ''}

Terima kasih 🙏`;
}

function pesanTagih(p, pr){
  const t = tunggakan(p, pr);
  let s = DB.usaha.pesan
    .replace(/{nama}/g, p.nama).replace(/{bulan}/g, pLbl(pr))
    .replace(/{jumlah}/g, rp(p.harga)).replace(/{tempo}/g, p.tempo)
    .replace(/{usaha}/g, DB.usaha.nama).replace(/{area}/g, p.area);
  const sd = saldoOf(p, pr);
  if(t>0) s += '\n\nTunggakan bulan sebelumnya: ' + rp(t) + '\nTotal: ' + rp(t + p.harga);
  else if(sd > 0) s += '\n\nSaldo Anda: ' + rp(sd) + '\nSisa yang perlu dibayar: ' + rp(Math.max(0, p.harga - sd));
  return s;
}
function unduh(nama, isi, tipe){
  const b = new Blob([isi], {type: tipe||'text/plain;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nama;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* Daftar pelanggan beserta tunggakannya — bisa dibuka di Excel. */
function csvCadanganPelanggan(){
  const pr = curPer();
  const h = ['Nama','Area','HP','Tempo','Tarif','Status','Mulai','Tunggakan','Saldo','Catatan'];
  const rows = pel().map(p=>[p.nama, p.area, p.hp, p.tempo, p.harga, p.status, p.mulai,
    ditagih(p)? tunggakan(p, pr) : 0, saldoOf(p, pr), p.catatan||'']);
  return [h, ...rows].map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(';')).join('\n');
}

function csvTagihan(pr){
  const h = ['Nama','Area','Tempo','Tarif','Dibayar','Status','Tgl Bayar','Cara','Tunggakan','Saldo','HP'];
  const rows = pel().filter(p=>ditagih(p) && pr>=p.mulai).map(p=>{
    const b = bayarOf(p.id, pr);
    return [p.nama, p.area, p.tempo, p.harga, b?b.j:0, statusOf(p,pr), b?tglId(b.t):'', b?b.c:'', tunggakan(p,pr), saldoOf(p,pr), p.hp];
  });
  return [h, ...rows].map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(';')).join('\n');
}

/* ================= TAGIHAN ================= */
function rowTagih(p){
  const s = statusOf(p, per); const b = bayarOf(p.id, per);
  const tk = s==='lunas'? 'on' : (s==='sebagian'? 'part':'');
  const lbl = {lunas:'<em class="l">Lunas</em>', sebagian:'<em class="b">Sebagian</em>',
    belum:'<em class="b">Belum</em>', telat:'<em class="t">Telat</em>', nihil:''}[s];
  const tg = tunggakan(p, per), sd = saldoOf(p, per);
  return `<div class="row" data-pel="${p.id}">
    <button class="tick ${tk}" data-tick="${p.id}" aria-label="Tandai lunas">${s==='sebagian'?'½':'✓'}</button>
    <div class="nm"><b>${esc(p.nama)}</b><span>${esc(p.area)} · tempo tgl ${p.tempo}${tg>0?' · <span style="color:var(--alert)">nunggak '+rpk(tg)+'</span>':''}${sd>0?' · <span style="color:var(--lunas)">saldo '+rpk(sd)+'</span>':''}${p.status==='isolir'?' · <span class="badge isolir">isolir</span>':''}</span></div>
    <div class="amt">${rp(b&&b.j?b.j:p.harga)}${lbl}</div></div>`;
}
function vTagihan(){
  const r = ringkas(per);
  let list = pel().filter(p=>ditagih(p) && per>=p.mulai);
  if(fTag.q){ const q=fTag.q.toLowerCase(); list = list.filter(p=>p.nama.toLowerCase().includes(q)); }

    return fTag.st==='lunas'? s==='lunas' : fTag.st==='belum'? (s!=='lunas') : tunggakan(p,per)>0; });
  if(fTag.gr!=='semua') list = list.filter(p=> fTag.gr==='t8'? p.tempo===8 : fTag.gr==='t15'? p.tempo===15 : p.area===fTag.gr);
  const areas = [...new Set(pel().map(p=>p.area))].filter(Boolean);

    ${[['semua','Semua grup'],['t8','Tempo 8'],['t15','Tempo 15'],...areas.map(a=>[a,a])]

/* ================= TITIP JUAL & KONSINYASI =================
   Barang dititip ke toko orang. Kalau laku, hasil penjualan dibagi:
   bagian pemilik (DB.titip.bagi %) jadi piutang ke toko sampai disetor.
   NOTE: modul ini baru tersimpan LOKAL di HP ini (belum ikut disinkronkan
   ke server), karena tabel servernya belum ada. Stok & Produk baru —
   Catat laku, Piutang & Setoran menyusul di tahap berikutnya. */
const tokoTitip = () => DB.titip.toko;
const produkTitip = () => DB.titip.produk;
const tokoTitipById = id => DB.titip.toko.find(t=>t.id===id);
const produkTitipById = id => DB.titip.produk.find(p=>p.id===id);
function titipStok(tokoId, produkId){
  let s = 0;
  for(const c of DB.titip.catat){
    if(c.tokoId!==tokoId || c.produkId!==produkId) continue;
    if(c.jenis==='titip') s += c.qty;
    else s -= c.qty;             // 'laku' atau 'retur' mengurangi stok
  }
  return s;
}
function titipStokToko(tokoId){
  const m = {};
  for(const c of DB.titip.catat.filter(x=>x.tokoId===tokoId)){
    m[c.produkId] = (m[c.produkId]||0) + (c.jenis==='titip'? c.qty : -c.qty);
  }
  return m;                       // {produkId: sisaStok}
}
function titipOmzet(tokoId){
  return DB.titip.catat.filter(c=>c.tokoId===tokoId && c.jenis==='laku')
    .reduce((s,c)=>{ const pr = produkTitipById(c.produkId); return s + (pr? pr.harga*c.qty : 0); }, 0);
}
function titipBagianSaya(tokoId){ return Math.round(titipOmzet(tokoId) * DB.titip.bagi / 100); }
function titipDisetor(tokoId){ return DB.titip.setor.filter(s=>s.tokoId===tokoId).reduce((s,x)=>s+x.jumlah,0); }
function titipPiutang(tokoId){ return Math.max(0, titipBagianSaya(tokoId) - titipDisetor(tokoId)); }
function titipPiutangTotal(){ return tokoTitip().reduce((s,t)=>s+titipPiutang(t.id),0); }

function vTitip(){
  const q = (fTitip.q||'').toLowerCase();
  const list = tokoTitip().filter(t=>!q || t.nama.toLowerCase().includes(q)).sort((a,b)=>a.nama.localeCompare(b.nama));
  const totalPiutang = titipPiutangTotal();
  return `
  <div class="card"><h3>Piutang belum disetor</h3>
    <div class="kpi ${totalPiutang>0?'warn':'ok'}" style="border:0;padding:0">
      <div class="val" style="font-size:26px">${rp(totalPiutang)}</div>

      border:1px solid var(--line);border-radius:11px;padding:9px 11px">
  </div>

  ${list.length? list.map(t=>{
    const pi = titipPiutang(t.id);
    const stok = titipStokToko(t.id);
    const totalStok = Object.values(stok).reduce((a,b)=>a+b,0);
    return `<div class="row" data-titiptoko="${t.id}">
      <div class="nm"><b>${esc(t.nama)}</b><span>${esc(t.kontak||'-')} · ${totalStok} barang jalan</span></div>

  }).join('') : `<div class="empty"><b>${q? 'Toko tidak ditemukan' : 'Belum ada toko titipan'}</b>${q?'':'Tambahkan toko tempat Anda menitipkan barang.'}</div>`}
  <div style="height:8px"></div>`;
}

function vHariIni(){

  if(!can('uang')) list = list.filter(x=>x.u===me.nama);

  const cara = {}; list.forEach(x=>cara[x.c]=(cara[x.c]||0)+x.j);
  const tgl = today();
  const jatuh = pel().filter(p=>ditagih(p) && p.tempo===tgl.getDate() && per>=p.mulai && statusOf(p,per)!=='lunas');
  const r = ringkas(per);
  return `

    ${Object.keys(cara).length? `<div class="grid3" style="margin-top:12px">${Object.entries(cara).map(([k,v])=>

    <div class="fr" style="margin-top:12px">

  <div class="card"><h3>Rincian pembayaran hari ini</h3>
    ${list.length? list.map(x=>`<div class="row" data-pel="${x.p.id}" data-per="${x.pr}">
      <button class="tick on" data-tick="${x.p.id}">✓</button>
      <div class="nm"><b>${esc(x.p.nama)}</b><span>${esc(x.p.area)} · ${esc(x.u||'-')} · ${esc(x.c)} · ${new Date(x.t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}<br>Untuk bulan ${esc(pLbl(x.pr))}</span></div>

let fLog = {q:'', aksi:'semua', oleh:'semua'};

  let list = DB.log.slice();
  if(!can('uang')) list = list.filter(x=>x.oleh_id === me.id);      // karyawan: aktivitasnya sendiri
  if(fLog.aksi !== 'semua') list = list.filter(x=>x.aksi === fLog.aksi);
  if(fLog.oleh !== 'semua') list = list.filter(x=>x.oleh_id === fLog.oleh);
  if(fLog.q){ const q = fLog.q.toLowerCase();
    list = list.filter(x=>(x.judul||'').toLowerCase().includes(q) || (x.oleh||'').toLowerCase().includes(q)); }
  const orang = [...new Map(DB.log.map(x=>[x.oleh_id, x.oleh])).entries()];
  const warna = {tambah:'var(--lunas)', edit:'var(--belum)', hapus:'var(--alert)', buka:'var(--biru)', koreksi:'var(--merah)'};
  const dikoreksi = x => DB.log.some(y=>y.aksi==='koreksi' && y.rekid===x.rekid && y.waktu > x.waktu

  <div class="chips">${[['semua','Semua'],['tambah','Tambah'],['edit','Ubah'],['hapus','Hapus'],['koreksi','Koreksi'],['buka','Buka kunci']]
    .map(([k,l])=>`<button class="chip ${fLog.aksi===k?'on':''}" data-laksi="${k}">${l}</button>`).join('')}</div>
  ${can('uang') && orang.length>1 ? `<div class="chips">${[['semua','Semua orang'],...orang.map(([id,nm])=>[id,nm])]
    .map(([k,l])=>`<button class="chip ${fLog.oleh===k?'on':''}" data-loleh="${esc(k)}">${esc(l)}</button>`).join('')}</div>`:''}
  <div style="margin-top:4px">
  ${list.length ? list.slice(0,200).map(x=>`<div class="row" style="align-items:flex-start" data-log="${x.id}">
    <div class="nm"><b>${esc(x.judul || x.tabel)}</b>
      <span style="color:${warna[x.aksi]||'var(--ink2)'};font-weight:700">${AKSI_LBL[x.aksi]||x.aksi}</span>
      <span> · ${esc(x.oleh)} (${esc(jabatanTeks((DB.users||[]).find(u=>u.nama===x.oleh) || {peran:x.peran}))}) · ${esc(jamId(x.waktu))}</span>
      ${dikoreksi(x) ? '<span class="badge isolir" style="margin-left:6px">sudah dikoreksi</span>':''}
      ${x.sebelum||x.sesudah ? `<span style="display:block;margin-top:2px">${x.sebelum? '<s>'+esc(x.sebelum)+'</s> → ':''}${esc(x.sesudah||'dihapus')}</span>`:''}

/* Kamera dipakai dua keperluan: bukti absen dan kirim foto ke grup.
   kamUntuk menentukan apa yang dilakukan setelah dijepret; kamHadap
   menentukan kamera depan (swafoto) atau belakang (potret). */
let kamUntuk = 'absen', kamHadap = 'user';

function sheetKamera(jenis, untuk, hadap){
  kamJenis = jenis;
  kamUntuk = untuk || 'absen';
  kamHadap = hadap || 'user';
  const keChat = kamUntuk === 'chat';
  const depan = kamHadap === 'user';
  const judul = keChat ? (depan ? 'Swafoto ke grup' : 'Potret ke grup')
                       : (jenis === 'masuk' ? 'Absen Masuk' : 'Absen Pulang');
  sheet(`<h2>${judul}</h2>

  navigator.mediaDevices && navigator.mediaDevices.getUserMedia

          v.srcObject = s;

        if(p) p.innerHTML = '<span style="color:var(--alert)">HP ini tidak mendukung kamera langsung — pakai “Kamera bawaan HP”</span>'; })();
}

/* menyimpan hasil absen: catatan jam, lokasi, dan fotonya */
async function simpanPresensi(jenis, foto){
  const lok = await ambilLokasi();
  const kini = new Date().toISOString();
  let a;
  if(jenis === 'masuk'){
    if(presensiTerbuka(me.id)){ toast('Sesi sebelumnya belum ditutup — absen pulang dulu'); return; }
    a = {id:uid('PR'), user_id:me.id, nama:me.nama, tanggal:tglKunci(), masuk:kini, pulang:null,
         lat_masuk:lok?lok.lat:null, lon_masuk:lok?lok.lon:null, akurasi_masuk:lok?lok.akurasi:null,
         lat_pulang:null, lon_pulang:null, akurasi_pulang:null};
    DB.presensi = DB.presensi || []; DB.presensi.push(a);
  }else{
    a = presensiTerbuka(me.id);
    if(!a){ toast('Belum ada sesi yang terbuka — absen masuk dulu'); return; }
    a.pulang = kini;
    if(lok){ a.lat_pulang = lok.lat; a.lon_pulang = lok.lon; a.akurasi_pulang = lok.akurasi; }
  }
  save();
  catat(jenis === 'masuk' ? 'tambah' : 'edit', 'presensi', a.id,
    me.nama + ' absen ' + jenis, '', jamSaja(kini) + (lok ? ' · lokasi tercatat' : ' · lokasi tidak terbaca'));

  if(foto) await fotoSimpan(a.id + '_' + jenis, foto);   // arsip pribadi di HP ini

  const baris = {id:a.id, user_id:a.user_id, nama:a.nama, tanggal:a.tanggal,
    masuk:a.masuk, pulang:a.pulang || null,
    lat_masuk:a.lat_masuk, lon_masuk:a.lon_masuk, akurasi_masuk:a.akurasi_masuk,
    lat_pulang:a.lat_pulang, lon_pulang:a.lon_pulang, akurasi_pulang:a.akurasi_pulang};
  if(foto) baris['foto_' + jenis] = foto;
  /* Foto sengaja tidak masuk antrean: antrean ikut tersimpan di localStorage
     yang kapasitasnya kecil. Bila gagal terkirim, catatan absennya tetap
     diantre — hanya fotonya yang dilewat. */
  const kirim = await sbSimpan('presensi', [baris], true).catch(()=>false);
  if(!kirim){ const tanpaFoto = Object.assign({}, baris); delete tanpaFoto['foto_' + jenis];
    antrekan({t:'presensi', a:'simpan', d:[tanpaFoto]}); }

  segeraSinkron(); closeSheet(); render();
  toast('Absen ' + jenis + ' tercatat ' + jamSaja(kini) + (lok ? '' : ' (lokasi tidak terbaca)'));
}

/* rincian satu absen: foto (bila masih ada) dan titik lokasi */
async function sheetPresensi(id){
  const a = (DB.presensi||[]).find(x=>x.id === id);
  if(!a) return toast('Data absen tidak ditemukan');
  if(!can('uang') && a.user_id !== me.id) return toast('Hanya absen sendiri');
  const umur = Math.round((new Date(tglKunci()) - new Date(a.tanggal)) / 86400000);
  const peta = (lat, lon) => lat==null ? '' :
    `<a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank" rel="noopener"
       style="color:var(--merah);font-weight:600">Buka peta</a>`;
  const baris = (j, jam, lat, lon, ak) => `
    <div style="flex:1;min-width:0">
      <div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)">${j}</div>
      <div style="font-weight:700">${jam}</div>
      <div id="fo_${j}" style="margin-top:6px;background:var(--paper);border-radius:10px;
        aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;
        font-size:11px;color:var(--ink2);overflow:hidden">memuat…</div>
      <div style="font-size:11px;color:var(--ink2);margin-top:5px">
        ${lat!=null ? '📍 '+lat.toFixed(5)+', '+lon.toFixed(5)+(ak? ' (±'+ak+'m)':'')+'<br>'+peta(lat,lon)
                    : 'lokasi tidak tercatat'}</div>
    </div>`;
  const jarak = (a.lat_masuk!=null && a.lat_pulang!=null)
    ? jarakMeter(a.lat_masuk, a.lon_masuk, a.lat_pulang, a.lon_pulang) : null;

  sheet(`<h2>${esc(a.nama)}</h2>
    <div class="sub">${esc(tglId(a.tanggal))}${a.pulang? ' · lama '+selisihTeks(a.masuk, a.pulang):''}</div>
    <div class="fr" style="margin-top:12px;gap:12px">
      ${baris('masuk', jamSaja(a.masuk), a.lat_masuk, a.lon_masuk, a.akurasi_masuk)}
      ${a.pulang ? baris('pulang', jamSaja(a.pulang), a.lat_pulang, a.lon_pulang, a.akurasi_pulang)
                 : '<div style="flex:1;color:var(--ink2);font-size:12px;align-self:center">Belum absen pulang</div>'}
    </div>
    ${jarak!=null ? `<div style="font-size:12px;color:${jarak>500?'var(--belum)':'var(--ink2)'};margin-top:10px">
      Jarak titik masuk ke titik pulang: ${jarak} meter${jarak>500? ' — cukup jauh, perlu ditanyakan':''}</div>`:''}
    <div style="font-size:11.5px;color:var(--ink2);margin-top:10px">
      ${umur > 3 ? 'Foto absen lebih dari 3 hari sudah terhapus otomatis dari server. Jam dan lokasi tetap tersimpan.'
                 : 'Foto tersimpan di server selama 3 hari, lalu terhapus sendiri.'}
    </div>
    <div class="acts" style="margin-top:10px"><button class="btn w" data-act="tutup">Tutup</button></div>`);

  /* foto diambil belakangan supaya layar tidak tertahan; utamakan salinan
     di HP sendiri, baru menoleh ke server */
  for(const j of ['masuk','pulang']){
    if(j === 'pulang' && !a.pulang) continue;
    const kotak = document.getElementById('fo_' + j);
    if(!kotak) continue;
    let img = await fotoAmbil(a.id + '_' + j);
    if(!img && sbOn() && umur <= 3){
      try{
        const r = await sbReq('presensi?select=foto_' + j + '&id=eq.' + encodeURIComponent(a.id));
        if(Array.isArray(r) && r[0]) img = r[0]['foto_' + j] || null;
      }catch(e){}
    }
    const k2 = document.getElementById('fo_' + j);
    if(!k2) return;
    k2.innerHTML = img
      ? `<img src="${img}" style="width:100%;height:100%;object-fit:cover">`
      : (umur > 3 ? 'foto sudah terhapus' : 'tidak ada foto');
  }
}

/* ================= CHAT GRUP TIM =================
   Satu grup untuk seluruh tim. Pesan diambil bertahap lewat penyelidikan
   berkala yang sudah ada, jadi tidak menambah beban baru yang berarti.
   Foto disimpan di HP masing-masing; di server foto lepas setelah 2 hari
   dan seluruh pesan hilang setelah 3 hari. */
let chatBalas = null;          // pesan yang sedang dibalas
let chatKirim = false;         // sedang mengirim
let chatTarikT = 0;            // hitungan giliran penarikan

function pesanUrut(){
  return (DB.pesan||[]).slice().sort((a,b)=>String(a.waktu).localeCompare(String(b.waktu)));
}
function belumDibaca(){
  if(!me) return 0;
  const s = (DB.bacaSampai && DB.bacaSampai[me.id]) || '';
  return (DB.pesan||[]).filter(p=>p.user_id !== me.id && String(p.waktu) > s).length;
}
function tandaChat(){
  const n = document.getElementById('chatBadge'); if(!n) return;
  const j = belumDibaca();
  if(j > 0 && view !== 'chat'){ n.style.display = 'block'; n.textContent = j > 99 ? '99+' : j; }
  else n.style.display = 'none';
  /* tanda merah di ikon aplikasi (di layar utama HP), seperti aplikasi lain.
     Hanya berfungsi kalau MyRoom sudah dipasang sebagai aplikasi (bukan
     dibuka lewat tab browser biasa), dan browsernya mendukung Badging API. */
  if('setAppBadge' in navigator){
    if(j > 0) navigator.setAppBadge(j).catch(()=>{});
    else navigator.clearAppBadge().catch(()=>{});
  }
}
/* menandai sudah terbaca sampai pesan terakhir */
async function tandaiTerbaca(){
  if(!me) return;
  const list = pesanUrut();
  if(!list.length) return;
  const akhir = list[list.length-1].waktu;
  DB.bacaSampai = DB.bacaSampai || {};
  if(DB.bacaSampai[me.id] === akhir) return;
  DB.bacaSampai[me.id] = akhir; save(); tandaChat();
  if(sbOn()){ try{ await sbSimpan('pesan_baca',
    [{user_id:me.id, nama:me.nama, sampai:akhir}], true); }catch(e){} }
}
/* siapa saja yang sudah membaca sampai pesan ini */
function sudahBaca(waktu){
  const b = DB.bacaSampai || {};
  return DB.users.filter(u=>u.aktif!==false && u.id !== me.id && b[u.id] && b[u.id] >= waktu)
    .map(u=>u.nama);
}

async function chatTarik(){
  if(!sbOn()) return false;
  const list = pesanUrut();
  const sejak = list.length ? list[list.length-1].waktu : null;
  const q = 'pesan?select=id,user_id,nama,teks,ada_foto,lat,lon,akurasi,balas_id,balas_nama,balas_teks,waktu'
    + (sejak ? '&waktu=gt.' + encodeURIComponent(sejak) : '')
    + '&order=waktu.asc&limit=200';
  let baru = [];
  try{ baru = await sbReq(q) || []; }catch(e){ return false; }
  try{ const bc = await sbReq('pesan_baca?select=*');
    if(Array.isArray(bc)){ DB.bacaSampai = DB.bacaSampai || {};
      bc.forEach(r=>{ DB.bacaSampai[r.user_id] = r.sampai; }); } }catch(e){}
  if(!baru.length){ if(!sejak) rapikanPesan(); return false; }
  const ada = new Set((DB.pesan||[]).map(x=>x.id));
  DB.pesan = DB.pesan || [];
  let masukBaru = [];
  baru.forEach(r=>{ if(ada.has(r.id)) return;
    const p = {id:r.id, user_id:r.user_id, nama:r.nama, teks:r.teks||'',
      lat:r.lat, lon:r.lon, akurasi:r.akurasi, adaFoto:!!r.ada_foto,
      balas_id:r.balas_id||'', balas_nama:r.balas_nama||'', balas_teks:r.balas_teks||'',
      waktu:r.waktu};
    DB.pesan.push(p); masukBaru.push(p); });
  rapikanPesan(); save(); tandaChat();
  const dariOrangLain = masukBaru.filter(p=>!me || p.user_id !== me.id);
  if(dariOrangLain.length && view !== 'chat' && sejak){
    const t = dariOrangLain[dariOrangLain.length-1];
    beriTahu('💬', 'Pesan baru dari ' + t.nama,
      (dariOrangLain.length > 1 ? '(' + dariOrangLain.length + ' pesan) ' : '')
      + (t.teks ? t.teks : (t.adaFoto ? '📷 mengirim foto' : '📍 membagikan lokasi')), 'chat');
  }
  return true;
}
/* Pesan lama dibuang dari HP: server pun hanya menyimpan 3 hari, dan
   penyimpanan HP terbatas. */
function rapikanPesan(){
  const batas = new Date(Date.now() - 3*86400000).toISOString();
  DB.pesan = (DB.pesan||[]).filter(p=>String(p.waktu) >= batas).slice(-300);
}

async function kirimPesan(teks, foto, lok){
  if(chatKirim) return;
  teks = (teks||'').trim();
  if(!teks && !foto && !lok) return;
  chatKirim = true;
  const p = {id:uid('M'), user_id:me.id, nama:me.nama, teks, adaFoto:!!foto,
    lat:lok?lok.lat:null, lon:lok?lok.lon:null, akurasi:lok?lok.akurasi:null,
    balas_id: chatBalas? chatBalas.id : '', balas_nama: chatBalas? chatBalas.nama : '',
    balas_teks: chatBalas? (chatBalas.teks||'(foto)').slice(0,70) : '',
    waktu: new Date().toISOString(), belum:true};
  DB.pesan = DB.pesan || []; DB.pesan.push(p);
  if(foto) await fotoSimpan('pesan_' + p.id, foto);     // salinan di HP sendiri
  chatBalas = null; save(); render();

  const baris = {id:p.id, user_id:p.user_id, nama:p.nama, teks:p.teks, ada_foto:!!foto,
    lat:p.lat, lon:p.lon, akurasi:p.akurasi,
    balas_id:p.balas_id||null, balas_nama:p.balas_nama||null, balas_teks:p.balas_teks||null,
    waktu:p.waktu};
  if(foto) baris.foto = foto;
  let ok = false;
  try{ ok = await sbSimpan('pesan', [baris], true); }catch(e){ ok = false; }
  if(!ok){ const tanpa = Object.assign({}, baris); delete tanpa.foto;
    antrekan({t:'pesan', a:'simpan', d:[tanpa]}); }
  const q = (DB.pesan||[]).find(x=>x.id === p.id); if(q) delete q.belum;
  chatKirim = false; save();
  if(view === 'chat'){ render(); geserBawah(); }
  tandaiTerbaca();
}

/* ================= RAPOR KINERJA INDIVIDU =================
   Menyusun jejak kerja satu orang: kehadiran, jam, poin, setoran, dan gaji,
   per bulan lalu diringkas setahun. Semua diambil dari catatan yang sudah
   ada — tidak ada data baru yang perlu diisi manual. */
function bulanTahun(tahun){
  return ALLPER.filter(p=>p.slice(0,4) === String(tahun));
}
function rapotBulan(u, periode){
  const R = rentangDari({mode:'bulan', bulan:periode});
  const rk = rekapJam(u, R.d1, R.d2);
  const pb = poinBonus(R.d1, R.d2).find(x=>x.nama === u.nama)
    || {poin:0, kerja:0, berdua:0, tagih:0, cepat:0, bonus:0};
  const abs = (DB.absen||[]).filter(a=>a.nama === u.nama && String(a.tgl).slice(0,7) === periode);
  const jns = k => abs.filter(a=>a.jenis === k).length;
  let setoran = 0, jmlBayar = 0;
  for(const k of Object.keys(DB.bayar||{})){
    const b = DB.bayar[k];
    if(b && b.u === u.nama && String(b.t||'').slice(0,7) === periode){ setoran += b.j||0; jmlBayar++; }
  }
  const gj = (DB.gaji||[]).find(g=>g.nama === u.nama && g.periode === periode && g.dibayarPada);
  const tiketSelesai = (DB.tiket||[]).filter(t=>t.status === 'selesai' && t.selesai
    && String(t.selesai).slice(0,7) === periode
    && String(t.penangan||'').split(',').map(x=>x.trim()).indexOf(u.nama) >= 0).length;
  return {periode, hariHadir:rk.hariHadir,
    menitNormal:rk.menitNormal, menitLembur:rk.menitLembur,
    telat:rk.telat, telatMenit:rk.telatMenit, belumTutup:rk.belumTutup,
    alpa:jns('alpa'), izin:jns('izin'), sakit:jns('sakit'), cuti:jns('cuti'),
    poin:pb.poin, gangguan:tiketSelesai, berdua:pb.berdua||0, cepat:pb.cepat||0,
    tagih:pb.tagih||0, bonus:pb.bonus||0,
    setoran, jmlBayar, upahLembur:rk.upahLembur,
    dibayar: gj ? (gj.total||0) : 0, sudahDibayar: !!gj};
}
function rapotTahun(u, tahun){
  const bulan = bulanTahun(tahun).map(p=>rapotBulan(u, p));
  const j = k => bulan.reduce((s,x)=>s + (x[k]||0), 0);
  return {bulan, tahun:String(tahun),
    hariHadir:j('hariHadir'), menitNormal:j('menitNormal'), menitLembur:j('menitLembur'),
    telat:j('telat'), telatMenit:j('telatMenit'), belumTutup:j('belumTutup'),
    alpa:j('alpa'), izin:j('izin'), sakit:j('sakit'), cuti:j('cuti'),
    poin:Math.round(j('poin')*100)/100, gangguan:j('gangguan'), berdua:j('berdua'),
    cepat:j('cepat'), tagih:j('tagih'), bonus:j('bonus'),
    setoran:j('setoran'), jmlBayar:j('jmlBayar'), upahLembur:j('upahLembur'),
    dibayar:j('dibayar')};
}

function sheet(html){
  $('#modal').innerHTML = `<div class="mask"><div class="sheet"><div class="hnd"></div>${html}</div></div>`;
  $('#modal .mask').addEventListener('click', e=>{ if(e.target.classList.contains('mask')) closeSheet(); });
}
function closeSheet(){
  if(typeof kamMatikan === 'function') kamMatikan();
  if(typeof pantauTimer !== 'undefined' && pantauTimer){ clearInterval(pantauTimer); pantauTimer = null; } $('#modal').innerHTML=''; }

function sheetTagih(id, pr){
  pr = pr || per;
  const p = byId(id), b = bayarOf(id, pr), s = statusOf(p, pr), tg = tunggakan(p, pr), sd = saldoOf(p, pr);
  sheet(`
    <h2>${esc(p.nama)}</h2>
    <div class="sub">${esc(p.area)} · tempo tanggal ${p.tempo} · ${esc(pLbl(pr))}</div>
    <div class="grid3">
      <div class="kpi"><div class="lbl">Tarif</div><div class="val" style="font-size:15px">${rpk(p.harga)}</div></div>
      <div class="kpi ok"><div class="lbl">Dibayar</div><div class="val" style="font-size:15px">${rpk(b?b.j:0)}</div></div>
      ${sd > 0
        ? `<div class="kpi ok"><div class="lbl">Saldo</div><div class="val" style="font-size:15px">${rpk(sd)}</div></div>`
        : `<div class="kpi bad"><div class="lbl">Tunggakan</div><div class="val" style="font-size:15px">${rpk(tg)}</div></div>`}
    </div>
    ${sd > 0 ? `<div style="font-size:12.5px;color:var(--lunas);margin-top:10px;background:var(--lunas-l);
      padding:9px 11px;border-radius:10px">Kelebihan ${rp(sd)} otomatis dipakai untuk tagihan bulan berikutnya.</div>`:''}
    ${tg > 0 ? `<div style="font-size:12.5px;color:var(--alert);margin-top:10px;background:var(--alert-l);
      padding:9px 11px;border-radius:10px">Tunggakan bulan sebelumnya ${rp(tg)}. Pembayaran akan menutup yang paling lama dulu.</div>`:''}
    ${b? `<div style="font-size:12.5px;color:var(--ink2);margin-top:10px">Dibayar ${tglId(b.t)} · ${esc(b.c)}${b.u? ' · diterima '+esc(b.u):''}</div>`:''}
    ${(()=>{ if(!b || can('uang')) return '';
      const naikSaja = !KARYAWAN_BOLEH_TURUNKAN_BAYAR && !KARYAWAN_BOLEH_UBAH;
      return naikSaja
        ? `<div style="font-size:12.5px;color:var(--belum);margin-top:10px;background:var(--belum-l);
            padding:9px 11px;border-radius:10px">Sudah tercatat ${rp(b.j)}. Kalau pelanggan menambah bayar,
            naikkan angkanya jadi total yang sudah diterima — bukan selisihnya.<br>
            <span style="opacity:.85">Angka tidak bisa diturunkan. Kalau keliru, minta Pemilik membetulkan.</span></div>`
        : ''; })()}
    <label>Jumlah diterima</label>
    <div class="fr"><input type="number" id="mJml" inputmode="numeric"
      value="${b? b.j : Math.max(0, p.harga + tg - sd)}"${b && !can('uang') && !KARYAWAN_BOLEH_TURUNKAN_BAYAR && !KARYAWAN_BOLEH_UBAH ? ` min="${b.j}"` : ''}>
      <select id="mCara"><option>Tunai</option><option>Transfer</option><option>QRIS</option><option>Titip warung</option></select></div>
    <div class="acts">
      <button class="btn g" data-act="simpanbayar" data-id="${id}" data-per="${pr}">Simpan pembayaran</button>
      ${b && (can('uang') || KARYAWAN_BOLEH_TURUNKAN_BAYAR || KARYAWAN_BOLEH_UBAH)
        ? `<button class="btn d" data-act="batalbayar" data-id="${id}" data-per="${pr}">Batalkan transaksi</button>`:''}
    </div>
    <div class="acts">
      <button class="btn" data-act="watagih" data-id="${id}" data-per="${pr}">💬 Tagih via WA</button>
      <button class="btn" data-act="wakwitansi" data-id="${id}" data-per="${pr}">🧾 Kwitansi</button>

    <button class="btn w" style="margin-top:9px" data-act="editpel" data-id="${id}">${can('tarif')?'Ubah data pelanggan':'Lihat / isi nomor HP'}</button>

  `);

/* ================= KLAIM & PENGESAHAN =================
   Poin tidak langsung masuk begitu karyawan menandai gangguan selesai.
   Pemilik mengesahkannya dulu, sekali di akhir bulan. Supaya pemeriksaan
   tidak melelahkan, sistem menyorot yang pantas dilihat lebih dulu —
   dari 60 gangguan biasanya hanya beberapa yang perlu diperiksa. */

/* Tiap tanda punya bobot. Yang disorot hanya bila bobotnya cukup berat.
   Sebabnya: sebagian pola itu wajar di usaha kecil — karyawan menerima
   telepon pelanggan, mencatatnya, lalu mengerjakannya sendiri. Kalau pola
   biasa ikut disorot, semua gangguan jadi merah dan sorotan kehilangan
   gunanya. Bobot di bawah bisa disetel setelah dipakai sebulan. */
const SOROT_AMBANG = 3;          // total bobot supaya sebuah gangguan disorot

function menitTangani(t){
  if(!t.tgl || !t.selesai) return null;
  const m = (new Date(t.selesai) - new Date(t.tgl)) / 60000;
  return isFinite(m) ? m : null;
}

/* Mengembalikan {skor, alasan[]}. Skor di bawah ambang dianggap wajar.

   Daftar pembanding dikelompokkan sekali di awal (per pelanggan, per jam
   tutup) lalu dipakai berulang. Sebelumnya seluruh daftar disapu ulang untuk
   tiap gangguan — dengan 900 gangguan itu 810.000 perbandingan, dan makin
   berat tiap bulan. Sekarang beratnya tumbuh lurus, bukan berlipat. */
function siapkanBanding(semua){
  const perPel = {}, perJam = {};
  for(const x of semua){
    if(x.pelId){ (perPel[x.pelId] = perPel[x.pelId] || []).push(x); }
    if(x.selesai){
      const k = String(x.selesai).slice(0,13) + '|' + String(x.penangan||'');
      perJam[k] = (perJam[k] || 0) + 1;
    }
  }
  return {perPel, perJam};
}

function sorotKlaim(t, semua, banding){
  const b = banding || siapkanBanding(semua);
  const alasan = []; let skor = 0;
  const tandai = (bobot, teks) => { skor += bobot; alasan.push(teks); };

  const m = menitTangani(t);
  if(m !== null && m >= 0){
    if(m < 3)       tandai(3, 'Selesai ' + Math.round(m) + ' menit setelah dilapor');
    else if(m < 15) tandai(1, 'Selesai ' + Math.round(m) + ' menit setelah dilapor');
  }

  const orang = String(t.penangan||'').split(',').map(x=>x.trim()).filter(Boolean);
  if(t.pelapor && orang.indexOf(String(t.pelapor).trim()) >= 0)
    tandai(1, 'Melapor lalu menyelesaikan sendiri');

  if(t.pelId){
    const sekelompok = b.perPel[t.pelId] || [];
    let dekat = 0;
    for(const x of sekelompok){
      if(x.id === t.id || !x.tgl) continue;
      if(Math.abs(new Date(x.tgl) - new Date(t.tgl)) < 7*86400000) dekat++;
    }
    if(dekat >= 3)      tandai(2, 'Pelanggan sama ' + (dekat+1) + 'x dalam seminggu');
    else if(dekat >= 1) tandai(1, 'Pelanggan sama ' + (dekat+1) + 'x dalam seminggu');
  }

  if(t.selesai){
    const bareng = b.perJam[String(t.selesai).slice(0,13) + '|' + String(t.penangan||'')] || 0;
    if(bareng >= 6)      tandai(2, bareng + ' gangguan ditutup dalam jam yang sama');
    else if(bareng >= 4) tandai(1, bareng + ' gangguan ditutup dalam jam yang sama');
  }

  return {skor, alasan, sorot: skor >= SOROT_AMBANG};
}

/* Gangguan selesai bulan berjalan yang belum disahkan.

   Pembanding dibatasi pada bulan berjalan ditambah seminggu sebelumnya —
   itu satu-satunya rentang yang dipakai untuk menilai. Tanpa batas ini,
   seluruh riwayat bertahun-tahun ikut disapu tiap kali dinilai. */
function klaimMenunggu(){
  const bulan = curPer();
  const [ty, tm] = bulan.split('-').map(Number);
  const batas = new Date(ty, tm - 1, 1);
  batas.setDate(batas.getDate() - 8);
  const batasIso = batas.toISOString().slice(0,10);

  const selesai = DB.tiket.filter(t=>t.status==='selesai' && t.selesai
    && String(t.selesai).slice(0,10) >= batasIso);
  const banding = siapkanBanding(selesai);          // disiapkan sekali saja
  return selesai
    .filter(t=>String(t.selesai).slice(0,7)===bulan && !t.disahkan)
    .map(t=>{ const s = sorotKlaim(t, selesai, banding);
      return Object.assign({}, t, {skor:s.skor, alasan:s.alasan, sorot:s.sorot}); })
    .sort((a,b)=> b.skor - a.skor || String(b.selesai).localeCompare(String(a.selesai)));
}

/* ================= ABSEN & GAJI =================
   Gaji tetap bulanan, dipotong hanya bila alpa. Izin dan sakit tidak
   memotong. Bonus poin dari gangguan yang sudah disahkan ikut digabung,
   supaya karyawan menerima satu angka utuh.

   Yang dicatat hanya hari TIDAK masuk. Masuk kerja itu keadaan biasa;
   yang perlu dicatat justru pengecualiannya. Dengan begitu tidak ada yang
   harus menekan tombol tiap pagi, dan tidak ada data bolong karena lupa. */

const HARI_KERJA = 26;          // hari kerja sebulan, dasar hitungan potongan
const JATAH_CUTI = 5;           // jatah cuti tiap orang, per tahun kalender

/* Cuti dihitung per tahun Januari–Desember. Melebihi jatah tidak memotong
   gaji, hanya ditandai supaya terlihat siapa yang sudah lewat. */
function cutiTahun(nama, tahun){
  tahun = tahun || String(today().getFullYear());
  const pakai = (DB.absen||[]).filter(a=>a.nama === nama && a.jenis === 'cuti'
    && String(a.tgl).slice(0,4) === String(tahun));
  return {tahun:String(tahun), pakai:pakai.length, jatah:JATAH_CUTI,
          sisa:Math.max(0, JATAH_CUTI - pakai.length),
          lebih:Math.max(0, pakai.length - JATAH_CUTI), daftar:pakai};
}
const TGL_GAJIAN = 7;           // gaji dibayar tiap tanggal 7, untuk bulan sebelumnya

/* Bulan gaji yang sedang jatuh tempo. Gaji bulan X dibayar tanggal 7 bulan
   X+1; sebelum tanggal 7, yang terakhir jatuh tempo masih bulan sebelumnya. */
function bulanGajian(){
  const d = today();
  const kini = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  return pAdd(kini, d.getDate() >= TGL_GAJIAN ? -1 : -2);
}
/* Keterangan jadwal untuk bulan gaji tertentu: kapan jatuh tempo dan
   berapa hari lagi (atau sudah lewat berapa hari). */
function jadwalGajian(periode){
  const bayar = pAdd(periode, 1);
  const [y,m] = bayar.split('-').map(Number);
  const jatuh = new Date(y, m-1, TGL_GAJIAN);
  const n = today(); n.setHours(0,0,0,0);
  const beda = Math.round((jatuh - n) / 86400000);
  const tgl = TGL_GAJIAN + ' ' + BLN[m-1] + ' ' + y;
  if(beda > 0)  return {tgl, beda, teks:'jatuh tempo ' + tgl + ' · ' + beda + ' hari lagi', warna:'var(--ink2)'};
  if(beda === 0) return {tgl, beda, teks:'jatuh tempo HARI INI (' + tgl + ')', warna:'var(--belum)'};
  return {tgl, beda, teks:'jatuh tempo ' + tgl + ' · lewat ' + (-beda) + ' hari', warna:'var(--alert)'};
}

function absenBulan(nama, periode){
  return (DB.absen||[]).filter(a=>a.nama === nama && String(a.tgl).slice(0,7) === periode);
}

/* Sisa kasbon: yang dipinjam dikurangi yang sudah dipotong lewat gaji.
   Selalu dihitung ulang dari catatan aslinya, tidak disimpan sebagai angka
   tersendiri — supaya tidak pernah melenceng bila ada yang diubah. */
function sisaKasbon(nama, sampaiPeriode){
  const pinjam = (DB.kasbon||[])
    .filter(k=>k.nama === nama && (!sampaiPeriode || String(k.tgl).slice(0,7) <= sampaiPeriode))
    .reduce((s,k)=>s + k.jml, 0);
  const sudah = (DB.gaji||[])
    .filter(g=>g.nama === nama && g.dibayarPada
      && (!sampaiPeriode || g.periode <= sampaiPeriode))
    .reduce((s,g)=>s + (g.kasbon || 0), 0);
  return Math.max(0, pinjam - sudah);
}

function hitungGaji(u, periode, d1, d2){
  const abs = d1
    ? (DB.absen||[]).filter(a=>a.nama === u.nama && String(a.tgl).slice(0,10) >= d1 && String(a.tgl).slice(0,10) <= d2)
    : absenBulan(u.nama, periode);
  const alpa  = abs.filter(a=>a.jenis === 'alpa').length;
  const izin  = abs.filter(a=>a.jenis === 'izin').length;
  const sakit = abs.filter(a=>a.jenis === 'sakit').length;
  const cuti  = abs.filter(a=>a.jenis === 'cuti').length;

  const pokok = Math.round(u.gaji || 0);
  const perHari = pokok ? Math.round(pokok / HARI_KERJA) : 0;
  const potongan = perHari * alpa;

  const b = poinBonus(d1, d2).find(x=>x.nama === u.nama);
  const bonus = b ? b.bonus : 0;
  const poin  = b ? b.poin : 0;

  /* Lembur: jam di luar jadwal dan jam pada hari libur, dikalikan tarifnya.
     Dihitung otomatis dari catatan absen pada rentang yang sedang dilihat. */
  const rk = (function(){
    if(d1) return rekapJam(u, d1, d2);
    const R0 = rentangDari({mode:'bulan', bulan:periode});
    return rekapJam(u, R0.d1, R0.d2);
  })();
  const jamLembur = Math.round(rk.jamLembur * 100) / 100;
  const jamLemburBiasa = Math.round(rk.jamLemburBiasa * 100) / 100;
  const jamLemburSiaga = Math.round(rk.jamLemburSiaga * 100) / 100;
  const upahLembur = rk.upahLembur;
  const upahLemburBiasa = rk.upahLemburBiasa;
  const upahLemburSiaga = rk.upahLemburSiaga;

  const sudah = (DB.gaji||[]).find(g=>g.nama === u.nama && g.periode === periode && g.dibayarPada);

  /* sebelum kasbon dipotong */
  const sebelumKasbon = Math.max(0, pokok - potongan + bonus + upahLembur);

  /* bila sudah dibayar, pakai angka yang tercatat saat itu.
     bila belum, tawarkan memotong sebanyak mungkin tanpa membuat gaji minus. */
  const sisa = sisaKasbon(u.nama, periode);
  const kasbon = sudah ? (sudah.kasbon || 0) : Math.min(sisa, sebelumKasbon);

  return {nama:u.nama, pokok, perHari, alpa, izin, sakit, cuti, potongan, bonus, poin,
          jamLembur, upahLembur, jamLemburBiasa, upahLemburBiasa, jamLemburSiaga, upahLemburSiaga,
          jamKerja:Math.round(rk.jamNormal*100)/100,
          hariHadir:rk.hariHadir, telat:rk.telat, belumTutup:rk.belumTutup,
          sebelumKasbon, sisaKasbon:sisa, kasbon,
          total: Math.max(0, sebelumKasbon - kasbon), sudah: sudah || null};
}

/* Karyawan yang sudah berhenti tetap ditampilkan selama masih ada urusan:
   gaji bulan ini belum dibayar, atau kasbon belum lunas. Tanpa ini, orang
   yang dinonaktifkan langsung hilang dari daftar dan gaji terakhirnya tidak
   bisa lagi dibayar lewat aplikasi. */
function daftarGaji(periode, d1, d2){
  return (DB.users||[]).filter(u=>{
    if(u.peran !== 'karyawan') return false;
    if(u.aktif !== false) return true;

    /* sudah berhenti: hanya tampil bila memang masih ada urusan pada bulan
       yang dilihat. Tanpa batas ini, namanya akan terus muncul tiap bulan
       seolah masih berhak gaji. */
    if(sisaKasbon(u.nama, periode) > 0) return true;
    const g = hitungGaji(u, periode, d1, d2);
    if(g.sudah) return true;                       // gaji bulan itu memang tercatat
    /* pernah bekerja pada bulan itu? terlihat dari uang yang dia terima
       atau hari tidak masuk yang tercatat */
    const kerja = Object.keys(DB.bayar||{}).some(k=>{
      const b2 = DB.bayar[k];
      return b2 && b2.u === u.nama && String(b2.t||'').slice(0,7) === periode;
    }) || absenBulan(u.nama, periode).length > 0;
    return kerja && g.pokok && !g.sudah;
  })
    .map(u=>Object.assign(hitungGaji(u, periode, d1, d2), {nonaktif: u.aktif === false}))
    .sort((a,b)=> (a.nonaktif?1:0) - (b.nonaktif?1:0) || a.nama.localeCompare(b.nama));
}

/* Slip gaji: bukti pembayaran untuk karyawan, dengan rincian lengkap
   supaya tidak ada yang bertanya-tanya kenapa jumlahnya berbeda dari
   gaji pokok. Bisa ditunjukkan di layar atau disalin untuk dikirim. */

function noSlip(nama, periode){
  const kode = String(nama||'').replace(/[^a-zA-Z0-9]/g,'').slice(0,4).toUpperCase() || '0000';
  return 'SG-' + String(periode).replace('-','') + '-' + kode;
}

function teksSlip(g, periode){
  const baris = [];
  baris.push('Gaji pokok   : ' + rp(g.pokok));
  if(g.alpa)     baris.push('Alpa ' + g.alpa + ' hari   : -' + rp(g.potongan));
  if(g.bonus)    baris.push('Bonus ' + poinTeks(g.poin) + ' poin : +' + rp(g.bonus));
  if(g.upahLembur) baris.push('Lembur ' + String(g.jamLembur).replace('.',',') + ' jam : +' + rp(g.upahLembur));
  if(g.upahLemburSiaga) baris.push('  (termasuk ' + String(g.jamLemburSiaga).replace('.',',') + ' jam tarif siaga : +' + rp(g.upahLemburSiaga) + ')');
  if(g.kasbon)   baris.push('Potong kasbon: -' + rp(g.kasbon));
  const sisa = g.sudah ? sisaKasbon(g.nama, periode) : Math.max(0, g.sisaKasbon - g.kasbon);
  return `*SLIP GAJI ${DB.usaha.nama}*
No.   : ${noSlip(g.nama, periode)}
Nama  : ${g.nama}
Bulan : ${pLbl(periode)}

${baris.join('\n')}
${'-'.repeat(28)}
DITERIMA: ${rp(g.total)}
${(g.izin || g.sakit || g.cuti) ? '\n' + [g.izin ? g.izin + ' hari izin' : '', g.sakit ? g.sakit + ' hari sakit' : '', g.cuti ? g.cuti + ' hari cuti' : ''].filter(Boolean).join(', ') + ' (tidak dipotong)' : ''}${sisa > 0 ? '\nSisa kasbon: ' + rp(sisa) : ''}
${g.sudah ? '\nDibayar ' + tglId(g.sudah.dibayarPada) + ' oleh ' + (g.sudah.dibayarOleh || '-') : ''}

Terima kasih atas kerjanya 🙏`;
}
