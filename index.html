<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#C8102E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyRoom">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180-apple.png">
<title>MyRoom — Tagihan WiFi</title>
<style>
:root{
  --ink:#2A1416; --ink2:#7A5A5C; --paper:#FBF3F3; --card:#fff; --line:#EBD8D8;
  --merah:#C8102E; --merah-t:#A00C24; --merah-l:#FCE9EC;
  --biru:#C8102E; --biru-l:#FCE9EC;
  --lunas:#0B7A55; --lunas-l:#E2F3EC;
  --belum:#9A6100; --belum-l:#FBF0DC;
  --alert:#B3261E; --alert-l:#FBE9E7;
  --tunda:#E07B00; --tunda-l:#FDECD1;
  --r:14px;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --headerH:80px; --navH:74px;
}
#antreBar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:9px;
  padding:11px 14px;font-size:13px;font-weight:700;cursor:pointer;border:0;width:100%;
  text-align:left;font-family:var(--sans);line-height:1.35}
#antreBar.tunggu{background:var(--belum-l);color:var(--belum);box-shadow:inset 0 -1px 0 rgba(0,0,0,.06)}
#antreBar.lama{background:var(--alert-l);color:var(--alert);box-shadow:inset 0 -1px 0 rgba(0,0,0,.06)}
#antreBar.aman{background:var(--lunas-l);color:var(--lunas)}
#antreBar.luring{background:#EEF1F4;color:#4A5A66;box-shadow:inset 0 -1px 0 rgba(0,0,0,.06)}
#antreBar.kirim{background:var(--tunda-l);color:var(--tunda);box-shadow:inset 0 -1px 0 rgba(0,0,0,.06)}
#antreBar small{display:block;font-weight:500;font-size:11.5px;opacity:.85;margin-top:1px}
#antreBar.hide{display:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{overflow:hidden;height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45;
  overflow:hidden;height:100%;max-width:100vw;position:fixed;inset:0;overscroll-behavior:none}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:940px;margin:0 auto;padding:0 14px}

/* ---------- scroll area (antara header tetap & nav tetap) ---------- */
#scrollArea{position:fixed;left:0;right:0;top:var(--headerH);bottom:var(--navH);z-index:1;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
#scrollArea::-webkit-scrollbar{width:0;height:0}
#scrollArea>main{padding-top:4px;padding-bottom:20px}

/* ---------- header (compact) ---------- */
header{background:linear-gradient(180deg,var(--merah) 0%,var(--merah-t) 100%);color:#fff;padding:8px 0 8px;
  padding-top:calc(8px + env(safe-area-inset-top));position:fixed;top:0;left:0;right:0;z-index:45;overflow:hidden}
header:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;
  border-radius:50%;border:16px solid rgba(255,255,255,.05)}
.hdrTop{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.logo{width:22px;height:22px;display:block;border-radius:7px;object-fit:cover;flex:0 0 auto}
.brand b{font-size:13.5px;letter-spacing:.08em;text-transform:uppercase;display:block;min-width:0;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-size:10px;letter-spacing:.02em;color:#FBD4D9;text-transform:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:0}
.perbar{display:flex;align-items:center;gap:6px;margin-top:6px;position:relative;z-index:1}
.perbar button{background:rgba(255,255,255,.12);border:0;color:#fff;width:26px;height:26px;
  border-radius:8px;font-size:15px;cursor:pointer}
.perbar button:active{background:rgba(255,255,255,.28)}
.perlbl{flex:1;text-align:center;font-weight:700;letter-spacing:.02em;font-size:13px}
.perlbl span{display:block;font-size:10px;font-weight:500;color:#FBD4D9;letter-spacing:.02em}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.card>h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px}
.backbar{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);padding:8px 14px 8px 10px;border-radius:11px;font-weight:700;font-size:13.5px;
  cursor:pointer;margin-top:12px}
.backbar:active{background:#F7F9FB}
.swrow{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.swrow:first-of-type{border-top:none}
.swrow .swtxt{flex:1}
.swrow .swtxt b{display:block;font-size:14px}
.swrow .swtxt span{display:block;font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.4}
.sw{position:relative;display:inline-block;width:44px;height:26px;flex:0 0 auto;margin-top:2px}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.15s;cursor:pointer}
.sw i::before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;
  border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw input:checked + i{background:var(--lunas)}
.sw input:checked + i::before{transform:translateX(18px)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:700px){.grid2{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.kpi .val{font-family:var(--num);font-size:19px;font-weight:700;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11px;color:var(--ink2);margin-top:2px}
.kpi.ok .val{color:var(--lunas)} .kpi.warn .val{color:var(--belum)} .kpi.bad .val{color:var(--alert)}

/* ---------- signal meter (signature) ---------- */
.meter{display:flex;gap:14px;align-items:flex-end}
.bars{display:flex;align-items:flex-end;gap:5px;height:74px;flex:0 0 auto}
.bars i{width:16px;background:var(--line);border-radius:3px;display:block;transition:background .45s ease}
.bars i:nth-child(1){height:30%}.bars i:nth-child(2){height:47%}.bars i:nth-child(3){height:64%}
.bars i:nth-child(4){height:82%}.bars i:nth-child(5){height:100%}
.bars i.on{background:var(--lunas)}
.meter .big{font-family:var(--num);font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1}
.meter .cap{font-size:12px;color:var(--ink2);margin-top:6px}

/* ---------- chart ---------- */
.chart{display:flex;gap:9px;align-items:flex-end;height:130px;margin-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.chart .pair{display:flex;gap:3px;align-items:flex-end;width:100%;height:100%;justify-content:center}
.chart .pair b{width:42%;border-radius:3px 3px 0 0;display:block;min-height:2px}
.chart .msk{background:var(--biru)} .chart .kel{background:#C7D3DE}
.chart .cl{font-size:10px;color:var(--ink2);letter-spacing:.04em}
.legend{display:flex;gap:14px;font-size:11px;color:var(--ink2);margin-top:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* ---------- toolbar ---------- */
.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tools input[type=search],.tools input[type=text]{flex:1 1 150px;min-width:0;background:var(--card);
  border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.chips{display:flex;gap:7px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink2);
  padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--merah);border-color:var(--merah);color:#fff}

/* ---------- list rows ---------- */
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;
  margin-top:8px;display:flex;gap:11px;align-items:center;cursor:pointer}
.row:active{background:#F7F9FB}
.tick{flex:0 0 auto;width:38px;height:38px;border-radius:11px;border:2px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:17px;color:transparent;cursor:pointer;padding:0}
.tick.on{background:var(--lunas);border-color:var(--lunas);color:#fff}
.tick.part{background:var(--belum-l);border-color:var(--belum);color:var(--belum);font-size:12px;font-weight:800}
.tick.pending{background:var(--tunda);border-color:var(--tunda);color:#fff}
/* ---------- lencana centang gaya WhatsApp ----------
   1 centang abu  = tersimpan di HP ini, belum sampai server
   2 centang hijau = sudah tersimpan di server, aman walau HP hilang */
.ct{display:inline-flex;align-items:center;vertical-align:-2px;margin-left:5px}
.ct svg{display:block}
.ct.satu{color:var(--tunda)}
.ct.dua{color:var(--lunas)}
.ct.gagal{color:var(--alert)}
.antre-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.antre-item b{display:block;font-size:13.5px}
.antre-item span{display:block;font-size:11.5px;color:var(--ink2);margin-top:2px}
.antre-item .um{margin-left:auto;font-size:11px;color:var(--ink2);white-space:nowrap;padding-top:2px}
.kutipan{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 14px;margin-bottom:12px;text-align:center;font-style:italic;
  font-size:12.5px;line-height:1.5;color:var(--ink2);transition:opacity .6s ease}
.kutipan b{display:block;font-style:normal;font-weight:700;font-size:11px;margin-top:3px;color:var(--ink)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm span{font-size:11.5px;color:var(--ink2)}
.row .amt{font-family:var(--num);font-weight:700;text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.row .amt em{display:block;font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.amt em.l{color:var(--lunas)} .amt em.b{color:var(--belum)} .amt em.t{color:var(--alert)}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:6px;background:var(--paper);color:var(--ink2)}
.badge.isolir{background:var(--alert-l);color:var(--alert)}
.badge.t8{background:var(--biru-l);color:var(--biru)}
.badge.t15{background:#EFEAFB;color:#5B3FBF}
.empty{text-align:center;color:var(--ink2);padding:34px 16px;font-size:14px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.seclbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:700;margin:16px 4px 6px}
.seclbl:first-child{margin-top:0}
.vHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.vInfo{display:flex;gap:10px;align-items:flex-start;min-width:0;flex:1}
.vAvatar{width:38px;height:38px;border-radius:11px;background:var(--merah-l);color:var(--merah);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:0 0 auto}
.vTxt{min-width:0;flex:1}
.vTxt b{font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vTxt span{font-size:11.5px;color:var(--ink2);display:block;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 14px;
  font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--biru);border-color:var(--biru);color:#fff}
.btn.g{background:var(--lunas);border-color:var(--lunas);color:#fff}
.btn.d{background:var(--alert-l);border-color:#F0C8C5;color:var(--alert)}
.btn.kunci{background:var(--paper);border-color:var(--line);color:var(--ink2);opacity:.7}
.btn.kunci:active{transform:none}
.btn.w{width:100%}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}

/* ---------- nav ---------- */
#lock{position:fixed;inset:0;z-index:100;background:var(--merah);
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;
  padding-bottom:calc(24px + env(safe-area-inset-bottom))}
#lock.hide{display:none}
#lock .lg{display:block;width:64px;height:64px;border-radius:18px;margin-bottom:14px;object-fit:cover}
#lock h1{font-size:19px;letter-spacing:.12em;text-transform:uppercase;text-align:center}
#lock p{margin:6px 0 0;font-size:13px;color:#FBD4D9;text-align:center;min-height:19px}
.dots{display:flex;gap:14px;margin:26px 0 22px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.55);transition:.15s}
.dots i.f{background:#fff;border-color:#fff;transform:scale(1.12)}
.dots.err{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.pad button{height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);
  color:#fff;font-size:23px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.pad button:active{background:rgba(255,255,255,.32)}
.pad button.x{border:0;background:0;font-size:15px;font-weight:600}
#lock input,#lock textarea{color:var(--ink);background:#fff;border:1px solid rgba(255,255,255,.5);
  font-size:15px;-webkit-text-fill-color:var(--ink);caret-color:var(--merah)}
#lock textarea{font-family:var(--num);font-size:12.5px;line-height:1.5;word-break:break-all}
#lock input::placeholder,#lock textarea::placeholder{color:#9AA8B4;-webkit-text-fill-color:#9AA8B4}
#lock input:focus,#lock textarea:focus{outline:3px solid rgba(255,255,255,.85);outline-offset:1px}
#lock label{color:#FBD4D9!important;margin-top:14px}
#lock .who{margin-top:26px;font-size:12.5px;color:#FBD4D9;text-align:center;line-height:1.7}
.rolebar{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:999px;
  padding:3px 5px 3px 9px;font-size:11px;font-weight:700;letter-spacing:.03em;flex:0 0 auto}
.rolebar button{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:999px;padding:3px 8px;
  font-size:10.5px;font-weight:700;cursor:pointer;white-space:nowrap}
#meLbl{max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--merah);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:40}
nav button{flex:1;background:0;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--ink2);font-size:10.5px;font-weight:600;cursor:pointer}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--biru)}
nav button.on svg{stroke:var(--biru)}

/* ---------- sheet / modal ---------- */
.mask{position:fixed;inset:0;background:rgba(10,20,30,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:8px 16px 24px;
  max-height:92vh;overflow:auto;animation:up .22s ease}
@media(min-width:700px){.mask{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
.hnd{width:40px;height:4px;background:var(--line);border-radius:9px;margin:6px auto 12px}
.sheet h2{font-size:18px;margin-bottom:2px}
.sheet .sub{color:var(--ink2);font-size:12.5px;margin-bottom:12px}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);
  margin:12px 0 5px;font-weight:700}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--biru);outline-offset:1px}
.fr{display:flex;gap:9px}.fr>*{flex:1}
.acts{display:flex;gap:9px;margin-top:18px}.acts>*{flex:1}
.menu-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:13px 14px;margin-top:8px;width:100%;text-align:left;font-weight:600;cursor:pointer}
.menu-item small{display:block;font-weight:400;color:var(--ink2);font-size:11.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:var(--merah-t);color:#fff;
  padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.notifpop{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);
  background:#fff;color:var(--ink);border-radius:14px;padding:12px 14px;z-index:200;
  box-shadow:0 10px 30px rgba(0,0,0,.22);display:flex;gap:10px;align-items:flex-start;
  cursor:pointer;border:1px solid var(--line);animation:notifIn .25s ease-out}
.notifpop .ico{font-size:20px;line-height:1;flex:0 0 auto}
.notifpop .txt{flex:1;min-width:0}
.notifpop b{display:block;font-size:13px;font-weight:800}
.notifpop span{display:block;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.notifpop .x{flex:0 0 auto;color:var(--ink2);font-size:16px;padding:0 2px}
@keyframes notifIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);
  padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid #EEF2F5;font-variant-numeric:tabular-nums}
td.n,th.n{text-align:right;font-family:var(--num)}
.tot{font-weight:800}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,nav,.tools,.chips,.mask{display:none!important}body{background:#fff;padding:0}}

/* ---------- kunci orientasi potret ---------- */
#rotateGate{display:none;position:fixed;inset:0;z-index:9999;background:#0A1015;color:#fff;
  align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}
#rotateGate svg{width:56px;height:56px;stroke:#fff;fill:none;stroke-width:1.6;margin-bottom:14px;
  animation:rotHint 1.6s ease-in-out infinite}
#rotateGate p{font-size:14px;color:#C9D3DA;max-width:260px;line-height:1.5}
@keyframes rotHint{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-90deg)}}
@media(orientation:landscape) and (max-width:900px){
  #rotateGate{display:flex}
  header,#scrollArea,nav,#lock,.mask{display:none!important}
}
</style>
</head>
<body>
<header>
  <div class="wrap">

let nadaCtx = null;
function bunyiNotif(){
  try{
    const A = window.AudioContext || window.webkitAudioContext; if(!A) return;
    nadaCtx = nadaCtx || new A();
    if(nadaCtx.state === 'suspended') nadaCtx.resume();
    const o = nadaCtx.createOscillator(), g = nadaCtx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(880, nadaCtx.currentTime);
    o.frequency.setValueAtTime(1180, nadaCtx.currentTime + 0.11);
    g.gain.setValueAtTime(0.0001, nadaCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, nadaCtx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, nadaCtx.currentTime + 0.32);
    o.connect(g); g.connect(nadaCtx.destination);
    o.start(); o.stop(nadaCtx.currentTime + 0.34);
  }catch(e){}
}

/* ================= STATUS KIRIM (centang 1 / centang 2) =================
   Aplikasi ini bekerja offline-first: setiap catatan disimpan di HP DULU,

/* true kalau baris antrean x menyangkut (tabel, rekid) tertentu */

  if(!x || x.t !== tabel) return false;
  if(x.a === 'tambal') return String(x.i) === String(rekid);
  if(x.a === 'hapus')  return String(x.d) === String(rekid);
  const d = Array.isArray(x.d) ? x.d : [x.d];
  return d.some(r=>r && String(r.id) === String(rekid));
}

/* ================= TARIF & TAGIHAN PER-PERIODE (riwayat, bukan status skrg) =================
   Tiga fungsi ini sengaja berdiri sendiri dan TIDAK bergantung pada status
   pelanggan SAAT INI — semuanya dihitung dari histori (tarifRiwayat,
   berhentiSejak) supaya tagihan bulan-bulan lama tidak ikut berubah saat
   tarif dinaikkan atau pelanggan berhenti belakangan. */

/* Tarif yang berlaku pada periode `pr`: cari baris riwayat dengan mulai<=pr,
   ambil yang paling baru (mulai terbesar). Kalau pelanggan belum pernah
   ganti tarif (belum ada baris riwayat), pakai tarif master p.harga —
   supaya pelanggan lama yang belum tersentuh riwayat tetap benar. */
/* Kapan baris riwayat tarif dibuat. Baris baru menyimpan `waktu`; baris lama
   (waktu kosong) dibaca dari id-nya — uid() = awalan + waktu(base36, 8 huruf)
   + acak, jadi urutan pembuatannya tetap bisa dipulihkan. */
function waktuTarif(r){
  if(r.waktu){ const t = Date.parse(r.waktu); if(!isNaN(t)) return t; }
  const m = /^TRC?([0-9a-z]{8})/.exec(String(r.id||''));
  return m ? parseInt(m[1], 36) : 0;
}
/* true kalau baris a lebih baru daripada b — dipakai untuk memilih pemenang
   bila satu pelanggan punya dua baris di periode `mulai` yang sama. Dulu
   pemenangnya baris yang kebetulan pertama di daftar; urutan daftar dari
   server tidak dijamin, jadi tarif satu bulan bisa berbeda antar HP. */
function tarifLebihBaru(a, b){
  const ta = waktuTarif(a), tb = waktuTarif(b);
  if(ta !== tb) return ta > tb;
  return String(a.id||'') > String(b.id||'');
}
function tarifPada(p, pr){
  let terbaik = null;
  for(const r of DB.tarifRiwayat){
    if(r.pelId !== p.id || r.mulai > pr) continue;
    if(!terbaik || r.mulai > terbaik.mulai
       || (r.mulai === terbaik.mulai && tarifLebihBaru(r, terbaik))) terbaik = r;
  }
  return terbaik ? terbaik.harga : p.harga;
}
/* Satu baris riwayat per (pelanggan, periode mulai): kalau tarif diubah lagi
   untuk periode yang sama, baris itu DIPERBARUI — tidak menumpuk baris baru. */
function catatTarif(pelId, mulai, harga){
  const waktu = new Date().toISOString();
  /* Sisakan satu baris per (pelanggan, bulan). Data lama bisa memuat baris
     kembar — kalau yang dipegang di sini bukan baris yang sedang dipakai
     tarifPada(), tarif bulan itu bisa berubah sendiri setelah sinkron. */
  const sama = DB.tarifRiwayat.filter(r=>r.pelId===pelId && r.mulai===mulai);
  let ada = null;
  for(const r of sama) if(!ada || tarifLebihBaru(r, ada)) ada = r;
  if(sama.length > 1) DB.tarifRiwayat = DB.tarifRiwayat.filter(r=>r === ada || r.pelId!==pelId || r.mulai!==mulai);
  if(ada){ ada.harga = harga; ada.waktu = waktu; ada.oleh = me ? me.nama : ''; return ada; }
  const baru = {id:uid('TR'), pelId, mulai, harga, waktu, oleh: me ? me.nama : ''};
  DB.tarifRiwayat.push(baru);
  return baru;
}

/* Aktif-tidaknya pelanggan pada periode `pr`, lepas dari status SAAT INI.
   Pelanggan yang baru berhenti bulan ini tetap tertagih untuk bulan-bulan
   sebelum berhentiSejak; pelanggan yang diaktifkan lagi tetap tidak
   tertagih untuk bulan-bulan saat dia berhenti. */
function ditagihPada(p, pr){
  if(pr < p.mulai) return false;
  if(p.berhentiSejak && pr >= p.berhentiSejak) return false;
  return true;
}

/* Potret SATU periode, APA ADANYA (tagihan vs uang yang benar-benar tercatat
   masuk untuk bulan ini) — dipakai untuk kwitansi & laporan kas, bukan untuk
   status lunas/tunggakan (itu sekarang dihitung lintas-bulan, lihat alokasi()). */
function periodeSnapshot(p, pr){
  const tagih = ditagihPada(p, pr) ? tarifPada(p, pr) : 0;
  const b = bayarOf(p.id, pr);
  const masuk = b ? b.j : 0;
  return {
    periode: pr, ditagih: ditagihPada(p, pr), tarif: tagih,
    masuk, terbayar: masuk,
    kurang: Math.max(0, tagih - masuk),
    lebih: Math.max(0, masuk - tagih)
  };
}
/* Semua bulan pelanggan ini SALING TERHUBUNG otomatis: seluruh uang yang
   tercatat (periode berapa pun, sampai `sampai`) dikumpulkan jadi satu kolam,
   lalu dipakai melunasi tagihan dari bulan TERTUA ke termuda (waterfall).
   Kelebihan bayar satu bulan otomatis menutup tagihan bulan berikutnya;
   kekurangan satu bulan otomatis menambah tunggakan yang harus ditutup —
   semua auto-update begitu ada pembayaran baru, tanpa konfirmasi manual. */
let _alokCache = {}, _alokVer = 0;
function alokasiBatal(){ _alokCache = {}; _alokVer++; }
function alokasi(p, sampai){
  const k = p.id + '|' + sampai + '|' + _alokVer;
  if(_alokCache[k]) return _alokCache[k];
  const periodeTertagih = periodeList(sampai).filter(pr => ditagihPada(p, pr));
  let pool = 0;
  for(const pr of periodeTertagih){ const b = bayarOf(p.id, pr); if(b) pool += b.j; }
  const per_ = {}; let kurangSebelum = 0, totalKurang = 0;
  for(const pr of periodeTertagih){
    const tagih = tarifPada(p, pr);
    const pakai = Math.min(pool, tagih);
    pool -= pakai;
    const kurang = tagih - pakai;
    const b = bayarOf(p.id, pr);
    per_[pr] = {tagih, terbayar: pakai, kurang, masuk: b ? b.j : 0};
    if(pr < sampai) kurangSebelum += kurang;
    totalKurang += kurang;
  }
  const hasil = {per:per_, saldo:Math.max(0, pool), utang:totalKurang, utangSebelum:kurangSebelum};
  _alokCache[k] = hasil;
  return hasil;
}
const saldoOf = (p, sampai) => alokasi(p, sampai).saldo;

function statusOf(p, pr){
  if(!ditagihPada(p, pr)) return 'nihil';
  const a = alokasi(p, pr).per[pr];
  if(!a) return 'belum';
  if(a.terbayar >= a.tagih) return 'lunas';
  if(a.terbayar > 0) return 'sebagian';
  return telat(p, pr) ? 'telat' : 'belum';
}
function telat(p, pr){
  const c = curPer();
  if(pr < c) return true;
  if(pr > c) return false;
  return today().getDate() > p.tempo;
}
function periodeList(sampai){ const out=[]; let x=P0; let guard=0;
  while(x <= sampai && guard++ < 400){ out.push(x); x = pAdd(x,1); } return out; }
function tunggakan(p, sampai){ // sisa hutang setelah semua periode SEBELUM `sampai`
  return alokasi(p, sampai).utangSebelum;
}
function ringkas(pr){
  let tagih=0, masuk=0, kas=0, saldo=0, lunas=0, sebagian=0, belum=0, aktif=0, isolir=0, tung=0;
  for(const p of pel()){
    if(p.status==='isolir') isolir++;
    if(ditagihPada(p, pr)) aktif++;               // aktif sesuai kondisi periode itu, bukan status skrg
    if(!ditagihPada(p, pr)){
      /* Pelanggan yang tidak ditagih bulan ini (berhenti/belum mulai) tetap
         bisa punya uang masuk, saldo, dan hutang lama. Dulu semuanya ikut
         lenyap dari laporan begitu pelanggan dinonaktifkan. */
      const bx = bayarOf(p.id, pr);
      if(bx) kas += bx.j;
      saldo += saldoOf(p, pr);
      tung += tunggakan(p, pr);
      continue;
    }
    const s = periodeSnapshot(p, pr);
    tagih += s.tarif;
    masuk += Math.min(s.terbayar, s.tarif);
    kas += s.masuk;
    saldo += saldoOf(p, pr);
    const st = statusOf(p, pr);
    if(st==='lunas') lunas++; else if(st==='sebagian') sebagian++; else belum++;
    tung += tunggakan(p, pr);
  }
  const keluar = DB.biaya.filter(b=>b.periode===pr).reduce((a,b)=>a+b.jml,0);
  return {tagih, masuk, kas, saldo, sisa:tagih-masuk, lunas, sebagian, belum, aktif, isolir, tung, keluar,
    laba: kas-keluar, pct: tagih? Math.round(masuk/tagih*100):0};
}

/* Jarak dua waktu dalam kalimat pendek. Dipakai untuk memisah "menunggu"
   (lapor -> mulai ditangani) dari "dikerjakan" (mulai -> selesai); dulu
   hanya ada satu angka gabungan sehingga teknisi yang cepat datang tapi
   pekerjaannya berat terlihat sama dengan yang laporannya lama terbengkalai. */
function selisihWaktu(dari, sampai){
  if(!dari) return '-';
  const a = new Date(dari), b = sampai ? new Date(sampai) : new Date();
  if(isNaN(a) || isNaN(b)) return '-';
  const m = Math.max(0, Math.round((b - a) / 60000));
  if(m < 1) return 'kurang dari 1 menit';
  if(m < 60) return m + ' menit';
  if(m < 1440) return Math.floor(m/60) + ' jam' + (m%60 ? ' ' + (m%60) + ' mnt' : '');
  return Math.floor(m/1440) + ' hari' + (Math.floor(m%1440/60) ? ' ' + Math.floor(m%1440/60) + ' jam' : '');
}
function lamaTangani(t){
  if(!t.tgl) return '';
  const a = new Date(t.tgl), b = t.selesai ? new Date(t.selesai) : new Date();
  const m = Math.max(0, Math.round((b - a) / 60000));
  if(m < 60) return m + ' menit';
  if(m < 1440) return Math.floor(m/60) + ' jam' + (m%60 ? ' ' + (m%60) + ' mnt' : '');
  return Math.floor(m/1440) + ' hari' + (Math.floor(m%1440/60) ? ' ' + Math.floor(m%1440/60) + ' jam' : '');
}
function jamId(iso){ if(!iso) return '-';
  const d = new Date(iso);
  return tglId(iso) + ' ' + d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }

function samaHari(iso){ if(!iso) return false; const d=new Date(iso), n=today();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate(); }

/* ================= PRESENSI (absen masuk & pulang) =================
   Berbeda dari DB.absen yang mencatat KETIDAKHADIRAN untuk potong gaji.
   Yang ini mencatat jam datang dan jam pulang tiap orang per hari. */
function tglKunci(d){ d = d || today();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function jamSaja(iso){ if(!iso) return '-';
  return new Date(iso).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }

/* ================= SIKLUS GAJI =================
   Gaji periode X mencakup tanggal 7 bulan X sampai tanggal 6 bulan X+1,
   dan dibayar tanggal 7 bulan X+1. Contoh: gaji September = 7 Sep – 6 Okt,
   dibayar 7 Okt. Absen, telat, lembur, bonus poin, dan KASBON semuanya
   ikut siklus ini, supaya angka di slip sama persis dengan rentang yang
   dibayar.
   Periode sebelum SIKLUS_MULAI tetap bulan kalender (1 – akhir bulan)
   supaya slip yang sudah dibayar tidak berubah. Periode SIKLUS_MULAI
   sendiri adalah masa peralihan: mulai tanggal 1 (bukan 7), karena
   tanggal 1–6 belum masuk gaji bulan sebelumnya. */
const TGL_GAJIAN = 7;           // gaji dibayar tiap tanggal 7, untuk siklus yang baru selesai
const SIKLUS_MULAI = '2026-09'; // periode pertama yang memakai siklus tanggal 7 – 6
const pad2 = n => String(n).padStart(2,'0');
function tglSingkat(t, tahun){
  const [y,m,d] = String(t).slice(0,10).split('-').map(Number);
  return d + ' ' + BLN[m-1].slice(0,3) + (tahun ? ' ' + y : '');
}
function siklusGaji(periode){
  const [y,m] = periode.split('-').map(Number);
  let d1, d2;
  if(periode < SIKLUS_MULAI){
    d1 = periode + '-01';
    d2 = periode + '-' + pad2(new Date(y, m, 0).getDate());
  }else{
    d1 = periode + '-' + (periode === SIKLUS_MULAI ? '01' : pad2(TGL_GAJIAN));
    d2 = pAdd(periode, 1) + '-' + pad2(TGL_GAJIAN - 1);
  }
  const bayar = pAdd(periode, 1);
  const tglBayar = TGL_GAJIAN + ' ' + BLN[+bayar.split('-')[1]-1] + ' ' + bayar.split('-')[0];
  return {d1, d2, teks: tglSingkat(d1, d1.slice(0,4) !== d2.slice(0,4)) + ' – ' + tglSingkat(d2, true),
          tglBayar, peralihan: periode === SIKLUS_MULAI};
}
/* Tanggal tertentu (YYYY-MM-DD) masuk gaji periode yang mana. */
function periodeSiklus(tgl){
  const t = String(tgl || '').slice(0,10);
  const bln = t.slice(0,7);
  const kandidat = +t.slice(8,10) >= TGL_GAJIAN ? bln : pAdd(bln, -1);
  return kandidat < SIKLUS_MULAI ? bln : kandidat;
}
const jamMenit = m => pad2(Math.floor(m/60)) + ':' + pad2(Math.round(m%60));
/* Pasal 6 — hari kerja tanpa absen masuk sama sekali. Mulai berlaku
   6 Sep 2026 (keputusan pemilik, 7 Okt 2026); hari sebelumnya tidak dihitung,
   jadi tidak berlaku mundur. Potongannya FLAT per hari (bukan per jam),
   sama untuk jadwal 8 jam maupun 6 jam. */
const TANPA_ABSEN_MULAI = '2026-09-06';
const POTONGAN_TANPA_ABSEN_BAWAAN = 57600;
const tambahHari = (t, n) => { const d = new Date(String(t).slice(0,10) + 'T00:00:00'); d.setDate(d.getDate() + n); return tglKunci(d); };
/* Tanggal LOKAL (WIB) dari sebuah waktu. Catatan waktu disimpan sebagai ISO
   UTC ("...T23:10:00Z"); memotong 10 huruf pertamanya memberi tanggal UTC,
   yang untuk jam 00:00–06:59 WIB masih tanggal kemarin. Tanggal polos
   ("2026-10-03") dikembalikan apa adanya. */
function tglLokal(x){
  const t = String(x || '');
  if(t.length <= 10 || t.indexOf('T') < 0) return t.slice(0,10);
  const d = new Date(t);
  return isNaN(d) ? t.slice(0,10) : tglKunci(d);
}
/* Satu hari boleh beberapa sesi (mis. pagi dan siang). Yang dicari di sini
   adalah sesi yang masih terbuka — sudah absen masuk, belum absen pulang. */
/* Sesi yang masih terbuka. Dulu hanya dicari pada tanggal HARI INI, sehingga
   sesi yang dimulai sebelum tengah malam (jaga malam, lembur gangguan) TIDAK
   BISA ditutup keesokan harinya: tombol "Absen pulang" menganggap tidak ada
   sesi terbuka, dan absen masuknya menggantung selamanya tanpa jam pulang.
   Sekarang ditengok mundur 2 hari, diambil yang paling baru. */
const JAM_SESI_MAKS = 18 * 3600000;    // sesi lebih tua dari ini dianggap lupa absen pulang
function presensiTerbuka(uid){
  return (DB.presensi||[])
    .filter(a=>{
      if(a.user_id !== uid || a.pulang) return false;
      const t = Date.parse(a.masuk);
      /* Dibatasi 18 jam, bukan "tanggal hari ini": jaga malam yang masuk
         pukul 21.00 tetap bisa absen pulang pukul 05.00 keesokan harinya,
         tetapi sesi yang benar-benar terlupakan berhari-hari TIDAK ikut
         terbuka — kalau ikut, jam pulang hari ini akan menempel ke sesi
         lama dan perhitungan jamnya jadi ngawur. */
      return !isNaN(t) && (Date.now() - t) <= JAM_SESI_MAKS;
    })
    .sort((x,y)=>String(y.masuk||'').localeCompare(String(x.masuk||'')))[0];
}
function presensiHariIni(uid){ return (DB.presensi||[]).filter(a=>a.user_id===uid
  && a.tanggal===tglKunci()).sort((a,b)=>String(a.masuk).localeCompare(String(b.masuk))); }
function presensiOrang(uid){ return (DB.presensi||[]).filter(a=>a.user_id===uid)
  .sort((a,b)=>b.tanggal.localeCompare(a.tanggal)); }

/* ---------- foto selfie: disimpan di memori HP, bukan di DB utama ----------
   DB utama ikut masuk localStorage yang kapasitasnya kecil (±5MB). Foto
   ditaruh di IndexedDB terpisah supaya tidak membuat data tagihan penuh
   lalu gagal tersimpan. */
const FOTO_DB = 'roomnet_foto', FOTO_TOKO = 'foto';
let fotoDbP = null;
function fotoDb(){
  if(fotoDbP) return fotoDbP;
  fotoDbP = new Promise((ya, tidak)=>{
    if(!window.indexedDB) return tidak(new Error('IndexedDB tidak ada'));
    const r = indexedDB.open(FOTO_DB, 1);
    r.onupgradeneeded = ()=>{ const db = r.result;
      if(!db.objectStoreNames.contains(FOTO_TOKO)) db.createObjectStore(FOTO_TOKO); };
    r.onsuccess = ()=>ya(r.result);
    r.onerror = ()=>tidak(r.error);
  });
  return fotoDbP;
}
async function fotoSimpan(kunci, data){
  try{ const db = await fotoDb();
    await new Promise((ya,tidak)=>{ const t = db.transaction(FOTO_TOKO,'readwrite');
      t.objectStore(FOTO_TOKO).put(data, kunci); t.oncomplete = ya; t.onerror = ()=>tidak(t.error); });
    return true;
  }catch(e){ console.error('foto gagal disimpan di HP', e); return false; }
}
async function fotoAmbil(kunci){
  try{ const db = await fotoDb();
    return await new Promise((ya,tidak)=>{ const t = db.transaction(FOTO_TOKO,'readonly');
      const q = t.objectStore(FOTO_TOKO).get(kunci); q.onsuccess = ()=>ya(q.result || null); q.onerror = ()=>tidak(q.error); });
  }catch(e){ return null; }
}

/* Memotret lewat kamera depan, lalu dikecilkan supaya ringan dikirim:
   lebar ${FOTO_LEBAR}px, mutu ${FOTO_MUTU} — sekitar 20–30KB per foto. */
const FOTO_LEBAR = 320, FOTO_MUTU = 0.5;
function kecilkanFoto(sumber, lebarAsli, tinggiAsli){
  const skala = Math.min(1, FOTO_LEBAR / lebarAsli);
  const c = document.createElement('canvas');
  c.width = Math.round(lebarAsli * skala);
  c.height = Math.round(tinggiAsli * skala);
  c.getContext('2d').drawImage(sumber, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', FOTO_MUTU);
}
/* titik lokasi; tidak menggagalkan absen bila ditolak atau tidak terbaca */
function ambilLokasi(){
  return new Promise(ya=>{
    if(!navigator.geolocation) return ya(null);
    let sudah = false;
    const selesai = v => { if(!sudah){ sudah = true; ya(v); } };
    setTimeout(()=>selesai(null), 8000);
    navigator.geolocation.getCurrentPosition(
      p => selesai({lat:p.coords.latitude, lon:p.coords.longitude, akurasi:Math.round(p.coords.accuracy||0)}),
      () => selesai(null),
      {enableHighAccuracy:true, timeout:7000, maximumAge:0});
  });
}
function jarakMeter(a1, o1, a2, o2){
  const R = 6371000, r = x => x*Math.PI/180;
  const dA = r(a2-a1), dO = r(o2-o1);
  const h = Math.sin(dA/2)**2 + Math.cos(r(a1))*Math.cos(r(a2))*Math.sin(dO/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(h)));
}
/* lama bekerja: selisih dua waktu dalam bentuk "7 jam 20 mnt" */
function selisihTeks(a, b){
  const m = Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000));
  if(m < 60) return m + ' menit';
  return Math.floor(m/60) + ' jam' + (m%60 ? ' ' + (m%60) + ' mnt' : '');
}
function setoranHariIni(){
  return Object.keys(DB.bayar).map(k=>{
    const v = DB.bayar[k], [id, pr] = k.split('|'), p = byId(id);
    return p ? {p, pr, j:v.j, t:v.t, c:v.c, u:v.u||'-'} : null;
  }).filter(x=>x && samaHari(x.t)).sort((a,b)=>b.t.localeCompare(a.t));
}

/* ================= RENTANG SETORAN (layar "Hari ini") =================
   Layar ini dulu terkunci pada hari berjalan saja, sehingga setoran kemarin
   atau rekap sebulan tidak bisa dilihat tanpa membongkar laporan. Sekarang
   rentangnya bisa dipilih: hari ini, kemarin, minggu ini, atau tanggal /
   bulan / tahun tertentu. Semua bagian di layar itu — total, rincian,
   jatuh tempo, kirim rekap, dan CSV — mengikuti pilihan yang sama. */
let fSetor = {mode:'hari', tgl:'', bln:'', thn:''};
const tglPanjang = d => d.getDate() + ' ' + BLN[d.getMonth()] + ' ' + d.getFullYear();
const tglPendek  = d => d.getDate() + ' ' + BLN[d.getMonth()].slice(0,3);
const awalHari   = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const akhirHari  = d => { const x = new Date(d); x.setHours(23,59,59,999); return x; };
/* Tahun yang boleh dipilih: dari tahun pembayaran paling tua sampai tahun ini. */
function tahunTersedia(){
  const thn = new Set([today().getFullYear()]);
  Object.keys(DB.bayar).forEach(k=>{ const t = DB.bayar[k] && DB.bayar[k].t;
    if(t){ const d = new Date(t); if(!isNaN(d)) thn.add(d.getFullYear()); } });
  return [...thn].sort((a,b)=>b-a);
}
function rentangSetoran(){
  const n = today(), f = fSetor;
  if(f.mode === 'kemarin'){
    const k = new Date(n); k.setDate(k.getDate() - 1);
    return {dari:awalHari(k), sampai:akhirHari(k), label:'Kemarin, ' + tglPanjang(k), hari:1};
  }
  if(f.mode === 'minggu'){
    const s = new Date(n); s.setDate(s.getDate() - ((s.getDay() + 6) % 7));   // Senin awal minggu
    const a = new Date(s); a.setDate(a.getDate() + 6);
    return {dari:awalHari(s), sampai:akhirHari(a),
      label:'Minggu ini, ' + tglPendek(s) + ' – ' + tglPendek(a) + ' ' + a.getFullYear(), hari:7};
  }
  if(f.mode === 'tanggal' && f.tgl){
    const d = new Date(f.tgl + 'T00:00:00');
    if(!isNaN(d)) return {dari:awalHari(d), sampai:akhirHari(d), label:tglPanjang(d), hari:1};
  }
  if(f.mode === 'bulan' && f.bln){
    const y = +f.bln.slice(0,4), m = +f.bln.slice(5,7);
    if(y && m){
      const d1 = new Date(y, m-1, 1), d2 = new Date(y, m, 0);
      return {dari:awalHari(d1), sampai:akhirHari(d2), label:BLN[m-1] + ' ' + y, hari:d2.getDate()};
    }
  }
  if(f.mode === 'tahun' && f.thn){
    const y = +f.thn;
    if(y) return {dari:awalHari(new Date(y,0,1)), sampai:akhirHari(new Date(y,11,31)),
      label:'Tahun ' + y, hari:366};
  }
  return {dari:awalHari(n), sampai:akhirHari(n), label:'Hari ini, ' + tglPanjang(n), hari:1};
}
function setoranRentang(rt){
  const a = rt.dari.getTime(), b = rt.sampai.getTime();
  return Object.keys(DB.bayar).map(k=>{
    const v = DB.bayar[k], bg = k.split('|'), p = byId(bg[0]);
    return p ? {p, pr:bg[1], j:v.j, t:v.t, c:v.c, u:v.u||'-'} : null;
  }).filter(x=>{
    if(!x || !x.t) return false;
    const t = Date.parse(x.t);
    return !isNaN(t) && t >= a && t <= b;
  }).sort((x,y)=>String(y.t).localeCompare(String(x.t)));
}
/* daftar setoran sesuai rentang + saringan hak akses, dipakai layar,
   kirim rekap, dan CSV supaya ketiganya tidak pernah berbeda isi */
function setoranTampil(rt){
  const l = setoranRentang(rt || rentangSetoran());
  return can('uang') ? l : l.filter(x=>x.u === me.nama);
}

/* ================= PANTAU HARI INI =================
   Melihat ritme kerja karyawan saat mereka menyisir di lapangan. Datanya
   sudah ada sejak dulu — tiap pembayaran mencatat penerima dan jamnya —
   yang belum ada hanya layar untuk melihatnya secara hidup.

   Yang paling berguna di sini bukan jumlah uangnya, tapi kolom "terakhir":
   bila seorang karyawan sudah lama tidak mencatat apa pun padahal masih jam
   kerja, itu terlihat seketika, tanpa menunggu sampai malam.

   Batasnya: aplikasi hanya tahu apa yang DICATAT. Uang yang diterima tanpa
   dicatat tidak akan muncul, dan HP tanpa sinyal baru menyusul belakangan. */

let pantauTgl = null;        // null = hari ini
let pantauTimer = null;

function pantauHari(){ return pantauTgl || today(); }
function samaTanggal(iso, d){
  if(!iso) return false;
  const x = new Date(iso);
  return x.getFullYear()===d.getFullYear() && x.getMonth()===d.getMonth() && x.getDate()===d.getDate();
}
function pantauHariIni(){ return samaTanggal(today().toISOString(), pantauHari()); }

/* Semua kejadian pada tanggal yang dilihat, terbaru di atas. */
function pantauKejadian(){
  const d = pantauHari(), out = [];

  for(const k of Object.keys(DB.bayar||{})){
    const v = DB.bayar[k], [id, pr] = k.split('|'), p = byId(id);
    if(!v || !samaTanggal(v.t, d)) continue;
    out.push({t:v.t, oleh:bakukanNama(v.u), jenis:'bayar', jml:v.j,
      judul:(p? p.nama : 'Pelanggan'), ket:(p? p.area : '') + ' · ' + pLbl(pr)});
  }
  for(const x of (DB.tiket||[])){
    if(x.selesai && samaTanggal(x.selesai, d))
      out.push({t:x.selesai, oleh:bakukanNama((x.penangan||'').split(',')[0]), jenis:'tutup',
        judul:(byId(x.pelId)||{nama:'Gangguan umum'}).nama, ket:x.masalah});
    if(x.tgl && samaTanggal(x.tgl, d))
      out.push({t:x.tgl, oleh:bakukanNama(x.pelapor), jenis:'lapor',
        judul:(byId(x.pelId)||{nama:'Gangguan umum'}).nama, ket:x.masalah});
  }
  return out.sort((a,b)=> String(b.t).localeCompare(String(a.t)));
}

/* Ringkasan per karyawan pada tanggal itu. */
function pantauOrang(){
  const kj = pantauKejadian(), per_ = {};
  const ambil = n => {
    const k = String(n||'').trim() || '(tidak dicatat)';
    if(!per_[k]) per_[k] = {nama:k, rumah:0, uang:0, gangguan:0, terakhir:'', area:''};
    return per_[k];
  };
  for(const x of kj){
    const o = ambil(x.oleh);
    if(x.jenis==='bayar'){ o.rumah++; o.uang += x.jml; if(!o.area) o.area = (x.ket||'').split(' · ')[0]; }
    else o.gangguan++;
    if(!o.terakhir || String(x.t) > o.terakhir) o.terakhir = x.t;
  }
  /* karyawan terdaftar tetap tampil walau belum ada kegiatan */
  for(const u of (DB.users||[])) if(u.aktif !== false && u.peran === 'karyawan') ambil(u.nama);

  return Object.keys(per_).map(k=>per_[k])
    .sort((a,b)=> (b.terakhir||'').localeCompare(a.terakhir||'') || b.uang - a.uang);
}

function selisihMenit(iso){
  if(!iso) return null;
  return Math.floor((Date.now() - new Date(iso)) / 60000);
}
function sejakTeks(iso){
  const m = selisihMenit(iso);
  if(m === null) return 'belum ada';
  if(m < 1) return 'baru saja';
  if(m < 60) return m + ' menit lalu';
  const j = Math.floor(m/60);
  if(j < 24) return j + ' jam lalu';
  return Math.floor(j/24) + ' hari lalu';
}
/* Untuk durasi yang MASIH BERJALAN (mis. "sudah online sekian lama") —
   beda dari sejakTeks yang untuk kejadian yang SUDAH LEWAT ("lalu"). */
function durasiTeks(iso){
  const m = selisihMenit(iso);
  if(m === null) return '';
  if(m < 1) return 'baru masuk';
  if(m < 60) return m + ' menit';
  const j = Math.floor(m/60), sisa = m % 60;
  if(j < 24) return sisa ? j+' jam '+sisa+' menit' : j+' jam';
  return Math.floor(j/24) + ' hari';
}

const AKSI_LBL = {tambah:'Tambah', edit:'Ubah', hapus:'Hapus', buka:'Buka kunci', masuk:'Masuk', koreksi:'Koreksi', ekspor:'Ekspor'};
let sesiId = '';
function mulaiSesi(){ sesiId = 'S' + Date.now().toString(36).slice(-5).toUpperCase(); return sesiId; }
function catat(aksi, tabel, rekid, judul, sebelum, sesudah){

const VERSI = '4.2';
/* ================= ATURAN PENGUBAHAN DATA =================
   UANG — jumlah diterima hanya boleh NAIK di tangan karyawan.
   Pelanggan bayar 50rb pagi lalu 70rb sore? Karyawan tinggal mengubah
   50.000 jadi 120.000. Bayar kurang, pas, atau lebih semua boleh —
   sisanya otomatis jadi hutang atau saldo ke bulan berikutnya.
   Yang TIDAK bisa karyawan lakukan: menurunkan angka atau membatalkan
   transaksi. Uang yang sudah masuk catatan tidak bisa menyusut atau hilang
   di tangan siapa pun kecuali Pemilik — termasuk uang yang dicatat
   karyawan lain maupun catatannya sendiri.

   DATA PELANGGAN — boleh diubah karyawan (nama, WA, wilayah, tempo, catatan).
   Tarif dan Status tetap khusus Pemilik.

   Semua perubahan tercatat di Riwayat lengkap dengan nama pengubahnya.
   Kalau suatu saat mau diubah, cukup ganti true/false di bawah ini. */
const KARYAWAN_BOLEH_NAIKKAN_BAYAR  = true;  // menambah jumlah / mencatat cicilan susulan
const KARYAWAN_BOLEH_TURUNKAN_BAYAR = true;  // mengubah jumlah naik ATAU turun (koreksi salah ketik)
const KARYAWAN_BOLEH_UBAH_PELANGGAN = true;  // ubah data pelanggan: nama, WA, wilayah, tempo, catatan
const KARYAWAN_BOLEH_TUTUP_TIKET    = true;  // karyawan boleh menandai gangguan "selesai"
const KARYAWAN_BOLEH_UBAH           = false; // cadangan: buka semua pengubahan, dibatasi BATAS_EDIT kali
/* Nilai ini dipakai di dua tempat (kotak Ubah pelanggan dan saat menyimpan)
   tetapi belum pernah dibuat, sehingga tombol Simpan berhenti diam-diam.
   Artinya: karyawan boleh mengisi nomor WhatsApp yang MASIH KOSONG, walau
   kolom lain terkunci baginya. Nomor yang sudah terisi tidak bisa diubah.
   Ganti ke false bila pengisian nomor pun hanya boleh Pemilik. */
const KARYAWAN_BOLEH_ISI_HP         = true;
const PESAN_TURUN = 'Jumlah hanya bisa ditambah, tidak bisa dikurangi. Untuk membetulkan, minta Pemilik.';
const PESAN_KUNCI = 'Terkunci. Data yang sudah tercatat hanya bisa diubah oleh Pemilik.';

/* Riwayat: Pemilik punya akses penuh — boleh mengubah maupun menghapus.
   Karyawan tetap tidak bisa menyentuhnya sama sekali (lihat IZIN: 'ubahlog').
   Setel true hanya bila izin ubah & hapus tabel log di Supabase ditutup. */
const RIWAYAT_PERMANEN = false;

/* berapa kali karyawan sudah mengubah satu data (sejak dibuka pemilik)
   — hanya terpakai bila KARYAWAN_BOLEH_UBAH = true */
const BATAS_EDIT = 3;
function jumlahEdit(tabel, rekid, userId){
  const list = DB.log.filter(x=>x.tabel===tabel && x.rekid===String(rekid))
    .sort((a,b)=>b.waktu.localeCompare(a.waktu));
  let n = 0;
  for(const x of list){
    if(x.aksi === 'buka') break;                 // pemilik sudah membuka kunci
    if((x.aksi === 'edit' || x.aksi === 'hapus') && x.oleh_id === userId) n++;
  }
  return n;
}
/* hitungan dari server: lebih tepat karena mencakup perubahan dari HP lain */
async function cekBatas(tabel, rekid){
  if(!me) return {ok:false, sisa:0, pesan:'Belum masuk'};
  if(me.peran === 'owner') return {ok:true, sisa:99};
  if(tabel === 'tiket' && KARYAWAN_BOLEH_TUTUP_TIKET) return {ok:true, sisa:99};
  if(tabel === 'pelanggan' && KARYAWAN_BOLEH_UBAH_PELANGGAN) return {ok:true, sisa:99};
  if(!KARYAWAN_BOLEH_UBAH) return {ok:false, sisa:0, kunci:true, pesan:PESAN_KUNCI};
  if(sbOn()){
    try{
      const baris = await sbReq('log?select=aksi,oleh_id,waktu&tabel=eq.' + encodeURIComponent(tabel)
        + '&rekid=eq.' + encodeURIComponent(rekid) + '&order=waktu.desc&limit=30');
      let n = 0;
      for(const x of baris){
        if(x.aksi === 'buka') break;
        if((x.aksi === 'edit' || x.aksi === 'hapus') && x.oleh_id === me.id) n++;
      }
      const lokal = jumlahEdit(tabel, rekid, me.id);
      n = Math.max(n, lokal);                       // ikut hitung yang belum terkirim
      if(n >= BATAS_EDIT) return {ok:false, sisa:0,
        pesan:'Batas ' + BATAS_EDIT + ' kali pengubahan sudah tercapai. Minta Pemilik membuka kuncinya.'};
      return {ok:true, sisa: BATAS_EDIT - n};
    }catch(e){ /* tanpa sinyal -> pakai hitungan di HP */ }
  }
  return bolehEdit(tabel, rekid);
}
function bolehEdit(tabel, rekid){
  if(!me) return {ok:false, sisa:0, pesan:'Belum masuk'};
  if(me.peran === 'owner') return {ok:true, sisa:99};
  if(tabel === 'tiket' && KARYAWAN_BOLEH_TUTUP_TIKET) return {ok:true, sisa:99};
  if(tabel === 'pelanggan' && KARYAWAN_BOLEH_UBAH_PELANGGAN) return {ok:true, sisa:99};
  if(!KARYAWAN_BOLEH_UBAH) return {ok:false, sisa:0, kunci:true, pesan:PESAN_KUNCI};
  const n = jumlahEdit(tabel, rekid, me.id);
  if(n >= BATAS_EDIT) return {ok:false, sisa:0,
    pesan:'Batas ' + BATAS_EDIT + ' kali pengubahan sudah tercapai. Minta Pemilik membuka kuncinya.'};
  return {ok:true, sisa: BATAS_EDIT - n};
}

/* Aturan uang: karyawan boleh menaikkan angka, tidak boleh menurunkan.
   jmlBaru dibandingkan dengan yang sudah tercatat. */
/* Bulan depan terkunci untuk karyawan. Tunggakan dan bulan berjalan tetap
   bebas dicatat; kunci terbuka sendiri tanggal 1. Pemilik tidak terkunci.

   Pengaman: bila tanggal di HP berada di luar rentang periode aplikasi
   (mis. jam HP salah, atau rentang belum diperbarui untuk tahun berikutnya),
   kunci dimatikan. Lebih baik kunci tidak aktif daripada karyawan tidak bisa
   bekerja sama sekali. */
function bulanTerkunci(pr){
  if(!me || me.peran === 'owner') return null;
  const c = curPer();
  if(c < P0 || c > PZ) return null;          // di luar rentang: jangan mengunci
  if(pr <= c) return null;
  return {ok:false, pesan: pLbl(pr) + ' belum dibuka. Tim hanya bisa mencatat '
    + 'sampai ' + pLbl(c) + '. Hubungi pemilik bila pelanggan bayar di muka.'};
}

/* Bulan tertua yang belum lunas — masih dipakai untuk label info di UI
   (mis. daftar tunggakan), tapi TIDAK LAGI dipakai untuk memblokir
   pencatatan pembayaran: sejak alokasi() otomatis mengalirkan uang lintas
   bulan (waterfall), uang yang dicatat di bulan mana pun akan otomatis
   menutup tagihan dari yang tertua dulu — jadi urutan pencatatan bebas. */
function bulanTertuaBelumLunas(p, sampai){
  for(const q of periodeList(sampai)){
    if(!ditagihPada(p, q)) continue;
    if(statusOf(p, q) !== 'lunas') return q;
  }
  return null;
}

function bolehBayar(id, pr, jmlBaru){
  if(!me) return {ok:false, pesan:'Belum masuk'};
  const kunci = bulanTerkunci(pr);
  if(kunci) return kunci;
  if(me.peran === 'owner') return {ok:true};
  if(KARYAWAN_BOLEH_UBAH) return bolehEdit('pembayaran', id + '_' + pr);
  const b = bayarOf(id, pr), lama = b ? b.j : 0;
  const baru = Math.round(jmlBaru || 0);
  if(baru > lama) return KARYAWAN_BOLEH_NAIKKAN_BAYAR
    ? {ok:true, naik: baru - lama}
    : {ok:false, pesan: PESAN_KUNCI};
  if(baru === lama) return {ok:true, tetap:true};
  /* mengoreksi angka boleh; menghapus setoran sama sekali tetap Pemilik */
  if(baru === 0 && lama > 0) return {ok:false, turun:true,
    pesan:'Membatalkan transaksi hanya bisa Pemilik. Untuk memperbaiki angka, ubah jumlahnya.'};
  return KARYAWAN_BOLEH_TURUNKAN_BAYAR ? {ok:true} : {ok:false, turun:true, pesan: PESAN_TURUN};
}

/* ================= AKSI ================= */
function setBayar(id, pr, jml, cara){
  alokasiBatal();
  const k = kBayar(id, pr);
  if(!jml || jml<=0) delete DB.bayar[k];
  else DB.bayar[k] = {j:Math.round(jml), t:new Date().toISOString(), c:cara||'Tunai', u:(me?me.nama:'-')};
  save();
}
/* satu pintu untuk semua perubahan pembayaran: cek batas, simpan, catat, kirim */
async function bayarUbah(id, pr, jml, cara){
  const p = byId(id); if(!p) return false;
  const rek = id + '_' + pr;
  const lama = bayarOf(id, pr);
  if(!lama && !(jml > 0)) return true;                 // tidak ada yang berubah
  const iz = await Promise.resolve(bolehBayar(id, pr, jml));
  if(!iz.ok){ toast(iz.pesan); return false; }
  const aksi = !lama ? 'tambah' : (jml > 0 ? 'edit' : 'hapus');
  setBayar(id, pr, jml, cara);
  catat(aksi, 'pembayaran', rek, p.nama + ' · ' + pLbl(pr)
      + (iz.naik && lama ? ' · tambah bayar ' + rp(iz.naik) : ''),
    lama ? rp(lama.j) + ' (' + lama.c + ')' : '',
    jml > 0 ? rp(jml) + ' (' + (cara||'Tunai') + ')' : '');
  dorongBayar(id, pr);
  return true;
}

async function toggleLunas(id){
  const p = byId(id); const s = statusOf(p, per);
  if(s==='lunas') await bayarUbah(id, per, 0);
  else await bayarUbah(id, per, tarifPada(p, per), 'Tunai');
  render();
}

/* ================= RINCIAN SLIP GAJI =================
   Dipakai bersama oleh slip A4 (cetak) dan slip di layar, supaya isinya
   selalu sama. Semua angka diambil dari hitungGaji() — tidak dihitung
   ulang di sini — jadi total di rincian = total di ringkasan slip. */
function hariTgl(t){
  const d = new Date(String(t).slice(0,10) + 'T00:00:00');
  return d.toLocaleDateString('id-ID', {weekday:'short'}) + ', ' + tglSingkat(t);
}
const JENIS_ABSEN = {alpa:'Alpa (tanpa keterangan)', izin:'Izin', sakit:'Sakit', cuti:'Cuti'};
/* rupiah dengan 2 angka desimal bila tidak bulat (tarif per jam) */
const rpJam = n => { const v = Math.round((+n||0) * 100) / 100;
  return Number.isInteger(v) ? rp(v) : 'Rp' + v.toLocaleString('id-ID', {minimumFractionDigits:2, maximumFractionDigits:2}); };
function rincianSlipHtml(g){
  const rp0 = n => rp(Math.round(n || 0));
  const bag = [];
  const tabel = (kepala, baris, kaki) => `<table class="rk"><thead><tr>${kepala.map((h,i)=>
      `<th${i === kepala.length-1 ? ' class="n"' : ''}>${h}</th>`).join('')}</tr></thead>
    <tbody>${baris.join('')}${kaki || ''}</tbody></table>`;

  /* 1. Kehadiran ringkas */
  const jml = j => g.rincianAbsen.filter(a=>a.jenis === j).length;
  bag.push(`<div class="sek"><h3>Kehadiran ${esc(g.siklusTeks)}</h3>
    ${tabel(['Keterangan','Jumlah'], [
      `<tr><td>Hari ada absen masuk</td><td class="n">${g.hariHadir} hari</td></tr>`,
      `<tr><td>Jam kerja normal tercatat</td><td class="n">${String(g.jamKerja).replace('.',',')} jam</td></tr>`,
      `<tr><td>Alpa / izin / sakit / cuti</td><td class="n">${jml('alpa')} / ${jml('izin')} / ${jml('sakit')} / ${jml('cuti')} hari</td></tr>`,
      `<tr><td>Telat masuk / pulang cepat</td><td class="n">${g.kaliTelat}x · ${jamTeks(g.menitTelat)}</td></tr>`,
      g.belumTutup ? `<tr><td>Lupa absen pulang</td><td class="n">${g.belumTutup}x</td></tr>` : '',
      g.menitLemburMenunggu ? `<tr><td>Lembur menunggu persetujuan (belum dibayar)</td><td class="n">${jamTeks(g.menitLemburMenunggu)}</td></tr>` : '',
      g.menitLemburDitolak ? `<tr><td>Lembur ditolak (tidak dibayar)</td><td class="n">${jamTeks(g.menitLemburDitolak)}</td></tr>` : ''
    ])}</div>`);

  /* 2. Tidak masuk */
  if(g.rincianAbsen.length){
    bag.push(`<div class="sek"><h3>Tidak masuk</h3>
      ${tabel(['Tanggal','Keterangan','Potongan'], g.rincianAbsen.map(a=>`<tr>
        <td>${esc(hariTgl(a.tanggal))}</td>
        <td>${esc(JENIS_ABSEN[a.jenis] || a.jenis)}${a.catatan ? ' · ' + esc(a.catatan) : ''}</td>
        <td class="n">${a.jenis === 'alpa' ? '−' + rp0(g.perHari) : 'tidak dipotong'}</td></tr>`),
        g.potonganAlpa ? `<tr class="t"><td colspan="2">Total potongan alpa (${g.alpa} × ${rp0(g.perHari)})</td>
          <td class="n">−${rp0(g.potonganAlpa)}</td></tr>` : '')}
      <div class="ket">Gaji per hari = gaji pokok ÷ ${HARI_KERJA} hari kerja = ${rp0(g.perHari)}. Izin, sakit, dan cuti tidak memotong gaji.</div></div>`);
  }

  /* 3. Telat & pulang cepat, per tanggal */
  if(g.rincianTelat.length){
    const totMenit = g.rincianTelat.reduce((a,x)=>a + x.potongMenit, 0);
    bag.push(`<div class="sek"><h3>Telat masuk &amp; pulang cepat</h3>
      ${tabel(['Tanggal','Jadwal → absen','Lama / dipotong','Potongan'], g.rincianTelat.map(t=>`<tr>
        <td>${esc(hariTgl(t.tanggal))}<br><span class="ket">${t.jenis === 'pulang' ? 'Pulang cepat' : 'Telat masuk'}</span></td>
        <td>${t.jadwal != null ? jamMenit(t.jadwal) + ' → ' + jamMenit(t.jam) : '-'}</td>
        <td>${t.menit} mnt / <b>${t.potongMenit} mnt</b></td>
        <td class="n">${t.rp ? '−' + rp0(t.rp) : '—'}</td></tr>`),
        `<tr class="t"><td colspan="2">Total ${g.kaliTelat}x · ${jamTeks(g.menitTelat)}</td>
          <td>${jamTeks(totMenit)}</td><td class="n">${g.potonganTelat ? '−' + rp0(g.potonganTelat) : '—'}</td></tr>`)}
      <div class="ket">Dicatat telat kalau lewat ${TOLERANSI_MENIT} menit atau lebih. ${TOLERANSI_MENIT} menit pertama tidak dipotong;
        yang dipotong hanya kelebihannya${g.potongAktif ? ', ' + rpJam(g.rateJam) + '/jam (dihitung per menit)' : ' — potongan telat sedang dimatikan di Setelan'}.
        ${g.pakaiGaji ? 'Tarif/jam = gaji pokok ' + rp0(g.pokok) + ' ÷ ' + HARI_KERJA + ' hari ÷ ' + String(g.jamWajib).replace('.',',') + ' jam wajib = ' + rpJam(g.rateJam) + '.' : 'Gaji pokok belum diisi — memakai tarif cadangan di Setelan.'}</div></div>`);
  }

  /* 4. Tanpa absen masuk */
  if(g.rincianTanpaMasuk.length){
    bag.push(`<div class="sek"><h3>Tanpa absen masuk</h3>
      ${tabel(['Tanggal','Jam wajib','Potongan'], g.rincianTanpaMasuk.map(x=>`<tr>
        <td>${esc(hariTgl(x.tanggal))}</td><td>${String(x.jamWajib).replace('.',',')} jam</td>
        <td class="n">${x.rp ? '−' + rp0(x.rp) : '—'}</td></tr>`),
        `<tr class="t"><td colspan="2">Total ${g.hariTanpaAbsenMasuk} hari</td><td class="n">${g.potonganTanpaMasuk ? '−' + rp0(g.potonganTanpaMasuk) : '—'}</td></tr>`)}
      <div class="ket">Hari kerja tanpa absen masuk sama sekali dipotong ${g.pakaiGaji
          ? 'tarif/jam ' + rpJam(g.rateJam) + ' × jam wajib hari itu (hari biasa = gaji pokok ÷ ' + HARI_KERJA + ' = ' + rp0(g.rpTanpaAbsen) + ')'
          : rp0(g.rpTanpaAbsen) + ' per hari (tarif cadangan di Setelan, karena gaji pokok belum diisi)'}.
        Tidak dihitung: hari libur karyawan, Hari libur usaha, dan hari yang dicatat alpa/izin/sakit/cuti.
        ${g.potongAktif ? '' : 'Potongan sedang dimatikan di Setelan — hanya dicatat.'}</div></div>`);
  }

  /* 5. Lembur per tanggal */
  if(g.rincianLembur.length){
    bag.push(`<div class="sek"><h3>Lembur</h3>
      ${tabel(['Tanggal','Biasa','Siaga','Pra-shift'], g.rincianLembur.map(x=>`<tr>
        <td>${esc(hariTgl(x.tanggal))}${x.awal ? '<br><span class="ket">termasuk datang awal ' + x.awal + ' mnt</span>' : ''}</td>
        <td>${x.biasa ? jamTeks(x.biasa) : '—'}</td>
        <td>${x.siaga ? jamTeks(x.siaga) : '—'}</td>
        <td class="n">${x.praShift ? jamTeks(x.praShift) : '—'}</td></tr>`),
        `<tr class="t"><td colspan="3">Total ${String(g.jamLembur).replace('.',',')} jam</td><td class="n">+${rp0(g.upahLembur)}</td></tr>`)}
      <div class="ket">Biasa ${String(g.jamLemburBiasa).replace('.',',')} jam × ${rp0(g.tarifLembur)} = ${rp0(g.upahLemburBiasa)}
        ${g.upahLemburSiaga ? ` · Siaga ${String(g.jamLemburSiaga).replace('.',',')} jam = ${rp0(g.upahLemburSiaga)}` : ''}
        ${g.upahLemburPraShift ? ` · Pra-shift ${String(g.jamLemburPraShift).replace('.',',')} jam × ${rp0(LEMBUR_PRA_SHIFT_RP_PER_JAM)} = ${rp0(g.upahLemburPraShift)}` : ''}</div></div>`);
  }

  /* 6. Bonus poin */
  const pb = g.poinRinci;
  if(pb && (pb.poin || pb.kerja || pb.tagih || pb.awal)){
    bag.push(`<div class="sek"><h3>Poin &amp; bonus</h3>
      ${tabel(['Sumber poin','Jumlah'], [
        `<tr><td>Gangguan / PSB dikerjakan sendiri (1 poin)</td><td class="n">${pb.sendiri||0}x</td></tr>`,
        `<tr><td>Gangguan / PSB berdua (0,5 poin)</td><td class="n">${pb.berdua||0}x</td></tr>`,
        `<tr><td>Gangguan selesai cepat (15 mnt – 3 jam, +0,5 / +0,25)</td><td class="n">${pb.cepat||0}x</td></tr>`,
        `<tr><td>Catatan tagihan disisir (${BAYAR_PER_POIN} catatan = 1 poin)</td><td class="n">${pb.tagih||0} catatan</td></tr>`,
        `<tr><td>Datang lebih awal (+0,10 / +0,15)</td><td class="n">${pb.awal||0} hari</td></tr>`
      ], `<tr class="t"><td>Total ${poinTeks(pb.poin)} poin</td><td class="n">${g.bonus ? '+' + rp0(g.bonus) : '—'}</td></tr>`)}
      <div class="ket">Bonus = (poin − ${BONUS_AMBANG}) × ${rp0(BONUS_PER_POIN)}${g.bonus ? ' = (' + poinTeks(pb.poin) + ' − ' + BONUS_AMBANG + ') × ' + rp0(BONUS_PER_POIN) : '; belum melewati ' + BONUS_AMBANG + ' poin'}.</div></div>`);
  }

  /* 7. Kasbon ikut siklus */
  if(g.kasbonAwal || g.kasbonBaru.length || g.kasbon || g.kasbonAkhir){
    bag.push(`<div class="sek"><h3>Kasbon</h3>
      ${tabel(['Keterangan','Jumlah'], [
        `<tr><td>Sisa kasbon sebelum siklus ini</td><td class="n">${rp0(g.kasbonAwal)}</td></tr>`,
        ...g.kasbonBaru.map(k=>`<tr><td>+ Kasbon ${esc(hariTgl(k.tgl))}${k.catatan ? ' · ' + esc(k.catatan) : ''}</td>
          <td class="n">+${rp0(k.jml)}</td></tr>`),
        `<tr><td><b>Total kasbon berjalan</b></td><td class="n"><b>${rp0(g.kasbonAwal + g.kasbonBaruJml)}</b></td></tr>`,
        `<tr><td>Dipotong dari gaji ini</td><td class="n">${g.kasbon ? '−' + rp0(g.kasbon) : '—'}</td></tr>`
      ], `<tr class="t"><td>Sisa kasbon setelah gajian</td><td class="n">${rp0(g.kasbonAkhir)}</td></tr>`)}
      <div class="ket">Kasbon ikut siklus gaji: kasbon tanggal ${tglSingkat(g.d1)} s.d. ${tglSingkat(g.d2, true)} masuk gaji ini.
        ${g.kasbonAkhir ? 'Sisanya dipotong pada gajian berikutnya.' : 'Kasbon lunas.'}</div></div>`);
  }
  return `<div class="slipRinci">${bag.join('')}</div>`;
}

function rincianSlipTeks(g){
  const out = [];
  if(g.rincianAbsen.length){
    out.push('', '*Tidak masuk*');
    g.rincianAbsen.forEach(a=>out.push('- ' + hariTgl(a.tanggal) + ' ' + (JENIS_ABSEN[a.jenis]||a.jenis)
      + (a.jenis === 'alpa' ? ' : -' + rp(g.perHari) : ' (tidak dipotong)')));
  }
  if(g.rincianTelat.length){
    out.push('', '*Telat / pulang cepat* (toleransi ' + TOLERANSI_MENIT + ' mnt)');
    g.rincianTelat.forEach(t=>out.push('- ' + hariTgl(t.tanggal) + ' '
      + (t.jenis === 'pulang' ? 'pulang ' : 'masuk ') + (t.jadwal != null ? jamMenit(t.jam) + ' (jadwal ' + jamMenit(t.jadwal) + ')' : '')
      + ' ' + t.menit + ' mnt, dipotong ' + t.potongMenit + ' mnt' + (t.rp ? ' : -' + rp(t.rp) : '')));
  }
  if(g.rincianTanpaMasuk.length){
    out.push('', '*Tanpa absen masuk*');
    g.rincianTanpaMasuk.forEach(x=>out.push('- ' + hariTgl(x.tanggal) + (x.rp ? ' : -' + rp(x.rp) : '')));
  }
  if(g.rincianLembur.length){
    out.push('', '*Lembur*');
    g.rincianLembur.forEach(x=>out.push('- ' + hariTgl(x.tanggal) + ' ' + jamTeks(x.biasa + x.siaga + x.praShift)
      + (x.siaga ? ' (siaga ' + jamTeks(x.siaga) + ')' : '') + (x.praShift ? ' (pra-shift ' + jamTeks(x.praShift) + ')' : '')));
  }
  if(g.kasbonAwal || g.kasbonBaru.length || g.kasbon || g.kasbonAkhir){
    out.push('', '*Kasbon*', 'Sisa sebelumnya : ' + rp(g.kasbonAwal));
    g.kasbonBaru.forEach(k=>out.push('+ ' + hariTgl(k.tgl) + ' : ' + rp(k.jml) + (k.catatan ? ' (' + k.catatan + ')' : '')));
    out.push('Dipotong gaji ini : -' + rp(g.kasbon || 0), 'Sisa setelah gajian : ' + rp(g.kasbonAkhir));
  }
  return out.join('\n');
}

      ${g.komisiJml? `<tr class="tambah"><td>Komisi &amp; apresiasi

/* ================= KWITANSI =================
   Sebelumnya kwitansi hanya bisa dikirim lewat WhatsApp. Untuk pelanggan
   yang belum punya nomor — dan itu sebagian besar — tombolnya membuka
   WhatsApp tanpa tujuan, jadi praktis tidak terpakai.

   Sekarang kwitansi ditampilkan di layar lebih dulu. Karyawan bisa langsung
   menunjukkannya ke pelanggan, atau pelanggan memotretnya sendiri. Kirim
   lewat WhatsApp jadi pilihan tambahan, bukan satu-satunya jalan.

   Nomor kwitansi dibuat tetap: pelanggan dan bulan yang sama selalu
   menghasilkan nomor yang sama, jadi bisa dicocokkan bila ada selisih. */

function noKwitansi(p, pr){
  const kode = String(p.id||'').replace(/[^a-zA-Z0-9]/g,'').slice(-4).toUpperCase() || '0000';
  return 'KW-' + String(pr).replace('-','') + '-' + kode;
}

function teksKwitansi(p, pr){
  const b = bayarOf(p.id, pr); if(!b) return '';
  const st = statusOf(p, pr) === 'lunas' ? 'LUNAS' : 'BAYAR SEBAGIAN';
  const saldo = saldoOf(p, pr);
  return `*KWITANSI ${DB.usaha.nama}*
No.      : ${noKwitansi(p, pr)}
Nama     : ${p.nama}
Bulan    : ${pLbl(pr)}
Jumlah   : ${rp(b.j)}
Cara     : ${b.c}
Tanggal  : ${tglId(b.t)}
Diterima : ${b.u || '-'}
Status   : ${st}${saldo > 0 ? '\nSaldo    : ' + rp(saldo) + ' (saldo kredit, dipakai bila dikonfirmasi)' : ''}

Terima kasih 🙏`;
}

function pesanTagih(p, pr){
  const t = tunggakan(p, pr);
  const tarif = tarifPada(p, pr);
  let s = DB.usaha.pesan
    .replace(/{nama}/g, p.nama).replace(/{bulan}/g, pLbl(pr))
    .replace(/{jumlah}/g, rp(tarif)).replace(/{tempo}/g, p.tempo)
    .replace(/{usaha}/g, DB.usaha.nama).replace(/{area}/g, p.area);
  const sd = saldoOf(p, pr);
  if(t>0) s += '\n\nTunggakan bulan sebelumnya: ' + rp(t) + '\nTotal: ' + rp(t + tarif);
  else if(sd > 0) s += '\n\nSaldo Anda: ' + rp(sd) + ' (saldo kredit, dipakai bila dikonfirmasi)\nTagihan bulan ini: ' + rp(tarif);
  return s;
}
function unduh(nama, isi, tipe){
  const b = new Blob([isi], {type: tipe||'text/plain;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nama;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* Ubah berkas cadangan menjadi isi DB. Menerima format cadangan (pelanggan,
   pembayaran, …) maupun salinan mentah DB lama (pel, bayar, …). Dulu tombol
   Pulihkan hanya mengenali format mentah, sehingga berkas yang dibuat oleh
   tombol Cadangkan sendiri SELALU ditolak "tidak terbaca". Server, antrean
   kirim, nama perangkat, dan PIN yang ada di HP ini dipertahankan. */
function dariCadangan(o, lama){
  if(!o || typeof o !== 'object') throw new Error('bukan cadangan');
  if(Array.isArray(o.pel)) return lengkapi(Object.assign({}, o, {server:lama.server, antre:lama.antre||[], perangkat:lama.perangkat}));
  if(!Array.isArray(o.pelanggan)) throw new Error('bukan cadangan MyRoom');
  const b = fresh();
  const pinLama = {}; (lama.users||[]).forEach(u=>{ if(u.pin) pinLama[u.id] = u.pin; });
  const v = o.voucher || {};
  const d = Object.assign(b, {
    usaha: Object.assign({}, b.usaha, o.usaha || {}),
    pel: o.pelanggan, bayar: o.pembayaran || {}, biaya: o.pengeluaran || [],
    tarifRiwayat: o.tarif_riwayat || [], kreditPakai: o.kredit_pakai || [],
    tiket: o.tiket || [], psb: o.psb || [], log: o.riwayat || [],
    users: (o.pengguna || []).map(u=>Object.assign({}, u, {pin: pinLama[u.id] || null})),
    presensi: o.presensi || [], absen: o.absen || [], kasbon: o.kasbon || [], gaji: o.gaji || [],
    komisi: o.komisi || {}, liburUsaha: o.libur_usaha || [], lemburDitolak: o.lembur_ditolak || [], kehadiran: o.kehadiran || [],
    vJenis: v.jenis || [], vToko: v.toko || [], vSesi: v.sesi || [], vDetail: v.detail || [],
    vStok: v.stok || [], vJual: v.jual || [], vTutup: v.tutup || [], vHutang: v.hutang || [],
    server: lama.server || b.server, antre: lama.antre || [], perangkat: lama.perangkat || b.perangkat
  });
  return lengkapi(d);
}

/* Daftar pelanggan beserta tunggakannya — bisa dibuka di Excel. */
function csvCadanganPelanggan(){
  const pr = curPer();
  const h = ['Nama','Area','HP','Tempo','Tarif','Status','Mulai','Tunggakan','Saldo','Catatan'];
  const rows = pel().map(p=>[p.nama, p.area, p.hp, p.tempo, tarifPada(p, pr), p.status, p.mulai,
    tunggakan(p, pr), saldoOf(p, pr), p.catatan||'']);
  return [h, ...rows].map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(';')).join('\n');
}

function csvTagihan(pr){
  const h = ['Nama','Area','Tempo','Tarif','Dibayar','Status','Tgl Bayar','Cara','Tunggakan','Saldo','HP'];
  const rows = pel().filter(p=>ditagihPada(p, pr)).map(p=>{
    const b = bayarOf(p.id, pr);
    return [p.nama, p.area, p.tempo, tarifPada(p,pr), b?b.j:0, statusOf(p,pr), b?tglId(b.t):'', b?b.c:'', tunggakan(p,pr), saldoOf(p,pr), p.hp];
  });
  return [h, ...rows].map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(';')).join('\n');
}

  clearInterval(kutipanT);
  kutipanT = setInterval(()=>{
    if(view !== 'beranda') return;
    const el = document.getElementById('kutipanTxt'); if(!el) return;
    el.style.opacity = 0;
    setTimeout(()=>{
      kutipanIdx = (kutipanIdx + 1) % KUTIPAN.length;
      const q = KUTIPAN[kutipanIdx];
      el.innerHTML = '"' + esc(q.t) + '"<b>— ' + esc(q.s) + '</b>';
      el.style.opacity = 1;
    }, 600);
  }, 8000);
}

function vBeranda(){
  const r = ringkas(per);
  const bars = [20,40,60,80,100].map(t=>`<i class="${r.pct>=t?'on':''}"></i>`).join('');
  const hariIni = pel().filter(p=>ditagihPada(p, per) && p.tempo===today().getDate() && statusOf(p,per)!=='lunas');
  const nunggak = pel().filter(p=>tunggakan(p,per)>0).sort((a,b)=>tunggakan(b,per)-tunggakan(a,per));
  // grafik 6 bulan
  const ps = perTerakhir(6, per);
  const dat = ps.map(p=>{ const x=ringkas(p); return {p, m:x.masuk, k:x.keluar}; });
  const mx = Math.max(1, ...dat.map(d=>Math.max(d.m,d.k)));
  // per area
  const area = {};
  for(const p of pel()){ if(!ditagihPada(p, per)) continue;
    const tarif = tarifPada(p, per);
    const a = area[p.area] = area[p.area]||{n:0,t:0,m:0,l:0};
    a.n++; a.t+=tarif; a.m += Math.min((bayarOf(p.id,per)||{j:0}).j, tarif);
    a.l = (a.l||0) + (statusOf(p,per)==='lunas'?1:0); }

  return `
  <div class="kutipan" id="kutipanTxt" style="opacity:1">"${esc(KUTIPAN[kutipanIdx].t)}"<b>— ${esc(KUTIPAN[kutipanIdx].s)}</b></div>
  ${can('uang')? `<div class="card">
    <h3>Penagihan ${esc(pLbl(per))}</h3>
    <div class="meter">
      <span class="bars">${bars}</span>
      <div>
        <div class="big">${r.pct}<span style="font-size:20px">%</span></div>
        <div class="cap">${rp(r.masuk)} masuk dari ${rp(r.tagih)}<br>${r.lunas} lunas · ${r.sebagian} sebagian · ${r.belum} belum</div>
      </div>
    </div>
  </div>`:''}

  <div class="grid2" style="margin-top:12px">
    ${can('uang')? `<div class="kpi ok"><div class="lbl">Uang masuk</div><div class="val">${rp(r.masuk)}</div><div class="sub">${r.lunas+r.sebagian} pelanggan bayar</div></div>
    <div class="kpi warn"><div class="lbl">Belum tertagih</div><div class="val">${rp(r.sisa)}</div><div class="sub">${r.belum} pelanggan</div></div>`
    : `<div class="kpi ok"><div class="lbl">Sudah lunas</div><div class="val">${r.lunas}</div><div class="sub">pelanggan</div></div>
    <div class="kpi warn"><div class="lbl">Belum bayar</div><div class="val">${r.belum+r.sebagian}</div><div class="sub">pelanggan</div></div>`}
    <div class="kpi"><div class="lbl">Pelanggan aktif</div><div class="val">${r.aktif}</div><div class="sub">${r.isolir} terisolir</div></div>
    <div class="kpi bad"><div class="lbl">${can('uang')?'Tunggakan lama':'Menunggak'}</div><div class="val">${can('uang')? rp(r.tung) : nunggak.length}</div><div class="sub">${nunggak.length} pelanggan</div></div>
    ${r.saldo > 0 ? `<div class="kpi ok"><div class="lbl">Saldo pelanggan</div><div class="val">${can('uang')? rp(r.saldo) : pel().filter(p=>saldoOf(p,per)>0).length}</div>
      <div class="sub">${pel().filter(p=>saldoOf(p,per)>0).length} pelanggan · saldo kredit, dipakai bila dikonfirmasi</div></div>`:''}
  </div>

  ${can('uang')? `<div class="card">
    <h3>Uang masuk vs pengeluaran · 6 bulan</h3>
    <div class="chart">${dat.map(d=>`<div class="col"><div class="pair">
      <b class="msk" style="height:${Math.max(2,d.m/mx*100)}%" title="${rp(d.m)}"></b>
      <b class="kel" style="height:${Math.max(2,d.k/mx*100)}%" title="${rp(d.k)}"></b>
      </div><span class="cl">${pShort(d.p)}</span></div>`).join('')}</div>
    <div class="legend"><span><i class="msk" style="background:var(--biru)"></i>Masuk</span>
      <span><i style="background:#C7D3DE"></i>Keluar</span>
      <span style="margin-left:auto;font-weight:700;color:${r.laba>=0?'var(--lunas)':'var(--alert)'}">Laba bulan ini ${rp(r.laba)}</span></div>
  </div>`:''}

  <div class="card" style="border-color:var(--merah);border-width:2px">
    <h3>Yang bayar hari ini</h3>
    <div style="display:flex;align-items:center;gap:14px">
      ${(()=>{ const l = can('uang')? setoranHariIni() : setoranHariIni().filter(x=>x.u===me.nama);
        return `<div><div style="font-family:var(--num);font-size:26px;font-weight:800;color:var(--lunas)">${rp(l.reduce((a,x)=>a+x.j,0))}</div>
        <div style="font-size:12px;color:var(--ink2)">${l.length} pembayaran ${can('uang')?'masuk':'oleh Anda'}</div></div>`; })()}
      <button class="btn sm p" style="margin-left:auto" data-go="harini">Buka</button>

    <tbody>${Object.entries(area).sort((a,b)=>b[1].t-a[1].t).map(([k,v])=>
      `<tr><td><b>${esc(k||'-')}</b></td><td class="n">${v.n}</td>${can('uang')
        ? `<td class="n">${rpk(v.t)}</td><td class="n" style="color:var(--lunas)">${rpk(v.m)}</td>`
        : `<td class="n" style="color:var(--lunas)">${v.l}</td>`}</tr>`).join('')}
    </tbody></table>
  </div>

  ${nunggak.length? `<div class="card"><h3>Perlu ditagih / kandidat isolir</h3>
    ${nunggak.slice(0,6).map(p=>`<div class="row" data-pel="${p.id}">
      <button class="tick ${(statusOf(p,per)==='lunas'?'on':'') + (pembayaranTertunda(p.id,per)?' pending':'')}" data-tick="${p.id}">✓</button>
      <div class="nm"><b>${esc(p.nama)}</b><span>${esc(p.area)} · nunggak ${Math.round(tunggakan(p,per)/(tarifPada(p,per)||1))} bulan</span></div>
      <div class="amt">${can('uang')? rpk(tunggakan(p,per)) : Math.round(tunggakan(p,per)/(tarifPada(p,per)||1))+' bln'}<em class="t">Tunggakan</em></div></div>`).join('')}</div>`:''}
  `;
}

/* ================= TAGIHAN ================= */
function rowTagih(p){
  const s = statusOf(p, per); const b = bayarOf(p.id, per);
  const tk = (s==='lunas'? 'on' : (s==='sebagian'? 'part':'')) + (pembayaranTertunda(p.id, per) ? ' pending' : '');
  const lbl = {lunas:'<em class="l">Lunas</em>', sebagian:'<em class="b">Sebagian</em>',
    belum:'<em class="b">Belum</em>', telat:'<em class="t">Telat</em>', nihil:''}[s];
  const tg = tunggakan(p, per), sd = saldoOf(p, per);
  return `<div class="row" data-pel="${p.id}">
    <button class="tick ${tk}" data-tick="${p.id}" aria-label="Tandai lunas">${s==='sebagian'?'½':'✓'}</button>
    <div class="nm"><b>${esc(p.nama)}${bayarOf(p.id, per)? centang('pembayaran', p.id+'_'+per):''}</b><span>${esc(p.area)} · tempo tgl ${p.tempo}${tg>0?' · <span style="color:var(--alert)">nunggak '+rpk(tg)+'</span>':''}${sd>0?' · <span style="color:var(--lunas)">saldo '+rpk(sd)+'</span>':''}${p.status==='isolir'?' · <span class="badge isolir">isolir</span>':''}</span></div>
    <div class="amt">${rp(b&&b.j?b.j:tarifPada(p, per))}${lbl}</div></div>`;
}
function vTagihan(){
  const r = ringkas(per);
  let list = pel().filter(p=>ditagihPada(p, per));
  if(fTag.q){ const q=fTag.q.toLowerCase(); list = list.filter(p=>p.nama.toLowerCase().includes(q)); }
  if(fTag.st!=='semua') list = list.filter(p=>{ const s=statusOf(p,per);
    return fTag.st==='lunas'? s==='lunas' : fTag.st==='belum'? (s!=='lunas') : tunggakan(p,per)>0; });
  if(fTag.gr!=='semua') list = list.filter(p=> fTag.gr==='t8'? p.tempo===8 : fTag.gr==='t15'? p.tempo===15 : p.area===fTag.gr);
  const areas = [...new Set(pel().map(p=>p.area))].filter(Boolean);
  return `
  <div class="grid3" style="margin-top:12px">
    <div class="kpi ok"><div class="lbl">Lunas</div><div class="val">${r.lunas}</div></div>
    <div class="kpi warn"><div class="lbl">Belum</div><div class="val">${r.belum+r.sebagian}</div></div>
    <div class="kpi"><div class="lbl">${can('uang')?'Sisa':'Total'}</div><div class="val">${can('uang')? rpk(r.sisa) : (r.lunas+r.belum+r.sebagian)}</div></div>
  </div>
  <div class="tools"><input type="search" id="qTag" placeholder="Cari nama pelanggan…" value="${esc(fTag.q)}">
    <button class="btn sm" data-act="wamassal">Kirim WA</button></div>
  <div class="chips">
    ${[['semua','Semua'],['belum','Belum bayar'],['lunas','Sudah lunas'],['nunggak','Menunggak']]
      .map(([k,l])=>`<button class="chip ${fTag.st===k?'on':''}" data-st="${k}">${l}</button>`).join('')}
  </div>
  <div class="chips">
    ${[['semua','Semua grup'],['t8','Tempo 8'],['t15','Tempo 15'],...areas.map(a=>[a,a])]
      .map(([k,l])=>`<button class="chip ${fTag.gr===k?'on':''}" data-gr="${k}">${esc(l)}</button>`).join('')}
  </div>
  <div style="margin-top:4px">
  ${list.length? list.map(rowTagih).join('') : '<div class="empty"><b>Tidak ada yang cocok</b>Ubah kata kunci atau filternya.</div>'}
  </div>
  <div style="height:8px"></div>`;
}

/* ================= PELANGGAN ================= */

  let list = pel().slice();

  if(fPel.gr!=='semua') list = list.filter(p=> fPel.gr==='isolir'? p.status==='isolir' :
    fPel.gr==='t8'? p.tempo===8 : fPel.gr==='t15'? p.tempo===15 : p.area===fPel.gr);
  const areas = [...new Set(pel().map(p=>p.area))].filter(Boolean);
  const tanpaHp = pel().filter(p=>!p.hp).length;
  return `

     <div style="font-size:13px;color:var(--ink2);margin-top:3px">Isi nomornya agar bisa dikirimi tagihan lewat WhatsApp.</div></div>`:''}
  <div style="margin-top:4px">
  ${list.map(p=>`<div class="row" data-edit="${p.id}">
    <div class="nm"><b>${esc(p.nama)}${centang('pelanggan', p.id)}</b><span>${esc(p.area)} · ${p.hp? esc(p.hp):'tanpa HP'} ·
      <span class="badge ${p.tempo===8?'t8':'t15'}">tempo ${p.tempo}</span>

/* ================= LAPORAN ================= */
