/* ================= POIN & BONUS KARYAWAN =================
   Poin dihitung dari gangguan yang SELESAI di bulan berjalan.
   Satu pekerjaan sendirian bernilai 1 poin. Bila dikerjakan berdua, nilainya
   dibagi: masing-masing 0,5 poin — sesuai pembagian bonus lama Rp5.000 per
   orang. Bonus = (poin - 50) x Rp10.000, dan tidak pernah minus.

   Daftar nama diambil dari daftar pengguna, jadi karyawan baru muncul
   sendirinya dan yang sudah keluar hilang sendirinya. */
const BAYAR_PER_POIN = 8;       // 8 catatan pembayaran = 1 poin

/* ================= JADWAL KERJA, JAM, & LEMBUR =================
   Tiap orang punya jam kerja sendiri, boleh terbagi beberapa sesi
   (mis. 08:00-12:00 dan 13:00-17:00). Jam di dalam jendela jadwal dihitung
   kerja biasa; di luar itu — termasuk hari libur — dihitung lembur.

   Lembur "siaga": bila pada sesi lembur itu ternyata ada gangguan yang
   ditangani orang ini dan sudah disahkan (yang berarti dia juga dapat
   poin & bonus untuk gangguan itu), jam lembur sesi tersebut dibayar
   dengan tarif yang dikurangi — supaya tidak dobel penuh dengan bonus
   poinnya. Lembur yang sama sekali tidak beririsan gangguan tetap
   dibayar tarif lembur penuh seperti biasa. */
const TOLERANSI_MENIT = 15;     // terlambat sampai 15 menit masih dimaklumi
const SIAGA_PENGALI = 0.5;      // tarif lembur saat gangguan: 50% dari tarif lembur biasa
const HARI_NAMA = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

function jadwalUser(u){
  const teks = (u && u.jadwal) || '';
  const sesi = teks.split(',').map(s=>s.trim()).filter(Boolean).map(s=>{
    const [a,b] = s.split('-').map(x=>(x||'').trim());
    const m = t => { const [j,n] = String(t).split(':').map(Number);
      return (isFinite(j)? j:0)*60 + (isFinite(n)? n:0); };
    return {teks:s, mulai:m(a), selesai:m(b)};
  }).filter(x=>x.selesai > x.mulai);
  const wajib = u && u.jamWajib ? +u.jamWajib
    : (sesi.length ? sesi.reduce((s,x)=>s + (x.selesai-x.mulai), 0)/60 : 8);
  const libur = String((u && u.hariLibur != null) ? u.hariLibur : '0')
    .split(',').map(s=>s.trim()).filter(s=>s!=='').map(Number);
  const tarif = u && u.tarifLembur ? +u.tarifLembur
    : (u && u.gaji && wajib ? Math.round(u.gaji / HARI_KERJA / wajib) : 0);
  return {sesi, wajib, libur, tarif};
}
const menitHari = iso => { const d = new Date(iso); return d.getHours()*60 + d.getMinutes(); };

/* Menit yang beririsan antara satu sesi absen dan jendela jadwal.
   Dipakai memisahkan jam kerja biasa dari lembur. */
function irisanMenit(m1, m2, w1, w2){ return Math.max(0, Math.min(m2,w2) - Math.max(m1,w1)); }

/* Apakah pada rentang satu sesi absen (masuk–pulang) orang ini menyelesaikan
   gangguan yang sudah disahkan? Kalau ya, jam lembur sesi itu dianggap
   "siaga" (tarif dikurangi) karena sudah dihargai lewat poin & bonus. */
function adaGangguanDisesi(nama, a){
  return (DB.tiket||[]).some(t=>{
    if(t.status !== 'selesai' || !t.selesai || !t.disahkan) return false;
    const orang = String(t.penangan||'').split(',').map(s=>s.trim()).filter(Boolean);
    if(orang.indexOf(nama) < 0) return false;
    const ts = new Date(t.selesai).getTime();
    return ts >= new Date(a.masuk).getTime() && ts <= new Date(a.pulang).getTime();
  });
}

/* Rekap satu hari untuk satu orang. Satu hari boleh berisi beberapa sesi
   absen — sesi pagi dan sesi siang dihitung terpisah lalu dijumlahkan. */
function rekapHari(u, tanggal, sesiAbsen){
  const J = jadwalUser(u);
  const hari = new Date(tanggal + 'T00:00:00').getDay();
  const iniLibur = J.libur.indexOf(hari) >= 0;
  /* jeda antar sesi jadwal (mis. jam istirahat 12:00-13:00) — waktu ini
     bukan jam kerja, jadi tidak dihitung lembur meski karyawan tidak
     menekan absen pulang/masuk pas istirahat (sesi absennya nyambung). */
  const sesiUrut = J.sesi.slice().sort((x,y)=>x.mulai-y.mulai);
  const jedaJadwal = [];
  for(let i=0;i<sesiUrut.length-1;i++) jedaJadwal.push({mulai:sesiUrut[i].selesai, selesai:sesiUrut[i+1].mulai});

  const autoTutup = !!(DB.usaha && DB.usaha.autoTutupLupaPulang);
  let dalam = 0, luarBiasa = 0, luarSiaga = 0, belumTutup = 0;
  for(const a of sesiAbsen){
    let m2;
    if(a.pulang){ m2 = menitHari(a.pulang); }
    else if(autoTutup && sesiUrut.length){
      belumTutup++;                                   // tetap dicatat lupa, tapi jam dihitung
      m2 = sesiUrut[sesiUrut.length - 1].selesai;      // anggap pulang pas jadwal terakhir selesai
    }else{ belumTutup++; continue; }                   // bawaan: lupa = 0 jam, tunggu koreksi manual
    const m1 = menitHari(a.masuk);
    if(m2 <= m1) continue;                             // data tidak masuk akal, lewati
    const total = Math.max(0, m2 - m1);
    const siaga = a.pulang && adaGangguanDisesi(u.nama, a);  // butuh pulang asli, bukan hasil tebakan
    if(iniLibur){ if(siaga) luarSiaga += total; else luarBiasa += total; continue; }        // hari libur: semua lembur
    let d = 0;
    for(const w of J.sesi) d += irisanMenit(m1, m2, w.mulai, w.selesai);
    dalam += Math.min(d, total);
    let jeda = 0;
    for(const j of jedaJadwal) jeda += irisanMenit(m1, m2, j.mulai, j.selesai);
    const luarSesi = Math.max(0, total - d - jeda);
    if(siaga) luarSiaga += luarSesi; else luarBiasa += luarSesi;
  }
  const batas = Math.round(J.wajib * 60);
  const normal = iniLibur ? 0 : Math.min(dalam, batas);
  const lemburBiasa = luarBiasa + (iniLibur ? 0 : Math.max(0, dalam - batas));
  const lemburSiaga = luarSiaga;
  const lembur = lemburBiasa + lemburSiaga;

  /* keterlambatan: HANYA dilihat dari absen masuk pertama di hari itu,
     dibandingkan jendela jadwal paling pagi. Sesi masuk berikutnya
     (mis. balik dari istirahat) tidak lagi dicek telat/tepat waktu —
     supaya telat/lambatnya menekan absen pulang saat istirahat tidak
     ikut menyeret status telat ke sesi berikutnya. Hanya dicatat,
     tidak memotong gaji. */
  const telat = [];
  if(!iniLibur && sesiUrut.length && sesiAbsen.length){
    const wPertama = sesiUrut[0];
    const masukPertama = sesiAbsen.map(a=>menitHari(a.masuk)).sort((x,y)=>x-y)[0];
    const lebih = masukPertama - wPertama.mulai;
    if(lebih > TOLERANSI_MENIT) telat.push({sesi:wPertama.teks, menit:lebih});
  }
  return {tanggal, hari, iniLibur, normal, lembur, lemburBiasa, lemburSiaga, belumTutup, telat,
          kurang: iniLibur ? 0 : Math.max(0, batas - normal)};
}

/* Rekap satu orang sepanjang rentang tanggal */
function rekapJam(u, d1, d2){
  const punya = (DB.presensi||[]).filter(a=>a.user_id === u.id
    && a.tanggal >= d1 && a.tanggal <= d2);
  const perHari = {};
  punya.forEach(a=>{ (perHari[a.tanggal] = perHari[a.tanggal] || []).push(a); });
  const hari = Object.keys(perHari).sort().map(t=>rekapHari(u, t, perHari[t]));
  const J = jadwalUser(u);
  const jml = k => hari.reduce((s,x)=>s + x[k], 0);
  const menitNormal = jml('normal'), menitLembur = jml('lembur');
  const menitLemburBiasa = jml('lemburBiasa'), menitLemburSiaga = jml('lemburSiaga');
  const upahLemburBiasa = Math.round((menitLemburBiasa/60) * J.tarif);
  const upahLemburSiaga = Math.round((menitLemburSiaga/60) * J.tarif * SIAGA_PENGALI);
  return {
    nama:u.nama, hariHadir:hari.length, hari,
    menitNormal, menitLembur, menitLemburBiasa, menitLemburSiaga,
    jamNormal: menitNormal/60, jamLembur: menitLembur/60,
    jamLemburBiasa: menitLemburBiasa/60, jamLemburSiaga: menitLemburSiaga/60,
    menitKurang: jml('kurang'),
    belumTutup: jml('belumTutup'),
    telat: hari.reduce((s,x)=>s + x.telat.length, 0),
    telatMenit: hari.reduce((s,x)=>s + x.telat.reduce((y,z)=>y+z.menit,0), 0),
    tarif: J.tarif, wajib: J.wajib,
    upahLemburBiasa, upahLemburSiaga,
    upahLembur: upahLemburBiasa + upahLemburSiaga
  };
}
const jamTeks = menit => { const j = Math.floor(menit/60), n = Math.round(menit%60);
  return (j? j+' jam' : '') + (n? (j?' ':'') + n + ' mnt' : (j? '' : '0 mnt')); };

/* ================= PILIHAN RENTANG WAKTU =================
   Dipakai layar Poin & bonus dan layar Gaji. Semua hitungan yang tadinya
   terkunci pada bulan berjalan kini mengikuti rentang yang dipilih. */
let fPoin = {mode:'bulan', bulan:curPer(), tgl:tglKunci()};
let fGaji = {mode:'bulan', bulan:(bulanGajian() < P0 ? P0 : bulanGajian()), tgl:tglKunci()};

function rentangDari(f){
  if(f.mode === 'hari'){ const t = tglKunci();
    return {d1:t, d2:t, lbl:'Hari ini', bulan:t.slice(0,7)}; }
  if(f.mode === '7hari'){ const a = today(); a.setDate(a.getDate()-6);
    const d1 = tglKunci(a), d2 = tglKunci();
    return {d1, d2, lbl:'7 hari terakhir', bulan:d2.slice(0,7)}; }
  if(f.mode === 'tanggal'){ const t = f.tgl || tglKunci();
    return {d1:t, d2:t, lbl:tglId(t), bulan:t.slice(0,7)}; }
  const [y,m] = f.bulan.split('-').map(Number);
  const akhir = new Date(y, m, 0).getDate();
  return {d1:f.bulan+'-01', d2:f.bulan+'-'+String(akhir).padStart(2,'0'),
          lbl:pLbl(f.bulan), bulan:f.bulan};
}
/* baris tombol pemilih rentang; akta = nama aksi penanganannya */
function pilihRentang(f, akta){
  const c = (m,l)=>`<button class="chip ${f.mode===m?'on':''}" data-act="${akta}" data-mode="${m}">${l}</button>`;
  return `<div class="chips" style="margin-top:10px">
    ${c('hari','Hari ini')}${c('7hari','7 hari terakhir')}${c('bulan','Pilih bulan')}${c('tanggal','Pilih tanggal')}</div>
  ${f.mode==='bulan' ? `<div class="fr" style="margin-top:8px;align-items:center">
      <button class="btn sm" style="flex:0 0 44px" data-act="${akta}" data-geser="-1">‹</button>
      <b style="text-align:center;align-self:center">${esc(pLbl(f.bulan))}</b>
      <button class="btn sm" style="flex:0 0 44px" data-act="${akta}" data-geser="1">›</button></div>`:''}
  ${f.mode==='tanggal' ? `<div class="fr" style="margin-top:8px">
      <input type="date" id="rt_${akta}" value="${esc(f.tgl||tglKunci())}">
      <button class="btn sm p" style="flex:0 0 96px" data-act="${akta}" data-pakai="1">Terapkan</button></div>`:''}`;
}
function aturRentang(f, d, elId){
  if(d.geser){ const b = pAdd(f.bulan, +d.geser);
    if(b < P0 || b > PZ){ toast('Periode tersedia '+pLbl(P0)+' – '+pLbl(PZ)); return false; }
    f.bulan = b; f.mode = 'bulan'; return true; }
  if(d.pakai){ const n = document.getElementById(elId), v = n ? n.value : '';
    if(!v){ toast('Pilih tanggalnya dulu'); return false; }
    f.tgl = v; f.mode = 'tanggal'; return true; }
  f.mode = d.mode; return true;
}

const BONUS_AMBANG = 40;
const BONUS_PER_POIN = 10000;

function poinBonus(d1, d2){
  /* tanpa rentang: bulan berjalan penuh, seperti sebelumnya */
  if(!d1){ const r = rentangDari({mode:'bulan', bulan:curPer()}); d1 = r.d1; d2 = r.d2; }
  const dalam = iso => { const t = String(iso || '').slice(0,10); return t >= d1 && t <= d2; };
  const per_ = {};

  const tambah = (nama, poin) => {
    const k = bakukanNama(nama);
    if(!k) return;
    if(!per_[k]) per_[k] = {nama:k, kerja:0, poin:0, sendiri:0, berdua:0, tagih:0, cepat:0};
    per_[k].poin += poin;
    per_[k].kerja += 1;
    if(poin === 1) per_[k].sendiri += 1; else per_[k].berdua += 1;
  };
  /* ambil wadah tanpa menambah hitungan gangguan */
  const ambil = nama => {
    const k = bakukanNama(nama) || '(tidak dicatat)';
    if(!per_[k]) per_[k] = {nama:k, kerja:0, poin:0, sendiri:0, berdua:0, tagih:0, cepat:0};
    return per_[k];
  };

  /* Bonus kecepatan: gangguan yang selesai antara 15 menit sampai 3 jam
     sejak dilapor dapat tambahan setengah poin. Batas bawah 15 menit
     sengaja disamakan dengan ambang kecurigaan di menu Klaim — di bawah
     itu dianggap belum tentu kerja nyata, jadi tidak dihargai kecepatan.
     Tanpa batas bawah ini, bonus justru mengajak menutup gangguan asal
     cepat demi poin, bukan demi pelanggan. */
  const KECEPATAN_MIN_MENIT = 15;
  const KECEPATAN_MAKS_MENIT = 180;
  const KECEPATAN_BONUS = 0.5;

  let menunggu = 0;
  for(const t of DB.tiket){
    if(t.status !== 'selesai' || !t.selesai) continue;
    if(!dalam(t.selesai)) continue;                            // di luar rentang
    if(!t.disahkan){ menunggu++; continue; }                   // belum disahkan Pemilik
    const orang = String(t.penangan || '').split(',').map(s=>s.trim()).filter(Boolean);
    if(!orang.length) continue;
    const berdua = orang.length > 1;
    const nilai = berdua ? 0.5 : 1;
    orang.forEach(o=>tambah(o, nilai));

    const m = menitTangani(t);
    if(m !== null && m >= KECEPATAN_MIN_MENIT && m <= KECEPATAN_MAKS_MENIT){
      const bonusCepat = berdua ? KECEPATAN_BONUS / 2 : KECEPATAN_BONUS;
      orang.forEach(o=>{ const w = ambil(o); w.poin += bonusCepat; w.cepat = (w.cepat||0) + 1; });
    }
  }

  /* Poin dari menyisir tagihan. Setiap ${BAYAR_PER_POIN} catatan pembayaran
     bernilai 1 poin, jadi tiap rumah yang disisir dihargai — tidak ada sisa
     yang hangus. Yang dipakai adalah tanggal uang diterima, bukan bulan
     tagihannya: menagih tunggakan lama tetap dihitung kerja bulan ini.
     Tidak perlu disahkan seperti gangguan, karena uangnya sudah nyata
     masuk dan penerimanya tercatat. */
  const nilaiBayar = 1 / BAYAR_PER_POIN;
  for(const k of Object.keys(DB.bayar || {})){
    const b = DB.bayar[k];
    if(!b || !dalam(b.t)) continue;
    const o = ambil(b.u);
    o.poin  += nilaiBayar;
    o.tagih += 1;
  }

  /* Semua karyawan terdaftar ikut tampil, walau belum ada gangguan. */
  const terdaftar = DB.users.filter(u=>u.peran === 'karyawan' && u.aktif !== false);
  const baris = terdaftar.map(u=>{
    const d = per_[u.nama] || {nama:u.nama, kerja:0, poin:0, sendiri:0, berdua:0, tagih:0, cepat:0};
    delete per_[u.nama];
    return Object.assign({}, d, {terdaftar:true});
  });

  /* Nama yang tercatat di gangguan tapi tidak ada di daftar pengguna —
     misalnya teknisi kedua yang diketik manual, atau karyawan yang sudah
     keluar. Tetap ditampilkan supaya bonusnya tidak hilang diam-diam. */
  const lainnya = Object.keys(per_).map(k=>Object.assign({}, per_[k], {terdaftar:false}));

  /* Pecahan 0,2 dan 0,5 tidak pernah bulat dalam hitungan komputer:
     enam puluh kali 0,2 menghasilkan 12,00000000000017, bukan 12. Tanpa
     pembulatan, bonusnya menjadi angka seperti Rp70.000,0000017 — mustahil
     untuk uang. Poin dibulatkan dua angka di belakang koma, bonusnya ke
     rupiah bulat. */
  const hasil = [...baris, ...lainnya]
    .map(x=>{
      x.poin = Math.round(x.poin * 100) / 100;
      x.bonus = Math.max(0, Math.round((x.poin - BONUS_AMBANG) * BONUS_PER_POIN));
      return x;
    })
    .sort((a,b)=> b.poin - a.poin || a.nama.localeCompare(b.nama));
  hasil.menunggu = menunggu;          // jumlah yang belum disahkan Pemilik
  return hasil;
}

/* ================= PENANGKAP KEGAGALAN =================
   Penekanan tombol ditangani oleh fungsi async. Bila terjadi kesalahan di
   dalamnya, JavaScript menelannya diam-diam: tombol ditekan, tidak ada
   pesan, tidak ada yang terjadi. Sulit ditelusuri karena tidak ada jejak
   di layar.

   Dua penangkap di bawah membuat kegagalan itu terlihat. Tidak memperbaiki
   sebabnya, tapi memunculkan namanya, supaya bisa dilaporkan dan dibetulkan. */
(function(){
  let terakhir = 0;
  function laporkan(pesan){
    const kini = Date.now();
    if(kini - terakhir < 1500) return;        // jangan bertubi-tubi
    terakhir = kini;
    try{ toast('Gagal: ' + String(pesan).slice(0, 120)); }catch(e){}
  }
  window.addEventListener('unhandledrejection', function(e){
    const r = e.reason;
    laporkan(r && r.message ? r.message : r);
    console.error('Kegagalan tak tertangkap:', r);
  });
  window.addEventListener('error', function(e){
    if(e.message) laporkan(e.message);
    console.error('Kesalahan:', e.error || e.message);
  });
})();

/* ================= PENCARIAN DALAM DAFTAR PANJANG =================
   Dengan ratusan pelanggan, menggulung daftar itu menyiksa — apalagi sambil
   berdiri di depan rumah orang. Isian di atasnya menyaring daftar sambil
   diketik: pilihan yang tidak cocok disembunyikan, dan bila tersisa satu
   saja, pilihan itu langsung terpilih sendiri.

   Baris yang tidak cocok disembunyikan lewat CSS, bukan dihapus, supaya
   pilihan yang sudah diambil tidak hilang saat pencarian dikosongkan. */
function saringDaftar(kotakCari){
  const sel = document.getElementById(kotakCari.dataset.saring);
  if(!sel) return;
  const q = kotakCari.value.trim().toLowerCase();
  let tampil = 0, satuNilai = '';

  for(const o of sel.options){
    if(!o.value){ o.hidden = false; o.style.display = ''; continue; }   // baris "gangguan umum"
    const cocok = !q || o.textContent.toLowerCase().indexOf(q) >= 0;
    /* dua cara sekaligus: sebagian peramban HP mengabaikan salah satunya */
    o.hidden = !cocok;
    o.style.display = cocok ? '' : 'none';
    if(cocok){ tampil++; satuNilai = o.value; }
  }

  /* tersisa satu — langsung pilih supaya tidak perlu diketuk lagi */
  if(q && tampil === 1) sel.value = satuNilai;
  else if(q && tampil === 0) sel.value = '';

  const info = document.getElementById(kotakCari.id + 'Info');
  if(info) info.textContent = !q ? ''
    : (tampil ? tampil + ' pelanggan cocok' + (tampil === 1 ? ' · sudah dipilih' : '')
              : 'Tidak ada yang cocok');
}

const sbOn = () => !!(DB.server && DB.server.url && DB.server.key);
function sbUrl(path){ return DB.server.url.replace(/\/+$/,'') + '/rest/v1/' + path; }
async function sbReq(path, opt){
  opt = opt || {};
  const r = await fetch(sbUrl(path), Object.assign({}, opt, {headers: Object.assign({
    apikey: DB.server.key, Authorization: 'Bearer ' + DB.server.key,
    'Content-Type': 'application/json'}, opt.headers || {})}));
  if(!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0,160));
  /* Balasan sukses boleh saja berbadan kosong (204, atau 201 dengan
     Prefer: return=minimal). Dulu r.json() langsung meledak di situ dan
     data yang SUDAH tersimpan dilaporkan gagal lalu diantrekan ulang. */
  if(r.status === 204 || r.status === 205) return null;
  const teks = await r.text();
  if(!teks) return null;
  try{ return JSON.parse(teks); }
  catch(e){ return null; }               // sukses, badannya bukan JSON
}

/* PIN tidak pernah dikirim apa adanya — yang disimpan hanya sidik acaknya */
async function sandiPin(pin){
  const data = new TextEncoder().encode('roomnet:' + pin);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* Ubah sebagian kolom saja. Ini mencegah perubahan orang lain ikut tertimpa
   ketika dua orang menyunting data yang sama pada saat hampir bersamaan. */
async function sbTambal(tabel, id, kolom, lempar){
  if(!sbOn()) return;
  if(!kolom || !Object.keys(kolom).length) return true;
  try{
    await sbReq(tabel + '?id=eq.' + encodeURIComponent(id),
      {method:'PATCH', headers:{Prefer:'return=minimal'}, body: JSON.stringify(kolom)});
    return true;
  }catch(e){ if(lempar) throw e; antrekan({t:tabel, a:'tambal', i:id, d:kolom}); laporGagal(e, tabel); return false; }
}
function bedaKolom(lama, baru){
  const out = {};
  for(const k of Object.keys(baru)) if(String(lama[k] == null ? '' : lama[k]) !== String(baru[k] == null ? '' : baru[k])) out[k] = baru[k];
  return out;
}

async function sbSimpan(tabel, data, lempar){   // upsert
  if(!sbOn()) return;
  try{
    /* Tabel log memakai 'abaikan bila sudah ada' supaya catatan lama tidak
       tertimpa saat antrean dikirim ulang. */
    const cara = tabel === 'log' ? 'resolution=ignore-duplicates' : 'resolution=merge-duplicates';
    await sbReq(tabel, {method:'POST', headers:{Prefer: cara + ',return=minimal'}, body: JSON.stringify(data)});
    return true;
  }catch(e){
    if(lempar) throw e;
    antrekan({t:tabel, a:'simpan', d:data});
    laporGagal(e, tabel);
    return false;
  }
}
let lastLapor = 0;
function laporGagal(e, tabel){
  const m = String((e && e.message) || '');
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return;   // sekadar hilang sinyal
  if(Date.now() - lastLapor < 8000) return;                          // jangan bertubi-tubi
  lastLapor = Date.now();
  toast('Server menolak data ' + tabel + ' — ' + alasanGagal(e));
}
async function sbHapus(tabel, id, lempar){
  if(!sbOn()) return;
  try{ await sbReq(tabel + '?id=eq.' + encodeURIComponent(id), {method:'DELETE'}); return true; }
  catch(e){ if(lempar) throw e; antrekan({t:tabel, a:'hapus', d:id}); laporGagal(e, tabel); return false; }
}

/* jumlah catatan yang tersimpan permanen di server */
async function jumlahLogServer(){
  const r = await fetch(sbUrl('log?select=id&limit=1'), {headers:{
    apikey: DB.server.key, Authorization: 'Bearer ' + DB.server.key,
    Prefer: 'count=exact', Range: '0-0'}});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return parseInt((r.headers.get('content-range') || '').split('/')[1], 10) || 0;

function gabungLog(baris, simpanLama){
  const ada = new Set(DB.log.map(x=>x.id));
  const dibuang = new Set((DB.antre||[]).filter(x=>x.t==='log' && x.a==='hapus').map(x=>x.d));
  for(const r of baris){
    if(ada.has(r.id) || dibuang.has(r.id)) continue;
    DB.log.push({id:r.id, waktu:r.waktu, oleh_id:r.oleh_id, oleh:r.oleh, peran:r.peran,
      aksi:r.aksi, tabel:r.tabel, rekid:r.rekid, judul:r.judul,
      sebelum:r.sebelum || '', sesudah:r.sesudah || '', perangkat:r.perangkat || ''});
  }
  DB.log.sort((a,b)=>b.waktu.localeCompare(a.waktu));
  if(!simpanLama) pangkasLog();
  save();
}
/* catatan 'edit' & 'buka' dipertahankan karena jadi dasar hitungan batas
   pengubahan; yang dipangkas hanya catatan ringan seperti 'masuk' */
function pangkasLog(){
  const BATAS = 1200;
  if(DB.log.length <= BATAS) return;
  const penting = [], ringan = [];
  for(const x of DB.log) (x.aksi==='edit' || x.aksi==='buka' ? penting : ringan).push(x);
  const sisaRuang = Math.max(0, BATAS - penting.length);
  DB.log = penting.concat(ringan.slice(0, sisaRuang))
    .sort((a,b)=>b.waktu.localeCompare(a.waktu));
}

function terapkanAntre(){
  for(const x of (DB.antre || [])){
    if(x.a === 'tambal'){
      if(x.t === 'pelanggan'){ const i = DB.pel.findIndex(p=>p.id === x.i); if(i>=0) Object.assign(DB.pel[i], kePelL(Object.assign({}, kePel(DB.pel[i]), x.d))); }
      if(x.t === 'pengguna'){ const u = DB.users.find(y=>y.id === x.i); if(u) Object.assign(u, x.d); }
      continue;
    }
    const arr = Array.isArray(x.d) ? x.d : [x.d];
    if(x.a === 'hapus'){
      if(x.t === 'pelanggan'){ DB.pel = DB.pel.filter(p=>p.id !== x.d); }
      if(x.t === 'pengeluaran'){ DB.biaya = DB.biaya.filter(b=>b.id !== x.d); }
      if(x.t === 'tiket'){ DB.tiket = DB.tiket.filter(t=>t.id !== x.d); }
      if(x.t === 'pembayaran'){ const k = String(x.d).replace('_','|'); delete DB.bayar[k]; }
      continue;
    }
    for(const r of arr){
      if(x.t === 'pelanggan'){
        const i = DB.pel.findIndex(p=>p.id === r.id);
        if(i >= 0) DB.pel[i] = Object.assign({}, DB.pel[i], kePelL(r)); else DB.pel.push(kePelL(r));
      }
      if(x.t === 'pembayaran'){
        DB.bayar[r.pelanggan_id + '|' + r.periode] =
          {j:r.jumlah, t:r.waktu, c:r.cara || 'Tunai', u:r.penerima || '-'};
      }
      if(x.t === 'pengeluaran'){
        const b = {id:r.id, periode:r.periode, tgl:r.waktu, ket:r.keterangan, kategori:r.kategori, jml:r.jumlah};
        const i = DB.biaya.findIndex(y=>y.id === r.id);
        if(i >= 0) DB.biaya[i] = b; else DB.biaya.push(b);
      }
      if(x.t === 'presensi'){
        DB.presensi = DB.presensi || [];
        const rec = {id:r.id, user_id:r.user_id, nama:r.nama || '', tanggal:r.tanggal,
          masuk:r.masuk, pulang:r.pulang || null,
          lat_masuk:r.lat_masuk, lon_masuk:r.lon_masuk, akurasi_masuk:r.akurasi_masuk,
          lat_pulang:r.lat_pulang, lon_pulang:r.lon_pulang, akurasi_pulang:r.akurasi_pulang};
        const i = DB.presensi.findIndex(y=>y.id === r.id);
        if(i >= 0) DB.presensi[i] = Object.assign({}, DB.presensi[i], rec); else DB.presensi.push(rec);
      }
      if(x.t === 'log'){ gabungLog([r]); }
      if(x.t === 'tiket'){
        const t = {id:r.id, pelId:r.pelanggan_id || '', masalah:r.masalah, tgl:r.waktu,
          status:r.status, pelapor:r.pelapor || '', penangan:r.penangan || '', selesai:r.selesai || ''};
        const i = DB.tiket.findIndex(y=>y.id === r.id);
        if(i >= 0) DB.tiket[i] = t; else DB.tiket.push(t);
      }
    }
  }
}

function kunciAntre(x){
  if(x.a === 'tambal') return x.t + '|tambal|' + x.i;
  const d = Array.isArray(x.d) ? x.d : [x.d];
  return x.t + '|' + x.a + '|' + d.map(r=>(r && r.id) || r).join(',');
}
function antrekan(x){
  DB.antre = DB.antre || [];
  const k = kunciAntre(x);
  if(x.a === 'tambal'){                       // gabungkan perubahan kolom
    const lama = DB.antre.find(y=>kunciAntre(y) === k);
    if(lama){ Object.assign(lama.d, x.d); lama.g = 0; save(); tandaServer(); garisAntre(); return; }
  }
  DB.antre = DB.antre.filter(y=>kunciAntre(y) !== k);   // versi terbaru saja
  x.g = 0;
  x.w = x.w || Date.now();                             // sejak kapan tertahan
  DB.antre.push(x); save(); tandaServer(); garisAntre();
}
async function kirimAntre(){                    // coba kirim ulang yang tertunda
  if(!sbOn() || !DB.antre || !DB.antre.length) return 0;
  const sisa = [], ditolak = [];
  for(const x of DB.antre){
    try{
      if(x.a === 'hapus') await sbHapus(x.t, x.d, true);
      else if(x.a === 'tambal') await sbTambal(x.t, x.i, x.d, true);
      else await sbSimpan(x.t, x.d, true);
    }catch(e){
      x.g = (x.g || 0) + 1;
      const tolak = /HTTP 4\d\d/.test(e.message || '');
      if(tolak && x.g >= 3){ ditolak.push(x); }        // dibuang, bukan masalah sinyal
      else sisa.push(x);
    }
  }
  if(ditolak.length) toast(ditolak.length + ' data ditolak server — cek kolom tabel');
  const terkirim = DB.antre.length - sisa.length;
  DB.antre = sisa; save(); tandaServer();
  /* tumpukan akhirnya habis: beri kabar lega, walau terkirim sendiri */
  if(terkirim > 0 && !sisa.length){
    antreLegaSampai = Date.now() + 6000;
    garisAntre(); setTimeout(garisAntre, 6200);
  }
  return terkirim;
}
/* ================= GARIS PERINGATAN ANTREAN =================
   Penanda kecil di pojok atas mudah terlewat. Bila karyawan menagih di
   daerah tanpa sinyal, catatannya menumpuk di HP dan bisa hilang bersama
   HP itu — tanpa jejak apa pun di server.

   Garis ini selalu terlihat selama masih ada yang tertahan, dan sekaligus
   menjadi tombolnya: sekali ketuk, langsung dicoba kirim. Begitu berhasil,
   berubah hijau sebentar supaya karyawan tahu pekerjaannya sudah aman. */


function garisAntre(){
  const n = $('#antreBar'); if(!n) return;
  const jml = (DB && DB.antre) ? DB.antre.length : 0;

  if(!jml){
    if(Date.now() < antreLegaSampai){
      n.className = 'aman';
      n.innerHTML = '<span>✓</span><span>Semua sudah tersimpan di server'
        + '<small>Tidak ada catatan yang tertahan di HP ini</small></span>';
    }else{
      n.className = 'hide'; n.innerHTML = '';
    }
    return;
  }

  /* semakin lama tertahan, semakin tegas warnanya */
  const tertua = DB.antre.reduce((t,x)=> Math.min(t, x.w || Date.now()), Date.now());
  const menit = Math.floor((Date.now() - tertua) / 60000);
  const berat = jml >= 10 || menit >= 30;

  n.className = berat ? 'lama' : 'tunggu';
  n.innerHTML = '<span>⚠️</span><span>' + jml + ' catatan belum terkirim'
    + '<small>' + (sbOn()
        ? (menit >= 2 ? 'tertahan ' + (menit < 60 ? menit + ' menit' : Math.floor(menit/60) + ' jam')
             + ' · ketuk untuk kirim sekarang'
           : 'ketuk untuk kirim sekarang')
        : 'server belum diatur — data hanya di HP ini')
    + '</small></span>';
}

function tandaServer(){
  const n = $('#svr'); if(!n) return;
  const antre = (DB.antre||[]).length;
  n.textContent = !sbOn() ? '○ HP' : (antre ? '◐ ' + antre : '● Server');
  garisAntre();
  n.title = !sbOn() ? 'Data hanya di HP ini'
    : (antre ? antre + ' data menunggu terkirim — ketuk untuk mencoba lagi' : 'Tersambung ke server');
}

/* ================= PIN & HAK AKSES ================= */
const IZIN = {
  owner:    ['beranda','tagihan','harini','pelanggan','laporan','menu','biaya','tiket','setelan','users','server','riwayat','presensi','chat','titip',
             'hapus','batal','uang','ekspor','tarif','ubahlog','poin'],
  karyawan: ['beranda','tagihan','harini','pelanggan','tiket','menu','riwayat','hapus','presensi','chat','poin']
};
const can = k => !!me && IZIN[me.peran].indexOf(k) >= 0;
const owner = () => DB.users.find(u=>u.peran==='owner');
const PIN_MIN = 4, PIN_MAX = 8;

/* tahap: 'server' (belum tersambung) | 'buat' | 'ulang' | 'masuk' */
let tahap = 'masuk', pinTmp = '', targetPin = null, sibuk = false;

function alasanGagal(e){
  const m = String((e && e.message) || '');
  if(/42501|violates row-level security|permission denied/i.test(m))
    return 'izin tabel belum sesuai, jalankan ulang reset-total.sql';
  if(/404|does not exist|Could not find the table|PGRST205/i.test(m))
    return 'Tabel pengguna belum ada di server — jalankan reset-total.sql';
  if(/401|403|JWT|apikey|permission|policy|42501/i.test(m))
    return 'Ditolak server — periksa anon key atau izin tabel';
  if(/400|column|PGRST204/i.test(m))
    return 'Kolom tabel belum sesuai — jalankan reset-total.sql';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))
    return 'Tidak ada koneksi ke server';
  return 'Gagal menyimpan: ' + m.slice(0, 70);
}
function tentukanTahap(){
  if(!sbOn()) return 'server';
  if(!owner() || !owner().pin) return 'buat';
  return 'masuk';
}

function drawLock(pesan, err){
  const n = $('#lock'); n.className = '';
  if(tahap === 'server') return n.innerHTML = layarServer(pesan, err);
  const buat = tahap === 'buat' || tahap === 'ulang';
  const nmT = targetPin ? targetPin.nama : 'Pemilik';
  const judul = tahap === 'ulang' ? 'Ulangi PIN'
    : buat ? ((owner() && owner().pin) ? 'PIN baru ' + nmT : 'Buat PIN Pemilik')
    : DB.usaha.nama;
  const sub = pesan != null ? pesan
    : tahap === 'ulang' ? 'Masukkan sekali lagi untuk memastikan'
    : buat ? 'Pilih ' + PIN_MIN + '–' + PIN_MAX + ' angka, lalu tekan Lanjut'
    : 'Masukkan PIN untuk masuk';
  const jml = Math.max(PIN_MIN, pinBuf.length);
  const siap = pinBuf.length >= PIN_MIN;
  n.innerHTML = `
    <span class="lg"><i></i><i></i><i></i><i></i></span>
    <h1>${esc(judul)}</h1><p>${esc(sub)}</p>
    <div class="dots${err?' err':''}">${Array.from({length:jml},(_,i)=>`<i class="${pinBuf.length>i?'f':''}"></i>`).join('')}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(x=>`<button data-pin="${x}">${x}</button>`).join('')}
      <button class="x" data-pin="c">Hapus</button><button data-pin="0">0</button>
      ${buat ? `<button class="x" data-pin="ok" style="${siap?'color:#fff;font-weight:800':'opacity:.35'}">Lanjut</button>`
             : '<button class="x"></button>'}</div>
    ${buat ? `<button class="btn" style="margin-top:16px;background:rgba(255,255,255,.16);border:0;color:#fff"
        data-act="keserver">Ubah sambungan server</button>` : ''}
    <div class="who">${buat
      ? (targetPin && targetPin.peran !== 'owner'
          ? 'PIN untuk ' + esc(targetPin.nama)
          : 'PIN pemilik sebaiknya 6–8 angka')
      : DB.users.filter(u=>u.pin && u.aktif !== false)
          .map(u=>esc(u.nama) + (u.peran==='owner' ? ' (pemilik)' : '')).join(' · ')}</div>`;
}

function layarServer(pesan, err){
  const sv = DB.server || {url:'', key:''};
  return `
    <span class="lg"><i></i><i></i><i></i><i></i></span>
    <h1>Sambungkan Perangkat</h1>
    <p>${esc(pesan || 'Isi alamat server agar HP ini memakai data yang sama')}</p>
    <div style="width:100%;max-width:380px;margin-top:18px;text-align:left">
      <label style="color:#FBD4D9">Project URL</label>
      <input id="lkUrl" value="${esc(sv.url)}" placeholder="https://xxxxx.supabase.co" autocomplete="off">
      <label style="color:#FBD4D9">Anon public key</label>
      <textarea id="lkKey" rows="3" placeholder="eyJhbGciOi...">${esc(sv.key)}</textarea>
      <div id="lkInfo" style="font-size:12px;color:#FBD4D9;margin-top:8px;min-height:16px"></div>
      <button class="btn w" style="margin-top:12px;background:#fff;color:var(--merah);border:0;font-weight:800"
        data-act="lksambung">Sambungkan</button>
    </div>
    <div class="who">Diisi oleh pemilik. Setelah tersambung, cukup PIN saja tiap membuka.</div>`;

async function pinTekan(v){
  if(sibuk) return;
  if(v === 'c'){ pinBuf = pinBuf.slice(0,-1); return drawLock(); }
  if(v === 'ok'){ if(pinBuf.length >= PIN_MIN) await pinLanjut(); return; }
  if(pinBuf.length >= PIN_MAX) return;
  pinBuf += v;
  drawLock();
  if(tahap === 'masuk' && pinBuf.length >= PIN_MIN){
    sibuk = true;
    const h = await sandiPin(pinBuf);
    sibuk = false;
    const u = DB.users.find(x=>x.pin === h && x.aktif !== false);
    if(u){ pinBuf = ''; return buka(u); }
    if(pinBuf.length >= PIN_MAX){ pinBuf = ''; drawLock('PIN salah, coba lagi', true); }
  }
}

async function pinLanjut(){
  try{ await pinLanjut2(); }
  catch(e){
    sibuk = false; pinBuf = ''; pinTmp = ''; tahap = 'buat';
    console.error(e);
    drawLock('Gagal: ' + String(e && e.message || e).slice(0,60) + ' — coba lagi', true);
  }
}
async function pinLanjut2(){
  if(tahap === 'buat'){ pinTmp = pinBuf; pinBuf = ''; tahap = 'ulang'; return drawLock(); }
  if(tahap === 'ulang'){
    if(pinBuf !== pinTmp){ pinBuf = ''; pinTmp = ''; tahap = 'buat'; return drawLock('PIN tidak sama, ulangi', true); }
    sibuk = true;
    const h = await sandiPin(pinBuf);
    pinBuf = ''; pinTmp = '';
    const o = owner();
    const tgt = targetPin || o || {id:uid('U'), nama:'Pemilik', peran:'owner', aktif:true};
    const pinLama = tgt.pin;
    tgt.pin = h;
    const baru = !DB.users.find(u=>u.id === tgt.id);
    if(baru) DB.users.push(tgt);
    save();
    catat(baru ? 'tambah' : 'edit', 'pengguna', tgt.id, tgt.nama,
      pinLama ? 'PIN lama' : '', 'PIN ' + (baru ? 'dibuat' : 'diganti') + ' oleh ' + (me ? me.nama : tgt.nama));
    try{ await sbUserSimpan(tgt); }
    catch(e){
      tgt.pin = null; save();
      sibuk = false; tahap = 'buat'; targetPin = tgt;
      return drawLock(alasanGagal(e), true);
    }
    sibuk = false;
    const kembali = targetPin && targetPin.peran !== 'owner' ? owner() : tgt;
    targetPin = null; tahap = 'masuk';
    buka(kembali);
    toast('PIN ' + tgt.nama + ' tersimpan');
  }
}

/* ================= KEHADIRAN — "sedang buka aplikasi" =================
   Beda dengan Pantau (yang menunjukkan kapan seseorang TERAKHIR mencatat
   sesuatu), ini menunjukkan apakah aplikasinya SEDANG terbuka sekarang.

   Caranya: selagi orang login dan layarnya menyala, aplikasi mengirim
   "tanda hidup" tiap 25 detik. Kalau tandanya masih baru (kurang dari
   75 detik), dianggap sedang online. Tanda ini otomatis berhenti sendiri
   saat layar disembunyikan — dicek ulang tiap kali mau mengirim, bukan
   dengan menyalakan/mematikan pengatur waktunya, supaya lebih sederhana. */
const HEARTBEAT_DETIK = 25;
const ONLINE_AMBANG_DETIK = 75;
let heartbeatT = null;

function kirimHeartbeat(sesiBaru){
  if(!me || !sbOn() || document.hidden) return;
  const now = new Date().toISOString();
  const baris = {nama: me.nama, terakhir_aktif: now};
  if(sesiBaru) baris.login_pada = now;
  sbSimpan('kehadiran', [baris]);
}
function mulaiHeartbeat(){
  clearInterval(heartbeatT);
  kirimHeartbeat(true);
  heartbeatT = setInterval(()=>kirimHeartbeat(false), HEARTBEAT_DETIK * 1000);
}
function berhentiHeartbeat(){
  clearInterval(heartbeatT); heartbeatT = null;
}

/* Menarik status kehadiran terbaru dari server. Dipakai layar Pantau
   sebelum digambar, bukan lewat sbTarik utama, supaya bisa disegarkan
   sendiri tiap beberapa detik tanpa menarik seluruh data usaha. */
async function tarikKehadiran(){
  if(!sbOn()) return;
  try{
    const r = await sbReq('kehadiran?select=*');
    if(Array.isArray(r)) DB.kehadiran = r;
  }catch(e){ /* diam — layar tetap tampil dengan data yang ada */ }
}
function statusOnline(nama){
  const k = (DB.kehadiran||[]).find(x=>x.nama === nama);
  if(!k || !k.terakhir_aktif) return {online:false};
  const detik = (Date.now() - new Date(k.terakhir_aktif)) / 1000;
  if(detik > ONLINE_AMBANG_DETIK) return {online:false, terakhir:k.terakhir_aktif};
  return {online:true, sejak:k.login_pada || k.terakhir_aktif};
}

function buka(u){
  me = u; pinBuf = ''; tahap = 'masuk'; targetPin = null;
  mulaiSesi();
  catat('masuk', 'sesi', u.id, u.nama + ' masuk', '', DB.perangkat || '-');
  if(!can(view)) view = 'beranda';
  $('#lock').className = 'hide';
  render(); tandaServer();
  if(sbOn()){ sinkron(true); mulaiSinkron(); mulaiHeartbeat();
    chatTarik().then(()=>tandaChat()).catch(()=>{}); }
}
function kunci(){
  me = null; pinBuf = ''; pinTmp = ''; targetPin = null;
  clearInterval(sinkronT); closeSheet(); berhentiHeartbeat();
  if('clearAppBadge' in navigator) navigator.clearAppBadge().catch(()=>{});
  tahap = tentukanTahap(); drawLock();
}
function mintaPinBaru(u){
  targetPin = u; pinBuf = ''; pinTmp = ''; me = null;
  closeSheet(); tahap = 'buat'; drawLock();
}
document.addEventListener('click', e=>{ const b = e.target.closest('[data-pin]'); if(b) pinTekan(b.dataset.pin); });

let sinkronT = null, sinkronJalan = false;
let ketikTerakhir = 0;
document.addEventListener('input', ()=>{ ketikTerakhir = Date.now(); }, true);
function bolehSinkron(){
  if(!me || !sbOn() || document.hidden || sinkronJalan) return false;
  if($('#modal').innerHTML) return false;                       // sedang mengisi kotak dialog
  const a = document.activeElement;
  const isi = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
  if(isi && Date.now() - ketikTerakhir < 4000) return false;     // beri jeda saat sedang mengetik
  return true;
}
async function sinkron(diam){
  if(!sbOn() || sinkronJalan) return;
  sinkronJalan = true;
  try{
    await kirimAntre();
    await sbTarik();
    try{ sidik = await sbSidik(); }catch(e){}
    if(me && !DB.users.find(u=>u.id === me.id && u.aktif !== false)) return kunci();  // akses dicabut
    if(me) me = DB.users.find(u=>u.id === me.id) || me;
    render(); tandaServer();
    if(!diam) toast('Data diperbarui');
  }catch(e){ if(!diam) toast('Gagal menyambung server'); }
  finally{ sinkronJalan = false; }
}
let hitungIntip = 0;
async function intip(){
  if(!bolehSinkron()) return;
  hitungIntip++;
  /* Pesan ditarik tiap putaran saat layar chat terbuka (3 detik), dan tiap
     putaran kelima (15 detik) saat sedang di layar lain — cukup untuk
     memunculkan tanda pesan baru tanpa memberatkan. */
  chatTarikT++;
  if(view === 'chat' || chatTarikT % 5 === 0){
    try{
      const ada = await chatTarik();
      if(ada && view === 'chat'){
        const g = document.getElementById('chatGulung');
        const bawah = !g || (g.scrollHeight - g.scrollTop - g.clientHeight) < 60;
        renderBody(true); muatFotoChat();
        if(bawah) geserBawah();
        tandaiTerbaca();
      }
    }catch(e){}
  }
  try{
    const s2 = await sbSidik();
    if(sidik === null){ sidik = s2; return; }
    if(s2 !== sidik){ sidik = s2; await sinkron(true); return; }
  }catch(e){ return; }
  if(hitungIntip % 100 === 0) sinkron(true);   // penarikan penuh cadangan tiap ~5 menit
  if((DB.antre||[]).length) kirimAntre();
}
function mulaiSinkron(){ clearInterval(sinkronT); sinkronT = setInterval(intip, 3000); }

let sembunyi = 0;
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) sembunyi = Date.now();
  else if(me && sembunyi && Date.now()-sembunyi > 5*60*1000) kunci();
  else if(me && !document.hidden && sbOn()){ sinkron(true); kirimHeartbeat(false); }
});

/* ================= RENDER ================= */
const VIEWS = {beranda:vBeranda, tagihan:vTagihan, harini:vHariIni, pelanggan:vPelanggan, laporan:vLaporan,
  menu:vMenu, biaya:vBiaya, tiket:vTiket, setelan:vSetelan, users:vUsers, server:vServer, riwayat:vLog, presensi:vPresensi, chat:vChat, titip:vTitip};
function periksaLogServer(){
  const n = $('#logSrv'); if(!n || !sbOn()) return;
  if((DB.antre||[]).filter(x=>x.t==='log').length) return;
  jumlahLogServer()
    .then(j=>{ const el2 = $('#logSrv'); if(el2) el2.innerHTML =
      '<span style="color:var(--lunas)">✓ ' + j + ' catatan tersimpan permanen di server</span>'; })
    .catch(()=>{ const el2 = $('#logSrv'); if(el2) el2.textContent = 'Jumlah di server belum terbaca'; });
}
function backBar(){
  const lbl = {beranda:'Beranda', menu:'Menu', tagihan:'Tagihan', harini:'Hari ini',
    pelanggan:'Pelanggan', laporan:'Laporan'}[viewSebelum] || 'Menu';
  return `<button class="backbar" data-go="${viewSebelum}">‹ Kembali${lbl? ' ke '+esc(lbl):''}</button>`;
}
function renderBody(keepFocus){
  const a = document.activeElement, id = a? a.id : null, pos = a && a.setSelectionRange? a.selectionStart : null;
  $('#app').innerHTML = (SUBVIEWS.includes(view)? backBar() : '') + (VIEWS[view]||vBeranda)();
  if(view === 'riwayat') periksaLogServer();
  if(view === 'chat'){ muatFotoChat(); tandaChat(); }
  if(keepFocus && id){ const n = document.getElementById(id);
    if(n){ n.focus(); if(pos!=null && n.setSelectionRange) try{ n.setSelectionRange(pos,pos); }catch(e){} } }
}
function render(){
  if(!me) return drawLock();
  if(!can(view)) view = 'beranda';
  $('#meLbl').textContent = me.nama + (me.peran==='owner' ? ' · Pemilik' : ' · Tim');
  $('#bnama').firstChild.nodeValue = DB.usaha.nama;
  $('#bsub').textContent = {beranda:'Ringkasan usaha', tagihan:'Tagihan bulan berjalan', pelanggan:'Daftar pelanggan',
    harini:'Setoran hari ini', laporan:'Keuangan & laporan', menu:'Alat & pengaturan', users:'Tim & PIN', server:'Sambungan server', riwayat:'Riwayat aktivitas', biaya:'Pengeluaran', tiket:'Gangguan', setelan:'Pengaturan', presensi:'Absen masuk & pulang', chat:'Grup tim', titip:'Titip jual & konsinyasi'}[view] || '';
  $('#pLbl').firstChild.nodeValue = pLbl(per);
  $('#pSub').textContent = (per===curPer()? 'bulan berjalan · ' : '') + 'periode ' + (ALLPER.indexOf(per)+1) + ' dari 6';
  drawNav(); renderBody(); tandaChat();
}
$('#btnLock').onclick = kunci;
$('#svr').onclick = ()=>{ if(!sbOn()) return toast('Belum tersambung ke server'); toast('Menyegarkan…'); sinkron(false); };
$('#pPrev').onclick = ()=>{ if(per>P0){ per = pAdd(per,-1); render(); } else toast('Periode mulai '+pLbl(P0)); };
$('#pNext').onclick = ()=>{ if(per<PZ){ per = pAdd(per,1); render(); } else toast('Periode terakhir '+pLbl(PZ)); };

/* ---- pasang sebagai aplikasi ---- */
let tawaranPasang = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); tawaranPasang = e; });
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

(async function init(){
  DB = await load() || fresh();
  if(!DB.tiket) DB.tiket = [];
  DB = lengkapi(DB);
  per = curPer() < P0 ? P0 : (curPer() > PZ ? PZ : curPer());
  tandaServer();
  if(sbOn()){ try{ await sbUsersTarik(); }catch(e){} }
  tahap = tentukanTahap();
  drawLock();
})();

</script>
</body>
</html>
