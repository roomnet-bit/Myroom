/* ================= TIKET GANGGUAN ================= */
function vTiket(){
  const buka = DB.tiket.filter(t=>t.status!=='selesai');
  const tutup = DB.tiket.filter(t=>t.status==='selesai').sort((a,b)=>(b.selesai||b.tgl).localeCompare(a.selesai||a.tgl)).slice(0,20);
  const nm = id => (byId(id)||{nama:'Umum'}).nama;
  /* Baris daftar memuat jam ketiga tahap sekaligus: masuk, mulai ditangani,
     dan selesai — supaya tidak perlu membuka satu per satu untuk tahu mana
     laporan yang tergeletak lama sebelum disentuh. */
  const item = t => `<div class="row" data-tiket="${t.id}">
    <div class="nm"><b>${esc(nm(t.pelId))}${centang('tiket', t.id)}</b><span>${esc(t.masalah)} · ${tglId(t.tgl)}${t.pelapor? ' · lapor: '+esc(t.pelapor):''}${
      t.status==='selesai' && t.penangan? ' · oleh '+esc(t.penangan)
      : t.status==='proses' && t.penangan? ' · <b style="color:var(--belum)">🔧 dikerjakan '+esc(t.penangan)+'</b>' : ''}
      <br>📞 ${esc(jamSaja(t.tgl))} · 🔧 ${t.ditangani? esc(jamSaja(t.ditangani)) : t.status==='selesai'? '<span style="color:var(--ink2)">—</span>' : '<span style="color:var(--alert)">belum</span>'} · ✅ ${
        t.selesai? esc(jamSaja(t.selesai)) : '<span style="color:var(--belum)">belum</span>'}</span></div>
    <div class="amt" style="font-size:12px">${t.status==='selesai'
      ? '<em class="l">'+esc(lamaTangani(t))+'</em>'
      : t.status==='proses'? '<em class="t" style="background:var(--belum-l);color:var(--belum)">'+esc(lamaTangani(t))+'</em>'
      : '<em class="t">'+esc(lamaTangani(t))+'</em>'}</div></div>`;
  const proses = buka.filter(t=>t.status==='proses');
  return `

/* ================= YANG BAYAR HARI INI ================= */
function vHariIni(){
  const rt = rentangSetoran();
  const list = setoranTampil(rt);
  const tot = list.reduce((a,x)=>a+x.j,0);
  const cara = {}; list.forEach(x=>cara[x.c]=(cara[x.c]||0)+x.j);
  /* Siapa yang nyisir: uang dikelompokkan per penerima setoran, lengkap
     dengan jumlah pembayaran dan jam catatan terakhirnya — supaya terlihat
     siapa yang masih jalan dan berapa yang sudah dia pegang. */
  const sisir = {};
  list.forEach(x=>{ const k = x.u || '-';
    const o = sisir[k] = sisir[k] || {n:0, j:0, t:''};
    o.n++; o.j += x.j; if(!o.t || String(x.t) > o.t) o.t = x.t; });
  const penyisir = Object.entries(sisir).sort((a,b)=>b[1].j - a[1].j);
  /* Pembayaran lama hasil impor tidak punya catatan jam, jadi tidak bisa
     dimasukkan ke rentang mana pun. Daripada hilang tanpa penjelasan,
     jumlahnya diberitahukan saat rentang yang dipilih menyentuh bulannya. */
  let tanpaJamN = 0, tanpaJamRp = 0;
  if(rt.hari > 1){
    const blnAwal = rt.dari.getFullYear() + '-' + String(rt.dari.getMonth()+1).padStart(2,'0');
    const blnAkhir = rt.sampai.getFullYear() + '-' + String(rt.sampai.getMonth()+1).padStart(2,'0');
    Object.keys(DB.bayar).forEach(k=>{
      const v = DB.bayar[k], pr = k.split('|')[1];
      if(waktuSah(v.t)) return;
      if(pr < blnAwal || pr > blnAkhir) return;
      if(!can('uang') && (v.u||'-') !== me.nama) return;
      tanpaJamN++; tanpaJamRp += (v.j||0);
    });
  }
  const tgl = today();
  /* Jatuh tempo mengikuti rentang juga: untuk satu hari dipakai tanggal itu,
     untuk rentang dipakai semua tanggal di dalamnya. Rentang setahun terlalu
     lebar untuk daftar ini, jadi kartunya disembunyikan. */
  const perR = (()=>{ const p2 = rt.sampai.getFullYear() + '-' + String(rt.sampai.getMonth()+1).padStart(2,'0');
    return p2 < P0 ? P0 : (p2 > PZ ? PZ : p2); })();
  const tglRentang = new Set();
  if(rt.hari <= 31){ const d = new Date(rt.dari);
    while(d <= rt.sampai && tglRentang.size <= 31){ tglRentang.add(d.getDate()); d.setDate(d.getDate()+1); } }
  const jatuh = tglRentang.size
    ? pel().filter(p=>ditagihPada(p, perR) && tglRentang.has(p.tempo) && statusOf(p, perR)!=='lunas') : [];
  const r = ringkas(per);
  const PILIH = [['hari','Hari ini'],['kemarin','Kemarin'],['minggu','Minggu ini'],
                 ['tanggal','Pilih tanggal'],['bulan','Pilih bulan'],['tahun','Pilih tahun']];
  return `
  <div class="chips">${PILIH.map(([k,l])=>
    `<button class="chip ${fSetor.mode===k?'on':''}" data-setor="${k}">${l}</button>`).join('')}</div>
  ${fSetor.mode==='tanggal'? `<div class="tools" style="margin-top:8px">
      <input type="date" id="sPilihTgl" value="${esc(fSetor.tgl||tglKunci())}" max="${esc(tglKunci())}"></div>`:''}
  ${fSetor.mode==='bulan'? `<div class="tools" style="margin-top:8px">
      <input type="month" id="sPilihBln" value="${esc(fSetor.bln||tglKunci().slice(0,7))}" max="${esc(tglKunci().slice(0,7))}"></div>`:''}
  ${fSetor.mode==='tahun'? `<div class="tools" style="margin-top:8px">
      <select id="sPilihThn">${tahunTersedia().map(y=>
        `<option value="${y}"${String(y)===String(fSetor.thn||today().getFullYear())?' selected':''}>${y}</option>`).join('')}</select></div>`:''}

  <div class="card">
    <h3>Setoran ${esc(rt.label)}</h3>
    <div class="meter">
      <div><div class="big" style="color:var(--lunas)">${rp(tot)}</div>
        <div class="cap">${list.length} pembayaran diterima${list.length?' · rata-rata '+rpk(tot/list.length):''}${
          rt.hari>1 && list.length? ' · '+rpk(tot/rt.hari)+'/hari':''}</div></div>
    </div>
    ${Object.keys(cara).length? `<div class="grid3" style="margin-top:12px">${Object.entries(cara).map(([k,v])=>
      `<div class="kpi"><div class="lbl">${esc(k)}</div><div class="val" style="font-size:15px">${rpk(v)}</div></div>`).join('')}</div>`:''}
    <div class="fr" style="margin-top:12px">
      <button class="btn sm" data-act="rekaphari">💬 Kirim rekap</button>
      <button class="btn sm" data-act="csvhari">📄 Unduh CSV</button>
    </div>
  </div>

  ${tanpaJamN? `<div class="card" style="background:var(--belum-l);border-color:#EBD9B4">
    <b>${tanpaJamN} pembayaran tidak punya catatan jam</b>
    <div style="font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.55">
      Totalnya ${rp(tanpaJamRp)}, dari bulan yang sama dengan rentang ini. Data lama hasil impor —
      jamnya tidak pernah tercatat, jadi tidak bisa dimasukkan ke rekap harian.
      Angkanya tetap utuh di Laporan dan di tagihan pelanggan.</div></div>`:''}
  ${penyisir.length? `<div class="card"><h3>Siapa yang nyisir</h3>
    <table><tbody>
      ${penyisir.map(([nm,o])=>`<tr>
        <td>${esc(nm)}<div style="font-size:11.5px;color:var(--ink2);margin-top:2px">${o.n} pembayaran · terakhir ${
          rt.hari>1? tglPendek(new Date(o.t))+' ' : ''}${jamSaja(o.t)}</div></td>
        <td class="n" style="color:var(--lunas)">${rp(o.j)}</td></tr>`).join('')}
      <tr class="tot"><td>Total uang sisiran</td><td class="n">${rp(tot)}</td></tr>
    </tbody></table>
  </div>`:''}

  <div class="card"><h3>Rincian pembayaran</h3>
    ${list.length? list.map(x=>`<div class="row" data-pel="${x.p.id}" data-per="${x.pr}">
      <button class="tick on" data-tick="${x.p.id}">✓</button>
      <div class="nm"><b>${esc(x.p.nama)}${centang('pembayaran', x.p.id+'_'+x.pr)}</b><span>${esc(x.p.area)} · ${esc(x.u||'-')} · ${esc(x.c)} · ${rt.hari>1? tglAman(x.t)+' ':''}${jamAman(x.t)}<br>Untuk bulan ${esc(pLbl(x.pr))}</span></div>
      <div class="amt">${rp(x.j)}<em class="l">${x.j>=tarifPada(x.p, x.pr)?'Lunas':'Sebagian'}</em></div></div>`).join('')
      : '<div class="empty"><b>Belum ada pembayaran</b>Tidak ada setoran tercatat pada rentang ini.</div>'}
  </div>

  ${tglRentang.size? `<div class="card"><h3>Jatuh tempo ${
      rt.hari>1 ? 'dalam rentang ini' : (fSetor.mode==='hari' ? 'hari ini' : 'tanggal '+rt.dari.getDate())
    } · belum bayar</h3>
    ${jatuh.length? jatuh.map(rowTagih).join('')
      : '<div class="empty">Tidak ada yang jatuh tempo ' + (rt.hari>1? 'pada rentang ini' : 'tanggal '+rt.dari.getDate()) + '.</div>'}
  </div>`:''}

  ${can('uang')? `<div class="card" style="text-align:center">
    <div style="font-size:12px;color:var(--ink2)">Sisa tagihan ${esc(pLbl(per))}</div>
    <div class="val" style="font-family:var(--num);font-size:22px;font-weight:800;color:var(--belum)">${rp(r.sisa)}</div>
    <button class="btn w sm" style="margin-top:10px" data-go="tagihan">Buka daftar tagihan</button>
  </div>`:''}<div style="height:8px"></div>`;
}

/* ================= ANALISIS GANGGUAN WIFI ================= */

/* ================= TITIP VOUCHER HOTSPOT =================
   Konsinyasi voucher hotspot ke toko mitra: titip -> nyisir (retur +
   bagi hasil otomatis) -> kwitansi -> dashboard per toko. Jual langsung
   di kasir memakai stok yang sama tanpa proses titip-retur.
   Piutang toko TIDAK ikut ter-reset oleh Tutup Buku — itu murni
   mengarsipkan ringkasan periode & menggeser titik hitung dashboard;
   uang yang belum disetor tetap tercatat sampai benar-benar dibayar. */
const V_BATAS_LAMA = 5;     // hari — sesi titip yang belum disisir dianggap lama

/* ---- konversi baris lokal <-> kolom tabel Supabase ---- */
function keVJenis(v){ return {id:v.id, nominal:v.nominal, aktif:v.aktif!==false, dibuat:v.dibuat||new Date().toISOString()}; }
function keVToko(v){ return {id:v.id, nama_toko:v.nama, alamat:v.alamat||null, no_wa:v.wa||null,
  persen_toko:v.persen!=null? v.persen : 20, aktif:v.aktif!==false, dibuat:v.dibuat||new Date().toISOString(),
  tutup_buku_pada:v.tutupPada||null, tutup_buku_oleh:v.tutupOleh||null}; }
function keVSesi(v){ return {id:v.id, toko_id:v.tokoId, tanggal_titip:v.tglTitip, tanggal_setor:v.tglSetor||null,
  status:v.status, karyawan_titip_id:v.olehTitipId||null, karyawan_titip:v.olehTitip||null,
  karyawan_setor_id:v.olehSetorId||null, karyawan_setor:v.olehSetor||null, catatan:v.catatan||null,
  wa_terkirim:!!v.waTerkirim, jumlah_disetor:v.disetor||0, no_kwitansi:v.noKwitansi||null,
  hutang_dipotong:v.hutangDipotong||0}; }
function keVDetail(v){ return {id:v.id, sesi_id:v.sesiId, jenis_id:v.jenisId, nominal:v.nominal,
  jumlah_titip:v.titip||0, jumlah_retur:v.retur||0, jumlah_laku:v.laku||0, subtotal:v.subtotal||0,
  bagian_toko:v.bagianToko||0, bagian_myroom:v.bagianMyroom||0}; }
function keVJual(v){ return {id:v.id, jenis_id:v.jenisId, jumlah:v.jumlah, karyawan_id:v.olehId||null,
  karyawan:v.oleh||null, total:v.total, waktu:v.tgl, no_kwitansi:v.noKwitansi||null}; }
function keVTutup(v){ return {id:v.id, toko_id:v.tokoId, nama_toko:v.namaToko, dari_tanggal:v.dari||null,
  sampai_tanggal:v.sampai, total_laku:v.totalLaku, total_bagian_toko:v.totalToko,
  total_bagian_myroom:v.totalMyroom, oleh:v.oleh, waktu:v.tgl}; }
/* ---- hutang belanja toko (listrik, dsb.) — terpisah dari piutang jualan
   voucher, tapi otomatis dipotong dari BAGIAN TOKO tiap kali nyisir sampai
   lunas (lihat simpanVoucherNyisir). `sisa` berkurang tiap kali kepotong;
   `jumlah` tetap sebagai catatan nilai aslinya. */
function keVHutang(v){ return {id:v.id, toko_id:v.tokoId, keterangan:v.keterangan||'',
  jumlah:v.jumlah||0, sisa:v.sisa||0, tanggal:v.tgl||null, oleh:v.oleh||''}; }
function keVHutangL(r){ return {id:r.id, tokoId:r.toko_id, keterangan:r.keterangan||'',
  jumlah:+r.jumlah||0, sisa:+r.sisa||0, tgl:r.tanggal||'', oleh:r.oleh||''}; }
const vHutangListToko = tokoId => (DB.vHutang||[]).filter(h=>h.tokoId===tokoId && h.sisa>0).sort((a,b)=>(a.tgl||'').localeCompare(b.tgl||''));
const vHutangSisaToko = tokoId => vHutangListToko(tokoId).reduce((s,h)=>s+h.sisa,0);

/* ---- turunan & aturan bisnis ---- */
const vJenisAktif = () => (DB.vJenis||[]).filter(j=>j.aktif!==false).sort((a,b)=>a.nominal-b.nominal);
const vJenisById = id => (DB.vJenis||[]).find(j=>j.id===id);
const vTokoById = id => (DB.vToko||[]).find(t2=>t2.id===id);
const vTokoAktif = () => (DB.vToko||[]).filter(t2=>t2.aktif!==false).sort((a,b)=>a.nama.localeCompare(b.nama));
const vSesiDetailOf = sesiId => (DB.vDetail||[]).filter(d2=>d2.sesiId===sesiId);
const vTitipQtySesi = sesiId => vSesiDetailOf(sesiId).reduce((s2,d2)=>s2+(d2.titip||0),0);
const vLakuQtySesi  = sesiId => vSesiDetailOf(sesiId).reduce((s2,d2)=>s2+(d2.laku||0),0);
const vSesiBuka = tokoId => (DB.vSesi||[]).filter(s2=>s2.tokoId===tokoId && s2.status==='berjalan');
const vHariBerjalan = s2 => Math.max(0, Math.floor((Date.now() - new Date(s2.tglTitip).getTime())/86400000));
function vNoKwitansiBaru(){
  let max = 0;
  for(const s2 of (DB.vSesi||[])){ const m=/^VCH-(\d+)$/.exec(s2.noKwitansi||''); if(m) max=Math.max(max,+m[1]); }
  for(const j of (DB.vJual||[])){ const m=/^VCH-(\d+)$/.exec(j.noKwitansi||''); if(m) max=Math.max(max,+m[1]); }
  return 'VCH-' + String(max+1).padStart(4,'0');
}
const vBagianMyroomSesi = sesiId => vSesiDetailOf(sesiId).reduce((s2,d2)=>s2+d2.bagianMyroom,0);
const vBagianTokoSesi   = sesiId => vSesiDetailOf(sesiId).reduce((s2,d2)=>s2+d2.bagianToko,0);
const vLakuSesi         = sesiId => vSesiDetailOf(sesiId).reduce((s2,d2)=>s2+d2.subtotal,0);
const vPiutangSesi = s2 => s2.status==='disisir' ? Math.max(0, vBagianMyroomSesi(s2.id) + (s2.hutangDipotong||0) - (s2.disetor||0)) : 0;
const vPiutangToko = tokoId => (DB.vSesi||[]).filter(s2=>s2.tokoId===tokoId).reduce((sum,s2)=>sum+vPiutangSesi(s2), 0);
const vPiutangSemua = () => (DB.vToko||[]).reduce((sum,t2)=>sum+vPiutangToko(t2.id), 0);
/* ringkasan periode berjalan (sejak tutup buku terakhir) — piutang TIDAK dihitung di sini,
   lihat vPiutangToko yang berlaku sepanjang waktu sampai benar-benar lunas */
function vRingkasToko(tokoId){
  const t2 = vTokoById(tokoId); if(!t2) return {laku:0, toko:0, myroom:0, disetor:0, jumlahSesi:0};
  const cutoff = t2.tutupPada || '';
  const list = (DB.vSesi||[]).filter(s2=>s2.tokoId===tokoId && s2.status==='disisir' && (s2.tglSetor||'') > cutoff);
  let laku=0, toko=0, myroom=0, disetor=0;
  for(const s2 of list){ laku+=vLakuSesi(s2.id); toko+=vBagianTokoSesi(s2.id); myroom+=vBagianMyroomSesi(s2.id); disetor+=(s2.disetor||0); }
  return {laku, toko, myroom, disetor, jumlahSesi:list.length};
}
/* toko id -> berapa hari sesi titipnya yang paling lama belum disisir */
function vTokoTerlambat(){
  const map = {};
  for(const s2 of (DB.vSesi||[])){
    if(s2.status!=='berjalan') continue;
    const h = vHariBerjalan(s2);
    if(h < V_BATAS_LAMA) continue;
    if(!map[s2.tokoId] || h > map[s2.tokoId]) map[s2.tokoId] = h;
  }
  return map;
}

/* ---- rekap semua voucher per nominal: masuk, retur, laku toko, laku langsung ----
   dipakai laporan detail supaya kelihatan voucher apa saja yang masuk & terjual */
function vRekapNominalSemua(){
  const map = {};
  vJenisAktif().forEach(j=>{ map[j.id] = {nominal:j.nominal, masuk:0, retur:0, laku:0, jual:0, rupiah:0}; });
  (DB.vDetail||[]).forEach(d2=>{
    if(!map[d2.jenisId]) map[d2.jenisId] = {nominal:d2.nominal, masuk:0, retur:0, laku:0, jual:0, rupiah:0};
    const r = map[d2.jenisId];
    r.masuk += d2.titip||0; r.retur += d2.retur||0; r.laku += d2.laku||0; r.rupiah += d2.subtotal||0;
  });
  (DB.vJual||[]).forEach(x=>{
    if(!map[x.jenisId]){ const j2 = vJenisById(x.jenisId); map[x.jenisId] = {nominal:j2?j2.nominal:0, masuk:0, retur:0, laku:0, jual:0, rupiah:0}; }
    const r = map[x.jenisId];
    r.jual += x.jumlah||0; r.rupiah += x.total||0;
  });
  return Object.values(map).sort((a,b)=>a.nominal-b.nominal);
}

/* ---- teks kwitansi (dipakai untuk salin & kirim WA) ---- */
function teksVoucherKwitansi(kind, key){
  if(kind==='sesi'){
    const s2 = (DB.vSesi||[]).find(x=>x.id===key); if(!s2) return '';
    const t2 = vTokoById(s2.tokoId); if(!t2) return '';
    const detail = vSesiDetailOf(s2.id).filter(d2=>d2.laku>0);
    const piutang = vPiutangSesi(s2);
    let out = 'Kwitansi ' + (s2.noKwitansi||'-') + '\n' + DB.usaha.nama + '\nToko: ' + t2.nama
      + '\nTanggal: ' + tglId(s2.tglSetor) + '\n\n';
    detail.forEach(d2=>{ out += rpk(d2.nominal) + ' x ' + d2.laku + ' = ' + rp(d2.subtotal) + '\n'; });
    out += '\nTotal laku: ' + rp(vLakuSesi(s2.id)) + '\nBagian toko (' + t2.persen + '%): ' + rp(vBagianTokoSesi(s2.id))
      + '\nBagian MyRoom: ' + rp(vBagianMyroomSesi(s2.id)) + '\nDisetor: ' + rp(s2.disetor||0) + '\n';
    out += piutang>0 ? ('Bagian kite: ' + rp(piutang) + '\n') : 'Status: LUNAS\n';
    out += '\nTerima kasih 🙏';
    return out;
  }
  const list = (DB.vJual||[]).filter(x=>x.noKwitansi===key); if(!list.length) return '';
  let out = 'Kwitansi ' + key + '\n' + DB.usaha.nama + '\nTanggal: ' + tglId(list[0].tgl) + '\n\n';
  list.forEach(x=>{ const j=vJenisById(x.jenisId); out += rpk(j?j.nominal:0) + ' x ' + x.jumlah + ' = ' + rp(x.total) + '\n'; });
  out += '\nTotal: ' + rp(list.reduce((s2,x)=>s2+x.total,0)) + '\n\nTerima kasih 🙏';
  return out;
}

/* Ringkasan hidup di kotak Nyisir: ikut berubah tiap centang/retur diketik,
   supaya sebelum menekan Simpan sudah kelihatan berapa yang benar-benar
   diambil sekarang dan jenis apa yang ditinggal di toko. */
function hitungSisir(sesiId){
  const s2 = (DB.vSesi||[]).find(x=>x.id===sesiId); if(!s2) return;
  const t2 = vTokoById(s2.tokoId); if(!t2) return;
  const kotak = document.getElementById('vRingkasSisir'); if(!kotak) return;
  let laku = 0; const ditunda = []; let adaPilih = false;
  for(const d2 of vSesiDetailOf(sesiId)){
    const cb  = document.getElementById('vSisir_'+d2.id);
    const inp = document.getElementById('vRetur_'+d2.id);
    const baris = document.getElementById('vBaris_'+d2.id);
    const pilih = !cb || cb.checked;
    if(inp) inp.disabled = !pilih;
    if(baris) baris.style.opacity = pilih ? '1' : '.45';
    if(!pilih){ ditunda.push(rpk(d2.nominal) + ' (' + d2.titip + ' kode)'); continue; }
    adaPilih = true;
    const retur = Math.max(0, Math.min(d2.titip, Math.floor(+((inp && inp.value) || 0))));
    laku += (d2.titip - retur) * d2.nominal;
  }
  const bagianToko = Math.round(laku * (t2.persen/100));
  kotak.style.background = adaPilih ? 'var(--lunas-l)' : 'var(--belum-l)';
  kotak.innerHTML = (adaPilih
    ? '<b>Disisir sekarang: ' + rp(laku) + '</b><br>Bagian toko ' + t2.persen + '% — ' + rp(bagianToko)
      + '<br>Bagian MyRoom — ' + rp(laku - bagianToko)
    : '<b style="color:var(--belum)">Belum ada jenis yang dicentang.</b>')
    + (ditunda.length
      ? '<br><span style="color:var(--belum)">Ditinggal di toko: ' + esc(ditunda.join(', ')) + ' — sesi tetap berjalan.</span>'
      : (adaPilih ? '<br><span style="color:var(--ink2)">Semua jenis disisir — sesi ditutup.</span>' : ''));
}

  if(!can('uang')) list = list.filter(x=>x.oleh_id === me.id);      // karyawan: aktivitasnya sendiri
  if(fLog.aksi !== 'semua') list = list.filter(x=>x.aksi === fLog.aksi);
  if(fLog.oleh !== 'semua') list = list.filter(x=>x.oleh_id === fLog.oleh);

      <span style="display:block;opacity:.7">${esc(x.perangkat||'-')}</span></div>

let kamAliran = null, kamJenis = null;
function kamMatikan(){
  if(kamAliran){ try{ kamAliran.getTracks().forEach(t=>t.stop()); }catch(e){} kamAliran = null; }
}
/* Kamera dipakai dua keperluan: bukti absen dan kirim foto ke grup.
   kamUntuk menentukan apa yang dilakukan setelah dijepret; kamHadap
   menentukan kamera depan (swafoto) atau belakang (potret). */
let kamUntuk = 'absen', kamHadap = 'user';
/* true kalau sesi lembur yang sedang dibuka lewat kamera ini adalah lembur
   pra-shift (Pasal 5: dipencet di jendela 1 jam sebelum jadwal masuk, dan
   karyawan belum absen masuk sama sekali hari itu) — gajinya nanti dihitung
   flat lewat LEMBUR_PRA_SHIFT_RP_PER_JAM, bukan tarif lembur pribadi. */
let kamPraShift = false;

function sheetKamera(jenis, untuk, hadap){
  kamJenis = jenis;
  kamUntuk = untuk || 'absen';
  kamHadap = hadap || 'user';
  const keChat = kamUntuk === 'chat';
  const depan = kamHadap === 'user';
  const judul = keChat ? (depan ? 'Swafoto ke grup' : 'Potret ke grup')
    : kamUntuk === 'lembur' ? (jenis === 'masuk' ? 'Mulai Lembur' : 'Selesai Lembur')
    : (jenis === 'masuk' ? 'Absen Masuk' : 'Absen Pulang');
  sheet(`<h2>${judul}</h2>
    <div class="sub">${keChat ? 'Foto langsung terkirim ke Grup tim'
                              : 'Ambil swafoto sebagai bukti kehadiran'}</div>
    <div style="margin-top:12px;background:#000;border-radius:12px;overflow:hidden;position:relative;
      aspect-ratio:3/4;max-height:46vh;display:flex;align-items:center;justify-content:center">
      <video id="kamVid" autoplay playsinline muted
        style="width:100%;height:100%;object-fit:cover;${depan?'transform:scaleX(-1)':''}"></video>
      <canvas id="kamKanvas" style="display:none"></canvas>
    </div>
    <div id="kamPesan" style="font-size:12px;color:var(--ink2);margin-top:8px;text-align:center">Menyalakan kamera…</div>
    <div class="acts" style="margin-top:10px">
      <button class="btn p" id="kamJepret" data-act="kamjepret" disabled style="opacity:.5">📸 ${keChat?'Jepret &amp; Kirim':'Jepret &amp; Absen'}</button>
      <button class="btn" data-act="kambatal">Batal</button></div>
    <div class="fr" style="margin-top:8px">
      <input type="file" id="kamBerkas" accept="image/*"${depan?' capture="user"':''} style="display:none">
      ${keChat? `<button class="btn sm" data-act="kambalik">🔄 ${depan?'Kamera belakang':'Kamera depan'}</button>`:''}
      <button class="btn sm" data-act="kamberkas">Kamera bawaan HP</button></div>
    <div style="font-size:11.5px;color:var(--ink2);margin-top:10px">
      ${keChat ? 'Foto dikecilkan supaya hemat kuota. Di server foto terhapus sendiri setelah 2 hari, tapi salinannya tetap tersimpan di HP ini.'
               : 'Foto dikecilkan dulu supaya hemat kuota. Di server foto terhapus sendiri setelah 3 hari; jam absen dan lokasinya tetap tersimpan.'}
    </div>`);

  navigator.mediaDevices && navigator.mediaDevices.getUserMedia
    ? navigator.mediaDevices.getUserMedia({video:{facingMode:kamHadap, width:{ideal:640}}, audio:false})
        .then(s=>{
          kamAliran = s;
          const v = $('#kamVid'); if(!v){ kamMatikan(); return; }
          v.srcObject = s;
          const b = $('#kamJepret'); if(b){ b.disabled = false; b.style.opacity = '1'; }
          const p = $('#kamPesan');
          if(p) p.textContent = depan ? 'Hadapkan wajah ke kamera, lalu tekan Jepret'
                                      : 'Arahkan kamera, lalu tekan Jepret';
        })
        .catch(()=>{
          const p = $('#kamPesan');
          if(p) p.innerHTML = '<span style="color:var(--alert)">Kamera tidak bisa dibuka — pakai tombol “Kamera bawaan HP” di bawah</span>';
        })
    : (function(){ const p = $('#kamPesan');
        if(p) p.innerHTML = '<span style="color:var(--alert)">HP ini tidak mendukung kamera langsung — pakai “Kamera bawaan HP”</span>'; })();
}

/* menyimpan hasil absen: catatan jam, lokasi, dan fotonya.
   resmi=true berarti sesi ini dibuka lewat tombol "Mulai Lembur" (bukan
   Absen Masuk biasa) — seluruh durasinya nanti dihitung lembur langsung
   tanpa perlu direview, karena sudah ada foto di kedua ujungnya. */
async function simpanPresensi(jenis, foto, resmi){
  const lok = await ambilLokasi();
  const kini = new Date().toISOString();
  let a;
  if(jenis === 'masuk'){
    if(presensiTerbuka(me.id)){ toast('Sesi sebelumnya belum ditutup — absen pulang dulu'); return; }
    a = {id:uid('PR'), user_id:me.id, nama:me.nama, tanggal:tglKunci(), masuk:kini, pulang:null,
         lat_masuk:lok?lok.lat:null, lon_masuk:lok?lok.lon:null, akurasi_masuk:lok?lok.akurasi:null,
         lat_pulang:null, lon_pulang:null, akurasi_pulang:null, resmi_lembur:!!resmi,
         lembur_pra_shift: !!(resmi && kamPraShift), lembur_disetujui:false};
    kamPraShift = false;
    DB.presensi = DB.presensi || []; DB.presensi.push(a);
  }else{
    a = presensiTerbuka(me.id);
    if(!a){ toast('Belum ada sesi yang terbuka — absen masuk dulu'); return; }
    a.pulang = kini;
    if(lok){ a.lat_pulang = lok.lat; a.lon_pulang = lok.lon; a.akurasi_pulang = lok.akurasi; }
  }
  save();
  catat(jenis === 'masuk' ? 'tambah' : 'edit', 'presensi', a.id,
    me.nama + ' absen ' + (a.resmi_lembur? 'lembur ' : '') + jenis,
    '', jamSaja(kini) + (lok ? ' · lokasi tercatat' : ' · lokasi tidak terbaca'));

  if(foto) await fotoSimpan(a.id + '_' + jenis, foto);   // arsip pribadi di HP ini

  const baris = {id:a.id, user_id:a.user_id, nama:a.nama, tanggal:a.tanggal,
    masuk:a.masuk, pulang:a.pulang || null,
    lat_masuk:a.lat_masuk, lon_masuk:a.lon_masuk, akurasi_masuk:a.akurasi_masuk,
    lat_pulang:a.lat_pulang, lon_pulang:a.lon_pulang, akurasi_pulang:a.akurasi_pulang,
    resmi_lembur:!!a.resmi_lembur, lembur_pra_shift:!!a.lembur_pra_shift, lembur_disetujui:!!a.lembur_disetujui};
  if(foto) baris['foto_' + jenis] = foto;
  /* Foto sengaja tidak masuk antrean: antrean ikut tersimpan di localStorage
     yang kapasitasnya kecil. Bila gagal terkirim, catatan absennya tetap
     diantre — hanya fotonya yang dilewat. */
  const kirim = await sbSimpan('presensi', [baris], true).catch(()=>false);
  if(!kirim){ const tanpaFoto = Object.assign({}, baris); delete tanpaFoto['foto_' + jenis];
    antrekan({t:'presensi', a:'simpan', d:[tanpaFoto]}); }

  segeraSinkron(); closeSheet(); render();
  toast((a.resmi_lembur? 'Lembur ' : 'Absen ') + jenis + ' tercatat ' + jamSaja(kini) + (lok ? '' : ' (lokasi tidak terbaca)'));
}

/* rincian satu absen: foto (bila masih ada) dan titik lokasi */
async function sheetPresensi(id){
  const a = (DB.presensi||[]).find(x=>x.id === id);
  if(!a) return toast('Data absen tidak ditemukan');
  if(!can('uang') && a.user_id !== me.id) return toast('Hanya absen sendiri');
  const umur = Math.round((new Date(tglKunci()) - new Date(a.tanggal)) / 86400000);
  const peta = (lat, lon) => lat==null ? '' :
    `<a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank" rel="noopener"
       style="color:var(--merah);font-weight:600">Buka peta</a>`;
  const baris = (j, jam, lat, lon, ak) => `
    <div style="flex:1;min-width:0">
      <div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)">${j}</div>
      <div style="font-weight:700">${jam}</div>
      <div id="fo_${j}" style="margin-top:6px;background:var(--paper);border-radius:10px;
        aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;
        font-size:11px;color:var(--ink2);overflow:hidden">memuat…</div>
      <div style="font-size:11px;color:var(--ink2);margin-top:5px">
        ${lat!=null ? '📍 '+lat.toFixed(5)+', '+lon.toFixed(5)+(ak? ' (±'+ak+'m)':'')+'<br>'+peta(lat,lon)
                    : 'lokasi tidak tercatat'}</div>
    </div>`;
  const jarak = (a.lat_masuk!=null && a.lat_pulang!=null)
    ? jarakMeter(a.lat_masuk, a.lon_masuk, a.lat_pulang, a.lon_pulang) : null;

  sheet(`<h2>${esc(a.nama)}</h2>
    <div class="sub">${esc(tglId(a.tanggal))}${a.pulang? ' · lama '+selisihTeks(a.masuk, a.pulang):''}</div>
    <div class="fr" style="margin-top:12px;gap:12px">
      ${baris('masuk', jamSaja(a.masuk), a.lat_masuk, a.lon_masuk, a.akurasi_masuk)}
      ${a.pulang ? baris('pulang', jamSaja(a.pulang), a.lat_pulang, a.lon_pulang, a.akurasi_pulang)
                 : '<div style="flex:1;color:var(--ink2);font-size:12px;align-self:center">Belum absen pulang</div>'}
    </div>
    ${jarak!=null ? `<div style="font-size:12px;color:${jarak>500?'var(--belum)':'var(--ink2)'};margin-top:10px">
      Jarak titik masuk ke titik pulang: ${jarak} meter${jarak>500? ' — cukup jauh, perlu ditanyakan':''}</div>`:''}
    ${a.resmi_lembur ? (()=>{
      const st = lemburDitolak(a.id) ? 'ditolak' : (lemburPerluSetuju(a) ? 'menunggu' : 'disetujui');
      const warna = {ditolak:'var(--alert)', menunggu:'var(--belum)', disetujui:'var(--lunas)'}[st];
      const label = {ditolak:'❌ Lembur DITOLAK — tidak dibayar', menunggu:'⏳ Lembur menunggu persetujuan — belum dibayar', disetujui:'✅ Lembur disetujui — dibayar'}[st];
      return `<div style="margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--paper);font-size:12.5px">
        <b style="color:${warna}">🕒 ${label}</b>${a.lembur_pra_shift ? '<br><span style="color:var(--ink2)">Lembur pra-shift (sebelum jam masuk)</span>' : ''}
        ${can('uang') ? `<div class="fr" style="margin-top:8px">
          ${st !== 'disetujui' ? `<button class="btn sm p" data-act="setujuilembur" data-id="${a.id}">Setujui</button>` : ''}
          ${st !== 'ditolak' ? `<button class="btn sm d" data-act="tolaklembur" data-id="${a.id}">Tolak (tidak dibayar)</button>`
                             : `<button class="btn sm" data-act="pulihkanlembur" data-id="${a.id}">Batalkan penolakan</button>`}
          <button class="btn sm" data-act="editlembur" data-id="${a.id}">Edit jam</button>
        </div>` : ''}</div>`; })() : ''}
    <div style="font-size:11.5px;color:var(--ink2);margin-top:10px">
      ${umur > 3 ? 'Foto absen lebih dari 3 hari sudah terhapus otomatis dari server. Jam dan lokasi tetap tersimpan.'
                 : 'Foto tersimpan di server selama 3 hari, lalu terhapus sendiri.'}
    </div>
    <div class="acts" style="margin-top:10px"><button class="btn w" data-act="tutup">Tutup</button></div>`);

  /* foto diambil belakangan supaya layar tidak tertahan; utamakan salinan
     di HP sendiri, baru menoleh ke server */
  for(const j of ['masuk','pulang']){
    if(j === 'pulang' && !a.pulang) continue;
    const kotak = document.getElementById('fo_' + j);
    if(!kotak) continue;
    let img = await fotoAmbil(a.id + '_' + j);
    if(!img && sbOn() && umur <= 3){
      try{
        const r = await sbReq('presensi?select=foto_' + j + '&id=eq.' + encodeURIComponent(a.id));
        if(Array.isArray(r) && r[0]) img = r[0]['foto_' + j] || null;
      }catch(e){}
    }
    const k2 = document.getElementById('fo_' + j);
    if(!k2) return;
    k2.innerHTML = img
      ? `<img src="${img}" style="width:100%;height:100%;object-fit:cover">`
      : (umur > 3 ? 'foto sudah terhapus' : 'tidak ada foto');
  }
}

        lebih awal +0,10 poin, 11-20 menit +0,15 poin, lebih dari 20 menit tetap +0,15 (poinnya mentok
        di situ, tidak naik lagi).</p>
      <p style="margin:0 0 10px"><b>Jam kerja normal</b><br>
        Dihitung dari jam absen yang beririsan dengan jadwal, maksimal sebesar jam wajib per hari.</p>
      <p style="margin:0 0 10px"><b>Jadwal yang ada jeda istirahat</b><br>
        Cukup <b>1x Absen Masuk</b> (pagi) dan <b>1x Absen Pulang</b> (sore) — tidak perlu absen lagi pas
        jeda istirahat. Sesinya dibiarkan menyala terus melewati jam istirahat; jam istirahatnya otomatis
        tidak ikut dihitung/dibayar. Begitu 1 siklus masuk-pulang itu sudah beres hari itu, tombol Absen
        Masuk terkunci lagi sampai besok, supaya tidak salah kira harus absen lagi di jam istirahat.</p>
      <p style="margin:0 0 10px"><b>Tidak pernah absen masuk</b><br>
        Kalau sampai jam pulang jadwal karyawan belum sekali pun pencet Absen Masuk, hari itu dianggap
        tidak absen masuk${
          DB.usaha && DB.usaha.potongTelat
            ? ' dan gaji dipotong sebesar gaji satu hari (gaji pokok ÷ ' + HARI_KERJA + ')'
              + (me && +me.gaji > 0 ? ', punya Anda ' + rp(Math.round(tarifPotongJam(me) * jadwalUser(me).wajib)) : '') + '. '
              + 'Tidak dipotong bila hari itu libur, Hari libur usaha, atau sudah dicatat izin/sakit/cuti/alpa.'
            : ' — untuk sekarang hanya catatan, belum memotong gaji (bisa diaktifkan di Setelan).'
        } Absen Masuk otomatis terkunci setelahnya, tinggal tombol Mulai Lembur yang aktif (selama masih
        jam operasional).</p>
      <p style="margin:0 0 10px"><b>Lembur — hanya lewat tombol "Mulai Lembur"</b><br>
        Kerja di luar jadwal lewat cara biasa (bukan tombol Lembur) <b>tidak</b> dihitung lembur — kecuali
        pulang lewat jam jadwal: 25 menit pertama lewat dianggap kompensasi (beres-beres/tutup, tidak
        dihitung apa-apa), baru sisanya di atas 25 menit dihitung lembur murni. Selain celah itu, supaya
        terhitung &amp; terbayar penuh harus pakai tombol "🕒 Mulai Lembur" — wajib foto di awal &amp;
        akhir sesi. Kalau sesi lembur dibiarkan menyala sampai menembus ke jam kerja, bagian yang
        beririsan jadwal otomatis dihitung jam kerja biasa (bukan lembur) — hanya bagian di luar jadwal
        yang tetap lembur. Satu sesi lembur maksimal ${jamTeks(BATAS_LEMBUR_SESI_MENIT)} (berlaku di
        semua hari) — lewat itu, aplikasi akan menawarkan "Lanjut Lembur?" untuk tutup sesi ini &amp;
        langsung buka sesi baru tanpa terputus.</p>
      <p style="margin:0 0 10px"><b>Hari libur</b><br>
        Tidak terikat jam operasional — Lembur bisa dimulai kapan saja, 24 jam, dengan batas
        ${jamTeks(BATAS_LEMBUR_SESI_MENIT)} per sesi yang sama seperti di atas. Tombol Absen Masuk biasa
        <b>terkunci</b> di hari libur — karena kerja di hari libur cuma terhitung &amp; terbayar lewat
        tombol Mulai Lembur.</p>
      <p style="margin:0">
        <b>Lembur bareng gangguan (siaga)</b><br>
        Kalau saat sesi lembur ada gangguan yang ditangani &amp; sudah disahkan, jam lembur
        sesi itu dibayar ${Math.round(SIAGA_PENGALI*100)}% dari tarif lembur biasa — karena
        gangguannya sudah dihargai lewat poin &amp; bonus.</p>
    </div>
    <div class="acts" style="margin-top:16px"><button class="btn w" data-act="tutup">Tutup</button></div>`);
}

let fJam = {mode:'bulan', bulan:periodeSiklus(tglKunci()), tgl:tglKunci()};

function vPresensi(){
  const buka = presensiTerbuka(me.id);
  const sesiKini = presensiHariIni(me.id);
  const d = today();
  const J = jadwalUser(me, d.getDay());
  const rekapSaya = rekapHari(me, tglKunci(), sesiKini);

  const jadwalTeks = J.sesi.length
    ? J.sesi.map(x=>x.teks).join(' &amp; ') + ' · wajib ' + J.wajib + ' jam'

    ${sesiKini.length? `<div style="margin-bottom:10px">

        <div style="font-size:11px;color:var(--ink2)">lihat &rsaquo;</div></div>`).join('')}
      <div style="font-size:12px;margin-top:8px">Hari ini: <b>${jamTeks(rekapSaya.normal)}</b> kerja${rekapSaya.lembur? ' · <b style="color:var(--belum)">'+jamTeks(rekapSaya.lembur)+' lembur</b>':''}${rekapSaya.telat.length? ' · <span style="color:var(--alert)">terlambat '+rekapSaya.telat.map(t=>t.menit+' mnt').join(', ')+'</span>':''}${rekapSaya.lemburReview? ' · <span style="color:var(--alert)">'+jamTeks(rekapSaya.lemburReview)+' lembur menunggu persetujuan</span>':''}</div>
    </div>`:''}
    ${buka

               ? `<button class="btn w" style="margin-top:6px" data-act="lemburlanjut">🔁 Lanjut Lembur (sesi baru)</button>

          : `<button class="btn p w" data-act="presensipulang">🔴 Absen Pulang (sesi berjalan sejak ${jamSaja(buka.masuk)})</button>`)
      : (()=>{ const st = statusTombolPresensi(me, d.getDay(), rekapSaya.iniLibur, sesiKini);

      ${rk.menitLemburReview? `<tr><td style="color:var(--alert)">Menunggu persetujuan (belum termasuk)</td><td class="n" style="color:var(--alert)">${jamTeks(rk.menitLemburReview)}</td></tr>`:''}

      ${rk.belumTutup? `<tr><td>Lupa absen pulang</td><td class="n" style="color:var(--alert)">${rk.belumTutup}\u00d7</td></tr>`:''}
      ${rk.menitLemburSiaga? `<tr><td style="padding-left:10px;font-size:12px;color:var(--ink2)">&rsaquo; lembur tarif penuh</td>
        <td class="n" style="font-size:12px;color:var(--ink2)">${jamTeks(rk.menitLemburBiasa)}</td></tr>
        <tr><td style="padding-left:10px;font-size:12px;color:var(--ink2)">&rsaquo; lembur tarif siaga (bersamaan gangguan)</td>
        <td class="n" style="font-size:12px;color:var(--ink2)">${jamTeks(rk.menitLemburSiaga)}</td></tr>`:''}

  ${milikSaya.length ? milikSaya.slice(0,40).map(a=>`<div class="row" data-presensi="${a.id}" style="cursor:pointer">
    <div class="nm"><b>${esc(tglId(a.tanggal))}${a.resmi_lembur? ' · 🕒 Lembur':''}</b><span>Masuk ${jamSaja(a.masuk)}${a.pulang? ' · Pulang '+jamSaja(a.pulang)+' · '+selisihTeks(a.masuk,a.pulang) : ' · <span style="color:var(--alert)">belum absen pulang</span>'}${a.lat_masuk? ' · 📍':''}</span></div>
    <div style="font-size:11px;color:var(--ink2)">lihat &rsaquo;</div>
  </div>`).join('') : '<div class="empty"><b>Belum ada riwayat</b>Absen Anda akan muncul di sini.</div>'}
  </div><div style="height:8px"></div>`;

  if(!can('uang')) return kartuSaya + rekapSayaKartu + riwayatSaya;

  const tim = DB.users.filter(u=>u.aktif!==false);
  const kartuTim = `
  <div class="card"><h3>Absen tim hari ini</h3>
  ${tim.map(u=>{ const ss = presensiHariIni(u.id), bk = presensiTerbuka(u.id);
    const rh = rekapHari(u, tglKunci(), ss);
    const warna = !ss.length ? 'var(--ink2)' : bk ? 'var(--belum)' : 'var(--lunas)';
    const ket = !ss.length ? 'Belum absen'
      : ss.map(x=>jamSaja(x.masuk)+(x.pulang? '–'+jamSaja(x.pulang):'–…')).join(' · ');
    return `<div class="row"${ss.length? ' data-presensi="'+ss[ss.length-1].id+'" style="cursor:pointer"':''}>
      <div class="nm"><b>${esc(u.nama)}</b><span>${ket}</span>

      <div style="font-size:12px;font-weight:700;color:${warna}">${!ss.length?'Belum':bk?'Di tempat':'Pulang'}</div>
    </div>`; }).join('')}
  </div>`;

  const rekapTim = `
  <div class="card"><h3>Rekap jam kerja tim · ${esc(R.lbl)}</h3>
    ${tim.filter(u=>u.peran==='karyawan').map(u=>{ const r2 = rekapJam(u, R.d1, R.d2);
      const Ju = jadwalUser(u);
      return `<div class="row" style="align-items:flex-start">
        <div class="nm"><b>${esc(u.nama)}</b>
          <span>${Ju.sesiDefault.length? Ju.sesiDefault.map(x=>x.teks).join(' &amp; ') : 'jadwal belum diatur'} · wajib ${Ju.wajib} jam${Ju.punyaSabtu? ' · Sabtu beda: '+esc(jadwalBagian(u).sabtu):''}</span>
          <span style="display:block;margin-top:2px">${r2.hariHadir} hari hadir · <b>${jamTeks(r2.menitNormal)}</b> kerja${r2.menitLembur? ' · <b style="color:var(--belum)">'+jamTeks(r2.menitLembur)+' lembur</b>'+(r2.menitLemburSiaga? ' <span style="color:var(--ink2)">('+jamTeks(r2.menitLemburSiaga)+' siaga)</span>':''):''}</span>

        <div class="amt"><b>${r2.upahLembur? rpk(r2.upahLembur) : '—'}</b><br>

    <div style="font-size:11px;color:var(--ink2);margin-top:8px">

      ${DB.usaha.potongTelat? 'Potongan telat aktif: gaji pokok ÷ ' + HARI_KERJA + ' ÷ jam wajib per jam (per orang) — atur di Setelan.' : ''}

  /* Lembur yang selisihnya besar (dari absen pulang telat, bukan tombol

  const semuaPerluReview = tim.filter(u=>u.peran==='karyawan')
    .reduce((s,u)=>s.concat(rekapJam(u, LEMBUR_SETUJU_MULAI, tglKunci()).perluReview), [])

  const kartuReview = semuaPerluReview.length ? `
  <div class="card"><h3>⚠️ Lembur menunggu persetujuan</h3>
    <div style="font-size:12px;color:var(--ink2);margin-bottom:6px">Sesi lembur dari tombol "Mulai Lembur" — <b>belum dibayar</b> sampai disetujui. Ketuk baris untuk melihat foto &amp; jamnya.</div>
    ${semuaPerluReview.length > 1 ? `<button class="btn sm p w" style="margin-bottom:8px" data-act="setujuisemualembur">Setujui semua (${semuaPerluReview.length} sesi · ${jamTeks(semuaPerluReview.reduce((t,x)=>t+x.menit,0))})</button>` : ''}
    ${semuaPerluReview.map(r2=>`<div class="row" data-presensi="${r2.id}" style="cursor:pointer;flex-wrap:wrap">
      <div class="nm"><b>${esc(r2.nama)}</b><span>${esc(tglId(r2.tanggal))} · ${jamTeks(r2.menit)}${r2.jenis ? ' · ' + esc(r2.jenis) : ''}</span></div>
      <div style="display:flex;gap:6px">
        <button class="btn sm p" data-act="setujuilembur" data-id="${r2.id}">Setujui</button>

        <button class="btn sm" data-act="editlembur" data-id="${r2.id}">Edit</button>
      </div>
    </div>`).join('')}
  </div>` : '';

  const semua = (DB.presensi||[]).slice()
    .sort((a,b)=> b.tanggal.localeCompare(a.tanggal) || String(b.masuk||'').localeCompare(String(a.masuk||'')));
  const riwayatSemua = `
  <div class="card"><h3>Riwayat absen semua tim</h3>
  ${semua.length ? semua.slice(0,60).map(a=>`<div class="row" data-presensi="${a.id}" style="cursor:pointer">
    <div class="nm"><b>${esc(a.nama)}</b><span>${esc(tglId(a.tanggal))} · ${jamSaja(a.masuk)}${a.pulang? '–'+jamSaja(a.pulang)+' · '+selisihTeks(a.masuk,a.pulang):' · <span style="color:var(--alert)">belum pulang</span>'}${a.lat_masuk? ' · 📍':''}</span></div>
    <div style="font-size:11px;color:var(--ink2)">lihat &rsaquo;</div>
  </div>`).join('') : '<div class="empty"><b>Belum ada riwayat</b></div>'}
  </div><div style="height:8px"></div>`;

  return kartuSaya + rekapSayaKartu + kartuTim + kartuReview + rekapTim + riwayatSemua;
}

/* ================= CHAT GRUP TIM =================
   Satu grup untuk seluruh tim. Pesan diambil bertahap lewat penyelidikan
   berkala yang sudah ada, jadi tidak menambah beban baru yang berarti.
   Foto disimpan di HP masing-masing; di server foto lepas setelah 2 hari
   dan seluruh pesan hilang setelah 3 hari. */
let chatBalas = null;          // pesan yang sedang dibalas
let chatKirim = false;         // sedang mengirim
let chatTarikT = 0;            // hitungan giliran penarikan

function pesanUrut(){
  return (DB.pesan||[]).slice().sort((a,b)=>String(a.waktu).localeCompare(String(b.waktu)));
}
function belumDibaca(){
  if(!me) return 0;
  const s = (DB.bacaSampai && DB.bacaSampai[me.id]) || '';
  return (DB.pesan||[]).filter(p=>p.user_id !== me.id && String(p.waktu) > s).length;
}
function tandaChat(){
  const n = document.getElementById('chatBadge'); if(!n) return;
  const j = belumDibaca();
  if(j > 0 && view !== 'chat'){ n.style.display = 'block'; n.textContent = j > 99 ? '99+' : j; }
  else n.style.display = 'none';
  /* tanda merah di ikon aplikasi (di layar utama HP), seperti aplikasi lain.
     Hanya berfungsi kalau MyRoom sudah dipasang sebagai aplikasi (bukan
     dibuka lewat tab browser biasa), dan browsernya mendukung Badging API. */
  if('setAppBadge' in navigator){
    if(j > 0) navigator.setAppBadge(j).catch(()=>{});
    else navigator.clearAppBadge().catch(()=>{});
  }
}
/* menandai sudah terbaca sampai pesan terakhir */
async function tandaiTerbaca(){
  if(!me) return;
  const list = pesanUrut();
  if(!list.length) return;
  const akhir = list[list.length-1].waktu;
  DB.bacaSampai = DB.bacaSampai || {};
  if(DB.bacaSampai[me.id] === akhir) return;
  DB.bacaSampai[me.id] = akhir; save(); tandaChat();
  if(sbOn()){ try{ await sbSimpan('pesan_baca',
    [{user_id:me.id, nama:me.nama, sampai:akhir}], true); }catch(e){} }
}
/* siapa saja yang sudah membaca sampai pesan ini */
function sudahBaca(waktu){
  const b = DB.bacaSampai || {};
  return DB.users.filter(u=>u.aktif!==false && u.id !== me.id && b[u.id] && b[u.id] >= waktu)
    .map(u=>u.nama);
}

async function chatTarik(){
  if(!sbOn()) return false;
  const list = pesanUrut();
  const sejak = list.length ? list[list.length-1].waktu : null;
  const q = 'pesan?select=id,user_id,nama,teks,ada_foto,ada_berkas,berkas_nama,berkas_tipe,lat,lon,akurasi,balas_id,balas_nama,balas_teks,waktu'
    + (sejak ? '&waktu=gt.' + encodeURIComponent(sejak) : '')
    + '&order=waktu.asc&limit=200';
  let baru = [];
  try{ baru = await sbReq(q) || []; }catch(e){ return false; }
  try{ const bc = await sbReq('pesan_baca?select=*');
    if(Array.isArray(bc)){ DB.bacaSampai = DB.bacaSampai || {};
      bc.forEach(r=>{ DB.bacaSampai[r.user_id] = r.sampai; }); } }catch(e){}
  if(!baru.length){ if(!sejak) rapikanPesan(); return false; }
  const ada = new Set((DB.pesan||[]).map(x=>x.id));
  DB.pesan = DB.pesan || [];
  let masukBaru = [];
  baru.forEach(r=>{ if(ada.has(r.id)) return;
    const p = {id:r.id, user_id:r.user_id, nama:r.nama, teks:r.teks||'',
      lat:r.lat, lon:r.lon, akurasi:r.akurasi, adaFoto:!!r.ada_foto,
      adaBerkas:!!r.ada_berkas, berkasNama:r.berkas_nama||'', berkasTipe:r.berkas_tipe||'',
      balas_id:r.balas_id||'', balas_nama:r.balas_nama||'', balas_teks:r.balas_teks||'',
      waktu:r.waktu};
    DB.pesan.push(p); masukBaru.push(p); });
  rapikanPesan(); save(); tandaChat();
  const dariOrangLain = masukBaru.filter(p=>!me || p.user_id !== me.id);
  if(dariOrangLain.length && view !== 'chat' && sejak){
    const t = dariOrangLain[dariOrangLain.length-1];
    beriTahu('💬', 'Pesan baru dari ' + t.nama,
      (dariOrangLain.length > 1 ? '(' + dariOrangLain.length + ' pesan) ' : '')
      + (t.teks ? t.teks : (t.adaFoto ? '📷 mengirim foto' : t.adaBerkas ? '📄 mengirim file ' + (t.berkasNama||'') : '📍 membagikan lokasi')), 'chat');
  }
  return true;
}
/* Pesan lama dibuang dari HP: server pun hanya menyimpan 3 hari, dan
   penyimpanan HP terbatas. */
function rapikanPesan(){
  const batas = new Date(Date.now() - 3*86400000).toISOString();
  DB.pesan = (DB.pesan||[]).filter(p=>String(p.waktu) >= batas).slice(-300);
}

async function kirimPesan(teks, foto, lok, berkas){
  if(chatKirim) return;
  teks = (teks||'').trim();
  if(!teks && !foto && !lok && !berkas) return;
  chatKirim = true;
  const p = {id:uid('M'), user_id:me.id, nama:me.nama, teks, adaFoto:!!foto,
    adaBerkas:!!berkas, berkasNama: berkas? berkas.nama : '', berkasTipe: berkas? berkas.tipe : '',
    lat:lok?lok.lat:null, lon:lok?lok.lon:null, akurasi:lok?lok.akurasi:null,
    balas_id: chatBalas? chatBalas.id : '', balas_nama: chatBalas? chatBalas.nama : '',
    balas_teks: chatBalas? (chatBalas.teks||(berkas?'(file)':'(foto)')).slice(0,70) : '',
    waktu: new Date().toISOString(), belum:true};
  DB.pesan = DB.pesan || []; DB.pesan.push(p);
  if(foto) await fotoSimpan('pesan_' + p.id, foto);         // salinan di HP sendiri
  if(berkas) await fotoSimpan('pesanfile_' + p.id, berkas.data);  // salinan file di HP sendiri
  chatBalas = null; save(); render();

  const baris = {id:p.id, user_id:p.user_id, nama:p.nama, teks:p.teks, ada_foto:!!foto,
    ada_berkas:!!berkas, berkas_nama: berkas? berkas.nama : null, berkas_tipe: berkas? berkas.tipe : null,
    lat:p.lat, lon:p.lon, akurasi:p.akurasi,
    balas_id:p.balas_id||null, balas_nama:p.balas_nama||null, balas_teks:p.balas_teks||null,
    waktu:p.waktu};
  if(foto) baris.foto = foto;
  if(berkas) baris.berkas = berkas.data;
  let ok = false;
  try{ ok = await sbSimpan('pesan', [baris], true); }catch(e){ ok = false; }
  if(!ok){ const tanpa = Object.assign({}, baris); delete tanpa.foto; delete tanpa.berkas;
    antrekan({t:'pesan', a:'simpan', d:[tanpa]}); }
  const q = (DB.pesan||[]).find(x=>x.id === p.id); if(q) delete q.belum;
  chatKirim = false; save();
  if(view === 'chat'){ render(); geserBawah(); }
  tandaiTerbaca();
}
/* Dokumen yang dilampirkan di chat: PDF, gambar, Word & Excel.
   PDF & gambar bisa langsung dibuka/di-print di browser; Word & Excel
   cuma bisa di-download atau dikirim lewat WhatsApp (tidak ada penampil
   Word/Excel bawaan di browser). */
function jenisBerkas(nama, tipe){
  const ext = String(nama||'').split('.').pop().toLowerCase();
  if(ext === 'pdf' || tipe === 'application/pdf') return {label:'PDF', ikon:'📕', previewable:true};
  if(['jpg','jpeg','png','gif','webp'].indexOf(ext) >= 0 || String(tipe||'').indexOf('image/') === 0)
    return {label:'Gambar', ikon:'🖼️', previewable:true};
  if(['doc','docx'].indexOf(ext) >= 0) return {label:'Dokumen Word', ikon:'📝', previewable:false};
  if(['xls','xlsx'].indexOf(ext) >= 0) return {label:'Spreadsheet Excel', ikon:'📊', previewable:false};
  return {label:'Berkas', ikon:'📄', previewable:false};
}
/* Ambil isi file (base64): dicari dulu salinan di HP sendiri, baru
   menoleh ke server kalau belum ada. */
async function ambilBerkasChat(id){
  const p = (DB.pesan||[]).find(x=>x.id === id); if(!p) return null;
  toast('Menyiapkan file…');
  let data = await fotoAmbil('pesanfile_' + id);
  if(!data && sbOn()){
    try{ const r = await sbReq('pesan?select=berkas&id=eq.' + encodeURIComponent(id));
      if(Array.isArray(r) && r[0] && r[0].berkas){ data = r[0].berkas;
        fotoSimpan('pesanfile_' + id, data); }
    }catch(e){}
  }
  if(!data){ toast('File sudah terhapus di server'); return null; }
  return {data, nama: p.berkasNama || 'berkas', tipe: p.berkasTipe || ''};
}
function unduhDataBerkas(b){
  const a = document.createElement('a');
  a.href = b.data; a.download = b.nama; a.target = '_blank';
  document.body.appendChild(a); a.click(); a.remove();
}
async function unduhBerkasChat(id){
  const b = await ambilBerkasChat(id); if(!b) return;
  unduhDataBerkas(b);
}
/* Kirim langsung ke WhatsApp (atau aplikasi lain) lewat Web Share API,
   yang di HP menampilkan daftar aplikasi termasuk WhatsApp. Kalau HP/
   browsernya tidak mendukung berbagi file, file diunduh saja sebagai
   jalan pintas supaya tetap bisa dikirim manual. */
async function kirimBerkasWA(id){
  const b = await ambilBerkasChat(id); if(!b) return;
  try{
    const blob = await (await fetch(b.data)).blob();
    const file = new File([blob], b.nama, {type: b.tipe || blob.type || 'application/octet-stream'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title: b.nama});
      return;
    }
  }catch(e){}
  toast('HP ini tidak mendukung kirim file langsung — file diunduh, kirim manual lewat WhatsApp');
  unduhDataBerkas(b);
}
/* Print ukuran A4 — cuma untuk PDF & gambar, yang bisa ditampilkan
   langsung oleh browser. Word/Excel tidak ada penampilnya di browser. */
async function printBerkasA4(id){
  const b = await ambilBerkasChat(id); if(!b) return;
  const j = jenisBerkas(b.nama, b.tipe);
  if(!j.previewable){ toast('Jenis file ini tidak bisa di-print langsung dari sini — download dulu'); return; }
  const w = window.open('', '_blank');
  if(!w){ toast('Popup diblokir — izinkan popup untuk mencetak'); return; }
  const isi = j.label === 'PDF'
    ? `<embed src="${b.data}" type="application/pdf">`
    : `<img src="${b.data}">`;
  w.document.write('<!DOCTYPE html><html><head><title>' + esc(b.nama) + '</title><style>'
    + '@page{size:A4;margin:12mm}'
    + 'html,body{margin:0;padding:0;height:100%}'
    + 'body{display:flex;align-items:center;justify-content:center}'
    + 'embed,img{width:100%;height:100%;object-fit:contain}'
    + '</style></head><body>' + isi + '</body></html>');
  w.document.close();
  w.onload = ()=> setTimeout(()=>{ w.focus(); w.print(); }, 500);
}

/* ================= RAPOR KINERJA INDIVIDU =================
   Menyusun jejak kerja satu orang: kehadiran, jam, poin, setoran, dan gaji,
   per bulan lalu diringkas setahun. Semua diambil dari catatan yang sudah
   ada — tidak ada data baru yang perlu diisi manual. */
function bulanTahun(tahun){
  return ALLPER.filter(p=>p.slice(0,4) === String(tahun));
}
function rapotBulan(u, periode){
  const R = rentangDari({mode:'bulan', bulan:periode});
  const rk = rekapJam(u, R.d1, R.d2);
  const pb = poinBonus(R.d1, R.d2).find(x=>x.nama === u.nama)
    || {poin:0, kerja:0, berdua:0, tagih:0, cepat:0, bonus:0};
  const dlm = t => { const x = tglLokal(t); return x >= R.d1 && x <= R.d2; };
  const abs = (DB.absen||[]).filter(a=>a.nama === u.nama && dlm(a.tgl));
  const jns = k => abs.filter(a=>a.jenis === k).length;
  let setoran = 0, jmlBayar = 0;
  for(const k of Object.keys(DB.bayar||{})){
    const b = DB.bayar[k];
    if(b && b.u === u.nama && dlm(b.t)){ setoran += b.j||0; jmlBayar++; }
  }
  const gj = (DB.gaji||[]).find(g=>g.nama === u.nama && g.periode === periode && g.dibayarPada);
  const tiketSelesai = (DB.tiket||[]).filter(t=>t.status === 'selesai' && t.selesai
    && dlm(t.selesai)
    && String(t.penangan||'').split(',').map(x=>x.trim()).indexOf(u.nama) >= 0).length;
  return {periode, hariHadir:rk.hariHadir,
    menitNormal:rk.menitNormal, menitLembur:rk.menitLembur,
    telat:rk.telat, telatMenit:rk.telatMenit, belumTutup:rk.belumTutup,
    alpa:jns('alpa'), izin:jns('izin'), sakit:jns('sakit'), cuti:jns('cuti'),
    poin:pb.poin, gangguan:tiketSelesai, berdua:pb.berdua||0, cepat:pb.cepat||0,
    tagih:pb.tagih||0, bonus:pb.bonus||0,
    setoran, jmlBayar, upahLembur:rk.upahLembur,
    dibayar: gj ? (gj.total||0) : 0, sudahDibayar: !!gj};
}
function rapotTahun(u, tahun){
  const bulan = bulanTahun(tahun).map(p=>rapotBulan(u, p));
  const j = k => bulan.reduce((s,x)=>s + (x[k]||0), 0);
  return {bulan, tahun:String(tahun),
    hariHadir:j('hariHadir'), menitNormal:j('menitNormal'), menitLembur:j('menitLembur'),
    telat:j('telat'), telatMenit:j('telatMenit'), belumTutup:j('belumTutup'),
    alpa:j('alpa'), izin:j('izin'), sakit:j('sakit'), cuti:j('cuti'),
    poin:Math.round(j('poin')*100)/100, gangguan:j('gangguan'), berdua:j('berdua'),
    cepat:j('cepat'), tagih:j('tagih'), bonus:j('bonus'),
    setoran:j('setoran'), jmlBayar:j('jmlBayar'), upahLembur:j('upahLembur'),
    dibayar:j('dibayar')};
}

function sheet(html){
  $('#modal').innerHTML = `<div class="mask"><div class="sheet"><div class="hnd"></div>${html}</div></div>`;
  $('#modal .mask').addEventListener('click', e=>{ if(e.target.classList.contains('mask')) closeSheet(); });
}
function closeSheet(){
  if(typeof kamMatikan === 'function') kamMatikan();
  if(typeof pantauTimer !== 'undefined' && pantauTimer){ clearInterval(pantauTimer); pantauTimer = null; } $('#modal').innerHTML='';
  /* Reset penanda asal PSB di sini juga (bukan cuma di case 'tutup'), supaya kalau sheet
     ditutup lewat cara lain (tap area gelap, Escape, atau pindah menu) tidak ada psbAsalId
     basi yang nyangkut dan salah menandai pelanggan baru berikutnya sebagai "dari PSB ini". */
  psbAsalId = null; psbAsalPenangan = null; }

    ${tg > 0 ? `<div style="font-size:12.5px;color:var(--alert);margin-top:10px;background:var(--alert-l);
      padding:9px 11px;border-radius:10px">Tunggakan bulan sebelumnya ${rp(tg)} — otomatis ikut dihitung ke total ini, tidak perlu dicatat manual di bulan lamanya.</div>`:''}
    ${b? `<div style="font-size:12.5px;color:var(--ink2);margin-top:10px">Dibayar ${tglId(b.t)} · ${esc(b.c)}${b.u? ' · diterima '+esc(b.u):''}</div>`:''}

    </div>
    <div class="acts">
      <button class="btn" data-act="watagih" data-id="${id}" data-per="${pr}">💬 Tagih via WA</button>

     sudah diketik sendiri tidak ditimpa. */
  const selTm = $('#fTarifMulai'), inpH = $('#fHarga');

      const h = tarifPada(p, selTm.value);
      if(inpH.value === String(inpH.dataset.auto)) inpH.value = h;   // belum diketik sendiri
      inpH.dataset.auto = String(h);
      pasang(selTm.value);
    });
  }
}

/* ================= KLAIM & PENGESAHAN =================
   Poin tidak langsung masuk begitu karyawan menandai gangguan selesai.
   Pemilik mengesahkannya dulu, sekali di akhir bulan. Supaya pemeriksaan
   tidak melelahkan, sistem menyorot yang pantas dilihat lebih dulu —
   dari 60 gangguan biasanya hanya beberapa yang perlu diperiksa. */

/* Tiap tanda punya bobot. Yang disorot hanya bila bobotnya cukup berat.
   Sebabnya: sebagian pola itu wajar di usaha kecil — karyawan menerima
   telepon pelanggan, mencatatnya, lalu mengerjakannya sendiri. Kalau pola
   biasa ikut disorot, semua gangguan jadi merah dan sorotan kehilangan
   gunanya. Bobot di bawah bisa disetel setelah dipakai sebulan. */
const SOROT_AMBANG = 3;          // total bobot supaya sebuah gangguan disorot

function menitTangani(t){
  if(!t.tgl || !t.selesai) return null;
  const m = (new Date(t.selesai) - new Date(t.tgl)) / 60000;
  return isFinite(m) ? m : null;
}

/* Mengembalikan {skor, alasan[]}. Skor di bawah ambang dianggap wajar.

   Daftar pembanding dikelompokkan sekali di awal (per pelanggan, per jam
   tutup) lalu dipakai berulang. Sebelumnya seluruh daftar disapu ulang untuk
   tiap gangguan — dengan 900 gangguan itu 810.000 perbandingan, dan makin
   berat tiap bulan. Sekarang beratnya tumbuh lurus, bukan berlipat. */
function siapkanBanding(semua){
  const perPel = {}, perJam = {};
  for(const x of semua){
    if(x.pelId){ (perPel[x.pelId] = perPel[x.pelId] || []).push(x); }
    if(x.selesai){
      const k = String(x.selesai).slice(0,13) + '|' + String(x.penangan||'');
      perJam[k] = (perJam[k] || 0) + 1;
    }
  }
  return {perPel, perJam};
}

function sorotKlaim(t, semua, banding){
  const b = banding || siapkanBanding(semua);
  const alasan = []; let skor = 0;
  const tandai = (bobot, teks) => { skor += bobot; alasan.push(teks); };

  const m = menitTangani(t);
  if(m !== null && m >= 0){
    if(m < 3)       tandai(3, 'Selesai ' + Math.round(m) + ' menit setelah dilapor');
    else if(m < 15) tandai(1, 'Selesai ' + Math.round(m) + ' menit setelah dilapor');
  }

  const orang = String(t.penangan||'').split(',').map(x=>x.trim()).filter(Boolean);
  if(t.pelapor && orang.indexOf(String(t.pelapor).trim()) >= 0)
    tandai(1, 'Melapor lalu menyelesaikan sendiri');

  if(t.pelId){
    const sekelompok = b.perPel[t.pelId] || [];
    let dekat = 0;
    for(const x of sekelompok){
      if(x.id === t.id || !x.tgl) continue;
      if(Math.abs(new Date(x.tgl) - new Date(t.tgl)) < 7*86400000) dekat++;
    }
    if(dekat >= 3)      tandai(2, 'Pelanggan sama ' + (dekat+1) + 'x dalam seminggu');
    else if(dekat >= 1) tandai(1, 'Pelanggan sama ' + (dekat+1) + 'x dalam seminggu');
  }

  if(t.selesai){
    const bareng = b.perJam[String(t.selesai).slice(0,13) + '|' + String(t.penangan||'')] || 0;
    if(bareng >= 6)      tandai(2, bareng + ' gangguan ditutup dalam jam yang sama');
    else if(bareng >= 4) tandai(1, bareng + ' gangguan ditutup dalam jam yang sama');
  }

  return {skor, alasan, sorot: skor >= SOROT_AMBANG};
}

/* Klaim poin mencakup siklus gaji SEBELUMNYA dan siklus berjalan. Saat
   gajian (tgl 7) gangguan siklus lalu masih harus bisa disahkan supaya
   poinnya masuk bonus — dulu dibatasi bulan kalender, sehingga gangguan
   1–30 Sep tidak muncul lagi begitu masuk Oktober. */
function klaimDari(){
  return siklusGaji(pAdd(periodeSiklus(tglKunci()), -1)).d1;
}
/* Gangguan selesai (siklus lalu + berjalan) yang belum disahkan.

   Pembanding dibatasi pada bulan berjalan ditambah seminggu sebelumnya —
   itu satu-satunya rentang yang dipakai untuk menilai. Tanpa batas ini,
   seluruh riwayat bertahun-tahun ikut disapu tiap kali dinilai. */
function klaimMenunggu(){
  const dari = klaimDari();
  const batas = new Date(dari + 'T00:00:00');
  batas.setDate(batas.getDate() - 8);
  const batasIso = tglKunci(batas);

  const selesai = DB.tiket.filter(t=>t.status==='selesai' && t.selesai
    && String(t.selesai).slice(0,10) >= batasIso);
  const banding = siapkanBanding(selesai);          // disiapkan sekali saja
  return selesai
    .filter(t=>tglLokal(t.selesai) >= dari && !t.disahkan)
    .map(t=>{ const s = sorotKlaim(t, selesai, banding);
      return Object.assign({}, t, {skor:s.skor, alasan:s.alasan, sorot:s.sorot}); })
    .sort((a,b)=> b.skor - a.skor || String(b.selesai).localeCompare(String(a.selesai)));
}

function sheetKlaim(){
  if(!can('uang')) return;              // pengesahan poin: Pemilik saja
  const list = klaimMenunggu();
  const perluDilihat = list.filter(x=>x.sorot).length;

  sheet(`<h2>Klaim poin</h2>
    <div class="sub">Sejak ${esc(tglSingkat(klaimDari(), true))} (siklus gaji lalu &amp; berjalan) · ${list.length} gangguan menunggu disahkan</div>
    ${list.length? (perluDilihat
      ? `<div style="font-size:12.5px;color:var(--alert);margin-top:10px;background:var(--alert-l);
          padding:9px 11px;border-radius:10px">${perluDilihat} gangguan pantas dilihat dulu. ${list.length-perluDilihat} sisanya tampak wajar.</div>`
      : `<div style="font-size:12.5px;color:var(--lunas);margin-top:10px;background:var(--lunas-l);
          padding:9px 11px;border-radius:10px">Semuanya tampak wajar.</div>`) : ''}
    ${list.length? `
    <div style="max-height:44vh;overflow:auto;margin-top:12px">
      ${list.map(t=>{
        const p = byId(t.pelId), m = menitTangani(t);
        return `<div class="row" style="align-items:flex-start">
          <div class="nm" data-klaimbuka="${t.id}" style="cursor:pointer">
            <b>${t.sorot? '⚠️ ':''}${esc(p? p.nama : 'Gangguan umum')}</b>
            <span>${esc(t.masalah)} · ${esc(t.penangan||'-')}${m!==null? ' · '+(m<60? Math.round(m)+' mnt' : Math.round(m/60)+' jam'):''}</span>
            ${t.alasan.length? `<span style="color:${t.sorot?'var(--alert)':'var(--ink2)'};display:block;margin-top:2px">${t.alasan.map(esc).join(' · ')}</span>`:''}
          </div>
          <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">
            <button class="btn sm" data-act="tiketubah" data-id="${t.id}">Ubah</button>
            <button class="btn sm g" data-act="klaimsatu" data-id="${t.id}">Sahkan</button>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="acts">
      <button class="btn g" data-act="klaimsahkan" data-mode="wajar">Sahkan yang wajar (${list.length-perluDilihat})</button>
      <button class="btn" data-act="klaimsahkan" data-mode="semua">Sahkan semua</button>
    </div>
    <div style="font-size:11.5px;color:var(--ink2);margin-top:10px">
      Ketuk namanya untuk melihat rincian. Yang belum disahkan tidak menghasilkan poin,
      dan poin ikut hilang bila gangguannya dihapus atau pengesahannya dicabut.
    </div>`
    : `<div class="kosong" style="margin-top:16px"><b>Tidak ada yang menunggu</b>
       <div>Semua gangguan bulan ini sudah disahkan.</div></div>
       <div class="acts"><button class="btn w" data-act="tutup">Tutup</button></div>`}`);
}

/* ================= ABSEN & GAJI =================
   Gaji tetap bulanan, dipotong hanya bila alpa. Izin dan sakit tidak
   memotong. Bonus poin dari gangguan yang sudah disahkan ikut digabung,
   supaya karyawan menerima satu angka utuh.

   Yang dicatat hanya hari TIDAK masuk. Masuk kerja itu keadaan biasa;
   yang perlu dicatat justru pengecualiannya. Dengan begitu tidak ada yang
   harus menekan tombol tiap pagi, dan tidak ada data bolong karena lupa. */

const HARI_KERJA = 26;          // hari kerja sebulan, dasar hitungan potongan
const JATAH_CUTI = 5;           // jatah cuti tiap orang, per tahun kalender

/* Cuti dihitung per tahun Januari–Desember. Melebihi jatah tidak memotong
   gaji, hanya ditandai supaya terlihat siapa yang sudah lewat. */
function cutiTahun(nama, tahun){
  tahun = tahun || String(today().getFullYear());
  const pakai = (DB.absen||[]).filter(a=>a.nama === nama && a.jenis === 'cuti'
    && String(a.tgl).slice(0,4) === String(tahun));
  return {tahun:String(tahun), pakai:pakai.length, jatah:JATAH_CUTI,
          sisa:Math.max(0, JATAH_CUTI - pakai.length),
          lebih:Math.max(0, pakai.length - JATAH_CUTI), daftar:pakai};
}

/* Bulan gaji yang sedang jatuh tempo. Gaji bulan X dibayar tanggal 7 bulan
   X+1; sebelum tanggal 7, yang terakhir jatuh tempo masih bulan sebelumnya. */
function bulanGajian(){
  const d = today();
  const kini = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  return pAdd(kini, d.getDate() >= TGL_GAJIAN ? -1 : -2);
}
/* Keterangan jadwal untuk bulan gaji tertentu: kapan jatuh tempo dan
   berapa hari lagi (atau sudah lewat berapa hari). */
function jadwalGajian(periode){
  const bayar = pAdd(periode, 1);
  const [y,m] = bayar.split('-').map(Number);
  const jatuh = new Date(y, m-1, TGL_GAJIAN);
  const n = today(); n.setHours(0,0,0,0);
  const beda = Math.round((jatuh - n) / 86400000);
  const tgl = TGL_GAJIAN + ' ' + BLN[m-1] + ' ' + y;
  if(beda > 0)  return {tgl, beda, teks:'jatuh tempo ' + tgl + ' · ' + beda + ' hari lagi', warna:'var(--ink2)'};
  if(beda === 0) return {tgl, beda, teks:'jatuh tempo HARI INI (' + tgl + ')', warna:'var(--belum)'};
  return {tgl, beda, teks:'jatuh tempo ' + tgl + ' · lewat ' + (-beda) + ' hari', warna:'var(--alert)'};
}

function absenBulan(nama, periode){
  const sk = siklusGaji(periode);
  return (DB.absen||[]).filter(a=>a.nama === nama
    && String(a.tgl).slice(0,10) >= sk.d1 && String(a.tgl).slice(0,10) <= sk.d2);
}

/* Sisa kasbon: yang dipinjam dikurangi yang sudah dipotong lewat gaji.
   Selalu dihitung ulang dari catatan aslinya, tidak disimpan sebagai angka
   tersendiri — supaya tidak pernah melenceng bila ada yang diubah. */
function sisaKasbon(nama, sampaiPeriode){
  const pinjam = (DB.kasbon||[])
    .filter(k=>k.nama === nama && (!sampaiPeriode || String(k.tgl).slice(0,10) <= siklusGaji(sampaiPeriode).d2))
    .reduce((s,k)=>s + k.jml, 0);
  const sudah = (DB.gaji||[])
    .filter(g=>g.nama === nama && g.dibayarPada
      && (!sampaiPeriode || g.periode <= sampaiPeriode))
    .reduce((s,g)=>s + (g.kasbon || 0), 0);
  return Math.max(0, pinjam - sudah);
}

/* Komisi & apresiasi: nominal manual, opsional, per orang per periode —
   beda dari bonus poin (otomatis dari gangguan) dan lembur. Diisi bebas
   oleh pemilik (mis. komisi jualan, apresiasi kinerja bagus, dll).
   Disimpan lewat tabel "pengaturan" (kunci/nilai umum) supaya tidak perlu
   tabel baru di server — kuncinya "komisi_<periode>_<id_user>". */
function komisiKey(id, periode){ return 'komisi_' + periode + '_' + id; }
function komisiUntuk(u, periode){
  const raw = (DB.komisi || {})[komisiKey(u.id, periode)];
  if(!raw) return {jml:0, ket:''};
  try{ const v = typeof raw === 'string' ? JSON.parse(raw) : raw; return {jml:Math.max(0, Math.round(+v.jml||0)), ket:v.ket||''}; }
  catch(e){ return {jml:0, ket:''}; }
}

/* Tarif potongan per JAM tiap karyawan = gaji pokok ÷ ${HARI_KERJA} hari ÷ jam wajib.
   Contoh: Rp1.500.000 ÷ 26 ÷ 8 jam = Rp7.211,54/jam; Rp1.200.000 ÷ 26 ÷ 6 jam
   = Rp7.692,31/jam. Dipakai untuk potongan telat (per menit lewat toleransi)
   dan tanpa absen masuk (tarif × jam wajib hari itu = gaji ÷ 26 untuk hari
   biasa). Angka di Setelan hanya CADANGAN bila gaji pokok belum diisi. */
function tarifPotongJam(u){
  const J = jadwalUser(u);
  const gaji = +(u && u.gaji) || 0;
  if(gaji > 0 && J.wajib > 0) return gaji / HARI_KERJA / J.wajib;
  return +(DB.usaha && DB.usaha.potonganTelatRp) || 0;
}
/* Alasan yang membuat telat / tanpa absen TIDAK terhitung untuk seseorang —
   ditampilkan di layar gaji supaya pemilik tidak mengira karyawan itu
   selalu tepat waktu, padahal datanya memang tidak bisa dihitung. */
function diagnosaGaji(u, rk){
  const out = [];
  const J = jadwalUser(u);
  if(!J.sesi.length) out.push('Belum punya <b>jadwal kerja</b> — telat, pulang cepat, dan tanpa absen tidak bisa dihitung. Isi lewat Menu › Tim &amp; PIN.');
  if(!(DB.usaha && DB.usaha.potongTelat)) out.push('Saklar <b>Potong gaji kalau telat</b> di Setelan sedang MATI — telat &amp; tanpa absen hanya dicatat, tidak memotong gaji.');
  if(rk && rk.hariHadir === 0) out.push('Tidak ada satu pun catatan absen pada siklus ini.');
  if(rk && rk.belumTutup) out.push(rk.belumTutup + 'x lupa absen pulang — jam kerja hari itu bisa terhitung 0.');
  if(rk && rk.menitLemburReview > 0) out.push('<b>' + jamTeks(rk.menitLemburReview) + ' lembur menunggu persetujuan</b> ('
    + (rk.perluReview||[]).length + ' sesi) — BELUM dibayar. Setujui di Menu › Absen &amp; jam kerja, kartu "Lembur menunggu persetujuan".');
  return out;
}
function potonganTanpaAbsenRp(){
  const v = DB.usaha && DB.usaha.potonganTanpaAbsenRp;
  return v == null || v === '' ? POTONGAN_TANPA_ABSEN_BAWAAN : Math.max(0, Math.round(+v || 0));
}
function hitungGaji(u, periode, d1, d2){
  /* tanpa rentang: satu siklus gaji penuh (7 – 6) untuk periode itu */
  if(!d1){ const sk = siklusGaji(periode); d1 = sk.d1; d2 = sk.d2; }
  const abs = (DB.absen||[]).filter(a=>a.nama === u.nama
    && String(a.tgl).slice(0,10) >= d1 && String(a.tgl).slice(0,10) <= d2);
  const alpa  = abs.filter(a=>a.jenis === 'alpa').length;
  const izin  = abs.filter(a=>a.jenis === 'izin').length;
  const sakit = abs.filter(a=>a.jenis === 'sakit').length;
  const cuti  = abs.filter(a=>a.jenis === 'cuti').length;

  const pokok = Math.round(u.gaji || 0);
  const perHari = pokok ? Math.round(pokok / HARI_KERJA) : 0;
  const potonganAlpa = perHari * alpa;

  const b = poinBonus(d1, d2).find(x=>x.nama === u.nama);
  const bonus = b ? b.bonus : 0;
  const poin  = b ? b.poin : 0;

  /* Lembur: hanya dari sesi yang dibuka lewat tombol "Mulai Lembur"
     (resmi_lembur), dikalikan tarifnya. Dihitung otomatis dari catatan
     absen pada rentang yang sedang dilihat. */
  const rk = rekapJam(u, d1, d2);
  /* termasuk jam pra-shift, supaya "Lembur X jam" di slip sesuai rupiahnya */
  const jamLembur = Math.round((rk.jamLembur + rk.jamLemburPraShift) * 100) / 100;
  const jamLemburBiasa = Math.round(rk.jamLemburBiasa * 100) / 100;
  const jamLemburSiaga = Math.round(rk.jamLemburSiaga * 100) / 100;
  const jamLemburPraShift = Math.round(rk.jamLemburPraShift * 100) / 100;
  const upahLembur = rk.upahLembur;
  const upahLemburBiasa = rk.upahLemburBiasa;
  const upahLemburSiaga = rk.upahLemburSiaga;
  const upahLemburPraShift = rk.upahLemburPraShift;

  /* Potongan telat (Pasal 1/7): proporsional per jam, TAPI hanya dari
     menit yang melebihi toleransi 15 menit (telatPotongMenit) — 15 menit
     pertama tetap kompensasi, tidak dipotong. Berlaku rata ke semua
     orang, tidak lewat poin, supaya tidak "kebal" untuk yang jarang
     kebagian tiket/gangguan (lihat poinBonus). Rate (potonganTelatRp)
     ini satu-satunya angka — yang ditampilkan ke karyawan di kartu Absen
     sama persis dengan yang dipakai menghitung gaji. Rate yang sama
     dipakai juga untuk potongan "tanpa absen masuk" (Pasal 6), dihitung
     dari total jam wajib hari itu. */
  const kaliTelat = rk.telat || 0;
  const menitTelat = rk.telatMenit || 0;
  const menitTelatPotong = rk.telatPotongMenit || 0;
  const rateJam = tarifPotongJam(u);
  const pakaiGaji = (+u.gaji || 0) > 0;
  const potonganTelat = DB.usaha.potongTelat ? Math.round((menitTelatPotong/60) * rateJam) : 0;
  const hariTanpaAbsenMasuk = rk.hariTanpaAbsenMasuk || 0;
  /* per hari = tarif/jam × jam wajib HARI ITU (hari biasa = gaji ÷ 26);
     bila gaji pokok belum diisi pakai angka cadangan di Setelan */
  const rpHariTanpaAbsen = jam => pakaiGaji ? Math.round(rateJam * jam) : potonganTanpaAbsenRp();
  const rpTanpaAbsen = rpHariTanpaAbsen(rk.wajib);
  const potonganTanpaMasuk = DB.usaha.potongTelat
    ? (rk.tanpaAbsen || []).reduce((a,x)=>a + rpHariTanpaAbsen(x.jamWajib), 0) : 0;
  const potongan = potonganAlpa + potonganTelat + potonganTanpaMasuk;

  /* Komisi & apresiasi: opsional, diisi manual oleh pemilik per orang per
     periode (lihat komisiUntuk di atas). */
  const kom = komisiUntuk(u, periode);
  const komisiJml = kom.jml;
  const komisiKet = kom.ket;

  const sudah = (DB.gaji||[]).find(g=>g.nama === u.nama && g.periode === periode && g.dibayarPada);

  /* sebelum kasbon dipotong */
  const sebelumKasbon = Math.max(0, pokok - potongan + bonus + upahLembur + komisiJml);

  /* bila sudah dibayar, pakai angka yang tercatat saat itu.
     bila belum, tawarkan memotong sebanyak mungkin tanpa membuat gaji minus. */
  const sisa = sisaKasbon(u.nama, periode);
  const kasbon = sudah ? (sudah.kasbon || 0) : Math.min(sisa, sebelumKasbon);

  /* ---------- RINCIAN untuk slip (per tanggal) ---------- */
  const rate = rateJam, potongAktif = !!DB.usaha.potongTelat;
  const rincianTelat = [], rincianTanpaMasuk = [], rincianLembur = [];
  for(const x of rk.hari){
    for(const t of (x.telat || [])){
      const potMenit = Math.max(0, t.menit - TOLERANSI_MENIT);
      rincianTelat.push({tanggal:x.tanggal, jenis:t.jenis, menit:t.menit, potongMenit:potMenit,
        jadwal:t.jadwal, jam:t.jam, rp: potongAktif ? Math.round(potMenit/60*rate) : 0});
    }
    if(x.lembur > 0 || x.lemburPraShift > 0) rincianLembur.push({tanggal:x.tanggal,
      biasa:x.lemburBiasa, siaga:x.lemburSiaga, praShift:x.lemburPraShift, awal:x.awalMenit||0});
  }
  for(const x of (rk.tanpaAbsen || [])) rincianTanpaMasuk.push({tanggal:x.tanggal, jamWajib:x.jamWajib,
    rp: potongAktif ? rpHariTanpaAbsen(x.jamWajib) : 0});
  const urutTgl = (a,b)=> String(a.tgl).localeCompare(String(b.tgl));
  const rincianAbsen = abs.slice().sort(urutTgl).map(a=>({tanggal:String(a.tgl).slice(0,10), jenis:a.jenis, catatan:a.catatan||''}));
  const kasbonBaru = (DB.kasbon||[]).filter(k=>k.nama === u.nama
      && String(k.tgl).slice(0,10) >= d1 && String(k.tgl).slice(0,10) <= d2).sort(urutTgl);
  const kasbonAwal = sisaKasbon(u.nama, pAdd(periode, -1));   // sisa sebelum siklus ini
  const kasbonBaruJml = kasbonBaru.reduce((s2,k)=>s2 + k.jml, 0);
  const kasbonAkhir = sudah ? sisa : Math.max(0, sisa - kasbon);
  const sk = siklusGaji(periode);

  return {nama:u.nama, pokok, perHari, alpa, izin, sakit, cuti, potongan, potonganAlpa,
          kaliTelat, menitTelat, menitTelatPotong, potonganTelat, hariTanpaAbsenMasuk, potonganTanpaMasuk,
          bonus, poin, komisiJml, komisiKet,
          jamLembur, upahLembur, jamLemburBiasa, upahLemburBiasa, jamLemburSiaga, upahLemburSiaga,
          jamLemburPraShift, upahLemburPraShift,
          jamKerja:Math.round(rk.jamNormal*100)/100,
          hariHadir:rk.hariHadir, telat:rk.telat, belumTutup:rk.belumTutup,
          sebelumKasbon, sisaKasbon:sisa, kasbon,
          total: Math.max(0, sebelumKasbon - kasbon), sudah: sudah || null,
          d1, d2, siklusTeks:(d1 === sk.d1 && d2 === sk.d2) ? sk.teks : tglSingkat(d1, true) + ' – ' + tglSingkat(d2, true),
          tglBayar:sk.tglBayar, peralihan:sk.peralihan && d1 === sk.d1,
          rincianTelat, rincianTanpaMasuk, rincianLembur, rincianAbsen,
          kasbonAwal, kasbonBaru, kasbonBaruJml, kasbonAkhir,
          tarifLembur:rk.tarif, jamWajib:rk.wajib, rateTelat:rate, potongAktif,
          poinRinci: b || null, rpTanpaAbsen, rateJam, pakaiGaji,
          diagnosa: diagnosaGaji(u, rk), menitLemburDitolak: rk.menitLemburDitolak || 0,
          menitLemburMenunggu: rk.menitLemburReview || 0};
}

/* Karyawan yang sudah berhenti tetap ditampilkan selama masih ada urusan:
   gaji bulan ini belum dibayar, atau kasbon belum lunas. Tanpa ini, orang
   yang dinonaktifkan langsung hilang dari daftar dan gaji terakhirnya tidak
   bisa lagi dibayar lewat aplikasi. */
function daftarGaji(periode, d1, d2){
  return (DB.users||[]).filter(u=>{
    if(u.peran !== 'karyawan') return false;
    if(u.aktif !== false) return true;

    /* sudah berhenti: hanya tampil bila memang masih ada urusan pada bulan
       yang dilihat. Tanpa batas ini, namanya akan terus muncul tiap bulan
       seolah masih berhak gaji. */
    if(sisaKasbon(u.nama, periode) > 0) return true;
    const g = hitungGaji(u, periode, d1, d2);
    if(g.sudah) return true;                       // gaji bulan itu memang tercatat
    /* pernah bekerja pada bulan itu? terlihat dari uang yang dia terima
       atau hari tidak masuk yang tercatat */
    const kerja = Object.keys(DB.bayar||{}).some(k=>{
      const b2 = DB.bayar[k];
      const sk2 = siklusGaji(periode), t2 = tglLokal(b2 && b2.t);
      return b2 && b2.u === u.nama && t2 >= sk2.d1 && t2 <= sk2.d2;
    }) || absenBulan(u.nama, periode).length > 0;
    return kerja && g.pokok && !g.sudah;
  })
    .map(u=>Object.assign(hitungGaji(u, periode, d1, d2), {nonaktif: u.aktif === false}))
    .sort((a,b)=> (a.nonaktif?1:0) - (b.nonaktif?1:0) || a.nama.localeCompare(b.nama));
}

/* Slip gaji: bukti pembayaran untuk karyawan, dengan rincian lengkap
   supaya tidak ada yang bertanya-tanya kenapa jumlahnya berbeda dari
   gaji pokok. Bisa ditunjukkan di layar atau disalin untuk dikirim. */

function noSlip(nama, periode){
  const kode = String(nama||'').replace(/[^a-zA-Z0-9]/g,'').slice(0,4).toUpperCase() || '0000';
  return 'SG-' + String(periode).replace('-','') + '-' + kode;
}

function teksSlip(g, periode){
  const baris = [];
  baris.push('Gaji pokok   : ' + rp(g.pokok));
  if(g.alpa)     baris.push('Alpa ' + g.alpa + ' hari   : -' + rp(g.potonganAlpa));
  if(g.potonganTelat) baris.push('Telat ' + g.kaliTelat + 'x (' + jamTeks(g.menitTelat) + ')   : -' + rp(g.potonganTelat));
  if(g.potonganTanpaMasuk) baris.push('Tanpa absen masuk ' + g.hariTanpaAbsenMasuk + ' hari   : -' + rp(g.potonganTanpaMasuk));
  if(g.bonus)    baris.push('Bonus ' + poinTeks(g.poin) + ' poin : +' + rp(g.bonus));
  if(g.komisiJml) baris.push('Komisi & apresiasi' + (g.komisiKet? ' ('+g.komisiKet+')':'') + ' : +' + rp(g.komisiJml));
  if(g.upahLembur) baris.push('Lembur ' + String(g.jamLembur).replace('.',',') + ' jam : +' + rp(g.upahLembur));
  if(g.upahLemburSiaga) baris.push('  (termasuk ' + String(g.jamLemburSiaga).replace('.',',') + ' jam tarif siaga : +' + rp(g.upahLemburSiaga) + ')');

/* daftar tanggal cuti yang benar-benar dipakai (hari libur dilewati) */
function tanggalCuti(u){
  const dr = document.getElementById('cDari'), sp = document.getElementById('cSampai');
  if(!dr || !sp || !dr.value || !sp.value) return [];
  if(sp.value < dr.value) return [];
  const J = jadwalUser(u);
  const out = [];
  const d = new Date(dr.value + 'T00:00:00'), akhir = new Date(sp.value + 'T00:00:00');
  let aman = 0;
  while(d <= akhir && aman++ < 120){
    if(J.libur.indexOf(d.getDay()) < 0) out.push(tglKunci(d));
    d.setDate(d.getDate() + 1);
  }
  return out;
}
function hitungHariCuti(u){ return tanggalCuti(u).length; }
