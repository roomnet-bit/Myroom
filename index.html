/* ================= POIN & BONUS KARYAWAN =================
   Poin dihitung dari gangguan yang SELESAI di bulan berjalan.
   Satu pekerjaan sendirian bernilai 1 poin. Bila dikerjakan berdua, nilainya
   dibagi: masing-masing 0,5 poin — sesuai pembagian bonus lama Rp5.000 per
   orang. Bonus = (poin - 50) x Rp10.000, dan tidak pernah minus.

   Daftar nama diambil dari daftar pengguna, jadi karyawan baru muncul
   sendirinya dan yang sudah keluar hilang sendirinya. */
const BAYAR_PER_POIN = 8;       // 8 catatan pembayaran = 1 poin

/* ================= JADWAL KERJA, JAM, & LEMBUR =================
   Tiap orang punya jam kerja sendiri, boleh terbagi beberapa sesi
   (mis. 08:00-12:00 dan 13:00-17:00). Jam di dalam jendela jadwal dihitung
   kerja biasa. Jam di luar jadwal — termasuk pulang telat dan seluruh jam
   di hari libur — TIDAK otomatis dihitung lembur. Lembur hanya terhitung
   lewat sesi yang sengaja dibuka dengan tombol "Mulai Lembur" (resmi_lembur),
   yang mewajibkan foto di kedua ujungnya dan langsung terbayar penuh.

   Lembur "siaga": bila pada sesi lembur itu ternyata ada gangguan yang
   ditangani orang ini dan sudah disahkan (yang berarti dia juga dapat
   poin & bonus untuk gangguan itu), jam lembur sesi tersebut dibayar
   dengan tarif yang dikurangi — supaya tidak dobel penuh dengan bonus
   poinnya. Lembur yang sama sekali tidak beririsan gangguan tetap
   dibayar tarif lembur penuh seperti biasa. */
const TOLERANSI_MENIT = 15;     // terlambat sampai 15 menit masih dimaklumi
const SIAGA_PENGALI = 0.5;      // tarif lembur saat gangguan: 50% dari tarif lembur biasa
/* BATAS_LEMBUR_OTOMATIS_MENIT sudah tidak dipakai untuk menghitung lembur
   (lembur kini murni dari tombol "Mulai Lembur"), tapi dibiarkan ada karena
   masih dirujuk oleh kartu "Lembur menunggu persetujuan" (kini selalu kosong
   karena tidak ada lagi jalur yang mengisi perluReview) dan data lama. */
const BATAS_LEMBUR_OTOMATIS_MENIT = 120;
/* Sejak siklus gaji Oktober 2026 (keputusan pemilik 10 Okt 2026): sesi dari
   tombol "Mulai Lembur" baru DIBAYAR setelah pemilik menekan Setujui. Sesi
   sebelum tanggal ini dianggap sudah disetujui supaya gaji September yang
   sudah dibayar tidak berubah. Datang awal / pulang lewat jadwal lewat absen
   biasa tidak perlu persetujuan (tetap otomatis). */
const LEMBUR_SETUJU_MULAI = '2026-10-07';
/* Lembur DITOLAK pemilik: sesinya tetap tersimpan (jam kerja normal di dalam
   jadwal tetap dihitung), hanya bagian lemburnya tidak dibayar. Disimpan di
   tabel pengaturan (kunci "lembur_ditolak", JSON daftar id sesi) supaya
   tidak perlu kolom baru di server dan semua HP sama. */
const lemburDitolak = id => (DB.lemburDitolak||[]).some(x=>x.id === id);
function simpanLemburDitolak(){
  save();
  if(sbOn()) sbPengaturan('lembur_ditolak', JSON.stringify(DB.lemburDitolak||[]));
}
const lemburPerluSetuju = a => !!(a && a.resmi_lembur && !a.lembur_disetujui && !lemburDitolak(a.id)
  && String(a.tanggal||'') >= LEMBUR_SETUJU_MULAI);
/* Batas maksimal per SESI lembur di hari libur (lihat rekapHari) — bukan
   batas total sehari, tapi per sesi. Kalau masih lanjut kerja setelah 2
   jam, karyawan harus tutup sesi ini & buka sesi lembur baru. */
const BATAS_LEMBUR_LIBUR_MENIT = 120;
/* Sejak kebijakan baru (Pasal 8), batas 2 jam per sesi lembur berlaku di
   SEMUA hari, bukan cuma hari libur — dipakai juga untuk sesi resmi_lembur
   di hari kerja (jam sebelum/sesudah jadwal). Nama lama dipertahankan
   sebagai alias supaya kode lama yang masih merujuknya tidak perlu diubah. */
const BATAS_LEMBUR_SESI_MENIT = BATAS_LEMBUR_LIBUR_MENIT;
/* Pasal 2: pulang lewat jam jadwal — 25 menit pertama dianggap kompensasi
   (wajar/beres-beres), baru sisanya di atas itu dihitung lembur murni. */
const KOMPENSASI_PULANG_MENIT = 25;
/* Pasal 5: kalau karyawan pencet "Mulai Lembur" di jendela 1 jam sebelum
   jadwal masuk (dan tidak absen masuk lagi), jam lembur sesi itu dibayar
   flat, bukan pakai tarif lembur pribadi masing-masing. */
const LEMBUR_PRA_SHIFT_RP_PER_JAM = 5000;
const HARI_NAMA = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

/* Jadwal kerja per orang. Format bawaan tidak berubah: "08:00-12:00, 13:00-17:00"
   berlaku untuk semua hari kerja. Boleh ditambah jadwal khusus Sabtu memakai
   pemisah " | ", contoh: "08:00-12:00, 13:00-17:00 | Sabtu: 08:00-13:00" —
   ditulis di kolom "jadwal" yang sama, tidak perlu kolom baru di server. */
function parseSesiTeks(teks){
  return (teks||'').split(',').map(s=>s.trim()).filter(Boolean).map(s=>{
    const [a,b] = s.split('-').map(x=>(x||'').trim());
    const m = t => { const [j,n] = String(t).split(':').map(Number);
      return (isFinite(j)? j:0)*60 + (isFinite(n)? n:0); };
    return {teks:s, mulai:m(a), selesai:m(b)};
  }).filter(x=>x.selesai > x.mulai);
}
function jadwalBagian(u){
  const teks = (u && u.jadwal) || '';
  const potong = teks.split('|').map(s=>s.trim()).filter(Boolean);
  let def = '', sabtu = null;
  potong.forEach((b,i)=>{
    const m = b.match(/^sabtu\s*:\s*(.*)$/i);
    if(m) sabtu = m[1].trim(); else if(i===0) def = b;
  });
  return {def, sabtu};
}
function jadwalUser(u, hari){
  const {def, sabtu} = jadwalBagian(u);
  const pakaiSabtu = hari === 6 && sabtu != null;
  const sesi = parseSesiTeks(pakaiSabtu ? sabtu : def);
  const sesiDefault = parseSesiTeks(def);
  const wajib = u && u.jamWajib ? +u.jamWajib
    : (sesi.length ? sesi.reduce((s,x)=>s + (x.selesai-x.mulai), 0)/60 : 8);
  const libur = String((u && u.hariLibur != null) ? u.hariLibur : '0')
    .split(',').map(s=>s.trim()).filter(s=>s!=='').map(Number);
  const tarif = u && u.tarifLembur ? +u.tarifLembur
    : (u && u.gaji && wajib ? Math.round(u.gaji / HARI_KERJA / wajib) : 0);
  return {sesi, wajib, libur, tarif, sesiDefault, punyaSabtu: sabtu != null};
}
const menitHari = iso => { const d = new Date(iso); return d.getHours()*60 + d.getMinutes(); };
function jamHM(menit){ menit = ((menit % 1440) + 1440) % 1440;
  const j = Math.floor(menit/60), m = menit%60;
  return String(j).padStart(2,'0') + '.' + String(m).padStart(2,'0'); }

/* ================= KAPAN TOMBOL ABSEN & LEMBUR BOLEH DIPENCET =================
   Aturan (disepakati bareng pemilik, Pasal 4-6):
   1. Jam operasional usaha (default 08.00–22.00, bisa diubah di Setelan).
      Di luar jam ini, tombol MULAI (Absen Masuk & Mulai Lembur) dua-duanya
      terkunci. Tombol SELESAI (Absen Pulang & Selesai Lembur) TIDAK PERNAH
      terkunci karena jam — kalau ada sesi terbuka, selalu bisa ditutup
      kapan saja, supaya tidak ada yang "kejebak" (baru terkunci setelah
      dipencet). Jam yang jatuh di luar jam operasional tidak dihitung/
      dibayar, kecuali ada lembur (lihat rekapHari).
   2. Jendela 1 jam sebelum jam masuk sesi pertama (Pasal 5): cuma tombol
      Lembur yang aktif, Absen Masuk masih terkunci. Kalau karyawan sudah
      pencet Lembur di jendela ini, tidak perlu absen masuk lagi hari itu —
      gajinya dipisah: lembur pra-shift (tarif flat, lihat
      LEMBUR_PRA_SHIFT_RP_PER_JAM) + gaji pokok seperti biasa.
   3. Kalau tidak pencet Lembur di jendela 1 jam itu: mulai 20 menit
      sebelum jam masuk, tombol Absen Masuk terbuka dan tombol Lembur TETAP
      terbuka sampai jam masuk (keputusan pemilik 7 Okt 2026).
   4. Selama jam shift (masuk sesi pertama s/d pulang sesi terakhir,
      termasuk jeda istirahat di antaranya): tombol Lembur terkunci.
      Absen Masuk tetap terbuka selama karyawan belum absen sama sekali
      hari itu (jaga-jaga telat) — begitu dipencet, tombol berubah jadi
      mode Absen Pulang lewat status "sesi terbuka" di tempat lain.
   5. Setelah jam pulang sesi terakhir sampai jam operasional selesai →
      cuma Lembur yang aktif lagi.
   6. Hari libur: tidak terikat jam operasional sama sekali — Lembur bisa
      dimulai kapan saja, 24 jam (batas 2 jam per sesi tetap berlaku, lihat
      BATAS_LEMBUR_SESI_MENIT). */
function statusTombolPresensi(u, hari, iniLibur, sesiHariIni){
  sesiHariIni = sesiHariIni || [];
  const J = jadwalUser(u, hari);
  const opMulai = (DB.usaha.jamOpMulai != null) ? DB.usaha.jamOpMulai : 480;
  const opSelesai = (DB.usaha.jamOpSelesai != null) ? DB.usaha.jamOpSelesai : 1320;
  const skrg = new Date().getHours()*60 + new Date().getMinutes();
  const opTeks = jamHM(opMulai) + '–' + jamHM(opSelesai);

  if(iniLibur){
    /* Hari libur: bebas jam operasional. Absen Masuk biasa DIKUNCI karena
       tidak dihitung/dibayar apa-apa di hari libur — supaya karyawan tidak
       salah pencet. Lembur tetap selalu aktif kapan saja, 24 jam. */
    return {masuk:false, lembur:true,
      pesanMasuk:'Hari libur — kerja hanya terbayar lewat tombol Mulai Lembur'};
  }
  if(!J.sesi.length){
    /* Belum ada jadwal diatur — jangan sampai keduanya kekunci total,
       cukup batasi ke jam operasional saja. */
    const dlm = skrg >= opMulai && skrg < opSelesai;
    return {masuk:dlm, lembur:dlm,
      pesanMasuk: dlm? '' : 'Di luar jam operasional (' + opTeks + ')',
      pesanLembur: dlm? '' : 'Di luar jam operasional (' + opTeks + ')'};
  }
  const firstStart = J.sesi[0].mulai, lastEnd = J.sesi[J.sesi.length-1].selesai;
  /* Jam kerja (termasuk jeda istirahat di antara sesi) selalu menang duluan,
     supaya jadwal kerja asli tidak pernah ikut terkunci walau jam
     operasionalnya kebetulan tidak pas. */
  if(skrg >= firstStart && skrg < lastEnd){
    /* Karyawan dengan jadwal berjeda (istirahat, >1 sesi): cukup SATU kali
       Absen Masuk (pagi) dan SATU kali Absen Pulang (sore) — sesinya
       dibiarkan menyala terus melewati jam istirahat, dan jam istirahat
       otomatis tidak ikut terhitung/terbayar (lihat rekapHari, irisanMenit
       per sesi jadwal). Begitu satu siklus masuk-pulang itu sudah beres
       hari ini, Absen Masuk dikunci lagi sampai besok — supaya karyawan
       tidak salah kira harus absen lagi pas istirahat/mulai "sesi 2". */
    const sudahSiklus = J.sesi.length > 1
      && sesiHariIni.some(a => a.pulang && !a.resmi_lembur);
    if(sudahSiklus){
      return {masuk:false, lembur:false,
        pesanMasuk:'Absen hari ini sudah lengkap (1x masuk, 1x pulang) — tidak perlu absen lagi saat istirahat',
        pesanLembur:'Jam istirahat tidak dihitung lembur'};
    }
    return {masuk:true, lembur:false, pesanLembur:'Lembur aktif lagi setelah ' + jamHM(lastEnd)};
  }
  if(skrg < opMulai || skrg >= opSelesai){
    return {masuk:false, lembur:false, pesanMasuk:'Di luar jam operasional (' + opTeks + ')',
      pesanLembur:'Di luar jam operasional (' + opTeks + ')'};
  }
  const jendelaLembur = Math.max(opMulai, firstStart - 60);   // 1 jam sebelum masuk
  const jendelaMasuk  = Math.max(opMulai, firstStart - 20);   // 20 menit sebelum masuk
  if(skrg >= jendelaLembur && skrg < firstStart){
    /* Sudah pencet Lembur pagi ini di jendela 1 jam? Tidak perlu absen
       masuk lagi — gajinya sudah tercakup lewat lembur pra-shift. */
    const sudahLemburPraShift = sesiHariIni.some(a=>a.resmi_lembur
      && menitHari(a.masuk) >= jendelaLembur && menitHari(a.masuk) < firstStart);
    if(sudahLemburPraShift){
      return {masuk:false, lembur:true,
        pesanMasuk:'Sudah lembur pagi ini — tidak perlu absen masuk lagi'};
    }
    if(skrg >= jendelaMasuk){
      /* 20 menit terakhir sebelum jam masuk: Absen Masuk terbuka, dan
         Lembur TETAP terbuka (keputusan pemilik, 7 Okt 2026). */
      return {masuk:true, lembur:true};
    }
    return {masuk:false, lembur:true,
      pesanMasuk:'Absen Masuk baru buka jam ' + jamHM(jendelaMasuk)};
  }
  if(skrg >= lastEnd && skrg < opSelesai){
    return {masuk:false, lembur:true, pesanMasuk:'Jadwal kerja hari ini sudah lewat'};
  }
  /* lebih dari 1 jam sebelum jam masuk */
  return {masuk:false, lembur:false,
    pesanMasuk:'Lembur baru bisa mulai jam ' + jamHM(jendelaLembur),
    pesanLembur:'Lembur baru bisa mulai jam ' + jamHM(jendelaLembur)};
}

/* Menit yang beririsan antara satu sesi absen dan jendela jadwal.
   Dipakai memisahkan jam kerja biasa dari lembur. */
function irisanMenit(m1, m2, w1, w2){ return Math.max(0, Math.min(m2,w2) - Math.max(m1,w1)); }

/* Apakah pada rentang satu sesi absen (masuk–pulang) orang ini menyelesaikan
   gangguan yang sudah disahkan? Kalau ya, jam lembur sesi itu dianggap
   "siaga" (tarif dikurangi) karena sudah dihargai lewat poin & bonus. */
function adaGangguanDisesi(nama, a){
  return (DB.tiket||[]).some(t=>{
    if(t.status !== 'selesai' || !t.selesai || !t.disahkan) return false;
    const orang = String(t.penangan||'').split(',').map(s=>s.trim()).filter(Boolean);
    if(orang.indexOf(nama) < 0) return false;
    const ts = new Date(t.selesai).getTime();
    return ts >= new Date(a.masuk).getTime() && ts <= new Date(a.pulang).getTime();
  });
}

/* Rekap satu hari untuk satu orang. Satu hari boleh berisi beberapa sesi
   absen — sesi pagi dan sesi siang dihitung terpisah lalu dijumlahkan. */
function rekapHari(u, tanggal, sesiAbsen){
  const hari = new Date(tanggal + 'T00:00:00').getDay();
  const J = jadwalUser(u, hari);
  const iniLibur = J.libur.indexOf(hari) >= 0;
  /* jeda antar sesi jadwal (mis. jam istirahat 12:00-13:00) — waktu ini
     bukan jam kerja, jadi tidak dihitung lembur meski karyawan tidak
     menekan absen pulang/masuk pas istirahat (sesi absennya nyambung). */
  const sesiUrut = J.sesi.slice().sort((x,y)=>x.mulai-y.mulai);
  const jedaJadwal = [];
  for(let i=0;i<sesiUrut.length-1;i++) jedaJadwal.push({mulai:sesiUrut[i].selesai, selesai:sesiUrut[i+1].mulai});

  const autoTutup = !!(DB.usaha && DB.usaha.autoTutupLupaPulang);
  let dalam = 0, luarBiasa = 0, luarSiaga = 0, luarPraShift = 0, luarReview = 0, luarDitolak = 0, belumTutup = 0;
  const perluReview = [];
  for(const a of sesiAbsen){
    let m2;
    if(a.pulang){ m2 = menitHari(a.pulang); }
    else if(autoTutup && sesiUrut.length){
      belumTutup++;                                   // tetap dicatat lupa, tapi jam dihitung
      m2 = sesiUrut[sesiUrut.length - 1].selesai;      // anggap pulang pas jadwal terakhir selesai
    }else{ belumTutup++; continue; }                   // bawaan: lupa = 0 jam, tunggu koreksi manual
    const m1 = menitHari(a.masuk);
    if(m2 <= m1) continue;                             // data tidak masuk akal, lewati
    const total = Math.max(0, m2 - m1);
    const siaga = a.pulang && adaGangguanDisesi(u.nama, a);  // butuh pulang asli, bukan hasil tebakan
    /* Sesi "resmi lembur" (dibuka lewat tombol Mulai Lembur, dengan foto di
       kedua ujungnya): kalau hari ini ada jadwal dan sesinya "menembus" ke
       jam kerja (mis. mulai lembur jam 6 pagi lalu dibiarkan menyala terus
       sampai lewat jam 8 masuk), bagian yang beririsan jadwal TETAP
       dihitung jam kerja biasa (bukan lembur) — sudah tercakup gaji pokok.
       Hanya bagian yang benar-benar di luar jadwal yang dihitung lembur.
       Kalau hari ini libur (tidak ada jadwal sama sekali), seluruh sesinya
       lembur seperti sebelumnya. Sejak Pasal 8, batas 2 jam per SESI ini
       berlaku di semua hari (dulu cuma hari libur). Sesi yang ditandai
       lembur_pra_shift (Pasal 5) dipisah, dibayar tarif flat, bukan tarif
       lembur pribadi. */
    if(a.resmi_lembur){
      if(lemburDitolak(a.id)){
        /* ditolak: lembur tidak dibayar; jam di dalam jadwal tetap jam kerja */
        let dT = 0, jT = 0;
        if(!iniLibur){
          for(const w of J.sesi) dT += irisanMenit(m1, m2, w.mulai, w.selesai);
          for(const w of jedaJadwal) jT += irisanMenit(m1, m2, w.mulai, w.selesai);
        }
        dalam += Math.min(dT, total);
        luarDitolak += Math.max(0, total - dT - jT);
        continue;
      }
      const tahan = lemburPerluSetuju(a);
      if(iniLibur){
        const totalDibayar = Math.min(total, BATAS_LEMBUR_SESI_MENIT);
        if(tahan){ luarReview += totalDibayar; perluReview.push({id:a.id, menit:totalDibayar, jenis: siaga ? 'siaga' : 'libur'}); }
        else if(siaga) luarSiaga += totalDibayar; else luarBiasa += totalDibayar;
      }else{
        let d0 = 0;
        for(const w of J.sesi) d0 += irisanMenit(m1, m2, w.mulai, w.selesai);
        dalam += Math.min(d0, total);
        /* jeda istirahat jadwal (mis. 12:00-13:00) bukan lembur walau sesi
           lemburnya menyala melewatinya — dulu ikut terhitung. */
        let jeda0 = 0;
        for(const w of jedaJadwal) jeda0 += irisanMenit(m1, m2, w.mulai, w.selesai);
        const luar0 = Math.min(Math.max(0, total - d0 - jeda0), BATAS_LEMBUR_SESI_MENIT);
        if(tahan){
          if(luar0 > 0){ luarReview += luar0;
            perluReview.push({id:a.id, menit:luar0, jenis: a.lembur_pra_shift ? 'pra-shift' : (siaga ? 'siaga' : 'biasa')}); }
        }
        else if(a.lembur_pra_shift) luarPraShift += luar0;
        else if(siaga) luarSiaga += luar0; else luarBiasa += luar0;
      }
      continue;
    }
    if(iniLibur){
      /* Hari libur lewat absen biasa (bukan tombol "Mulai Lembur") tidak
         dihitung lembur sama sekali. Supaya jam kerja di hari libur
         terbayar, karyawan wajib pakai tombol "Mulai Lembur". */
      continue;
    }
    /* Hari kerja biasa: jam di DALAM jendela jadwal tetap dihitung jam
       kerja normal. Jam di LUAR jadwal lewat absen biasa (bukan tombol
       Mulai Lembur) tidak dihitung lembur, KECUALI dua celah kecil yang
       sudah disepakati (lihat blok telat/awal/pulang-cepat di bawah):
       datang lebih awal (Pasal 3) dan pulang lewat >25 menit (Pasal 2). */
    let d = 0;
    for(const w of J.sesi) d += irisanMenit(m1, m2, w.mulai, w.selesai);
    dalam += Math.min(d, total);
  }
  const batas = Math.round(J.wajib * 60);
  const normal = iniLibur ? 0 : Math.min(dalam, batas);

  /* ================= TELAT, PULANG CEPAT, MASUK AWAL, TANPA ABSEN MASUK =================
     Pasal 1: masuk TELAT / pulang cepat (dicap "telat") kalau selisihnya
       >= TOLERANSI_MENIT (15 menit) — dilihat dari absen masuk PERTAMA
       dan absen pulang TERAKHIR hari itu saja.
     Pasal 7: dari total menit telat itu, 15 menit pertama tetap kompensasi
       (tidak dipotong gaji) — yang dipotong hanya kelebihannya di atas
       toleransi (telatPotongMenit), dengan rate DB.usaha.potonganTelatRp.
     Pasal 3: datang lebih awal dari jadwal — semua menitnya dihitung
       lembur penuh (lemburAwal), plus bonus poin bertingkat (lihat
       poinAwalTier, dipakai di poinBonus).
     Pasal 2: pulang lewat jadwal (pakai Absen Pulang biasa, bukan tombol
       Lembur) — 25 menit pertama kompensasi, sisanya lembur murni.
     Pasal 6: kalau sepanjang hari itu (yang sudah lewat) sama sekali tidak
       pernah absen masuk, ditandai tanpaAbsenMasuk untuk potongan
       Rp/jam dari total jam wajib hari itu. */
  const telat = [];
  let telatPotongMenit = 0, awalMenit = 0, lemburAwal = 0, lemburTelatPulang = 0, tanpaAbsenMasuk = false;
  if(!iniLibur && sesiUrut.length){
    const wPertama = sesiUrut[0], wTerakhir = sesiUrut[sesiUrut.length - 1];
    if(!sesiAbsen.length){
      const hariIniStr = tglKunci();
      const sudahLewat = tanggal < hariIniStr
        || (tanggal === hariIniStr && (new Date().getHours()*60 + new Date().getMinutes()) >= wTerakhir.selesai);
      if(sudahLewat) tanpaAbsenMasuk = true;
    }else{
      const masukPertama = sesiAbsen.map(a=>menitHari(a.masuk)).sort((x,y)=>x-y)[0];
      const lebih = masukPertama - wPertama.mulai;
      if(lebih >= TOLERANSI_MENIT){
        telat.push({sesi:wPertama.teks, menit:lebih, jenis:'masuk', jadwal:wPertama.mulai, jam:masukPertama});
        telatPotongMenit += Math.max(0, lebih - TOLERANSI_MENIT);
      }else if(lebih < 0){
        awalMenit = -lebih;
        /* Kalau datang awalnya lewat tombol Mulai Lembur, menit sebelum jadwal
           itu SUDAH dibayar sebagai lembur (pra-shift / biasa) di atas —
           jangan dibayar lagi sebagai lembur datang awal. Poin datang awal
           tetap dapat. */
        const pertama = sesiAbsen.slice().sort((x,y)=>new Date(x.masuk) - new Date(y.masuk))[0];
        lemburAwal = (pertama && pertama.resmi_lembur) ? 0 : awalMenit;
      }
      /* Pulang cepat cuma masuk akal kalau hari itu memang sudah SELESAI.
         Dengan aturan baru (jadwal berjeda cukup 1x masuk & 1x pulang,
         sesinya menyala terus melewati istirahat), satu entri absen sudah
         bisa mewakili sehari penuh — asal jam pulangnya memang sudah
         masuk ke jendela sesi TERAKHIR (bukan keburu ditutup di tengah,
         mis. baru sesi 1 kelar, sesi 2 belum dikerjakan sama sekali).
         Gaya lama (pisah per sesi, satu entri per sesi) tetap didukung:
         kalau jumlah entri yang sudah ditutup >= jumlah sesi jadwal,
         berarti semuanya sudah dikerjakan juga dianggap selesai. */
      const sesiDitutup = sesiAbsen.filter(a=>a.pulang && !a.resmi_lembur);
      const kandidatPulang = sesiDitutup.sort((x,y)=>new Date(y.pulang) - new Date(x.pulang))[0];
      const sesiPulangSah = kandidatPulang
        && (sesiDitutup.length >= J.sesi.length || menitHari(kandidatPulang.pulang) >= wTerakhir.mulai)
        ? kandidatPulang : null;
      if(sesiPulangSah){
        const pulangTerakhir = menitHari(sesiPulangSah.pulang);
        const kurang = wTerakhir.selesai - pulangTerakhir;   // positif = pulang lebih cepat dari jadwal
        if(kurang >= TOLERANSI_MENIT){
          telat.push({sesi:wTerakhir.teks, menit:kurang, jenis:'pulang', jadwal:wTerakhir.selesai, jam:pulangTerakhir});
          telatPotongMenit += Math.max(0, kurang - TOLERANSI_MENIT);
        }else if(kurang < 0){
          lemburTelatPulang = Math.max(0, -kurang - KOMPENSASI_PULANG_MENIT);
        }
      }
    }
  }

  const lemburBiasa = luarBiasa + (iniLibur ? 0 : Math.max(0, dalam - batas)) + lemburAwal + lemburTelatPulang;
  const lemburSiaga = luarSiaga;
  const lembur = lemburBiasa + lemburSiaga;

  return {tanggal, hari, iniLibur, normal, lembur, lemburBiasa, lemburSiaga, lemburPraShift:luarPraShift,
          lemburReview:luarReview, lemburDitolak:luarDitolak, perluReview, belumTutup, telat, telatPotongMenit, awalMenit, tanpaAbsenMasuk,
          kurang: iniLibur ? 0 : Math.max(0, batas - normal)};
}
/* Pasal 3: bonus poin bertingkat untuk datang lebih awal. 0-10 menit lebih
   awal = +0,10 poin; 11-20 menit = +0,15 poin; lebih dari 20 menit tetap
   +0,15 (poinnya mentok, tidak naik lagi). Dipakai di poinBonus. */
function poinAwalTier(menit){
  if(!menit || menit <= 0) return 0;
  return menit <= 10 ? 0.10 : 0.15;
}

/* Pasal 6: daftar hari kerja dalam rentang yang SAMA SEKALI tidak ada
   catatan presensinya. Tidak dihitung:
   - sebelum TANPA_ABSEN_MULAI, dan hari yang belum lewat (hari ini baru
     dihitung setelah jadwal kerja terakhirnya selesai);
   - sebelum absen pertama orang itu (dianggap belum mulai kerja), dan
     untuk karyawan nonaktif: sesudah absen terakhirnya (sudah berhenti);
   - hari libur mingguan karyawan (jadwalnya) dan Hari libur usaha;
   - hari yang sudah dicatat alpa / izin / sakit / cuti (alpa sudah punya
     potongan sendiri, jadi tidak dipotong dobel). */
function hariTanpaAbsen(u, d1, d2, adaPresensi){
  const out = [];
  const semua = (DB.presensi||[]).filter(a=>a.user_id === u.id && a.tanggal).map(a=>a.tanggal).sort();
  if(!semua.length) return out;
  const hariIni = tglKunci();
  let mulai = [d1, TANPA_ABSEN_MULAI, semua[0]].sort()[2];
  let akhir = d2 < hariIni ? d2 : hariIni;
  if(u.aktif === false && semua[semua.length-1] < akhir) akhir = semua[semua.length-1];
  if(mulai > akhir) return out;
  const libur = new Set((DB.liburUsaha||[]).map(x=>x.tgl));
  const dicatat = new Set((DB.absen||[]).filter(a=>a.nama === u.nama).map(a=>String(a.tgl).slice(0,10)));
  const n = new Date(), menitKini = n.getHours()*60 + n.getMinutes();
  for(let t = mulai, jaga = 0; t <= akhir && jaga < 400; t = tambahHari(t, 1), jaga++){
    if(adaPresensi[t] || libur.has(t) || dicatat.has(t)) continue;
    const hari = new Date(t + 'T00:00:00').getDay();
    const J = jadwalUser(u, hari);
    if(J.libur.indexOf(hari) >= 0 || !J.sesi.length) continue;
    if(t === hariIni && menitKini < Math.max.apply(null, J.sesi.map(x=>x.selesai))) continue;
    out.push({tanggal:t, jamWajib:J.wajib});
  }
  return out;
}

/* Rekap satu orang sepanjang rentang tanggal */
function rekapJam(u, d1, d2){
  const punya = (DB.presensi||[]).filter(a=>a.user_id === u.id
    && a.tanggal >= d1 && a.tanggal <= d2);
  const perHari = {};
  punya.forEach(a=>{ (perHari[a.tanggal] = perHari[a.tanggal] || []).push(a); });
  const hari = Object.keys(perHari).sort().map(t=>rekapHari(u, t, perHari[t]));
  const J = jadwalUser(u);
  const jml = k => hari.reduce((s,x)=>s + x[k], 0);
  const menitNormal = jml('normal'), menitLembur = jml('lembur');
  const menitLemburBiasa = jml('lemburBiasa'), menitLemburSiaga = jml('lemburSiaga');
  const menitLemburPraShift = jml('lemburPraShift');
  const menitLemburReview = jml('lemburReview');
  const menitLemburDitolak = jml('lemburDitolak');
  const perluReview = hari.reduce((s,x)=>s.concat((x.perluReview||[]).map(r=>Object.assign({tanggal:x.tanggal, nama:u.nama}, r))), []);
  const upahLemburBiasa = Math.round((menitLemburBiasa/60) * J.tarif);
  const upahLemburSiaga = Math.round((menitLemburSiaga/60) * J.tarif * SIAGA_PENGALI);
  const upahLemburPraShift = Math.round((menitLemburPraShift/60) * LEMBUR_PRA_SHIFT_RP_PER_JAM);
  /* Pasal 3: total menit "poin bonus masuk awal" bertingkat, dijumlah per
     hari (masing-masing hari sudah dibatasi tiernya di poinAwalTier). */
  const poinAwal = hari.reduce((s,x)=>s + poinAwalTier(x.awalMenit), 0);
  const tanpaAbsen = hariTanpaAbsen(u, d1, d2, perHari);
  const hariTanpaAbsenMasuk = tanpaAbsen.length;
  return {
    nama:u.nama, hariHadir:hari.length, hari,
    menitNormal, menitLembur, menitLemburBiasa, menitLemburSiaga, menitLemburPraShift, menitLemburReview, menitLemburDitolak, perluReview,
    jamNormal: menitNormal/60, jamLembur: menitLembur/60,
    jamLemburBiasa: menitLemburBiasa/60, jamLemburSiaga: menitLemburSiaga/60, jamLemburPraShift: menitLemburPraShift/60,
    menitKurang: jml('kurang'),
    belumTutup: jml('belumTutup'),
    telat: hari.reduce((s,x)=>s + x.telat.length, 0),
    telatMenit: hari.reduce((s,x)=>s + x.telat.reduce((y,z)=>y+z.menit,0), 0),
    telatPotongMenit: jml('telatPotongMenit'),
    poinAwal, hariTanpaAbsenMasuk, tanpaAbsen,
    tarif: J.tarif, wajib: J.wajib,
    upahLemburBiasa, upahLemburSiaga, upahLemburPraShift,
    upahLembur: upahLemburBiasa + upahLemburSiaga + upahLemburPraShift
  };
}
const jamTeks = menit => { const j = Math.floor(menit/60), n = Math.round(menit%60);
  return (j? j+' jam' : '') + (n? (j?' ':'') + n + ' mnt' : (j? '' : '0 mnt')); };

/* ================= PILIHAN RENTANG WAKTU =================
   Dipakai layar Poin & bonus dan layar Gaji. Semua hitungan yang tadinya
   terkunci pada bulan berjalan kini mengikuti rentang yang dipilih. */
let fPoin = {mode:'bulan', bulan:periodeSiklus(tglKunci()), tgl:tglKunci()};
let fGaji = {mode:'bulan', bulan:(bulanGajian() < P0 ? P0 : bulanGajian()), tgl:tglKunci()};

function rentangDari(f){
  if(f.mode === 'hari'){ const t = tglKunci();
    return {d1:t, d2:t, lbl:'Hari ini', bulan:periodeSiklus(t)}; }
  if(f.mode === '7hari'){ const a = today(); a.setDate(a.getDate()-6);
    const d1 = tglKunci(a), d2 = tglKunci();
    return {d1, d2, lbl:'7 hari terakhir', bulan:periodeSiklus(d2)}; }
  if(f.mode === 'tanggal'){ const t = f.tgl || tglKunci();
    return {d1:t, d2:t, lbl:tglId(t), bulan:periodeSiklus(t)}; }
  /* "Pilih bulan" = satu siklus gaji (7 – 6), bukan bulan kalender */
  const sk = siklusGaji(f.bulan);
  return {d1:sk.d1, d2:sk.d2, lbl:pLbl(f.bulan) + ' (' + sk.teks + ')', bulan:f.bulan};
}
/* baris tombol pemilih rentang; akta = nama aksi penanganannya */
function pilihRentang(f, akta){
  const c = (m,l)=>`<button class="chip ${f.mode===m?'on':''}" data-act="${akta}" data-mode="${m}">${l}</button>`;
  return `<div class="chips" style="margin-top:10px">
    ${c('hari','Hari ini')}${c('7hari','7 hari terakhir')}${c('bulan','Pilih bulan')}${c('tanggal','Pilih tanggal')}</div>
  ${f.mode==='bulan' ? `<div class="fr" style="margin-top:8px;align-items:center">
      <button class="btn sm" style="flex:0 0 44px" data-act="${akta}" data-geser="-1">‹</button>
      <b style="text-align:center;align-self:center">${esc(pLbl(f.bulan))}
        <span style="display:block;font-size:11px;font-weight:400;color:var(--ink2)">siklus ${esc(siklusGaji(f.bulan).teks)}</span></b>
      <button class="btn sm" style="flex:0 0 44px" data-act="${akta}" data-geser="1">›</button></div>`:''}
  ${f.mode==='tanggal' ? `<div class="fr" style="margin-top:8px">
      <input type="date" id="rt_${akta}" value="${esc(f.tgl||tglKunci())}">
      <button class="btn sm p" style="flex:0 0 96px" data-act="${akta}" data-pakai="1">Terapkan</button></div>`:''}`;
}
function aturRentang(f, d, elId){
  if(d.geser){ const b = pAdd(f.bulan, +d.geser);
    if(b < P0 || b > PZ){ toast('Periode tersedia '+pLbl(P0)+' – '+pLbl(PZ)); return false; }
    f.bulan = b; f.mode = 'bulan'; return true; }
  if(d.pakai){ const n = document.getElementById(elId), v = n ? n.value : '';
    if(!v){ toast('Pilih tanggalnya dulu'); return false; }
    f.tgl = v; f.mode = 'tanggal'; return true; }
  f.mode = d.mode; return true;
}

const BONUS_AMBANG = 40;
const BONUS_PER_POIN = 10000;

function poinBonus(d1, d2){
  /* tanpa rentang: bulan berjalan penuh, seperti sebelumnya */
  if(!d1){ const r = rentangDari({mode:'bulan', bulan:periodeSiklus(tglKunci())}); d1 = r.d1; d2 = r.d2; }
  const dalam = iso => { const t = tglLokal(iso); return t >= d1 && t <= d2; };
  const per_ = {};

  const tambah = (nama, poin) => {
    const k = bakukanNama(nama);
    if(!k) return;
    if(!per_[k]) per_[k] = {nama:k, kerja:0, poin:0, sendiri:0, berdua:0, tagih:0, cepat:0, awal:0};
    per_[k].poin += poin;
    per_[k].kerja += 1;
    if(poin === 1) per_[k].sendiri += 1; else per_[k].berdua += 1;
  };
  /* ambil wadah tanpa menambah hitungan gangguan */
  const ambil = nama => {
    const k = bakukanNama(nama) || '(tidak dicatat)';
    if(!per_[k]) per_[k] = {nama:k, kerja:0, poin:0, sendiri:0, berdua:0, tagih:0, cepat:0, awal:0};
    return per_[k];
  };

  /* Bonus kecepatan: gangguan yang selesai antara 15 menit sampai 3 jam
     sejak dilapor dapat tambahan setengah poin. Batas bawah 15 menit
     sengaja disamakan dengan ambang kecurigaan di menu Klaim — di bawah
     itu dianggap belum tentu kerja nyata, jadi tidak dihargai kecepatan.
     Tanpa batas bawah ini, bonus justru mengajak menutup gangguan asal
     cepat demi poin, bukan demi pelanggan. */
  const KECEPATAN_MIN_MENIT = 15;
  const KECEPATAN_MAKS_MENIT = 180;
  const KECEPATAN_BONUS = 0.5;

  let menunggu = 0;
  for(const t of DB.tiket){
    if(t.status !== 'selesai' || !t.selesai) continue;
    if(!dalam(t.selesai)) continue;                            // di luar rentang
    if(!t.disahkan){ menunggu++; continue; }                   // belum disahkan Pemilik
    const orang = String(t.penangan || '').split(',').map(s=>s.trim()).filter(Boolean);
    if(!orang.length) continue;
    const berdua = orang.length > 1;
    const nilai = berdua ? 0.5 : 1;
    orang.forEach(o=>tambah(o, nilai));

    const m = menitTangani(t);
    if(m !== null && m >= KECEPATAN_MIN_MENIT && m <= KECEPATAN_MAKS_MENIT){
      const bonusCepat = berdua ? KECEPATAN_BONUS / 2 : KECEPATAN_BONUS;
      orang.forEach(o=>{ const w = ambil(o); w.poin += bonusCepat; w.cepat = (w.cepat||0) + 1; });
    }
  }

  /* Poin dari PSB (pemasangan baru) — nilainya disamakan dengan poin
     gangguan (1 solo / 0,5+0,5 berdua), tapi TANPA bonus kecepatan: wajar
     kalau pemasangan makan waktu berjam-jam/berhari (nunggu survei, tarik
     kabel), beda konteks dari gangguan yang idealnya cepat ditangani. */
  for(const p of (DB.psb||[])){
    if(p.status !== 'terpasang' || !p.diubah) continue;
    if(!dalam(p.diubah)) continue;
    if(!p.disahkan){ menunggu++; continue; }
    const orang = String(p.penangan || '').split(',').map(s=>s.trim()).filter(Boolean);
    if(!orang.length) continue;
    const berdua = orang.length > 1;
    orang.forEach(o=>tambah(o, berdua ? 0.5 : 1));
  }

  /* Poin dari menyisir tagihan. Setiap ${BAYAR_PER_POIN} catatan pembayaran
     bernilai 1 poin, jadi tiap rumah yang disisir dihargai — tidak ada sisa
     yang hangus. Yang dipakai adalah tanggal uang diterima, bukan bulan
     tagihannya: menagih tunggakan lama tetap dihitung kerja bulan ini.
     Tidak perlu disahkan seperti gangguan, karena uangnya sudah nyata
     masuk dan penerimanya tercatat. */
  const nilaiBayar = 1 / BAYAR_PER_POIN;
  for(const k of Object.keys(DB.bayar || {})){
    const b = DB.bayar[k];
    if(!b || !dalam(b.t)) continue;
    const o = ambil(b.u);
    o.poin  += nilaiBayar;
    o.tagih += 1;
  }

  /* Pasal 3: bonus poin bertingkat untuk datang lebih awal dari jadwal.
     Dihitung dari catatan jam presensi (rekapJam → poinAwal, per hari
     lewat poinAwalTier), bukan dari gangguan/PSB seperti sumber poin lain
     di atas — makanya tidak lewat tambah() supaya tidak ikut menambah
     hitungan "kerja" gangguan. */
  for(const u of DB.users){
    if(u.peran !== 'karyawan') continue;
    const rk = rekapJam(u, d1, d2);
    if(rk.poinAwal > 0){
      const o = ambil(u.nama);
      o.poin += rk.poinAwal;
      o.awal = (o.awal || 0) + rk.hari.filter(x=>x.awalMenit > 0).length;
    }
  }

  /* Semua karyawan terdaftar ikut tampil, walau belum ada gangguan. */
  const terdaftar = DB.users.filter(u=>u.peran === 'karyawan' && u.aktif !== false);
  const baris = terdaftar.map(u=>{
    const d = per_[u.nama] || {nama:u.nama, kerja:0, poin:0, sendiri:0, berdua:0, tagih:0, cepat:0, awal:0};
    delete per_[u.nama];
    return Object.assign({}, d, {terdaftar:true});
  });

  /* Nama yang tercatat di gangguan tapi tidak ada di daftar pengguna —
     misalnya teknisi kedua yang diketik manual, atau karyawan yang sudah
     keluar. Tetap ditampilkan supaya bonusnya tidak hilang diam-diam. */
  const lainnya = Object.keys(per_).map(k=>Object.assign({}, per_[k], {terdaftar:false}));

  /* Pecahan 0,2 dan 0,5 tidak pernah bulat dalam hitungan komputer:
     enam puluh kali 0,2 menghasilkan 12,00000000000017, bukan 12. Tanpa
     pembulatan, bonusnya menjadi angka seperti Rp70.000,0000017 — mustahil
     untuk uang. Poin dibulatkan dua angka di belakang koma, bonusnya ke
     rupiah bulat. */
  const hasil = [...baris, ...lainnya]
    .map(x=>{
      x.poin = Math.round(x.poin * 100) / 100;
      x.bonus = Math.max(0, Math.round((x.poin - BONUS_AMBANG) * BONUS_PER_POIN));
      return x;
    })
    .sort((a,b)=> b.poin - a.poin || a.nama.localeCompare(b.nama));
  hasil.menunggu = menunggu;          // jumlah yang belum disahkan Pemilik
  return hasil;
}

/* ================= PENANGKAP KEGAGALAN =================
   Penekanan tombol ditangani oleh fungsi async. Bila terjadi kesalahan di
   dalamnya, JavaScript menelannya diam-diam: tombol ditekan, tidak ada
   pesan, tidak ada yang terjadi. Sulit ditelusuri karena tidak ada jejak
   di layar.

   Dua penangkap di bawah membuat kegagalan itu terlihat. Tidak memperbaiki
   sebabnya, tapi memunculkan namanya, supaya bisa dilaporkan dan dibetulkan. */
(function(){
  let terakhir = 0;
  function laporkan(pesan){
    const kini = Date.now();
    if(kini - terakhir < 1500) return;        // jangan bertubi-tubi
    terakhir = kini;
    try{ toast('Gagal: ' + String(pesan).slice(0, 120)); }catch(e){}
  }
  window.addEventListener('unhandledrejection', function(e){
    const r = e.reason;
    laporkan(r && r.message ? r.message : r);
    console.error('Kegagalan tak tertangkap:', r);
  });
  window.addEventListener('error', function(e){
    if(e.message) laporkan(e.message);
    console.error('Kesalahan:', e.error || e.message);
  });
})();

    case 'simpanVoucherNyisir': {
      const s2 = (DB.vSesi||[]).find(x=>x.id===d.id); if(!s2){ toast('Sesi tidak ditemukan'); break; }
      const tk = vTokoById(s2.tokoId); if(!tk) break;
      const semua = vSesiDetailOf(s2.id);
      /* Hanya jenis yang dicentang yang disisir & diuangkan sekarang. Jenis
         yang tidak dicentang tetap tertinggal di toko: barisnya dipindah ke
         sesi lanjutan yang masih berjalan, dengan tanggal titip yang sama
         supaya hitungan "sudah sekian hari" tidak ikut ter-reset. */
      const detail  = semua.filter(d2=>{ const cb = document.getElementById('vSisir_'+d2.id); return !cb || cb.checked; });
      const ditunda = semua.filter(d2=>detail.indexOf(d2) < 0);
      if(!detail.length){ toast('Centang minimal satu jenis voucher untuk disisir'); break; }
      let totalLaku=0, totalToko=0, totalMyroom=0;
      for(const d2 of detail){
        const el2 = document.getElementById('vRetur_'+d2.id);
        const retur = Math.max(0, Math.min(d2.titip, Math.floor(+((el2 && el2.value) || 0))));
        const laku = d2.titip - retur, subtotal = laku * d2.nominal;
        const bagianToko = Math.round(subtotal * (tk.persen/100)), bagianMyroom = subtotal - bagianToko;
        d2.retur=retur; d2.laku=laku; d2.subtotal=subtotal; d2.bagianToko=bagianToko; d2.bagianMyroom=bagianMyroom;
        totalLaku+=subtotal; totalToko+=bagianToko; totalMyroom+=bagianMyroom;
      }
      const disetor = Math.max(0, +($('#vDisetor').value||0));
      /* potong hutang belanja toko (kalau ada) dari bagian toko, FIFO ke

      let hutangDipotong = 0, sisaPotong = totalToko;
      const hutangDiubah = [];

        if(sisaPotong<=0) break;
        const potong = Math.min(h.sisa, sisaPotong);
        h.sisa -= potong; sisaPotong -= potong; hutangDipotong += potong;
        hutangDiubah.push(h);

      /* Sesi lanjutan dibuat DULU (dan dikirim lebih dulu) supaya baris detail

      let sesiLanjut = null;

      save();
      if(sesiLanjut){
        await sbSimpan('voucher_sesi_titip', [keVSesi(sesiLanjut)]);
        await sbSimpan('voucher_sesi_detail', ditunda.map(keVDetail));
      }
      sbSimpan('voucher_sesi_titip', [keVSesi(s2)]);
      sbSimpan('voucher_sesi_detail', detail.map(keVDetail));
      if(hutangDiubah.length) hutangDiubah.forEach(h=>sbTambal('voucher_hutang_toko', h.id, {sisa:h.sisa}));
      catat('edit', 'voucher_sesi_titip', s2.id, 'Nyisir ' + tk.nama,
        detail.map(x=>x.titip+' titip').join(', '), rp(totalLaku)+' laku · toko '+rp(totalToko)+' · myroom '+rp(totalMyroom)

      segeraSinkron(); sheetVoucherKwitansi('sesi', s2.id);
      toast(ditunda.length
        ? 'Nyisir tersimpan · ' + ditunda.length + ' jenis masih di toko'

/* ================= PENCARIAN DALAM DAFTAR PANJANG =================
   Dengan ratusan pelanggan, menggulung daftar itu menyiksa — apalagi sambil
   berdiri di depan rumah orang. Isian di atasnya menyaring daftar sambil
   diketik: pilihan yang tidak cocok disembunyikan, dan bila tersisa satu
   saja, pilihan itu langsung terpilih sendiri.

   Baris yang tidak cocok disembunyikan lewat CSS, bukan dihapus, supaya
   pilihan yang sudah diambil tidak hilang saat pencarian dikosongkan. */
function saringDaftar(kotakCari){
  const sel = document.getElementById(kotakCari.dataset.saring);
  if(!sel) return;
  const q = kotakCari.value.trim().toLowerCase();
  let tampil = 0, satuNilai = '';

  for(const o of sel.options){
    if(!o.value){ o.hidden = false; o.style.display = ''; continue; }   // baris "gangguan umum"
    const cocok = !q || o.textContent.toLowerCase().indexOf(q) >= 0;
    /* dua cara sekaligus: sebagian peramban HP mengabaikan salah satunya */
    o.hidden = !cocok;
    o.style.display = cocok ? '' : 'none';
    if(cocok){ tampil++; satuNilai = o.value; }
  }

  /* tersisa satu — langsung pilih supaya tidak perlu diketuk lagi */
  if(q && tampil === 1) sel.value = satuNilai;
  else if(q && tampil === 0) sel.value = '';

  const info = document.getElementById(kotakCari.id + 'Info');
  if(info) info.textContent = !q ? ''
    : (tampil ? tampil + ' pelanggan cocok' + (tampil === 1 ? ' · sudah dipilih' : '')
              : 'Tidak ada yang cocok');
}

const sbOn = () => !!(DB.server && DB.server.url && DB.server.key);
function sbUrl(path){ return DB.server.url.replace(/\/+$/,'') + '/rest/v1/' + path; }
async function sbReq(path, opt){
  opt = opt || {};
  const r = await fetch(sbUrl(path), Object.assign({}, opt, {headers: Object.assign({
    apikey: DB.server.key, Authorization: 'Bearer ' + DB.server.key,
    'Content-Type': 'application/json'}, opt.headers || {})}));
  if(!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0,160));
  /* Balasan sukses boleh saja berbadan kosong (204, atau 201 dengan
     Prefer: return=minimal). Dulu r.json() langsung meledak di situ dan
     data yang SUDAH tersimpan dilaporkan gagal lalu diantrekan ulang. */
  if(r.status === 204 || r.status === 205) return null;
  const teks = await r.text();
  if(!teks) return null;
  try{ return JSON.parse(teks); }
  catch(e){ return null; }               // sukses, badannya bukan JSON
}

/* PIN tidak pernah dikirim apa adanya — yang disimpan hanya sidik acaknya */
async function sandiPin(pin){
  const data = new TextEncoder().encode('roomnet:' + pin);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* Server (PostgREST) diam-diam memotong balasan di 1000 baris. Tabel
   pembayaran bertambah ~170 baris tiap bulan, jadi setelah ±6 bulan
   sebagian pembayaran tidak ikut tertarik dan tampil "belum bayar". Ambil
   halaman demi halaman sampai jumlah total di server habis. */
async function sbReqSemua(tabel, kolom, urut){
  const hasil = []; let dari = 0; const UKURAN = 1000;
  const alamat = tabel + '?select=' + (kolom || '*') + '&order=' + (urut || 'id.asc');
  for(let guard = 0; guard < 200; guard++){
    const r = await fetch(sbUrl(alamat), {headers:{
      apikey: DB.server.key, Authorization: 'Bearer ' + DB.server.key,
      Prefer: 'count=exact', 'Range-Unit': 'items', Range: dari + '-' + (dari + UKURAN - 1)}});
    if(!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0,160));
    const teks = await r.text();
    const baris = teks ? JSON.parse(teks) : [];
    hasil.push(...baris);
    dari += baris.length;
    const total = parseInt((r.headers.get('content-range') || '').split('/')[1], 10);
    if(!baris.length || isNaN(total) || dari >= total) break;
  }
  return hasil;
}

/* Ubah sebagian kolom saja. Ini mencegah perubahan orang lain ikut tertimpa
   ketika dua orang menyunting data yang sama pada saat hampir bersamaan. */
/* ---- PENJAGA BALAPAN KIRIM vs TARIK ----------------------------------
   Dulu: setelah menyimpan, kiriman ke server (sbTambal/sbSimpan/sbHapus)
   TIDAK ditunggu, tapi 1,2 detik kemudian sinkron() sudah menarik seluruh
   data dari server. Di sinyal lambat kirimannya belum sampai, sehingga yang
   ditarik masih versi LAMA lalu menimpa perubahan yang baru saja dibuat —
   di layar terlihat "tersimpan" tapi datanya kembali seperti semula, tanpa
   pesan galat apa pun. Sekarang setiap kiriman didaftarkan di sini, dan
   penarikan data selalu menunggu kiriman yang masih jalan selesai dulu. */
const tulisAktif = new Set();
function lacakTulis(p){
  const q = Promise.resolve(p).catch(()=>{});
  tulisAktif.add(q);
  q.then(()=>tulisAktif.delete(q));
  return p;
}
/* Tunggu semua kiriman yang sedang berjalan. Diberi batas putaran & waktu
   supaya satu permintaan yang menggantung tidak membuat sinkron macet. */
async function tungguTulis(batasMs){
  const sampai = Date.now() + (batasMs || 12000);
  let putaran = 0;
  while(tulisAktif.size && putaran++ < 6 && Date.now() < sampai){
    await Promise.race([
      Promise.all([...tulisAktif]),
      new Promise(r=>setTimeout(r, Math.max(0, sampai - Date.now())))
    ]);
  }
}
async function sbTambal(tabel, id, kolom, lempar){ return lacakTulis(_sbTambal(tabel, id, kolom, lempar)); }
async function sbSimpan(tabel, data, lempar){ return lacakTulis(_sbSimpan(tabel, data, lempar)); }
async function sbHapus(tabel, id, lempar){ return lacakTulis(_sbHapus(tabel, id, lempar)); }
async function _sbTambal(tabel, id, kolom, lempar){
  if(!sbOn()) return;
  if(!kolom || !Object.keys(kolom).length) return true;
  try{
    await sbReq(tabel + '?id=eq.' + encodeURIComponent(id),
      {method:'PATCH', headers:{Prefer:'return=minimal'}, body: JSON.stringify(kolom)});
    return true;
  }catch(e){ if(lempar) throw e; antrekan({t:tabel, a:'tambal', i:id, d:kolom}); laporGagal(e, tabel); return false; }
}
function bedaKolom(lama, baru){
  const out = {};
  for(const k of Object.keys(baru)) if(String(lama[k] == null ? '' : lama[k]) !== String(baru[k] == null ? '' : baru[k])) out[k] = baru[k];
  return out;
}

async function _sbSimpan(tabel, data, lempar){   // upsert
  if(!sbOn()) return;
  try{
    /* Tabel log memakai 'abaikan bila sudah ada' supaya catatan lama tidak
       tertimpa saat antrean dikirim ulang. */
    const cara = tabel === 'log' ? 'resolution=ignore-duplicates' : 'resolution=merge-duplicates';
    /* Riwayat tarif: satu baris per (pelanggan, bulan) — dijaga kunci unik di
       server. HP yang datanya ketinggalan bisa membuat baris dengan id baru
       untuk bulan yang SAMA; tanpa penunjuk ini kiriman itu ditolak (409) dan
       dulu malah menumpuk jadi baris ganda. Dengan on_conflict, baris yang
       sudah ada diperbarui, bukan digandakan. */
    const kunciBentrok = tabel === 'tarif_riwayat' ? '?on_conflict=pelanggan_id,mulai' : '';
    await sbReq(tabel + kunciBentrok, {method:'POST', headers:{Prefer: cara + ',return=minimal'}, body: JSON.stringify(data)});
    return true;
  }catch(e){
    if(lempar) throw e;
    antrekan({t:tabel, a:'simpan', d:data});
    laporGagal(e, tabel);
    return false;
  }
}
let lastLapor = 0;
function laporGagal(e, tabel){
  const m = String((e && e.message) || '');
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return;   // sekadar hilang sinyal
  if(Date.now() - lastLapor < 8000) return;                          // jangan bertubi-tubi
  lastLapor = Date.now();
  toast('Server menolak data ' + tabel + ' — ' + alasanGagal(e));
}
async function _sbHapus(tabel, id, lempar){
  if(!sbOn()) return;
  try{ await sbReq(tabel + '?id=eq.' + encodeURIComponent(id), {method:'DELETE'}); return true; }
  catch(e){ if(lempar) throw e; antrekan({t:tabel, a:'hapus', d:id}); laporGagal(e, tabel); return false; }
}
/* RESET TOTAL — kosongkan seluruh tabel di server (dipakai bersama semua HP),
   KECUALI "log" — riwayat aktivitas sengaja permanen (lihat kebijakan RLS:
   tabel log hanya boleh INSERT+SELECT, tidak bisa diubah/dihapus, bahkan
   oleh Reset Total ini), supaya selalu ada jejak audit termasuk jejak
   kapan reset total pernah dijalankan.
   Urutan penting: tabel "anak" (yang menunjuk ke pelanggan/pengguna) dihapus
   dulu, baru tabel "induk"-nya, supaya tidak tertahan oleh kunci relasi.
   Tiap tabel dihapus dengan filter penampung-semua (kolom kuncinya "not null"),
   karena PostgREST menolak DELETE tanpa filter sama sekali. Mengembalikan
   daftar nama tabel yang gagal dihapus (kosong berarti semua berhasil). */
async function sbHapusSemua(){
  const urutan = [
    ['pembayaran','id'], ['tiket','id'], ['presensi','id'], ['absen','id'],
    ['gaji','id'], ['kasbon','id'], ['pesan_baca','user_id'], ['pesan','id'],
    ['kehadiran','nama'], ['pengaturan','kunci'], ['pengeluaran','id'],
    ['pelanggan','id'], ['pengguna','id']
  ];
  const gagal = [];
  for(const [tabel, kolom] of urutan){
    try{
      await sbReq(tabel + '?' + kolom + '=not.is.null',
        {method:'DELETE', headers:{Prefer:'return=minimal'}});
    }catch(e){ gagal.push(tabel); }
  }
  return gagal;
}

/* riwayat digabung, bukan ditimpa — catatan lama & yang belum terkirim tetap ada */

async function jumlahLogServer(){

}
function gabungLog(baris, simpanLama){
  const ada = new Set(DB.log.map(x=>x.id));
  const dibuang = new Set((DB.antre||[]).filter(x=>x.t==='log' && x.a==='hapus').map(x=>x.d));
  for(const r of baris){
    if(ada.has(r.id) || dibuang.has(r.id)) continue;
    DB.log.push({id:r.id, waktu:r.waktu, oleh_id:r.oleh_id, oleh:r.oleh, peran:r.peran,
      aksi:r.aksi, tabel:r.tabel, rekid:r.rekid, judul:r.judul,
      sebelum:r.sebelum || '', sesudah:r.sesudah || '', perangkat:r.perangkat || ''});
  }
  DB.log.sort((a,b)=>b.waktu.localeCompare(a.waktu));
  if(!simpanLama) pangkasLog();
  save();
}
/* catatan 'edit' & 'buka' dipertahankan karena jadi dasar hitungan batas
   pengubahan; yang dipangkas hanya catatan ringan seperti 'masuk' */
function pangkasLog(){
  const BATAS = 1200;
  if(DB.log.length <= BATAS) return;
  const penting = [], ringan = [];
  for(const x of DB.log) (x.aksi==='edit' || x.aksi==='buka' ? penting : ringan).push(x);
  const sisaRuang = Math.max(0, BATAS - penting.length);
  DB.log = penting.concat(ringan.slice(0, sisaRuang))
    .sort((a,b)=>b.waktu.localeCompare(a.waktu));
}

function terapkanAntre(){
  for(const x of (DB.antre || [])){
    if(x.a === 'tambal'){
      if(x.t === 'pelanggan'){ const i = DB.pel.findIndex(p=>p.id === x.i); if(i>=0) Object.assign(DB.pel[i], kePelL(Object.assign({}, kePel(DB.pel[i]), x.d))); }
      if(x.t === 'pengguna'){ const u = DB.users.find(y=>y.id === x.i); if(u) Object.assign(u, x.d); }
      if(x.t === 'voucher_hutang_toko'){ const h = (DB.vHutang||[]).find(y=>y.id === x.i); if(h && x.d.sisa!=null) h.sisa = +x.d.sisa; }
      if(x.t === 'presensi'){ const a = (DB.presensi||[]).find(y=>y.id === x.i); if(a && x.d.lembur_disetujui!=null) a.lembur_disetujui = !!x.d.lembur_disetujui; }
      if(x.t === 'psb'){ const ps = (DB.psb||[]).find(y=>y.id === x.i); if(ps) Object.assign(ps, keePsbL(Object.assign({}, keePsb(ps), x.d))); }
      continue;
    }
    const arr = Array.isArray(x.d) ? x.d : [x.d];
    if(x.a === 'hapus'){
      if(x.t === 'pelanggan'){ DB.pel = DB.pel.filter(p=>p.id !== x.d); }
      if(x.t === 'pengeluaran'){ DB.biaya = DB.biaya.filter(b=>b.id !== x.d); }
      if(x.t === 'tiket'){ DB.tiket = DB.tiket.filter(t=>t.id !== x.d); }
      if(x.t === 'pembayaran'){ const k = String(x.d).replace('_','|'); delete DB.bayar[k]; }
      if(x.t === 'voucher_jenis'){ DB.vJenis = DB.vJenis.filter(v=>v.id !== x.d); }
      if(x.t === 'voucher_toko'){ DB.vToko = DB.vToko.filter(v=>v.id !== x.d); }
      if(x.t === 'kredit_pakai'){ DB.kreditPakai = (DB.kreditPakai||[]).filter(k=>k.id !== x.d); }
      if(x.t === 'voucher_hutang_toko'){ DB.vHutang = (DB.vHutang||[]).filter(h=>h.id !== x.d); }
      if(x.t === 'psb'){ DB.psb = (DB.psb||[]).filter(p=>p.id !== x.d); }

    for(const r of arr){

        if(i >= 0) DB.pel[i] = Object.assign({}, DB.pel[i], kePelL(r)); else DB.pel.push(kePelL(r));

      }
      if(x.t === 'presensi'){
        DB.presensi = DB.presensi || [];
        const rec = {id:r.id, user_id:r.user_id, nama:r.nama || '', tanggal:r.tanggal,
          masuk:r.masuk, pulang:r.pulang || null,

        const i = DB.vToko.findIndex(y=>y.id===r.id); if(i>=0) DB.vToko[i]=v; else DB.vToko.push(v);

function kunciAntre(x){
  if(x.a === 'tambal') return x.t + '|tambal|' + x.i;
  const d = Array.isArray(x.d) ? x.d : [x.d];
  return x.t + '|' + x.a + '|' + d.map(r=>(r && (r.id || r.kode)) || r).join(',');
}
function antrekan(x){
  DB.antre = DB.antre || [];
  const k = kunciAntre(x);
  if(x.a === 'tambal'){                       // gabungkan perubahan kolom
    const lama = DB.antre.find(y=>kunciAntre(y) === k);
    if(lama){ Object.assign(lama.d, x.d); lama.g = 0; save(); tandaServer(); garisAntre(); segarkanTandaTertunda(); return; }
  }
  DB.antre = DB.antre.filter(y=>kunciAntre(y) !== k);   // versi terbaru saja
  x.g = 0;
  x.w = x.w || Date.now();                             // sejak kapan tertahan
  DB.antre.push(x); save(); tandaServer(); garisAntre(); segarkanTandaTertunda();
}
/* Tombol centang di daftar tagihan dikasih warna oranye kalau catatannya
   masih tertahan di HP (belum sampai server) — supaya saat nyisir offline,
   jelas mana yang sudah benar-benar aman dan mana yang belum. Dipanggil
   tiap kali antrean berubah (masuk baru / berhasil terkirim) supaya
   tandanya update sendiri tanpa perlu ditarik ulang manual. */
/* Semua layar yang memuat lencana centang ikut disegarkan begitu isi antrean
   berubah — kalau tidak, centangnya baru berubah setelah pindah menu. */
const LAYAR_BERCENTANG = ['beranda','tagihan','harini','pelanggan','tiket','psb','biaya','voucher'];
function segarkanTandaTertunda(){
  if(LAYAR_BERCENTANG.indexOf(view) >= 0) renderBody(true);
}
/* ================= PENGIRIMAN ANTREAN — TERUKUR & TERATUR =================
   Tiga aturan yang menjaga HP tetap waras di daerah bersinyal jelek:

   1. SATU PUTARAN SAJA. Selama satu putaran kirim masih berjalan, putaran
      berikutnya tidak ikut jalan. Dulu pemeriksaan tiap 1,5 detik bisa
      menumpuk berlapis-lapis saat sinyal lambat.
   2. BERHENTI BEGITU SINYAL PUTUS. Kalau satu kiriman gagal karena jaringan,
      sisanya TIDAK ikut dicoba di putaran itu. Percuma menembak 40 permintaan
      ke sinyal yang memang sedang mati — hanya menghabiskan baterai & kuota.
      Penolakan server (HTTP 4xx) beda perkara: itu salah data, bukan sinyal,
      jadi putarannya lanjut dan baris itu dihitung gagal sendiri.
   3. JEDA BERTAMBAH (backoff). Tiap putaran yang gagal memperpanjang jeda
      sebelum mencoba lagi: 5 detik, 15, 30, 1 menit, 2 menit, paling lama 5
      menit. Begitu berhasil, jedanya kembali nol. Tombol "Kirim sekarang"
      selalu menerobos jeda ini — pengguna tidak pernah dipaksa menunggu. */
const JEDA_ULANG = [0, 5000, 15000, 30000, 60000, 120000, 300000];
let antreJalan = false;          // sedang ada putaran kirim
let antreGagal = 0;              // berapa putaran gagal berturut-turut
let antreJedaSampai = 0;         // jangan mencoba sendiri sebelum waktu ini
let antreProgres = null;         // {n, total} selagi mengirim

function antreSiapCoba(){ return sbOn() && (DB.antre||[]).length && !antreJalan && Date.now() >= antreJedaSampai; }

async function kirimAntre(paksa){               // coba kirim ulang yang tertunda
  if(!sbOn() || !DB.antre || !DB.antre.length) return 0;
  if(antreJalan) return 0;
  if(!paksa && Date.now() < antreJedaSampai) return 0;
  antreJalan = true;
  antreProgres = {n:0, total:DB.antre.length};
  garisAntre();
  const sisa = [], ditolak = [];
  let putus = false;
  try{
    for(const x of DB.antre){
      if(putus){ sisa.push(x); continue; }        // sinyal sudah terbukti mati
      antreProgres.n++; garisAntre();
      try{
        if(x.a === 'hapus') await sbHapus(x.t, x.d, true);
        else if(x.a === 'tambal') await sbTambal(x.t, x.i, x.d, true);
        else await sbSimpan(x.t, x.d, true);
      }catch(e){
        x.g = (x.g || 0) + 1;
        const tolak = /HTTP 4\d\d/.test(e.message || '');
        if(tolak && x.g >= 3){ ditolak.push(x); }  // dibuang, bukan masalah sinyal
        else { sisa.push(x); if(!tolak) putus = true; }
      }
    }
  } finally { antreJalan = false; antreProgres = null; }

  if(ditolak.length) toast(ditolak.length + ' data ditolak server — cek kolom tabel');
  const terkirim = DB.antre.length - sisa.length - ditolak.length;
  DB.antre = sisa; save(); tandaServer();
  if(terkirim > 0) segarkanTandaTertunda();

  if(sisa.length){
    antreGagal++;
    antreJedaSampai = Date.now() + JEDA_ULANG[Math.min(antreGagal, JEDA_ULANG.length - 1)];
  }else{
    antreGagal = 0; antreJedaSampai = 0;
  }
  /* tumpukan akhirnya habis: beri kabar lega, walau terkirim sendiri */
  if(terkirim > 0 && !sisa.length){
    antreLegaSampai = Date.now() + 6000;
    garisAntre(); setTimeout(garisAntre, 6200);
  }
  garisAntre();
  return terkirim;
}
/* Sinyal kembali: browser memberi tahu lebih cepat daripada pemeriksaan
   berkala. Jeda backoff langsung dinolkan — sinyal baru, kesempatan baru. */
window.addEventListener('online', ()=>{
  antreGagal = 0; antreJedaSampai = 0;
  garisAntre();
  if(me && sbOn() && (DB.antre||[]).length) kirimAntre(true).then(()=>{ garisAntre(); render(); });
});
window.addEventListener('offline', ()=>{ garisAntre(); });
/* ================= GARIS PERINGATAN ANTREAN =================
   Penanda kecil di pojok atas mudah terlewat. Bila karyawan menagih di
   daerah tanpa sinyal, catatannya menumpuk di HP dan bisa hilang bersama
   HP itu — tanpa jejak apa pun di server.

   Garis ini selalu terlihat selama masih ada yang tertahan, dan sekaligus
   menjadi tombolnya: sekali ketuk, langsung dicoba kirim. Begitu berhasil,
   berubah hijau sebentar supaya karyawan tahu pekerjaannya sudah aman. */


/* Selisih waktu singkat untuk garis status & daftar antrean */
function umurSingkat(ms){
  const m = Math.floor(ms / 60000);
  if(m < 1) return 'baru saja';
  if(m < 60) return m + ' menit';
  const j = Math.floor(m / 60);
  if(j < 24) return j + ' jam' + (m % 60 ? ' ' + (m % 60) + ' mnt' : '');
  return Math.floor(j / 24) + ' hari' + (j % 24 ? ' ' + (j % 24) + ' jam' : '');
}
const luring = () => ('onLine' in navigator) && navigator.onLine === false;

/* Garis status di atas layar. Lima keadaan, masing-masing satu kalimat —
   karyawan tidak perlu menebak apakah pekerjaannya sudah aman atau belum. */
function garisAntre(){
  const n = $('#antreBar'); if(!n) return;
  const jml = (DB && DB.antre) ? DB.antre.length : 0;

  /* 1. sedang mengirim */
  if(antreJalan && antreProgres){
    n.className = 'kirim';
    n.innerHTML = '<span>⏳</span><span>Mengirim ' + antreProgres.n + ' dari ' + antreProgres.total + '…'
      + '<small>Jangan tutup aplikasi dulu</small></span>';
    return;
  }

  /* 2. tidak ada yang tertahan */
  if(!jml){
    if(Date.now() < antreLegaSampai){
      n.className = 'aman';
      n.innerHTML = '<span>✓✓</span><span>Semua catatan sudah di server'
        + '<small>Aman walaupun HP ini hilang</small></span>';
    }else if(luring()){
      n.className = 'luring';
      n.innerHTML = '<span>📴</span><span>Tidak ada sinyal — silakan tetap bekerja'
        + '<small>Semua catatan lama sudah aman di server</small></span>';
    }else{
      n.className = 'hide'; n.innerHTML = '';
    }
    return;
  }

  /* 3. ada yang tertahan — nadanya naik sesuai lamanya */
  const tertua = DB.antre.reduce((t,x)=> Math.min(t, x.w || Date.now()), Date.now());
  const menit = Math.floor((Date.now() - tertua) / 60000);
  const jam = menit / 60;
  const gawat = jam >= 6 || jml >= 40;
  const berat = jam >= 1 || jml >= 10;

  if(!sbOn()){
    n.className = 'lama';
    n.innerHTML = '<span>⚠️</span><span>' + jml + ' catatan hanya ada di HP ini'
      + '<small>Server belum diatur — buka Menu › Sambungan server</small></span>';
    return;
  }
  if(luring()){
    n.className = berat ? 'lama' : 'luring';
    n.innerHTML = '<span>📴</span><span>' + jml + ' catatan menunggu sinyal'
      + '<small>Tersimpan aman di HP · ' + umurSingkat(Date.now() - tertua)
      + ' · ketuk untuk lihat daftarnya</small></span>';
    return;
  }
  const jeda = Math.max(0, Math.ceil((antreJedaSampai - Date.now()) / 1000));
  n.className = gawat ? 'lama' : (berat ? 'lama' : 'tunggu');
  n.innerHTML = '<span>' + (gawat ? '🔴' : '⚠️') + '</span><span>' + jml + ' catatan belum sampai server'
    + '<small>' + (gawat
        ? 'TERTAHAN ' + umurSingkat(Date.now() - tertua).toUpperCase()
          + ' — cari sinyal sebentar, kalau HP ini hilang catatannya ikut hilang'
        : 'tertahan ' + umurSingkat(Date.now() - tertua)
          + (jeda > 1 ? ' · mencoba lagi ' + jeda + " detik lagi" : ' · mencoba sendiri'))
    + ' · ketuk untuk lihat &amp; kirim</small></span>';
}

/* ---- nama yang bisa dibaca orang untuk tiap baris antrean ---- */
function labelAntre(x){
  const ambilId = () => x.a === 'tambal' ? x.i
    : x.a === 'hapus' ? x.d
    : ((Array.isArray(x.d) ? x.d[0] : x.d) || {}).id || '';
  const id = String(ambilId() || '');
  const aksi = x.a === 'hapus' ? 'Hapus ' : x.a === 'tambal' ? 'Perubahan ' : '';
  switch(x.t){
    case 'pembayaran': {
      const g = id.split('_'), p = byId(g[0]);
      return {judul: aksi + 'Pembayaran ' + (p ? p.nama : g[0]),
              ket: g[1] ? 'untuk ' + pLbl(g[1]) : ''};
    }
    case 'pelanggan': { const p = byId(id);
      return {judul: aksi + 'Data pelanggan ' + (p ? p.nama : id), ket:''}; }
    case 'tiket': { const t = DB.tiket.find(y=>y.id===id);
      return {judul: aksi + 'Gangguan ' + (t ? (byId(t.pelId)||{nama:'umum'}).nama : id),
              ket: t ? t.masalah : ''}; }
    case 'pengeluaran': { const b = DB.biaya.find(y=>y.id===id);
      return {judul: aksi + 'Pengeluaran ' + (b ? b.ket : id), ket: b ? rp(b.jml) : ''}; }
    case 'psb': { const p = (DB.psb||[]).find(y=>y.id===id);
      return {judul: aksi + 'PSB ' + (p ? p.nama : id), ket:''}; }
    case 'presensi': return {judul: aksi + 'Absen masuk/pulang', ket:''};
    case 'tarif_riwayat': return {judul: aksi + 'Perubahan tarif', ket:''};
    case 'kredit_pakai': return {judul: aksi + 'Pemakaian saldo kredit', ket:''};
    case 'voucher_sesi_titip': return {judul: aksi + 'Titip / nyisir voucher', ket:''};
    case 'voucher_sesi_detail': return {judul: aksi + 'Rincian voucher', ket:''};
    case 'voucher_jual_langsung': return {judul: aksi + 'Penjualan voucher', ket:''};
    case 'voucher_hutang_toko': return {judul: aksi + 'Hutang belanja toko', ket:''};
    case 'log': return {judul: 'Catatan riwayat', ket:'jejak aktivitas'};
    case 'pengguna': return {judul: aksi + 'Data pengguna', ket:''};
    default: return {judul: aksi + x.t, ket: id};
  }
}

  if(v) sbSimpan('pembayaran', [{id:id+'_'+pr, pelanggan_id:id, periode:pr, jumlah:v.j,
    cara:v.c, penerima:v.u||'-', waktu:v.t}]);
  else sbHapus('pembayaran', id+'_'+pr);
  segeraSinkron();
}

             'hapus','batal','uang','ekspor','tarif','ubahlog','poin','vouchertutupbuku','voucherkelola'],
  karyawan: ['beranda','tagihan','harini','pelanggan','tiket','psb','menu','riwayat','hapus','presensi','chat','poin','voucher','tarif']
};
const can = k => !!me && IZIN[me.peran].indexOf(k) >= 0;
const owner = () => DB.users.find(u=>u.peran==='owner');
const PIN_MIN = 4, PIN_MAX = 8;

/* tahap: 'server' (belum tersambung) | 'buat' | 'ulang' | 'masuk' */
let tahap = 'masuk', pinTmp = '', targetPin = null, sibuk = false;

function alasanGagal(e){
  const m = String((e && e.message) || '');
  if(/42501|violates row-level security|permission denied/i.test(m))
    return 'izin tabel belum sesuai, jalankan ulang reset-total.sql';
  if(/404|does not exist|Could not find the table|PGRST205/i.test(m))
    return 'Tabel pengguna belum ada di server — jalankan reset-total.sql';
  if(/401|403|JWT|apikey|permission|policy|42501/i.test(m))
    return 'Ditolak server — periksa anon key atau izin tabel';
  if(/400|column|PGRST204/i.test(m))
    return 'Kolom tabel belum sesuai — jalankan reset-total.sql';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))
    return 'Tidak ada koneksi ke server';
  return 'Gagal menyimpan: ' + m.slice(0, 70);
}
/* true begitu sekali berhasil menarik daftar pengguna di sesi ini */
let adaJaringanAwal = false;
function tentukanTahap(){
  if(!sbOn()) return 'server';
  /* HP baru yang belum pernah online: JANGAN tawarkan "Buat PIN Pemilik".
     Daftar pengguna belum pernah sampai ke HP ini, jadi PIN yang dibuat di
     sini akan menabrak Pemilik yang sudah ada di server. */
  if((!owner() || !owner().pin) && !adaJaringanAwal && !(DB.users||[]).length) return 'server';
  if(!owner() || !owner().pin) return 'buat';
  return 'masuk';
}

async function pinTekan(v){
  if(sibuk) return;
  if(v === 'c'){ pinBuf = pinBuf.slice(0,-1); return drawLock(); }
  if(v === 'ok'){ if(pinBuf.length >= PIN_MIN) await pinLanjut(); return; }
  if(pinBuf.length >= PIN_MAX) return;
  pinBuf += v;
  drawLock();
  if(tahap === 'masuk' && pinBuf.length >= PIN_MIN){
    sibuk = true;
    const h = await sandiPin(pinBuf);
    sibuk = false;
    const u = DB.users.find(x=>x.pin === h && x.aktif !== false);
    if(u){ pinBuf = ''; return buka(u); }
    if(pinBuf.length >= PIN_MAX){ pinBuf = ''; drawLock('PIN salah, coba lagi', true); }
  }
}

async function pinLanjut(){
  try{ await pinLanjut2(); }
  catch(e){
    sibuk = false; pinBuf = ''; pinTmp = ''; tahap = 'buat';
    console.error(e);
    drawLock('Gagal: ' + String(e && e.message || e).slice(0,60) + ' — coba lagi', true);
  }
}
async function pinLanjut2(){
  if(tahap === 'buat'){ pinTmp = pinBuf; pinBuf = ''; tahap = 'ulang'; return drawLock(); }
  if(tahap === 'ulang'){
    if(pinBuf !== pinTmp){ pinBuf = ''; pinTmp = ''; tahap = 'buat'; return drawLock('PIN tidak sama, ulangi', true); }
    sibuk = true;
    const h = await sandiPin(pinBuf);
    pinBuf = ''; pinTmp = '';
    const o = owner();
    const tgt = targetPin || o || {id:uid('U'), nama:'Pemilik', peran:'owner', aktif:true};
    const pinLama = tgt.pin;
    tgt.pin = h;
    const baru = !DB.users.find(u=>u.id === tgt.id);
    if(baru) DB.users.push(tgt);
    save();
    catat(baru ? 'tambah' : 'edit', 'pengguna', tgt.id, tgt.nama,
      pinLama ? 'PIN lama' : '', 'PIN ' + (baru ? 'dibuat' : 'diganti') + ' oleh ' + (me ? me.nama : tgt.nama));
    try{ await sbUserSimpan(tgt); }
    catch(e){
      tgt.pin = null; save();
      sibuk = false; tahap = 'buat'; targetPin = tgt;
      return drawLock(alasanGagal(e), true);
    }
    sibuk = false;
    const kembali = targetPin && targetPin.peran !== 'owner' ? owner() : tgt;
    targetPin = null; tahap = 'masuk';
    buka(kembali);
    toast('PIN ' + tgt.nama + ' tersimpan');
  }
}

/* ================= KEHADIRAN — "sedang buka aplikasi" =================
   Beda dengan Pantau (yang menunjukkan kapan seseorang TERAKHIR mencatat
   sesuatu), ini menunjukkan apakah aplikasinya SEDANG terbuka sekarang.

   Caranya: selagi orang login dan layarnya menyala, aplikasi mengirim
   "tanda hidup" tiap 25 detik. Kalau tandanya masih baru (kurang dari
   75 detik), dianggap sedang online. Tanda ini otomatis berhenti sendiri
   saat layar disembunyikan — dicek ulang tiap kali mau mengirim, bukan
   dengan menyalakan/mematikan pengatur waktunya, supaya lebih sederhana. */
const HEARTBEAT_DETIK = 25;
const ONLINE_AMBANG_DETIK = 75;
let heartbeatT = null;

function kirimHeartbeat(sesiBaru){
  if(!me || !sbOn() || document.hidden) return;
  const now = new Date().toISOString();
  const baris = {nama: me.nama, terakhir_aktif: now};
  if(sesiBaru) baris.login_pada = now;
  sbSimpan('kehadiran', [baris]);
}
function mulaiHeartbeat(){
  clearInterval(heartbeatT);
  kirimHeartbeat(true);
  heartbeatT = setInterval(()=>kirimHeartbeat(false), HEARTBEAT_DETIK * 1000);
}
function berhentiHeartbeat(){
  clearInterval(heartbeatT); heartbeatT = null;
}

/* Menarik status kehadiran terbaru dari server. Dipakai layar Pantau
   sebelum digambar, bukan lewat sbTarik utama, supaya bisa disegarkan
   sendiri tiap beberapa detik tanpa menarik seluruh data usaha. */
async function tarikKehadiran(){
  if(!sbOn()) return;
  try{
    const r = await sbReq('kehadiran?select=*');
    if(Array.isArray(r)) DB.kehadiran = r;
  }catch(e){ /* diam — layar tetap tampil dengan data yang ada */ }
}
function statusOnline(nama){
  const k = (DB.kehadiran||[]).find(x=>x.nama === nama);
  if(!k || !k.terakhir_aktif) return {online:false};
  const detik = (Date.now() - new Date(k.terakhir_aktif)) / 1000;
  if(detik > ONLINE_AMBANG_DETIK) return {online:false, terakhir:k.terakhir_aktif};
  return {online:true, sejak:k.login_pada || k.terakhir_aktif};
}

function buka(u){
  me = u; pinBuf = ''; tahap = 'masuk'; targetPin = null;
  mulaiSesi();
  catat('masuk', 'sesi', u.id, u.nama + ' masuk', '', DB.perangkat || '-');
  if(!can(view)) view = 'beranda';
  $('#lock').className = 'hide';
  render(); tandaServer(); mulaiKutipan();
  if(sbOn()){ sinkron(true); mulaiSinkron(); mulaiHeartbeat();
    chatTarik().then(()=>tandaChat()).catch(()=>{}); }
}
function kunci(){
  me = null; pinBuf = ''; pinTmp = ''; targetPin = null;
  clearInterval(sinkronT); clearInterval(kutipanT); closeSheet(); berhentiHeartbeat();
  if('clearAppBadge' in navigator) navigator.clearAppBadge().catch(()=>{});
  tahap = tentukanTahap(); drawLock();
}
function mintaPinBaru(u){
  targetPin = u; pinBuf = ''; pinTmp = ''; me = null;
  closeSheet(); tahap = 'buat'; drawLock();
}
document.addEventListener('click', e=>{ const b = e.target.closest('[data-pin]'); if(b) pinTekan(b.dataset.pin); });

let sinkronT = null, sinkronJalan = false;
let ketikTerakhir = 0;
document.addEventListener('input', ()=>{ ketikTerakhir = Date.now(); }, true);
function bolehSinkron(){
  /* document.hidden SENGAJA tidak lagi jadi penghalang di sini — notifSistem()
     justru hanya menampilkan notifikasi HP ketika document.hidden true, jadi
     pengecekan pesan/gangguan baru wajib tetap jalan di latar belakang supaya
     notifikasi itu punya kesempatan muncul. Sebelumnya kedua bagian ini saling
     meniadakan: pengecekan berhenti persis saat notifikasi seharusnya tampil. */
  if(!me || !sbOn() || sinkronJalan) return false;
  /* Tidak ada sinyal sama sekali: berhenti mengetuk pintu. Tanpa ini, tiap
     1,5 detik aplikasi tetap menembak server dan semuanya pasti gagal —
     baterai dan kuota habis percuma. Begitu sinyal kembali, peristiwa
     'online' langsung membangunkannya lagi, jadi tidak ada yang tertunda. */
  if(luring()) return false;
  if($('#modal').innerHTML) return false;                       // sedang mengisi kotak dialog
  const a = document.activeElement;
  const isi = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
  if(isi && Date.now() - ketikTerakhir < 4000) return false;     // beri jeda saat sedang mengetik
  return true;
}
async function sinkron(diam){
  if(!sbOn() || sinkronJalan) return;
  sinkronJalan = true;
  try{
    await kirimAntre();
    await sbTarik();
    try{ sidik = await sbSidik(); }catch(e){}
    if(me && !DB.users.find(u=>u.id === me.id && u.aktif !== false)) return kunci();  // akses dicabut
    if(me) me = DB.users.find(u=>u.id === me.id) || me;
    render(); tandaServer();
    if(!diam) toast('Data diperbarui');
  }catch(e){ if(!diam) toast('Gagal menyambung server'); }
  finally{ sinkronJalan = false; }
}
let hitungIntip = 0, intipJalan = false;
async function intip(){
  /* Penjaga tumpang-tindih: setInterval tidak menunggu putaran sebelumnya
     selesai. Kalau sinyal lambat dan satu putaran butuh >1,5 detik, tanpa
     penjaga ini permintaan akan menumpuk berlapis-lapis dan HP jadi tersendat. */
  if(intipJalan) return;
  /* garis status disegarkan lebih dulu, SEBELUM penjaga di bawah — supaya
     hitungan umur & hitung mundur tetap hidup walau sinyal sedang mati */
  hitungIntip++;
  if(hitungIntip % 6 === 0) garisAntre();
  if(!bolehSinkron()) return;
  intipJalan = true;
  try{

    /* Pesan ditarik SETIAP putaran (1,5 detik) sekarang, di layar mana pun —
       supaya pesan baru & popup-nya nyaris real-time. */
    chatTarikT++;
    try{
      const ada = await chatTarik();
      if(ada && view === 'chat'){
        const g = document.getElementById('chatGulung');
        const bawah = !g || (g.scrollHeight - g.scrollTop - g.clientHeight) < 60;
        renderBody(true); muatFotoChat();
        if(bawah) geserBawah();
        tandaiTerbaca();
      }
    }catch(e){}
    try{
      const s2 = await sbSidik();
      if(sidik === null){ sidik = s2; return; }
      if(s2 !== sidik){ sidik = s2; await sinkron(true); return; }
    }catch(e){ return; }
    if(hitungIntip % 60 === 0) await sinkron(true);   // penarikan penuh cadangan tiap ~1,5 menit
    if((DB.antre||[]).length) await kirimAntre();
  } finally { intipJalan = false; }
}
function mulaiSinkron(){ clearInterval(sinkronT); sinkronT = setInterval(intip, 1500); }

let sembunyi = 0;
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) sembunyi = Date.now();
  else if(me && !document.hidden && sbOn()){
    sinkron(true); kirimHeartbeat(false);
    /* sinkron(true) menarik data umum (termasuk gangguan lewat sbTarik),
       tapi TIDAK menarik pesan grup — itu jalur terpisah. Tanpa baris ini,
       pesan yang masuk selagi layar terkunci/HP di-minimize baru ketahuan
       lewat pengecekan berkala berikutnya (bisa telat sampai ~15 detik,
       dan kalau pesan itu ternyata sudah sempat tertarik sekali sebelumnya
       tanpa pop-up, tidak akan pernah muncul pop-up-nya lagi). Menariknya
       di sini juga memastikan pop-up muncul persis saat aplikasi dibuka. */
    if(view !== 'chat') chatTarik().catch(()=>{});
  }
});

/* ================= RENDER ================= */
const VIEWS = {beranda:vBeranda, tagihan:vTagihan, harini:vHariIni, pelanggan:vPelanggan, laporan:vLaporan,
  menu:vMenu, biaya:vBiaya, tiket:vTiket, psb:vPsb, setelan:vSetelan, users:vUsers, server:vServer, riwayat:vLog, presensi:vPresensi, chat:vChat, voucher:vVoucher};
function periksaLogServer(){
  const n = $('#logSrv'); if(!n || !sbOn()) return;
  if((DB.antre||[]).filter(x=>x.t==='log').length) return;
  jumlahLogServer()
    .then(j=>{ const el2 = $('#logSrv'); if(el2) el2.innerHTML =
      '<span style="color:var(--lunas)">✓ ' + j + ' catatan tersimpan permanen di server</span>'; })
    .catch(()=>{ const el2 = $('#logSrv'); if(el2) el2.textContent = 'Jumlah di server belum terbaca'; });
}
function backBar(){
  const lbl = {beranda:'Beranda', menu:'Menu', tagihan:'Tagihan', harini:'Hari ini',
    pelanggan:'Pelanggan', laporan:'Laporan'}[viewSebelum] || 'Menu';
  return `<button class="backbar" data-go="${viewSebelum}">‹ Kembali${lbl? ' ke '+esc(lbl):''}</button>`;
}
function renderBody(keepFocus){
  const a = document.activeElement, id = a? a.id : null, pos = a && a.setSelectionRange? a.selectionStart : null;
  $('#app').innerHTML = (SUBVIEWS.includes(view)? backBar() : '') + (VIEWS[view]||vBeranda)();
  if(view === 'riwayat') periksaLogServer();
  if(view === 'chat'){ muatFotoChat(); tandaChat(); }
  if(keepFocus && id){ const n = document.getElementById(id);
    if(n){ n.focus(); if(pos!=null && n.setSelectionRange) try{ n.setSelectionRange(pos,pos); }catch(e){} } }
}
function render(){
  if(!me) return drawLock();
  if(!can(view)) view = 'beranda';
  $('#meLbl').textContent = me.nama + (me.peran==='owner' ? ' · Pemilik' : ' · Tim');
  $('#bnama').firstChild.nodeValue = DB.usaha.nama;
  $('#bsub').textContent = {beranda:'Ringkasan usaha', tagihan:'Tagihan bulan berjalan', pelanggan:'Daftar pelanggan',
    harini:'Setoran hari ini', laporan:'Keuangan & laporan', menu:'Alat & pengaturan', users:'Tim & PIN', server:'Sambungan server', riwayat:'Riwayat aktivitas', biaya:'Pengeluaran', tiket:'Gangguan', setelan:'Pengaturan', presensi:'Absen masuk & pulang', chat:'Grup tim', voucher:'Titip voucher hotspot'}[view] || '';
  $('#pLbl').firstChild.nodeValue = pLbl(per);
  $('#pSub').textContent = (per===curPer()? 'bulan berjalan · ' : '') + 'periode ' + (ALLPER.indexOf(per)+1) + ' dari ' + ALLPER.length;
  drawNav(); renderBody(); tandaChat(); sinkronTataLetak();
}
$('#btnLock').onclick = kunci;
$('#svr').onclick = ()=>{
  if(!sbOn()) return toast('Belum tersambung ke server');
  if((DB.antre||[]).length) return sheetAntre();
  toast('Menyegarkan…'); sinkron(false);
};
$('#pPrev').onclick = ()=>{ if(per>P0){ per = pAdd(per,-1); render(); } else toast('Periode mulai '+pLbl(P0)); };
$('#pNext').onclick = ()=>{ if(per<PZ){ per = pAdd(per,1); render(); } else toast('Periode terakhir '+pLbl(PZ)); };

/* ---- pasang sebagai aplikasi ---- */
let tawaranPasang = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); tawaranPasang = e; });
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      /* Versi baru ditemukan saat ada sinyal: pasang diam-diam, lalu beri
         tahu sekali. Tidak dipaksa muat ulang di tengah kerja. */
      reg.addEventListener('updatefound', ()=>{
        const baru = reg.installing; if(!baru) return;
        baru.addEventListener('statechange', ()=>{
          if(baru.state === 'installed' && navigator.serviceWorker.controller){
            try{ toast('Versi baru tersedia — tutup lalu buka lagi aplikasinya'); }catch(e){}
          }
        });
      });
    }).catch(()=>{});
  });
}

/* ---------- tata letak: header & nav tetap, hanya konten tengah yang digeser ---------- */
function sinkronTataLetak(){
  const h = document.querySelector('header'), n = document.getElementById('nav');
  if(h) document.documentElement.style.setProperty('--headerH', h.offsetHeight + 'px');
  if(n) document.documentElement.style.setProperty('--navH', n.offsetHeight + 'px');
}
if('ResizeObserver' in window){
  const ro = new ResizeObserver(()=>sinkronTataLetak());
  window.addEventListener('DOMContentLoaded', ()=>{
    const h = document.querySelector('header'), n = document.getElementById('nav');
    if(h) ro.observe(h); if(n) ro.observe(n);
  });
}
window.addEventListener('resize', sinkronTataLetak);
window.addEventListener('orientationchange', ()=>setTimeout(sinkronTataLetak, 60));

/* coba kunci orientasi potret (berhasil hanya pada beberapa browser/PWA terpasang) */
function cobaKunciPotret(){
  try{
    const so = screen.orientation;
    if(so && so.lock) so.lock('portrait').catch(()=>{});
  }catch(e){}
}
cobaKunciPotret();
document.addEventListener('click', cobaKunciPotret, {once:true});

/* cegah pinch-zoom / double-tap zoom di iOS Safari (viewport user-scalable diabaikan sebagian browser) */
document.addEventListener('gesturestart', e=>e.preventDefault());
document.addEventListener('touchmove', e=>{ if(e.touches && e.touches.length > 1) e.preventDefault(); }, {passive:false});
let sentuhTerakhir = 0;
document.addEventListener('touchend', e=>{
  const now = Date.now();
  if(now - sentuhTerakhir < 300) e.preventDefault();
  sentuhTerakhir = now;
}, {passive:false});

(async function init(){
  DB = await load() || fresh();
  if(!DB.tiket) DB.tiket = [];
  DB = lengkapi(DB);
  per = curPer() < P0 ? P0 : (curPer() > PZ ? PZ : curPer());
  tandaServer();
  /* Dulu baris ini DITUNGGU tanpa batas waktu. Di sinyal jelek, layar PIN
     baru muncul setelah permintaan itu menyerah sendiri (bisa puluhan
     detik) — karyawan mengira aplikasinya mati. Sekarang dibatasi: lewat
     2 detik, layar PIN langsung tampil memakai data pengguna yang sudah
     tersimpan di HP, penarikannya diteruskan di belakang layar. */
  if(sbOn()){
    try{
      await Promise.race([
        sbUsersTarik().then(()=>{ adaJaringanAwal = true; }),
        new Promise(r=>setTimeout(r, 2000))
      ]);
    }catch(e){}
  }
  tahap = tentukanTahap();
  drawLock(tahap === 'server' && sbOn()
    ? 'HP ini belum pernah mengambil data. Nyalakan data/WiFi sebentar, lalu buka lagi — setelah itu bisa dipakai offline.'
    : undefined);
  sinkronTataLetak();
  setTimeout(sinkronTataLetak, 300);
})();

</script>
</body>
</html>
